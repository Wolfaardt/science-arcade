<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Arcade — Grade 7</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1f2a37; --soft:#5b6675; --line:#e2ddd2;
  --brand:#2f6f9f; --brand-ink:#ffffff; --good:#2e8b57; --good-bg:#e6f4ec;
  --warn:#b4531f; --warn-bg:#fbeee6; --gold:#d99a00; --accent:#7b5ea7;
  --radius:18px; --fs:19px;
}
:root[data-theme="dark"]{
  --bg:#141a22; --card:#1e2733; --ink:#eef2f6; --soft:#a9b4c2; --line:#2e3a48;
  --brand:#5aa0d6; --brand-ink:#0d1520; --good:#5cc98c; --good-bg:#16301f;
  --warn:#f08a55; --warn-bg:#3a2216; --gold:#ffc53d; --accent:#b39ddb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.5 "Segoe UI","Trebuchet MS",Verdana,system-ui,sans-serif;letter-spacing:.01em}
body.calm *{animation:none!important;transition:none!important}
#app{max-width:880px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.6em} h2{font-size:1.3em} h3{font-size:1.1em}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:var(--radius)}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.big{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);padding:16px 18px;font-size:1.05em;min-height:64px}
.big:hover{border-color:var(--brand)}
.big .ico{font-size:1.6em;margin-right:10px;vertical-align:middle}
.big small{display:block;color:var(--soft);font-size:.8em;margin-top:2px}
.primary{background:var(--brand);color:var(--brand-ink);padding:14px 26px;font-weight:700;font-size:1.05em;min-height:56px}
.ghost{background:transparent;border:2px solid var(--line);padding:10px 18px;min-height:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);padding:14px 18px;margin:10px 0;min-height:60px}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.prompt{font-size:1.2em;font-weight:600;margin:6px 0 12px}
.feedback{border-radius:var(--radius);padding:14px 18px;margin:12px 0;font-weight:600}
.feedback.good{background:var(--good-bg);color:var(--good)}
.feedback.try{background:var(--warn-bg);color:var(--warn)}
.progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);border-radius:999px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.dots b{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots b.ok{background:var(--good)} .dots b.no{background:var(--warn)} .dots b.now{outline:3px solid var(--brand)}
.pet{display:flex;align-items:center;gap:18px}
.pet svg{flex:0 0 auto}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tile{min-width:52px;height:56px;font-size:1.3em;font-weight:700;background:var(--card);border:3px solid var(--line);text-transform:uppercase}
.tile.used{opacity:.25}
.slot{min-height:64px;border:3px dashed var(--line);border-radius:var(--radius);padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:1.25em;cursor:pointer}
.flash .side{color:var(--soft);font-size:.7em;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{background:var(--card);border:3px solid var(--line);padding:12px;text-align:left;min-height:58px}
.match button.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.match button.done{border-color:var(--good);background:var(--good-bg);opacity:.55}
.match button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.7em;font-weight:700}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shop button{background:var(--card);border:3px solid var(--line);padding:12px;text-align:center}
.shop button.on{border-color:var(--good)}
.shop .em{font-size:2em;display:block}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:120px;margin:6px;text-align:center;font-size:.8em;opacity:.35}
.badge.got{opacity:1} .badge .em{font-size:2.2em}
.speak{background:transparent;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85em;margin-left:6px}
.muted{color:var(--soft)}
.center{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
input[type=range]{width:200px}
@media (max-width:560px){ :root{--fs:17px} .match{grid-template-columns:1fr} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const DATA = {"grade": "g07", "label": "Grade 7", "strap": "Science · Stage 8", "built": "2026-09-22", "units": [{"id": "g07-u01", "n": 1, "title": "Respiration", "terms": [["4dfcd4acf2", "Respiration", "A chemical reaction in every living cell that releases energy from glucose"], ["945e9c4a8f", "Aerobic respiration", "Respiration that uses oxygen"], ["4c3c73d96a", "Mitochondria", "The parts of a cell where aerobic respiration happens"], ["f22af154d8", "Respiratory system", "The organ system that takes in oxygen and gets rid of carbon dioxide"], ["2de5c1c77f", "Larynx (voicebox)", "The top of the trachea; contains the vocal cords"], ["0390b42588", "Trachea (windpipe)", "The tube that carries air from the throat to the chest"], ["b957951b18", "Bronchus (plural bronchi)", "One of the two tubes that carry air into the lungs"], ["f4746c000b", "Bronchiole", "A small tube inside the lung"], ["a04ef8de11", "Air sac (alveolus)", "A tiny sac where gas exchange happens"], ["1929018c95", "Cartilage", "Tough, bendy tissue that holds the trachea and bronchi open"], ["a2846ba8ae", "Gas exchange", "Oxygen moving into the blood, and carbon dioxide moving out"], ["41c79ab053", "Diffusion", "Particles spreading from where there are many to where there are fewer"], ["49434c3145", "Capillary", "A tiny blood vessel with a very thin wall"], ["ddbbdb2446", "Diaphragm", "A dome-shaped sheet of muscle under the lungs"], ["7af69d8a7c", "Intercostal muscles", "Muscles between the ribs"], ["588f33ae3d", "Analogy", "A comparison with something simpler, used as a model"], ["792dba8ad7", "Limewater", "A liquid that turns cloudy when carbon dioxide passes through it"], ["ced769bfaa", "Plasma", "The liquid part of blood"], ["fbe113e8c9", "Haemoglobin", "The red substance in red blood cells that carries oxygen"], ["e48bf301b7", "Oxyhaemoglobin", "Haemoglobin joined to oxygen"], ["b743d5ffa9", "Pathogen", "A microorganism that causes disease"], ["75afd826ce", "Phagocytosis", "A white blood cell engulfing and digesting a pathogen"], ["13783bdf2f", "Antibody", "A chemical made by white blood cells that sticks to a pathogen"], ["02f5dc23c4", "Hazard", "Something that could cause harm"], ["7854117c0d", "Risk assessment", "Identifying the hazards, and how to reduce the risk from each"]], "checks": [["7cdf921725", "Name, in order, the tubes air passes through from the trachea to the air sacs", "Bronchi, then bronchioles"], ["bc9329afa1", "Why does the trachea have rings of cartilage?", "To hold it open, so it does not collapse when you breathe in"], ["85adac0249", "Give two features of the air sacs that make gas exchange fast", "Any two: thin walls; large surface area; rich blood supply; moist"], ["5a54f6c03e", "What happens to the volume and the pressure in your chest when you breathe in?", "The volume increases, so the pressure decreases"], ["6e01bfda76", "Write the word equation for aerobic respiration", "glucose + oxygen → carbon dioxide + water"], ["615c9ca83c", "Why do dead peas make no heat?", "Dead peas do not respire, so they release no energy as heat"], ["f7b6e9005e", "Why does a red blood cell have no mitochondria?", "So that it does not use up the oxygen it is carrying"], ["689a2b85ea", "Name two things carried in plasma", "Any two: glucose (nutrients); carbon dioxide; blood cells; hormones"], ["4b6f74691d", "Put these structures in the order that air passes through them as you breathe in: bronchiole, trachea, air sac, bronchus", "trachea → bronchus → bronchiole → air sac (one pair out of order loses one mark)"], ["4da24116e1", "Zara cuts open a sheep's lung with scissors. Write down one hazard, and one way she can reduce the risk from it", "hazard: the raw lung may carry harmful microorganisms — wear gloves / wash hands with soap afterwards (or: sharp scissors — cut downwards, away from the body)"], ["12df60c7f0", "Oxygen moves from the air in an air sac into the blood. Explain why it moves in this direction", "there is more oxygen in the air sac than in the blood, so it diffuses from where there is more to where there is less"], ["14efc068b6", "Air sacs are adapted to make gas exchange fast. Describe one adaptation of the air sacs and explain how it helps", "thin walls so the diffusion distance is short / diffusion is faster (or: large surface area more diffusion at once · rich blood supply keeps the difference in concentration high · moist walls gases dissolve )"], ["ed9c1b6e79", "Explain why the air you breathe out contains more carbon dioxide than the air you breathe in", "your cells make carbon dioxide in respiration it diffuses from the blood into the air sacs and is breathed out"], ["812de4136e", "Describe what happens to the diaphragm when you breathe in", "(the muscles in) the diaphragm contract the diaphragm flattens / moves down"], ["1465f655c1", "Complete the word equation for aerobic respiration. glucose + .................... → .................... + water", "oxygen · carbon dioxide"], ["6a7b5255ca", "Heart muscle cells have more mitochondria than skin cells. Suggest why", "heart muscle contracts all the time, so it needs more energy (from respiration)"], ["418f3eb7e9", "Maria says, \"Breathing and respiration are the same thing.\" Explain why Maria is wrong", "any two: breathing moves air into and out of the lungs, but respiration is a chemical reaction breathing happens in the lungs, but respiration happens in every cell respiration releases energy from glucose; breathing does not"], ["df63295926", "Explain how having no nucleus helps a red blood cell to do its job", "more space for haemoglobin so it can carry more oxygen"]], "facts": [["2ad7c42e1f", "Respiration happens in every living cell, all the time. In the mitochondria, glucose and oxygen react to make carbon dioxide and water. This releases energy that the cell uses"], ["3b40fe9f5d", "Diffusion is the spreading of particles from where there are many of them to where there are fewer. Gases and dissolved substances diffuse. Diffusion is faster when the distance is short and the surface area is large"], ["1e299808a7", "When the volume of a gas gets bigger, its pressure goes down. When the volume gets smaller, its pressure goes up. Air always moves from higher pressure to lower pressure"], ["da40b37f86", "A muscle can only pull, by contracting (getting shorter). When it relaxes, it stops pulling. The lungs have no muscles of their own, so other muscles must move them"], ["61caa6cf95", "Blood is the delivery service. Plasma carries dissolved substances and the blood cells. Red blood cells carry oxygen. White blood cells protect against pathogens"]]}, {"id": "g07-u02", "n": 2, "title": "Properties of materials", "terms": [["c47f714890", "Solute", "The substance that dissolves"], ["75c3b0c1de", "Solvent", "The liquid that the solute dissolves in"], ["9a196fd0fc", "Solution", "The mixture made when a solute dissolves in a solvent"], ["a029799f72", "Soluble", "Able to dissolve in a solvent"], ["4efee0810e", "Insoluble", "Not able to dissolve in a solvent"], ["b469d212de", "Transparent", "You can see through it; all solutions are transparent"], ["1bf63dec49", "Opaque", "You cannot see through it"], ["3d9ab342f9", "Pure substance", "A substance that contains only one substance"], ["cfc2229e29", "Conserved", "Not lost; the total mass stays the same"], ["0fa39d0252", "Meniscus", "The curved surface of a liquid in a measuring cylinder"], ["ad20d39b12", "Concentration", "How many solute particles there are in a given volume"], ["bb0f7f9320", "Concentrated", "Having many solute particles in a given volume"], ["37b5f740bf", "Dilute", "Having few solute particles in a given volume"], ["a4e32a4240", "Analogy", "A comparison with something familiar that works in a similar way; a kind of model"], ["fe019cc210", "Solubility", "The mass of a solute that dissolves in 100 g of solvent at a stated temperature"], ["f69b702915", "Saturated solution", "A solution in which no more solute can dissolve at that temperature"], ["7703c0566a", "Hypothesis", "An idea that can be tested with evidence"], ["e0c324c166", "Independent variable", "The variable you change"], ["8390a43903", "Dependent variable", "The variable you measure"], ["73e3ab8d2f", "Control variable", "A variable you keep the same, for a fair test"], ["bd3d5929a6", "Range", "The lowest and highest values of the independent variable"], ["fa003b4a9b", "Interval", "The gap between one value of the independent variable and the next"], ["c589a92aea", "Anomaly", "A result that does not fit the pattern"], ["0706b71bb9", "Reliable", "Giving similar results when the experiment is repeated"], ["9050338d13", "Risk assessment", "Identifying the hazards, and how to reduce the risk from each"], ["806b65ef1f", "Paper chromatography", "A way to separate the dissolved substances in a mixture on paper"], ["d96c95c7eb", "Chromatogram", "The pattern of spots that chromatography produces"], ["c4ace6e366", "Solvent front", "The highest point the solvent reaches on the paper"], ["0fc8029aa8", "Rf value", "Distance moved by a spot ÷ distance moved by the solvent front"]], "checks": [["c0ff84c60a", "In \"sugar dissolves in water\", name the solute, the solvent and the solution", "Solute: sugar. Solvent: water. Solution: the sugar solution (sugar water)"], ["535c6c4504", "Why is a solution always transparent?", "The solute particles are spread out among the solvent particles and are too small to block the light"], ["41b00850ea", "15 g of salt dissolves in 100 g of water. What is the mass of the solution?", "115 g"], ["5c862cbe49", "Give two ways to make a solution more concentrated", "Dissolve more solute in it; evaporate (remove) some of the solvent"], ["717f586619", "Calculate the concentration of 4.0 g of salt in 50 cm³ of solution, in g / 100 cm³", "4.0 ÷ 50 × 100 = 8.0 g / 100 cm³"], ["48ffa57dfb", "What is a saturated solution?", "A solution in which no more solute will dissolve, at that temperature"], ["baa423ae8b", "Name the independent, dependent and one control variable in the solubility investigation", "Independent: temperature of the water. Dependent: mass of salt that dissolves. Control: volume of water (or type of salt, size of portion, stirring)"], ["20d69c1910", "Why is the start line on a chromatogram drawn in pencil?", "Pencil does not dissolve in the solvent, so it does not move up the paper and spoil the result"], ["57460d67ec", "A dye spot is 30 mm from the start line and the solvent front is 50 mm from it. Calculate Rf", "30 ÷ 50 = 0.6"], ["e36e724d95", "Priya dissolves 12 g of sugar in 80 g of water. What is the mass of the sugar solution? Explain your answer", "92 g the mass of the solute and the solvent add together / no mass is lost because the sugar particles are still there"], ["dca8c29b30", "Tom says, \"When I put sugar in my tea, the sugar melts.\" Explain why Tom is wrong", "the sugar dissolves dissolving needs two substances (a solute and a solvent) / the sugar is not heated to its melting point"], ["ee240c14a3", "Kofi has a beaker of copper sulfate solution. Give two ways he could make the solution more concentrated", "dissolve more copper sulfate in it evaporate / remove some of the water"], ["76b746a82a", "A teacher says a crowded bus is like a concentrated solution. She calls this an analogy. Explain what is meant by an analogy", "comparing something (hard to see) with something familiar that behaves in a similar way / a model that uses similar features to explain an idea"], ["962ae696db", "Three solutions have these concentrations: P 8.0 g / 100 cm³, Q 15.0 g / 100 cm³, R 3.5 g / 100 cm³. Which solution has the most solute particles in 100 cm³? Explain your answer", "Q it has the highest concentration"], ["a4b066f004", "7 g of potassium chlorate dissolves in 100 g of water at 20 °C. What mass dissolves in 300 g of water at 20 °C?", "300 g is three times 100 g, so 7 × 3 = 21 g"], ["eaa8a24394", "Use the table. Describe how the solubility of sodium nitrate changes as the temperature increases", "as the temperature increases, the solubility increases (allow \"the hotter the water, the more dissolves\")"], ["f14211ccd3", "Leo says, \"My results are not reliable.\" Give two reasons why Leo is correct", "the result at 50 °C does not fit the pattern / is an anomaly he has only one set of results / he did not repeat the experiment"], ["12ae7596f4", "Ana sets up a chromatography experiment. The solvent in the beaker is above her ink spot. Explain why she will not get a useful result", "the ink / spot dissolves into the solvent in the beaker so it does not move up the paper / does not separate / the solvent becomes coloured"], ["7e8b554b38", "An orange food colour gives two spots on a chromatogram. One is level with pure red dye. The other is level with pure yellow dye. (a) Is the orange food colour a pure substance? Explain your answer. (b) Name the dyes it contains", "(a) no — it gives more than one spot / it is a mixture (b) red and yellow"], ["4f8fbcc0d8", "On a chromatogram, a blue spot is 18 mm from the start line. The solvent front is 45 mm from the start line. Calculate the Rf value of the blue dye", "18 ÷ 45 = 0.4"]], "facts": [["679d0def3e", "When a solute dissolves, its particles separate and spread out among the solvent particles. The particles are still there, but they are too small and too spread out to see"], ["6dc38bdfc6", "Dissolving does not create or destroy particles, so mass is conserved. The mass of the solution equals the mass of the solute plus the mass of the solvent"], ["e1819611fa", "Concentration is how crowded the solute particles are — the number of solute particles in a given volume. Only two things raise it: more solute particles, or fewer solvent particles"], ["a992f6bcaa", "A solvent can only hold so much of a solute. That limit is the solubility. It depends on the solute, the solvent and the temperature. A solution at the limit is saturated"], ["b4c4c066d9", "Different substances dissolve to different amounts in the same solvent. This explains why salts have different solubilities, why nail polish needs its own solvent, and why chromatography separates dyes"]]}]};
// Science Arcade engine. Data comes from tools/build_arcade.py (the unit Core Notes).
// Everything runs in the browser; progress is saved in localStorage, with a save code as backup.
"use strict";

// ───────────────────────── state ─────────────────────────
const KEY = "science-arcade:" + DATA.grade;
const TODAY = () => new Date().toISOString().slice(0, 10);
const BLANK = {
  name: "", xp: 0, coins: 0, box: {}, right: 0, answered: 0, missions: 0, lastMission: "",
  streak: 0, owned: ["none", "teal"], hat: "none", colour: "teal", badges: [], unitsDone: {},
  settings: { size: 19, speak: false, calm: false, sound: true, dark: false },
};
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign({}, BLANK, s, { settings: Object.assign({}, BLANK.settings, s.settings) }); } catch (e) {}
  return JSON.parse(JSON.stringify(BLANK));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ───────────────────────── helpers ─────────────────────────
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const level = () => Math.floor(Math.sqrt(S.xp / 40)) + 1;
const xpFor = l => 40 * (l - 1) * (l - 1);
function applySettings() {
  document.documentElement.style.setProperty("--fs", S.settings.size + "px");
  document.body.classList.toggle("calm", S.settings.calm);
  document.documentElement.dataset.theme = S.settings.dark ? "dark" : "light";
}
function speak(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.lang = "en-GB"; speechSynthesis.speak(u); } catch (e) {}
}
const say = t => `<button class="speak" data-say="${esc(t)}" aria-label="Read aloud">🔊 Read</button>`;
let actx;
function beep(good) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [523, 659, 784] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.09; g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}
function confetti() {
  if (S.settings.calm) return;
  const d = document.createElement("div"); d.className = "confetti";
  const cols = ["#2f6f9f", "#2e8b57", "#d99a00", "#7b5ea7", "#e4572e"];
  for (let i = 0; i < 60; i++) { const b = document.createElement("i"); b.style.left = rnd(100) + "vw"; b.style.background = pick(cols); b.style.animationDelay = (Math.random() * 0.6) + "s"; d.appendChild(b); }
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); speak(b.dataset.say); } }, true);

// ───────────────────────── the pet ─────────────────────────
const COLOURS = { teal: "#3aa38f", sky: "#4a90d9", sun: "#f2b705", berry: "#c2477b", grape: "#7b5ea7", lime: "#7cb342", coral: "#ef6f5e", night: "#34495e", rainbow: "url(#rb)" };
const HATS = { none: "", cap: "🧢", crown: "👑", top: "🎩", grad: "🎓", helmet: "⛑️", bow: "🎀", flower: "🌼", goggles: "🥽", star: "⭐", rocket: "🚀", dino: "🦖" };
const SHOP = [
  ["colour", "sky", "Sky blue", 20], ["colour", "sun", "Sunshine", 20], ["colour", "berry", "Berry", 30], ["colour", "grape", "Grape", 30],
  ["colour", "lime", "Lime", 30], ["colour", "coral", "Coral", 40], ["colour", "night", "Midnight", 50], ["colour", "rainbow", "Rainbow", 150],
  ["hat", "cap", "Cap", 25], ["hat", "bow", "Bow", 25], ["hat", "flower", "Flower", 30], ["hat", "goggles", "Lab goggles", 40],
  ["hat", "helmet", "Safety helmet", 40], ["hat", "grad", "Graduate", 60], ["hat", "top", "Top hat", 60], ["hat", "star", "Star", 80],
  ["hat", "rocket", "Rocket", 100], ["hat", "crown", "Crown", 150], ["hat", "dino", "Dino friend", 200],
];
function petSVG(size = 120, mood = "happy") {
  const c = COLOURS[S.colour] || COLOURS.teal, grow = Math.min(1 + (level() - 1) * 0.04, 1.4);

      if (!S.owned.includes(key)) { if (S.coins < price) { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); return; } S.coins -= price; S.owned.push(key); beep(true); }
      if (kind === "hat") S.hat = key; else S.colour = key; checkBadges(); save(); go("shop");
    });
  },
  badges() {
    $app.innerHTML = header("home") + `<h1>Badges</h1><p class="muted">${S.right} correct answers so far.</p><div>${BADGES.map(b => `<div class="badge ${S.badges.includes(b[0]) ? "got" : ""}"><span class="em">${b[1]}</span><strong>${b[2]}</strong><span>${b[3]}</span></div>`).join("")}</div>`;
  },
  settings() {
    const st = S.settings;
    $app.innerHTML = header("home") + `<h1>Settings</h1>
      <div class="card"><label>Text size <input type="range" min="16" max="28" value="${st.size}" id="sz"></label></div>
      <div class="card"><label><input type="checkbox" id="sp" ${st.speak ? "checked" : ""}> Read every question aloud</label><br>
        <label><input type="checkbox" id="snd" ${st.sound ? "checked" : ""}> Sounds</label><br>
        <label><input type="checkbox" id="calm" ${st.calm ? "checked" : ""}> Calm mode (no moving pictures or confetti)</label><br>
        <label><input type="checkbox" id="dk" ${st.dark ? "checked" : ""}> Dark colours</label></div>
      <div class="card"><h2>Your name</h2><input id="nm" value="${esc(S.name)}" maxlength="20" style="font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line)"></div>
      <div class="card"><h2>Save code</h2><p class="muted">Your progress is saved on this computer. To move it to another computer, copy this code, then paste it there.</p>
        <textarea id="code" rows="3" style="width:100%;font:14px monospace" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
        <div class="row"><button class="ghost" id="copy">Copy code</button><button class="ghost" id="load">Load a code</button></div></div>
      <p class="muted">Built ${esc(DATA.built)} · ${UNITS.length} unit${UNITS.length === 1 ? "" : "s"} · ${esc(DATA.strap)}</p>`;
    const upd = () => { st.size = +sz.value; st.speak = sp.checked; st.sound = snd.checked; st.calm = calm.checked; st.dark = dk.checked; S.name = nm.value.trim() || S.name; applySettings(); save(); };
    const [sz, sp, snd, calm, dk, nm] = ["sz", "sp", "snd", "calm", "dk", "nm"].map(i => document.getElementById(i));
    [sz, sp, snd, calm, dk, nm].forEach(el => el.oninput = el.onchange = upd);
    document.getElementById("copy").onclick = () => { const t = document.getElementById("code"); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); } };
    document.getElementById("load").onclick = () => { const c = prompt("Paste your save code:"); if (!c) return; try { const s = JSON.parse(decodeURIComponent(escape(atob(c.trim())))); S = Object.assign({}, BLANK, s); save(); applySettings(); go("home"); } catch (e) { alert("That code did not work. Check you copied all of it."); } };
  },
};
function shopRow(kind) {
  const base = kind === "colour" ? [["colour", "teal", "Teal", 0]] : [["hat", "none", "No hat", 0]];
  return base.concat(SHOP.filter(s => s[0] === kind)).map(([k, key, name, price]) => {
    const own = S.owned.includes(key) || price === 0, on = (k === "hat" ? S.hat : S.colour) === key;
    const em = k === "hat" ? (HATS[key] || "🙂") : `<span style="display:inline-block;width:1em;height:1em;border-radius:50%;background:${key === "rainbow" ? "linear-gradient(90deg,#ef6f5e,#f2b705,#3aa38f,#7b5ea7)" : COLOURS[key]}"></span>`;
    return `<button data-buy="${key}" data-kind="${k}" class="${on ? "on" : ""}"><span class="em">${em}</span>${name}<br><small>${on ? "wearing" : own ? "owned" : "🪙 " + price}</small></button>`;
  }).join("");
}

// ───────────────────── the round player ─────────────────────
function play(qs, opt) {
  if (!qs.length) { $app.innerHTML = header(opt.back) + `<div class="card">Nothing here yet — try another activity!</div>`; return; }
  let i = 0, score = 0; const res = [];
  const backArgs = `data-go="${opt.back}" ${opt.arg ? `data-arg="${opt.arg}"` : ""}`;
  function show() {
    const q = qs[i];
    const u = unitById(q.unit);
    const dots = qs.map((_, k) => `<b class="${k < i ? (res[k] ? "ok" : "no") : k === i ? "now" : ""}"></b>`).join("");
    let body = "";
    if (q.kind === "mc") body = `<div class="prompt">${esc(q.prompt)} ${say(q.prompt + " " + (q.detail || "") + " " + q.options.join(". "))}</div>${q.detail ? `<div class="card" style="font-size:1.1em">${esc(q.detail)}</div>` : ""}<div id="opts">${q.options.map(o => `<button class="opt">${esc(o)}</button>`).join("")}</div>`;
    else if (q.kind === "build") body = `<div class="prompt">${esc(q.prompt)} ${say(q.detail)}</div><div class="card" style="font-size:1.1em">${esc(q.detail)}</div>
      <p class="muted">Tap the letters in order. It has ${q.answer.replace(/[ -]/g, "").length} letters.</p><div class="slot" id="slot"></div>
      <div class="tiles" id="tiles">${shuffle(q.answer.replace(/[ -]/g, "").split("")).map((c, k) => `<button class="tile" data-k="${k}">${esc(c)}</button>`).join("")}</div>
      <div class="row"><button class="ghost" id="hint">💡 Hint</button><button class="ghost" id="undo" hidden>⌫</button></div>`;
    else body = `<div class="prompt">${esc(q.prompt)} ${say(q.prompt)}</div><p class="muted">Think of your answer — say it or write it down. Then check.</p>
      <button class="primary" id="reveal">Show the answer</button><div id="ans"></div>`;
    $app.innerHTML = `<div class="bar"><button class="ghost" ${backArgs}>✖ Stop</button><strong>${esc(opt.title)}</strong><span class="chip">${i + 1} / ${qs.length}</span></div>
      <div class="dots">${dots}</div>${opt.mission && u ? `<p class="muted">Unit ${u.n}: ${esc(u.title)}</p>` : ""}<div class="card pop">${body}</div><div id="fb"></div>`;
    if (S.settings.speak) speak(q.kind === "build" ? q.detail : q.prompt + (q.detail ? ". " + q.detail : ""));
    if (q.kind === "mc") {
      const tries = { n: 0 };
      $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        if (b.disabled) return;
        const ok = b.textContent === q.answer;
        if (ok) { b.classList.add("right"); finish(tries.n === 0, q); }
        else { b.classList.add("wrong"); b.disabled = true; tries.n++; beep(false);
          if (tries.n >= 2) { $app.querySelectorAll(".opt").forEach(x => { if (x.textContent === q.answer) x.classList.add("right"); x.disabled = true; }); finish(false, q); }
          else fb(`Not quite — have another go! 💪`, "try"); }
      });
    } else if (q.kind === "build") {
      const target = q.answer.replace(/[ -]/g, "").toLowerCase(); let typed = []; let hints = 0;
      const slot = document.getElementById("slot"), tiles = [...document.querySelectorAll(".tile")];
      const draw = () => { slot.innerHTML = typed.map(k => `<span class="tile" style="display:inline-grid;place-items:center">${esc(tiles[k].textContent)}</span>`).join(""); tiles.forEach((t, k) => t.classList.toggle("used", typed.includes(k))); };
      // Guided spelling: a wrong letter is refused on the spot, and after three misses the right
      // tile lights up — nobody can get stuck, and nothing has to be undone.
      let misses = 0, here = 0;
      tiles.forEach((t, k) => t.onclick = () => {
        if (typed.includes(k)) return;
        if (t.textContent.toLowerCase() !== target[typed.length]) {
          misses++; here++; beep(false); t.classList.add("shake"); setTimeout(() => t.classList.remove("shake"), 400);
          if (here >= 3) tiles.find((x, j) => !typed.includes(j) && x.textContent.toLowerCase() === target[typed.length]).style.borderColor = "var(--gold)";
          return;
        }
        here = 0; tiles.forEach(x => x.style.borderColor = ""); typed.push(k); draw();
        if (typed.length === target.length) finish(hints === 0 && misses <= 2, q);
      });
      document.getElementById("undo").onclick = () => { typed.pop(); draw(); };
      document.getElementById("hint").onclick = () => { hints++; fb(`It starts with "${q.answer[0].toUpperCase()}"${hints > 1 ? ` and ends with "${q.answer.slice(-1)}"` : ""}.`, "try"); };
    } else {
      document.getElementById("reveal").onclick = () => {
        document.getElementById("ans").innerHTML = `<div class="card" style="border-color:var(--good)"><strong>Answer:</strong> ${esc(q.answer)} ${say(q.answer)}</div>
          <p>Did you get it?</p><div class="row"><button class="primary" id="yes">✅ I got it</button><button class="ghost" id="nearly">🙂 Nearly</button><button class="ghost" id="no">🔁 Not yet</button></div>`;
        document.getElementById("reveal").remove();
        document.getElementById("yes").onclick = () => finish(true, q, true);
        document.getElementById("nearly").onclick = () => finish(false, q, true, true);
        document.getElementById("no").onclick = () => finish(false, q, true);
        if (S.settings.speak) speak("The answer is: " + q.answer);
      };
    }
  }
  function fb(msg, cls) { document.getElementById("fb").innerHTML = `<div class="feedback ${cls}">${msg}</div>`; }
  function finish(ok, q, self, nearly) {
    if (!q.gen) mark(q.id, ok); else { S.answered++; if (ok) S.right++; }
    res[i] = ok; if (ok) score++;
    const gainXp = ok ? 10 : 4, gainCoins = ok ? 3 : 1;   // effort always earns something
    const before = level(); S.xp += gainXp; S.coins += gainCoins; save();
    beep(ok);
    const praise = pick(["Brilliant!", "Great job!", "You got it!", "Super scientist!", "Fantastic!", "Spot on!"]);
    const kind = nearly ? "Good effort — you'll see this one again soon." : ok ? praise : self ? "That's OK — you'll see this one again soon, and you'll get it." : "Good try! Here is the answer:";
    $app.querySelectorAll("#opts .opt, .tile, #undo, #hint").forEach(b => b.disabled = true);
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "good" : "try"} pop">${kind} <span class="chip">+${gainXp} XP</span> <span class="chip">+${gainCoins} 🪙</span>
      ${!ok && q.explain ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)} ${say(q.explain)}</div>` : ok && q.explain && q.gen ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)}</div>` : ""}</div>
      <button class="primary" id="next">${i + 1 < qs.length ? "Next ➡" : "Finish 🎉"}</button>`;
    if (level() > before) { confetti(); fb2(`🎉 Level up! Your buddy is now level ${level()}!`); }
    const nb = document.getElementById("next"); nb.focus(); nb.onclick = () => { i++; i < qs.length ? show() : end(); };
  }
  function fb2(msg) { const d = document.createElement("div"); d.className = "feedback good pop"; d.textContent = msg; document.getElementById("fb").prepend(d); }
  function end() {
    const stars = score >= qs.length * 0.9 ? 3 : score >= qs.length * 0.6 ? 2 : 1;
    let bonus = 5 * stars;
    if (opt.mission) {
      if (S.lastMission !== TODAY()) {
        const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
        S.streak = S.lastMission === y ? S.streak + 1 : 1; S.lastMission = TODAY(); bonus += 20;
      }
      S.missions++;
    }
    S.coins += bonus; S.xp += bonus; save(); checkBadges();
    if (stars === 3) confetti();
    $app.innerHTML = header() + `<div class="card center pop">${petSVG(140, "wow")}<h1>${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</h1>
      <h2>${score} out of ${qs.length}!</h2><p>${stars === 3 ? "Amazing work!" : stars === 2 ? "Really good — keep going!" : "Every try makes you stronger. Let's do another!"}</p>
      <p><span class="chip">Bonus +${bonus} 🪙</span>${opt.mission && S.streak ? ` <span class="chip">🔥 ${S.streak}-day streak</span>` : ""}</p>
      <div class="row" style="justify-content:center"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button>${opt.unit ? `<button class="ghost" data-go="world" data-arg="${opt.unit}">Unit menu</button>` : ""}</div></div>`;
    document.getElementById("again").onclick = () => opt.mission ? go("mission") : go(opt.back === "world" ? currentActivity(opt) : "home", opt.arg);
    if (S.settings.speak) speak(`${score} out of ${qs.length}. ${stars === 3 ? "Amazing work!" : "Well done!"}`);
  }
  show();
}
function currentActivity(opt) { const t = opt.title; return t.startsWith("Quiz") ? "play" : t.startsWith("Number") ? "numbers" : t.startsWith("Word") ? "builder" : t.startsWith("Challenge") ? "challenge" : "play"; }

// ───────────────────── flashcards ─────────────────────
function flashcards(cards, id, title) {
  let i = 0, flipped = false; cards = weakFirst(cards, c => c[2]);
  function show() {
    const [front, back, cid] = cards[i];
    $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>${title}</strong><span class="chip">${i + 1} / ${cards.length}</span></div>
      <button class="card flash pop" id="fc" style="width:100%"><span class="side">${flipped ? "meaning" : "tap to flip"}</span>${esc(flipped ? back : front)}</button>
      <div class="row" style="justify-content:center">${say(flipped ? back : front)}
        ${flipped ? `<button class="primary" id="know">✅ I know this</button><button class="ghost" id="learn">🔁 Still learning</button>` : `<button class="primary" id="flip">Flip 🔄</button>`}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="ghost" id="prev">⬅ Previous</button><button class="ghost" id="nxt">Next ➡</button></div>`;
    if (S.settings.speak) speak(flipped ? back : front);
    const flip = () => { flipped = !flipped; show(); };
    document.getElementById("fc").onclick = flip;
    if (!flipped) document.getElementById("flip").onclick = flip;
    else {
      document.getElementById("know").onclick = () => { if (!title.startsWith("Big")) mark(cid, true); S.xp += 3; S.coins += 1; save(); beep(true); next(); };
      document.getElementById("learn").onclick = () => { S.xp += 2; save(); next(); };
    }
    document.getElementById("prev").onclick = () => { i = (i - 1 + cards.length) % cards.length; flipped = false; show(); };
    document.getElementById("nxt").onclick = next;
  }
  function next() { i = (i + 1) % cards.length; flipped = false; if (i === 0) confetti(); show(); }
  show();
}

// ───────────────────── match up ─────────────────────
function matchGame(id) {
  const set = weakFirst(allTerms.filter(t => t.unit === id)).slice(0, 5);
  const left = shuffle(set), right = shuffle(set);
  let sel = null, done = 0, mistakes = 0;
  $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>Match up</strong><span class="chip" id="mc">0 / ${set.length}</span></div>
    <p>Tap a word, then tap its meaning. ${say("Tap a word, then tap its meaning.")}</p>
    <div class="match"><div>${left.map(t => `<button data-side="L" data-id="${t.id}" style="width:100%;margin-bottom:10px;font-weight:700">${esc(t.term)}</button>`).join("")}</div>
    <div>${right.map(t => `<button data-side="R" data-id="${t.id}" style="width:100%;margin-bottom:10px">${esc(t.meaning)}</button>`).join("")}</div></div><div id="fb"></div>`;
  $app.querySelectorAll(".match button").forEach(b => b.onclick = () => {
    if (b.classList.contains("done")) return;
    if (!sel || sel.dataset.side === b.dataset.side) { $app.querySelectorAll(".match .sel").forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); if (S.settings.speak) speak(b.textContent); return; }
    if (sel.dataset.id === b.dataset.id) {
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); }); mark(b.dataset.id, true); done++; S.xp += 5; S.coins += 2; beep(true);
      document.getElementById("mc").textContent = `${done} / ${set.length}`; save();
      if (done === set.length) { const bonus = mistakes === 0 ? 15 : 8; S.coins += bonus; save(); confetti(); checkBadges();
        document.getElementById("fb").innerHTML = `<div class="feedback good pop">All matched! ${mistakes === 0 ? "Perfect — no mistakes!" : ""} <span class="chip">+${bonus} 🪙</span></div><div class="row"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button></div>`;
        document.getElementById("again").onclick = () => matchGame(id); }
    } else { mistakes++; beep(false); [sel, b].forEach(x => { x.classList.add("shake"); setTimeout(() => x.classList.remove("shake", "sel"), 400); }); }
    sel = null;
  });
}

// ───────────────────── badges ─────────────────────
const BADGES = [
  ["first", "🌱", "First steps", "Answer your first question", () => S.answered >= 1],
  ["ten", "🔟", "Ten right", "10 correct answers", () => S.right >= 10],
  ["fifty", "🎯", "Sharp shooter", "50 correct answers", () => S.right >= 50],
  ["hundred", "💯", "Century", "100 correct answers", () => S.right >= 100],
  ["fivehundred", "🧠", "Brain power", "500 correct answers", () => S.right >= 500],
  ["mission", "🚀", "Lift off", "Finish a mission", () => S.missions >= 1],
  ["mission10", "🛰️", "Space explorer", "Finish 10 missions", () => S.missions >= 10],
  ["streak3", "🔥", "On fire", "3-day mission streak", () => S.streak >= 3],
  ["streak7", "🌟", "Super week", "7-day mission streak", () => S.streak >= 7],
  ["level5", "⭐", "Rising star", "Reach level 5", () => level() >= 5],
  ["level10", "🏆", "Champion", "Reach level 10", () => level() >= 10],
  ["shop", "🛍️", "Stylish", "Buy something in the shop", () => S.owned.length > 2],
  ["master", "🎓", "Unit master", "Get a unit to 80% mastery", () => UNITS.some(u => mastery(u) >= 80)],
  ["allworlds", "🌍", "World traveller", "Get every unit to 50%", () => UNITS.length > 1 && UNITS.every(u => mastery(u) >= 50)],
];
function checkBadges() {
  const got = BADGES.filter(b => !S.badges.includes(b[0]) && b[4]());
  if (!got.length) return;
  got.forEach(b => S.badges.push(b[0])); S.coins += 10 * got.length; save(); confetti();
  const d = document.createElement("div"); d.className = "feedback good pop"; d.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9;box-shadow:0 6px 20px #0003";
  d.textContent = `New badge: ${got.map(b => b[1] + " " + b[2]).join(", ")}! +${10 * got.length} 🪙`; document.body.appendChild(d); setTimeout(() => d.remove(), 3500);
}

applySettings();
go("home");

</script>
</body>
