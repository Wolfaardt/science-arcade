<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Arcade — Grade 9</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1f2a37; --soft:#5b6675; --line:#e2ddd2;
  --brand:#2f6f9f; --brand-ink:#ffffff; --good:#2e8b57; --good-bg:#e6f4ec;
  --warn:#b4531f; --warn-bg:#fbeee6; --gold:#d99a00; --accent:#7b5ea7;
  --radius:18px; --fs:19px;
}
:root[data-theme="dark"]{
  --bg:#141a22; --card:#1e2733; --ink:#eef2f6; --soft:#a9b4c2; --line:#2e3a48;
  --brand:#5aa0d6; --brand-ink:#0d1520; --good:#5cc98c; --good-bg:#16301f;
  --warn:#f08a55; --warn-bg:#3a2216; --gold:#ffc53d; --accent:#b39ddb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.5 "Segoe UI","Trebuchet MS",Verdana,system-ui,sans-serif;letter-spacing:.01em}
body.calm *{animation:none!important;transition:none!important}
#app{max-width:880px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.6em} h2{font-size:1.3em} h3{font-size:1.1em}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:var(--radius)}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.big{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);padding:16px 18px;font-size:1.05em;min-height:64px}
.big:hover{border-color:var(--brand)}
.big .ico{font-size:1.6em;margin-right:10px;vertical-align:middle}
.big small{display:block;color:var(--soft);font-size:.8em;margin-top:2px}
.primary{background:var(--brand);color:var(--brand-ink);padding:14px 26px;font-weight:700;font-size:1.05em;min-height:56px}
.ghost{background:transparent;border:2px solid var(--line);padding:10px 18px;min-height:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);padding:14px 18px;margin:10px 0;min-height:60px}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.prompt{font-size:1.2em;font-weight:600;margin:6px 0 12px}
.feedback{border-radius:var(--radius);padding:14px 18px;margin:12px 0;font-weight:600}
.feedback.good{background:var(--good-bg);color:var(--good)}
.feedback.try{background:var(--warn-bg);color:var(--warn)}
.progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);border-radius:999px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.dots b{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots b.ok{background:var(--good)} .dots b.no{background:var(--warn)} .dots b.now{outline:3px solid var(--brand)}
.pet{display:flex;align-items:center;gap:18px}
.pet svg{flex:0 0 auto}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tile{min-width:52px;height:56px;font-size:1.3em;font-weight:700;background:var(--card);border:3px solid var(--line);text-transform:uppercase}
.tile.used{opacity:.25}
.slot{min-height:64px;border:3px dashed var(--line);border-radius:var(--radius);padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:1.25em;cursor:pointer}
.flash .side{color:var(--soft);font-size:.7em;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{background:var(--card);border:3px solid var(--line);padding:12px;text-align:left;min-height:58px}
.match button.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.match button.done{border-color:var(--good);background:var(--good-bg);opacity:.55}
.match button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.7em;font-weight:700}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shop button{background:var(--card);border:3px solid var(--line);padding:12px;text-align:center}
.shop button.on{border-color:var(--good)}
.shop .em{font-size:2em;display:block}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:120px;margin:6px;text-align:center;font-size:.8em;opacity:.35}
.badge.got{opacity:1} .badge .em{font-size:2.2em}
.speak{background:transparent;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85em;margin-left:6px}
.muted{color:var(--soft)}
.center{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
input[type=range]{width:200px}
@media (max-width:560px){ :root{--fs:17px} .match{grid-template-columns:1fr} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const DATA = {"grade": "g9-igcse1", "label": "Grade 9", "strap": "IGCSE Chemistry · Year 1", "built": "2026-09-22", "units": [{"id": "g9-igcse1-u01", "n": 1, "title": "States of Matter", "terms": [["ac3db1fa0d", "Kinetic energy", "The energy a particle has because it is moving"], ["5dbb356c68", "Kinetic particle theory", "The model that explains the properties of matter by the movement and arrangement of its particles"], ["6ac08fcbeb", "Forces of attraction", "The attractions between particles that hold a solid and a liquid together"], ["d8e73d222f", "Melting point", "The temperature at which a solid changes into a liquid"], ["8a4c0f04a0", "Boiling point", "The temperature at which a liquid changes into a gas throughout the liquid"], ["f149ceb4c0", "Melting", "Change from solid to liquid"], ["14ee9e6d25", "Freezing", "Change from liquid to solid"], ["55a3de2b53", "Boiling", "Change from liquid to gas, throughout the liquid, at the boiling point"], ["8f997a2d2d", "Evaporating", "Change from liquid to gas, at the surface only, below the boiling point"], ["b0b85828fa", "Condensing", "Change from gas to liquid"], ["28c7b370e0", "Compressible", "Able to be squeezed into a smaller volume"], ["171786c596", "Density", "Mass per unit volume"], ["438313de0a", "Diffusion", "The net movement of particles from a higher to a lower concentration, caused by their random motion"], ["80875e76e8", "Concentration gradient", "A difference in concentration between two regions"], ["9f7490cb95", "Relative molecular mass (Mᵣ)", "The sum of the relative atomic masses of all the atoms in a molecule"]], "checks": [], "facts": [["cfad00f22f", "All matter is made of particles that are always moving. In a solid they vibrate about fixed positions. In a liquid and a gas they move from place to place"], ["f65f8bc751", "The particles themselves never change during a change of state. A water molecule is the same molecule in ice, in water and in steam. What changes is how far apart the particles are, how they are arranged, and how fast they move"], ["4f261c6d66", "Temperature is a measure of the average kinetic energy of the particles. A higher temperature means the particles are moving faster on average"], ["14094fbf6e", "Particles attract one another. These forces of attraction are strongest when particles are close together, and must be overcome to pull particles apart"]]}, {"id": "g9-igcse1-u02", "n": 2, "title": "Atoms, Elements and Compounds", "terms": [["02322c41f1", "Element", "A substance containing only one type of atom"], ["178fa05540", "Compound", "Two or more types of atom chemically bonded in a fixed ratio"], ["d820802540", "Mixture", "Two or more substances not chemically bonded"], ["7c65fb0cac", "Nucleus", "The central part of an atom, containing the protons and neutrons"], ["d971ccbab5", "Proton number (atomic number)", "The number of protons in the nucleus; it defines the element"], ["63938fef88", "Nucleon number (mass number)", "The total number of protons and neutrons in the nucleus"], ["93023c3f2d", "Shell", "A region around the nucleus in which electrons are found"], ["434f52d562", "Electronic configuration", "The arrangement of electrons in shells, e.g. 2,8,1"], ["3edd2e3e2d", "Isotopes", "Atoms of the same element with the same proton number but different numbers of neutrons"], ["040511bc54", "Relative atomic mass (Aᵣ)", "The average mass of an element's isotopes on the carbon-12 scale"], ["9b0072e90d", "Ion", "An atom or group of atoms carrying an electrical charge"], ["3006174171", "Cation", "A positive ion, formed when an atom loses electrons"], ["020263e7cd", "Anion", "A negative ion, formed when an atom gains electrons"], ["4d74b2c46d", "Ionic bond", "The strong electrostatic attraction between oppositely charged ions"], ["43e671634b", "Giant ionic lattice", "A regular 3-D arrangement of alternating positive and negative ions"], ["2c9d1fb784", "Covalent bond", "A shared pair of electrons between two atoms"], ["8b52bb5a7b", "Molecule", "A group of atoms held together by covalent bonds"], ["7509176f49", "Intermolecular forces", "The weak forces of attraction between separate molecules"], ["d02ab1ec5a", "Giant covalent structure", "A continuous network of atoms joined by covalent bonds"], ["b0024c721b", "Delocalised electron", "An electron not attached to one atom, free to move through the structure"], ["eedcf5ce01", "Metallic bond", "The electrostatic attraction between positive metal ions and the sea of delocalised electrons"], ["8b7139b30f", "Malleable", "Able to be hammered into shape without breaking"], ["e11f7af43e", "Ductile", "Able to be drawn out into a wire"]], "checks": [["12ebeb4421", "Explain why air is classified as a mixture and not as a compound", "The gases in air are not chemically bonded / combined together. They are present in no fixed ratio and can be separated by physical means"], ["26981be43f", "An atom has proton number 15 and nucleon number 31. State its electronic configuration and give its group and period", "15 electrons, so the configuration is 2,8,5. Five outer-shell electrons, so Group V. Three occupied shells, so Period 3"], ["8a4cffdabb", "Copper has two isotopes: ⁶³Cu (69%) and ⁶⁵Cu (31%). Calculate the relative atomic mass of copper. Give your answer to one decimal place", "[(63 × 69) + (65 × 31)] ÷ 100 = (4347 + 2015) ÷ 100 = 63.6"], ["0d34f09481", "Explain why solid magnesium oxide does not conduct electricity but molten magnesium oxide does", "In the solid, the ions are held in fixed positions in the lattice. When molten, the lattice breaks down and the ions are free to move. Moving ions carry the electrical charge through the liquid"], ["75603e7aa8", "Explain why carbon dioxide has a much lower boiling point than silicon(IV) oxide, even though both contain only covalent bonds", "Carbon dioxide is simple molecular, so only the weak intermolecular forces between the molecules have to be overcome when it boils. Silicon(IV) oxide is giant covalent, so boiling means breaking strong covalent bonds throughout the structure. Breaking covalent bonds requires much more energy than overcoming intermolecular forces"], ["c2b141d414", "Graphite is used as a lubricant and also as an electrode. Explain, in terms of its structure, why it can do both", "Graphite has layers of carbon atoms held together by weak forces between the layers. These layers can slide over each other, which makes it slippery and useful as a lubricant. Each carbon atom uses only three of its four outer electrons for bonding. The fourth electron is delocalised and free to move, so graphite conducts electricity and can be used as an electrode"], ["4eaa0cc675", "Explain, in terms of structure and bonding, why copper can be drawn into wires", "Copper consists of layers of positive metal ions in a sea of delocalised electrons. The layers of ions can slide over each other when a force is applied. The delocalised electrons continue to attract the positive ions in their new positions, so the metallic bonding is not broken"]], "facts": [["11bc517c00", "An atom has a tiny central nucleus containing protons and neutrons, surrounded by electrons moving in shells. Almost all the mass is in the nucleus; almost all the volume is empty space around it"], ["d1fdad182e", "The proton number decides which element an atom is. Change it and you have a different element. Nothing else does this — not the neutrons, not the electrons"], ["eeabeb5b34", "Chemistry happens in the outer shell only. Two atoms with the same number of outer-shell electrons react in the same way, whatever else is different about them"], ["484310a13a", "A full outer shell is stable. The noble gases already have one, which is why they are unreactive. Every other atom bonds in order to reach one"], ["7ec8d95669", "There are exactly three ways to reach a full outer shell: lose electrons, gain electrons, or share them. Metal + non-metal gives ionic bonding, non-metal + non-metal gives covalent bonding, metal + metal gives metallic bonding. That is the whole map"]]}, {"id": "g9-igcse1-u03", "n": 3, "title": "Stoichiometry", "terms": [["29868bcc6b", "Chemical formula", "Symbols and subscripts showing the ratio of atoms of each element in a substance"], ["22c761f69c", "Molecular formula", "The actual number of atoms of each element in one molecule of a compound"], ["738699e281", "Empirical formula", "The simplest whole number ratio of the atoms or ions in a compound"], ["e5ce2a229e", "Spectator ion", "An ion present at the start and unchanged at the end, left out of an ionic equation"], ["67bb669d12", "Ionic equation", "An equation showing only the particles that change during a reaction"], ["5e2f5728c2", "State symbol", "(s), (l), (g) or (aq), showing the physical state of a substance in a reaction"], ["69da559fdb", "Relative atomic mass, Aᵣ", "The average mass of an element's isotopes compared with one twelfth of a carbon-12 atom"], ["30bb02445a", "Relative molecular mass, Mᵣ", "The sum of the relative atomic masses of all the atoms in a molecular formula"], ["1c7d42b8f0", "Relative formula mass", "The same sum, used for an ionic compound, which has no molecules"], ["82fe99bb2d", "Water of crystallisation", "Water molecules held within a crystal, written after a dot in the formula"], ["82a4e63ae5", "Mole", "The unit of amount of substance; the amount containing 6.02 × 10²³ particles"], ["541b619255", "Avogadro constant", "6.02 × 10²³, the number of particles in one mole"], ["b3792f043f", "Molar mass, M", "The mass of one mole of a substance, in g/mol"], ["4f4a23d14a", "Molar gas volume", "24 dm³, the volume of one mole of any gas at room temperature and pressure"], ["d35117032d", "Concentration", "The amount of solute in a given volume of solution, in g/dm³ or mol/dm³"], ["2719fd6893", "Limiting reactant", "The reactant that is used up first and therefore sets the amount of product"], ["8f41566909", "Excess reactant", "A reactant that is not fully used up; some is left over"], ["ed3bc7197c", "Titre", "The volume of solution delivered from a burette to reach the end-point"], ["e37cb9f0c5", "Concordant results", "Titres agreeing within 0.10 cm³, which are the ones averaged"], ["9482648c27", "Theoretical yield", "The mass of product calculated from the limiting reactant, assuming complete reaction"], ["9efe1fe45d", "Actual yield", "The mass of product actually obtained"], ["63c3e20b1f", "Percentage purity", "The proportion of a sample that is the substance named, as a percentage of the whole sample"]], "checks": [["01ba6399f3", "Deduce the formula of aluminium nitrate", "Al³⁺ with NO₃⁻; one +3 needs three −1, and the nitrate repeats, so it needs brackets: Al(NO₃)₃"], ["a641a9c4a3", "Balance: ___C₂H₆ + ___O₂ → ___CO₂ + ___H₂O", "Balance carbon first (2 each side needs 2CO₂), then hydrogen (6 needs 3H₂O), leaving 7 oxygen atoms on the right, which needs 3½O₂. Double everything: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O"], ["dbc1352ce4", "Write the ionic equation for aqueous barium chloride reacting with dilute sulfuric acid to give a white precipitate of barium sulfate", "Full: BaCl₂(aq) + H₂SO₄(aq) → BaSO₄(s) + 2HCl(aq). The H⁺ and Cl⁻ are spectators. Ionic: Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)"], ["4f4758388d", "Calculate the relative formula mass of magnesium nitrate, Mg(NO₃)₂", "24 + 2 × (14 + 48) = 24 + 124 = 148"], ["05696113b7", "Calculate the mass of one mole of CuSO₄·5H₂O", "Mᵣ(CuSO₄) = 64 + 32 + 64 = 160; plus 5 × 18 = 90; total 250, so one mole has a mass of 250 g"], ["d2a60b379f", "Calculate the volume of hydrogen, at r.t.p., produced when 0.48 g of magnesium reacts completely with excess hydrochloric acid. Mg + 2HCl → MgCl₂ + H₂", "n(Mg) = 0.48 ÷ 24 = 0.020 mol. Ratio Mg : H₂ is 1 : 1, so n(H₂) = 0.020 mol. V = 0.020 × 24 = 0.48 dm³, which is 480 cm³"], ["5d64758b45", "2.0 g of sodium hydroxide is dissolved to make 500 cm³ of solution. Calculate its concentration in mol/dm³", "n = 2.0 ÷ 40 = 0.050 mol; V = 500 ÷ 1000 = 0.500 dm³; c = 0.050 ÷ 0.500 = 0.10 mol/dm³"], ["471556ec4a", "A compound contains 40.0% carbon, 6.7% hydrogen and 53.3% oxygen by mass, and has an Mᵣ of 180. Determine its molecular formula", "Moles: C = 40.0 ÷ 12 = 3.33; H = 6.7 ÷ 1 = 6.7; O = 53.3 ÷ 16 = 3.33. Divide by 3.33: 1 : 2 : 1, so the empirical formula is CH₂O, with a mass of 30. 180 ÷ 30 = 6, so the molecular formula is C₆H₁₂O₆"], ["5911e93c86", "Deduce the formula of iron(III) sulfate", "The ions are Fe³⁺ and SO₄²⁻. Two Fe³⁺ give +6 and three SO₄²⁻ give −6, so the ratio is 2 : 3, and the sulfate needs brackets because there is more than one of it: Fe₂(SO₄)₃"], ["72cb31e068", "Write the ionic equation for the reaction between aqueous lead(II) nitrate and aqueous potassium iodide, which forms a yellow precipitate of lead(II) iodide", "The full equation is Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq). Everything aqueous splits; the precipitate stays whole. The potassium ions and nitrate ions are unchanged on both sides, so they are spectators and are cancelled. Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s) (Charge check: +2 and 2 × −1 gives zero on the left, and the solid is neutral. Both sides balance.)"], ["83c3968f7f", "Chlorine consists of 75% ³⁵Cl and 25% ³⁷Cl. Calculate the relative atomic mass of chlorine", "Aᵣ = [ (35 × 75) + (37 × 25) ] ÷ 100 = [ 2625 + 925 ] ÷ 100 = 3550 ÷ 100 = 35.5 (Sanity check: the answer must lie between 35 and 37, and closer to 35 because there is more of it. It does.)"], ["2b002f6c31", "Calcium carbonate decomposes on heating: CaCO₃ → CaO + CO₂. Calculate the mass of calcium oxide formed when 50 g of calcium carbonate decomposes completely", "Mᵣ(CaCO₃) = 40 + 12 + 48 = 100 and Mᵣ(CaO) = 40 + 16 = 56, so 100 g of carbonate gives 56 g of oxide. Scaling by 50 ÷ 100 = 0.5: mass of CaO = 0.5 × 56 = 28 g (Sanity check: the CO₂ must account for the missing 22 g, and Mᵣ(CO₂) = 44, half of which is 22. Mass is conserved.)"], ["825a92db94", "Calculate the number of oxygen atoms in 88 g of carbon dioxide. The Avogadro constant is 6.02 × 10²³", "Mᵣ(CO₂) = 12 + 32 = 44, so M = 44 g/mol. n(CO₂) = 88 ÷ 44 = 2.0 mol Each molecule holds two oxygen atoms, so n(O atoms) = 2.0 × 2 = 4.0 mol Number = 4.0 × 6.02 × 10²³ = 2.41 × 10²⁴ atoms (The step students miss is the middle one. The question asks for atoms, not molecules.)"], ["e81eac6eb0", "4.0 g of sodium hydroxide is dissolved in water and made up to 250 cm³ of solution. Calculate the concentration of the solution in mol/dm³", "Mᵣ(NaOH) = 23 + 16 + 1 = 40, so M = 40 g/mol. n = 4.0 ÷ 40 = 0.10 mol V = 250 ÷ 1000 = 0.250 dm³ c = n ÷ V = 0.10 ÷ 0.250 = 0.40 mol/dm³ (Sanity check: a quarter of a litre holds 0.1 mol, so a full litre would hold 0.4 mol. The answer must be four times the amount, and it is.)"], ["307edec82f", "5.3 g of sodium carbonate reacts completely with excess dilute hydrochloric acid: Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂. Calculate the volume of carbon dioxide produced at r.t.p", "Mᵣ(Na₂CO₃) = 46 + 12 + 48 = 106. In: n(Na₂CO₃) = 5.3 ÷ 106 = 0.050 mol Across: the ratio Na₂CO₃ : CO₂ is 1 : 1, so n(CO₂) = 0.050 mol Out: V = 0.050 × 24 = 1.2 dm³ (The word \"excess\" is doing work: it tells you the acid is not the limiting reactant, so you can ignore it entirely.)"], ["2ed059cbfd", "5.4 g of aluminium is heated with 48.0 g of iron(III) oxide: 2Al + Fe₂O₃ → Al₂O₃ + 2Fe. Determine which reactant is limiting, and calculate the maximum mass of iron produced", "n(Al) = 5.4 ÷ 27 = 0.20 mol; Mᵣ(Fe₂O₃) = 112 + 48 = 160, so n(Fe₂O₃) = 48.0 ÷ 160 = 0.30 mol Divide by coefficients: Al gives 0.20 ÷ 2 = 0.10; Fe₂O₃ gives 0.30 ÷ 1 = 0.30. The smaller is aluminium, so aluminium is limiting Then n(Fe) = 0.20 × (2 ÷ 2) = 0.20 mol, and m = 0.20 × 56 = 11.2 g"], ["6ed56a479c", "25.0 cm³ of 0.100 mol/dm³ sodium hydroxide is exactly neutralised by 20.0 cm³ of sulfuric acid: 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O. Calculate the concentration of the sulfuric acid in mol/dm³", "In: n(NaOH) = c × V = 0.100 × (25.0 ÷ 1000) = 2.50 × 10⁻³ mol Across: the ratio NaOH : H₂SO₄ is 2 : 1, so n(H₂SO₄) = 2.50 × 10⁻³ ÷ 2 = 1.25 × 10⁻³ mol Out: c = n ÷ V = 1.25 × 10⁻³ ÷ (20.0 ÷ 1000) = 0.0625 mol/dm³ (Sanity check: the acid is more concentrated per particle than the alkali would suggest, because each H₂SO₄ supplies two H⁺. Dividing by 2 in the middle step is the chemistry, not a tidying-up move.)"], ["02a63aab6a", "A hydrocarbon contains 82.7% carbon and 17.3% hydrogen by mass. Its relative molecular mass is 58. Determine its empirical formula and its molecular formula", "Moles: C = 82.7 ÷ 12 = 6.89; H = 17.3 ÷ 1 = 17.3 Divide by the smaller: C = 1.00; H = 17.3 ÷ 6.89 = 2.51, which is 2.5 Multiply both by 2: C₂H₅, the empirical formula Its mass is 24 + 5 = 29, and 58 ÷ 29 = 2, so the molecular formula is C₄H₁₀ (A ratio landing on a .5 is a signal to double, not a rounding error to be tidied away.)"], ["fa01e01580", "An impure 20.0 g sample of limestone is heated until it fully decomposes, giving 4.40 g of carbon dioxide. CaCO₃ → CaO + CO₂. Calculate the percentage purity of the limestone", "n(CO₂) = 4.40 ÷ 44 = 0.100 mol The ratio CaCO₃ : CO₂ is 1 : 1, so n(CaCO₃) = 0.100 mol m(CaCO₃) = 0.100 × 100 = 10.0 g of pure carbonate % purity = (10.0 ÷ 20.0) × 100 = 50.0% (Note what the impurity does: it is in the 20.0 g and contributes no CO₂, which is exactly why the gas measures the pure part.)"]], "facts": [["64a3d3f24e", "A chemical formula states a fixed ratio of atoms, and the ratio is decided by the charges on the ions or by the bonding — never by you. This is why you can put a number in front of a formula to balance an equation, but you can never change a subscript inside one"], ["a17fb08593", "Atoms are far too small to weigh, so every mass in chemistry is a relative mass. All of them are measured against the same standard: one twelfth of the mass of a carbon-12 atom. That is why Aᵣ and Mᵣ are ratios and carry no units"], ["24d901cdfe", "In a chemical reaction the atoms are only rearranged. Every atom present at the start is present at the end, so th         }
        here = 0; tiles.forEach(x => x.style.borderColor = ""); typed.push(k); draw();
        if (typed.length === target.length) finish(hints === 0 && misses <= 2, q);
      });
      document.getElementById("undo").onclick = () => { typed.pop(); draw(); };
      document.getElementById("hint").onclick = () => { hints++; fb(`It starts with "${q.answer[0].toUpperCase()}"${hints > 1 ? ` and ends with "${q.answer.slice(-1)}"` : ""}.`, "try"); };
    } else {
      document.getElementById("reveal").onclick = () => {
        document.getElementById("ans").innerHTML = `<div class="card" style="border-color:var(--good)"><strong>Answer:</strong> ${esc(q.answer)} ${say(q.answer)}</div>
          <p>Did you get it?</p><div class="row"><button class="primary" id="yes">✅ I got it</button><button class="ghost" id="nearly">🙂 Nearly</button><button class="ghost" id="no">🔁 Not yet</button></div>`;
        document.getElementById("reveal").remove();
        document.getElementById("yes").onclick = () => finish(true, q, true);
        document.getElementById("nearly").onclick = () => finish(false, q, true, true);
        document.getElementById("no").onclick = () => finish(false, q, true);
        if (S.settings.speak) speak("The answer is: " + q.answer);
      };
    }
  }
  function fb(msg, cls) { document.getElementById("fb").innerHTML = `<div class="feedback ${cls}">${msg}</div>`; }
  function finish(ok, q, self, nearly) {
    if (!q.gen) mark(q.id, ok); else { S.answered++; if (ok) S.right++; }
    res[i] = ok; if (ok) score++;
    const gainXp = ok ? 10 : 4, gainCoins = ok ? 3 : 1;   // effort always earns something
    const before = level(); S.xp += gainXp; S.coins += gainCoins; save();
    beep(ok);
    const praise = pick(["Brilliant!", "Great job!", "You got it!", "Super scientist!", "Fantastic!", "Spot on!"]);
    const kind = nearly ? "Good effort — you'll see this one again soon." : ok ? praise : self ? "That's OK — you'll see this one again soon, and you'll get it." : "Good try! Here is the answer:";
    $app.querySelectorAll("#opts .opt, .tile, #undo, #hint").forEach(b => b.disabled = true);
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "good" : "try"} pop">${kind} <span class="chip">+${gainXp} XP</span> <span class="chip">+${gainCoins} 🪙</span>
      ${!ok && q.explain ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)} ${say(q.explain)}</div>` : ok && q.explain && q.gen ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)}</div>` : ""}</div>
      <button class="primary" id="next">${i + 1 < qs.length ? "Next ➡" : "Finish 🎉"}</button>`;
    if (level() > before) { confetti(); fb2(`🎉 Level up! Your buddy is now level ${level()}!`); }
    const nb = document.getElementById("next"); nb.focus(); nb.onclick = () => { i++; i < qs.length ? show() : end(); };
  }
  function fb2(msg) { const d = document.createElement("div"); d.className = "feedback good pop"; d.textContent = msg; document.getElementById("fb").prepend(d); }
  function end() {
    const stars = score >= qs.length * 0.9 ? 3 : score >= qs.length * 0.6 ? 2 : 1;
    let bonus = 5 * stars;
    if (opt.mission) {
      if (S.lastMission !== TODAY()) {
        const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
        S.streak = S.lastMission === y ? S.streak + 1 : 1; S.lastMission = TODAY(); bonus += 20;
      }
      S.missions++;
    }
    S.coins += bonus; S.xp += bonus; save(); checkBadges();
    if (stars === 3) confetti();
    $app.innerHTML = header() + `<div class="card center pop">${petSVG(140, "wow")}<h1>${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</h1>
      <h2>${score} out of ${qs.length}!</h2><p>${stars === 3 ? "Amazing work!" : stars === 2 ? "Really good — keep going!" : "Every try makes you stronger. Let's do another!"}</p>
      <p><span class="chip">Bonus +${bonus} 🪙</span>${opt.mission && S.streak ? ` <span class="chip">🔥 ${S.streak}-day streak</span>` : ""}</p>
      <div class="row" style="justify-content:center"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button>${opt.unit ? `<button class="ghost" data-go="world" data-arg="${opt.unit}">Unit menu</button>` : ""}</div></div>`;
    document.getElementById("again").onclick = () => opt.mission ? go("mission") : go(opt.back === "world" ? currentActivity(opt) : "home", opt.arg);
    if (S.settings.speak) speak(`${score} out of ${qs.length}. ${stars === 3 ? "Amazing work!" : "Well done!"}`);
  }
  show();
}
function currentActivity(opt) { const t = opt.title; return t.startsWith("Quiz") ? "play" : t.startsWith("Number") ? "numbers" : t.startsWith("Word") ? "builder" : t.startsWith("Challenge") ? "challenge" : "play"; }

// ───────────────────── flashcards ─────────────────────
function flashcards(cards, id, title) {
  let i = 0, flipped = false; cards = weakFirst(cards, c => c[2]);
  function show() {
    const [front, back, cid] = cards[i];
    $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>${title}</strong><span class="chip">${i + 1} / ${cards.length}</span></div>
      <button class="card flash pop" id="fc" style="width:100%"><span class="side">${flipped ? "meaning" : "tap to flip"}</span>${esc(flipped ? back : front)}</button>
      <div class="row" style="justify-content:center">${say(flipped ? back : front)}
        ${flipped ? `<button class="primary" id="know">✅ I know this</button><button class="ghost" id="learn">🔁 Still learning</button>` : `<button class="primary" id="flip">Flip 🔄</button>`}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="ghost" id="prev">⬅ Previous</button><button class="ghost" id="nxt">Next ➡</button></div>`;
    if (S.settings.speak) speak(flipped ? back : front);
    const flip = () => { flipped = !flipped; show(); };
    document.getElementById("fc").onclick = flip;
    if (!flipped) document.getElementById("flip").onclick = flip;
    else {
      document.getElementById("know").onclick = () => { if (!title.startsWith("Big")) mark(cid, true); S.xp += 3; S.coins += 1; save(); beep(true); next(); };
      document.getElementById("learn").onclick = () => { S.xp += 2; save(); next(); };
    }
    document.getElementById("prev").onclick = () => { i = (i - 1 + cards.length) % cards.length; flipped = false; show(); };
    document.getElementById("nxt").onclick = next;
  }
  function next() { i = (i + 1) % cards.length; flipped = false; if (i === 0) confetti(); show(); }
  show();
}

// ───────────────────── match up ─────────────────────
function matchGame(id) {
  const set = weakFirst(allTerms.filter(t => t.unit === id)).slice(0, 5);
  const left = shuffle(set), right = shuffle(set);
  let sel = null, done = 0, mistakes = 0;
  $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>Match up</strong><span class="chip" id="mc">0 / ${set.length}</span></div>
    <p>Tap a word, then tap its meaning. ${say("Tap a word, then tap its meaning.")}</p>
    <div class="match"><div>${left.map(t => `<button data-side="L" data-id="${t.id}" style="width:100%;margin-bottom:10px;font-weight:700">${esc(t.term)}</button>`).join("")}</div>
    <div>${right.map(t => `<button data-side="R" data-id="${t.id}" style="width:100%;margin-bottom:10px">${esc(t.meaning)}</button>`).join("")}</div></div><div id="fb"></div>`;
  $app.querySelectorAll(".match button").forEach(b => b.onclick = () => {
    if (b.classList.contains("done")) return;
    if (!sel || sel.dataset.side === b.dataset.side) { $app.querySelectorAll(".match .sel").forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); if (S.settings.speak) speak(b.textContent); return; }
    if (sel.dataset.id === b.dataset.id) {
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); }); mark(b.dataset.id, true); done++; S.xp += 5; S.coins += 2; beep(true);
      document.getElementById("mc").textContent = `${done} / ${set.length}`; save();
      if (done === set.length) { const bonus = mistakes === 0 ? 15 : 8; S.coins += bonus; save(); confetti(); checkBadges();
        document.getElementById("fb").innerHTML = `<div class="feedback good pop">All matched! ${mistakes === 0 ? "Perfect — no mistakes!" : ""} <span class="chip">+${bonus} 🪙</span></div><div class="row"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button></div>`;
        document.getElementById("again").onclick = () => matchGame(id); }
    } else { mistakes++; beep(false); [sel, b].forEach(x => { x.classList.add("shake"); setTimeout(() => x.classList.remove("shake", "sel"), 400); }); }
    sel = null;
  });
}

// ───────────────────── badges ─────────────────────
const BADGES = [
  ["first", "🌱", "First steps", "Answer your first question", () => S.answered >= 1],
  ["ten", "🔟", "Ten right", "10 correct answers", () => S.right >= 10],
  ["fifty", "🎯", "Sharp shooter", "50 correct answers", () => S.right >= 50],
  ["hundred", "💯", "Century", "100 correct answers", () => S.right >= 100],
  ["fivehundred", "🧠", "Brain power", "500 correct answers", () => S.right >= 500],
  ["mission", "🚀", "Lift off", "Finish a mission", () => S.missions >= 1],
  ["mission10", "🛰️", "Space explorer", "Finish 10 missions", () => S.missions >= 10],
  ["streak3", "🔥", "On fire", "3-day mission streak", () => S.streak >= 3],
  ["streak7", "🌟", "Super week", "7-day mission streak", () => S.streak >= 7],
  ["level5", "⭐", "Rising star", "Reach level 5", () => level() >= 5],
  ["level10", "🏆", "Champion", "Reach level 10", () => level() >= 10],
  ["shop", "🛍️", "Stylish", "Buy something in the shop", () => S.owned.length > 2],
  ["master", "🎓", "Unit master", "Get a unit to 80% mastery", () => UNITS.some(u => mastery(u) >= 80)],
  ["allworlds", "🌍", "World traveller", "Get every unit to 50%", () => UNITS.length > 1 && UNITS.every(u => mastery(u) >= 50)],
];
function checkBadges() {
  const got = BADGES.filter(b => !S.badges.includes(b[0]) && b[4]());
  if (!got.length) return;
  got.forEach(b => S.badges.push(b[0])); S.coins += 10 * got.length; save(); confetti();
  const d = document.createElement("div"); d.className = "feedback good pop"; d.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9;box-shadow:0 6px 20px #0003";
  d.textContent = `New badge: ${got.map(b => b[1] + " " + b[2]).join(", ")}! +${10 * got.length} 🪙`; document.body.appendChild(d); setTimeout(() => d.remove(), 3500);
}

applySettings();
go("home");

</script>
