ry member of a homologous series, such as CₙH₂ₙ₊₂"], ["0cd40b3c41", "Functional group", "The atom or group of atoms that determines the chemical properties of a homologous series"], ["1948ac877a", "Homologous series", "A family of similar compounds with similar chemical properties due to the same functional group"], ["3531f2e0aa", "Saturated", "All carbon–carbon bonds are single bonds"], ["2db706e384", "Unsaturated", "One or more carbon–carbon bonds are double or triple bonds"], ["c470888a4b", "Structural isomers", "Compounds with the same molecular formula but different structural formulae"], ["e85ec03bca", "Hydrocarbon", "A compound of hydrogen and carbon only"], ["f4a170e64d", "Fraction", "A mixture of hydrocarbons with similar boiling points, from fractional distillation"], ["103db52ba9", "Volatility", "How easily a liquid evaporates"], ["21041bac56", "Viscosity", "How thick a liquid is, and how slowly it flows"], ["805d52023b", "Cracking", "Breaking large alkanes into smaller alkanes, alkenes and hydrogen, using heat and a catalyst"], ["a17c3817ff", "Substitution reaction", "A reaction in which one atom or group is replaced by another"], ["6941380923", "Photochemical reaction", "A reaction that needs light (ultraviolet) to happen"], ["310a1b2873", "Addition reaction", "A reaction in which two molecules join to form only one product"], ["def5dcf751", "Fermentation", "Making ethanol from glucose using yeast, without air"], ["974161feef", "Ester", "A compound made from a carboxylic acid and an alcohol, with the –COO– linkage"], ["e5f2fa8d99", "Polymer", "A large molecule built up from many small units called monomers"], ["69306b1a24", "Monomer", "A small molecule that joins with others to make a polymer"], ["b252be7c74", "Addition polymerisation", "Joining alkene monomers into a polymer with no other product"], ["f380b57996", "Condensation polymerisation", "Joining monomers into a polymer with water lost at each link"], ["a55b136421", "Polyamide", "A polymer with amide linkages, –CO–NH–, such as nylon and proteins"], ["94449f2f67", "Polyester", "A polymer with ester linkages, –CO–O–, such as PET"], ["f6f51b85ff", "Non-biodegradable", "Not broken down by bacteria or other living things"], ["3f0582d21d", "Hydrolysis", "Breaking a molecule apart by reaction with water, such as a protein into amino acids"]], "checks": [["0524f1761a", "Four compounds are listed: C3H6, C4H10, C3H7OH, C6H14. Which two are alkanes? Explain your choice", "C4H10 and C6H14 . Both fit the general formula CₙH₂ₙ₊₂"], ["d6904ad997", "State why propene, CH3CH=CH2, is described as unsaturated", "It has a carbon–carbon bond that is not a single bond (a C=C double bond)"], ["996df1d066", "Pentane is CH3CH2CH2CH2CH3. Draw the displayed formula of a branched structural isomer of pentane", "Any correct branched C5H12, for example 2-methylbutane: a chain of four carbons, with a CH3 branch on the second carbon, every C with four bonds and 12 H atoms in total"], ["f379ac0c92", "Methanol, ethanol and propanol are in the same homologous series. State two characteristics they share, and explain why they have similar chemical properties", "Any two of: same general formula; same functional group; each differs from the next by CH2; trend in physical properties . They all contain the same functional group, –OH"], ["2f9cf82993", "Name the alcohol CH3CH(OH)CH2CH3, and draw the displayed formula of its unbranched isomer with the –OH on the end carbon", "Butan-2-ol . Butan-1-ol: four carbons in a chain, the O–H on carbon 1, every bond shown"], ["828b891335", "An ester has the structural formula CH3CH2COOCH2CH2CH3. Name the ester, and name the acid and the alcohol used to make it", "Propyl propanoate . Propanoic acid . Propan-1-ol (propanol)"], ["7730a01495", "Write the balanced equation for the complete combustion of propane, C3H8", "C3H8 + 5O2 → 3CO2 + 4H2O. CO2 and H2O as the only products ; correctly balanced"], ["029e6342b6", "Diesel oil and gasoline are two fractions. State which is more viscous, which is more volatile, and the difference in their molecules that causes this", "Diesel oil is more viscous . Gasoline is more volatile . Diesel oil has longer chains (larger molecules)"], ["e0a24f5ac0", "Hexane, C6H14, reacts with chlorine in ultraviolet light. (a) Name the type of reaction. (b) State the purpose of the ultraviolet light. (c) Write the equation for the reaction of one molecule of hexane with one molecule of chlorine", "(a) Substitution (it is also photochemical). (b) To provide the activation energy . (c) C6H14 + Cl2 → C6H13Cl + HCl. HCl as the other product ; balanced"], ["1da15c2e6e", "Tetradecane, C14H30, is cracked to give ethene and one other hydrocarbon in a 2 : 1 ratio. Complete the equation C14H30 → 2C2H4 + ……, and state two conditions for cracking", "C10H22 (14 − 4 = 10 C; 30 − 8 = 22 H). A high temperature ; a catalyst"], ["ef148a42ea", "Describe a test to show that a hydrocarbon is unsaturated. Give the result", "Add aqueous bromine . It turns from orange to colourless"], ["b1fecb9c75", "Propene reacts with steam to form two alcohols. Name both products and state the catalyst used", "Propan-1-ol . Propan-2-ol . An acid catalyst (phosphoric acid)"], ["4d5e47636b", "Write the balanced equation for the complete combustion of ethanol, C2H5OH, and state one use of ethanol other than as a fuel", "C2H5OH + 3O2 → 2CO2 + 3H2O. Correct formulae ; balanced . As a solvent"], ["5556f151d1", "Give one advantage and one disadvantage of making ethanol by fermentation instead of from ethene", "Advantage: the raw material (sugar) is renewable, or it needs little energy . Disadvantage: it is slow, or the ethanol is impure and must be distilled"], ["61f0ff8f32", "Ethanoic acid reacts with zinc. Name the salt formed, give its formula, and name the other product", "Zinc ethanoate . (CH3COO)2Zn . Hydrogen"], ["9ad77c2542", "Propan-1-ol is heated with acidified potassium manganate(VII). Name the type of reaction and the organic product", "Oxidation . Propanoic acid"], ["d95a8abb39", "Methanoic acid reacts with butan-1-ol. (a) Name the ester formed. (b) Name the other product. (c) Name a suitable catalyst", "(a) Butyl methanoate . (b) Water . (c) Concentrated sulfuric acid (an acid)"], ["d83f16adf7", "Explain why plastic bags cause pollution in the oceans", "Most plastics are non-biodegradable, so they do not break down . They build up in the sea and harm aquatic animals"], ["5ef85a4737", "A polymer has the repeat unit –CH2–CHCl–. Draw the displayed formula of the monomer and name the type of polymerisation", "A C=C with two H atoms on one carbon, and one H and one Cl on the other (chloroethene), every bond shown . Addition"], ["a74c4881af", "A polymer is made from a dicarboxylic acid and a diol. Name the linkage formed, the type of polymer, and the other product", "Ester linkage . Polyester . Water"], ["de75706a22", "State the name given to the type of polymer that PET is, and one way PET can be recycled", "A polyester . It can be broken down into its monomers, which are polymerised again"], ["8cf72156ec", "Three different amino acids join to form part of a protein. Name the type of polymerisation, the linkage formed, and the reaction that turns the protein back into amino acids", "Condensation . Amide (peptide) linkage . Hydrolysis"]], "facts": [["8c5abd112b", "Every carbon atom makes four covalent bonds, hydrogen one, oxygen two. This is why a displayed formula can be checked by counting lines. It is also why carbon forms chains, branches and rings, and so millions of compounds"], ["22bc835c95", "A functional group is the reactive part of a molecule, and it decides the reactions. Alkanes have none, so they barely react. A C=C, an –OH or a –COOH each brings its own reactions. Members of one family share the group, so they share the reactions"], ["8755766920", "Bigger molecules attract each other more strongly. The forces between molecules grow as the chain gets longer. So boiling point and viscosity rise along a homologous series, and fractions separate in a column"], ["9aaf07822a", "A C=C double bond can open up and add atoms. One of the two bonds breaks, and each carbon gains a new atom. This explains the bromine test, hydrogenation, making ethanol and addition polymers"], ["aefbef852f", "–COOH and –OH can join and release water. The acid loses OH, the alcohol loses H, and they make water. The rest joins up as an ester. With two groups on each monomer, the same reaction makes long condensation polymers"], ["f0ffd5b062", "Burning anything made of carbon and hydrogen gives carbon dioxide and water. With too little oxygen it gives carbon monoxide and soot instead. This holds for alkanes, alkenes, alcohols and plastics"]]}]}]};
// Science Arcade engine. One app for every grade; the toys and the question pool are modules.
//
// Toys are the point (Wolf, 22 Sep 2026: "learning the topic is not the idea" — playing with the
// idea is). Each toy is its own file in tools/arcade/toys/ and registers itself with ARCADE.toy().
// Adding a unit's toy means adding a file: nothing here changes and nothing already working moves.
// The question games are still here, one step down, for whoever wants them.
//
// Everything runs in the browser; progress is saved in localStorage, with a save code as backup.
"use strict";

// ───────────────────────── state ─────────────────────────
const KEY = "science-arcade:v2";
const TODAY = () => new Date().toISOString().slice(0, 10);
const BLANK = {
  name: "", grade: "", xp: 0, coins: 0, box: {}, found: {}, right: 0, answered: 0, missions: 0,
  lastMission: "", streak: 0, owned: ["none", "teal"], hat: "none", colour: "teal", badges: [],
  unitsDone: {}, settings: { size: 19, speak: false, calm: false, sound: true, dark: false },
};
let S = load();
function load() {
  const merge = s => Object.assign({}, BLANK, s, { settings: Object.assign({}, BLANK.settings, s.settings) });
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return merge(s); } catch (e) {}
  // One save per grade was the old shape. Carry the biggest one over so nobody starts again.
  try {
    const old = DATA.grades.map(g => { try { return JSON.parse(localStorage.getItem("science-arcade:" + g.grade)); } catch (e) { return null; } })
      .filter(Boolean).sort((a, b) => (b.xp || 0) - (a.xp || 0))[0];
    if (old) return merge(old);
  } catch (e) {}
  return JSON.parse(JSON.stringify(BLANK));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// The grade decides which worlds are on the home screen. ?grade=g07 in the address wins, so a
// class link can drop a student straight into theirs; otherwise it is whatever they picked.
const gradeById = id => DATA.grades.find(g => g.grade === id);
const urlGrade = (() => { try { return new URLSearchParams(location.search).get("grade"); } catch (e) { return null; } })();
let G = gradeById(urlGrade) || gradeById(S.grade) || null;
function setGrade(id) { G = gradeById(id) || G; S.grade = G.grade; refreshPool(); save(); }

// ───────────────────────── helpers ─────────────────────────
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const level = () => Math.floor(Math.sqrt(S.xp / 40)) + 1;
const xpFor = l => 40 * (l - 1) * (l - 1);
function applySettings() {
  document.documentElement.style.setProperty("--fs", S.settings.size + "px");
  document.body.classList.toggle("calm", S.settings.calm);
  document.documentElement.dataset.theme = S.settings.dark ? "dark" : "light";
}
function speak(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.lang = "en-GB"; speechSynthesis.speak(u); } catch (e) {}
}
const say = t => `<button class="speak" data-say="${esc(t)}" aria-label="Read aloud">🔊 Read</button>`;
let actx;
function beep(good) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [523, 659, 784] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.09; g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}
function confetti() {
  if (S.settings.calm) return;
  const d = document.createElement("div"); d.className = "confetti";
  const cols = ["#2f6f9f", "#2e8b57", "#d99a00", "#7b5ea7", "#e4572e"];
  for (let i = 0; i < 60; i++) { const b = document.createElement("i"); b.style.left = rnd(100) + "vw"; b.style.background = pick(cols); b.style.animationDelay = (Math.random() * 0.6) + "s"; d.appendChild(b); }
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); speak(b.dataset.say); } }, true);

// ───────────────────────── toys ─────────────────────────
// A toy is a self-contained simulation. It declares which unit(s) it belongs to and what there is
// to discover in it, and gets a box to draw in plus the small API below. It never touches S.
const TOYS = [];
const toyById = id => TOYS.find(t => t.id === id);
const toysFor = unit => TOYS.filter(t => (t.units || [t.unit]).includes(unit));
const hasFound = (toy, key) => !!S.found[toy + ":" + key];
const foundIn = toy => { const t = toyById(toy); return t ? t.discoveries.filter(d => hasFound(toy, d[0])).length : 0; };
const toyTotal = () => Object.keys(S.found).length;

function toyAPI(t) {
  return {
    id: t.id,
    has: key => hasFound(t.id, key),
    found(key) {
      const d = t.discoveries.find(x => x[0] === key);
      if (!d || hasFound(t.id, key)) return false;
      S.found[t.id + ":" + key] = TODAY();
      S.xp += 20; S.coins += 15; save();
      logEvent("discovery", { toy: t.id, key, label: d[1] });
      beep(true); confetti();
      toast(`💎 Discovery! ${d[1]} <span class="chip">+15 🪙</span>`);
      if (S.settings.speak) speak("Discovery! " + d[1]);
      const c = document.getElementById("dcount");

function shopRow(kind) {

    const own = S.owned.includes(key) || price === 0, on = (k === "hat" ? S.hat : S.colour) === key;
    const em = k === "hat" ? (HATS[key] || "🙂") : `<span style="display:inline-block;width:1em;height:1em;border-radius:50%;background:${key === "rainbow" ? "linear-gradient(90deg,#ef6f5e,#f2b705,#3aa38f,#7b5ea7)" : COLOURS[key]}"></span>`;
    return `<button data-buy="${key}" data-kind="${k}" class="${on ? "on" : ""}"><span class="em">${em}</span>${name}<br><small>${on ? "wearing" : own ? "owned" : "🪙 " + price}</small></button>`;
  }).join("");

// ───────────────────── the round player ─────────────────────
function play(qs, opt) {
  if (!qs.length) { $app.innerHTML = header(opt.back) + `<div class="card">Nothing here yet — try another activity!</div>`; return; }
  let i = 0, score = 0; const res = [];
  const backArgs = `data-go="${opt.back}" ${opt.arg ? `data-arg="${opt.arg}"` : ""}`;
  function show() {
    const q = qs[i];
    const u = unitById(q.unit);
    const dots = qs.map((_, k) => `<b class="${k < i ? (res[k] ? "ok" : "no") : k === i ? "now" : ""}"></b>`).join("");
    let body = "";
    if (q.kind === "mc") body = `<div class="prompt">${esc(q.prompt)} ${say(q.prompt + " " + (q.detail || "") + " " + q.options.join(". "))}</div>${q.detail ? `<div class="card" style="font-size:1.1em">${esc(q.detail)}</div>` : ""}<div id="opts">${q.options.map(o => `<button class="opt">${esc(o)}</button>`).join("")}</div>`;
    else if (q.kind === "build") body = `<div class="prompt">${esc(q.prompt)} ${say(q.detail)}</div><div class="card" style="font-size:1.1em">${esc(q.detail)}</div>
      <p class="muted">Tap the letters in order. It has ${q.answer.replace(/[ -]/g, "").length} letters.</p><div class="slot" id="slot"></div>
      <div class="tiles" id="tiles">${shuffle(q.answer.replace(/[ -]/g, "").split("")).map((c, k) => `<button class="tile" data-k="${k}">${esc(c)}</button>`).join("")}</div>
      <div class="row"><button class="ghost" id="hint">💡 Hint</button><button class="ghost" id="undo" hidden>⌫</button></div>`;
    else body = `<div class="prompt">${esc(q.prompt)} ${say(q.prompt)}</div><p class="muted">Think of your answer — say it or write it down. Then check.</p>
      <button class="primary" id="reveal">Show the answer</button><div id="ans"></div>`;
    $app.innerHTML = `<div class="bar"><button class="ghost" ${backArgs}>✖ Stop</button><strong>${esc(opt.title)}</strong><span class="chip">${i + 1} / ${qs.length}</span></div>
      <div class="dots">${dots}</div>${opt.mission && u ? `<p class="muted">${esc(u.tag || "Unit " + u.n)}: ${esc(u.title)}</p>` : ""}<div class="card pop">${body}</div><div id="fb"></div>`;
    if (S.settings.speak) speak(q.kind === "build" ? q.detail : q.prompt + (q.detail ? ". " + q.detail : ""));
    if (q.kind === "mc") {
      const tries = { n: 0 };
      $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        if (b.disabled) return;
        const ok = b.textContent === q.answer;
        if (ok) { b.classList.add("right"); finish(tries.n === 0, q); }
        else { b.classList.add("wrong"); b.disabled = true; tries.n++; beep(false);
          if (tries.n >= 2) { $app.querySelectorAll(".opt").forEach(x => { if (x.textContent === q.answer) x.classList.add("right"); x.disabled = true; }); finish(false, q); }
          else fb(`Not quite — have another go! 💪`, "try"); }
      });
    } else if (q.kind === "build") {
      const target = q.answer.replace(/[ -]/g, "").toLowerCase(); let typed = []; let hints = 0;
      const slot = document.getElementById("slot"), tiles = [...document.querySelectorAll(".tile")];
      const draw = () => { slot.innerHTML = typed.map(k => `<span class="tile" style="display:inline-grid;place-items:center">${esc(tiles[k].textContent)}</span>`).join(""); tiles.forEach((t, k) => t.classList.toggle("used", typed.includes(k))); };
      // Guided spelling: a wrong letter is refused on the spot, and after three misses the right
      // tile lights up — nobody can get stuck, and nothing has to be undone.
      let misses = 0, here = 0;
      tiles.forEach((t, k) => t.onclick = () => {
        if (typed.includes(k)) return;
        if (t.textContent.toLowerCase() !== target[typed.length]) {
          misses++; here++; beep(false); t.classList.add("shake"); setTimeout(() => t.classList.remove("shake"), 400);
          if (here >= 3) tiles.find((x, j) => !typed.includes(j) && x.textContent.toLowerCase() === target[typed.length]).style.borderColor = "var(--gold)";
          return;
        }
        here = 0; tiles.forEach(x => x.style.borderColor = ""); typed.push(k); draw();
        if (typed.length === target.length) finish(hints === 0 && misses <= 2, q);
      });
      document.getElementById("undo").onclick = () => { typed.pop(); draw(); };
      document.getElementById("hint").onclick = () => { hints++; fb(`It starts with "${q.answer[0].toUpperCase()}"${hints > 1 ? ` and ends with "${q.answer.slice(-1)}"` : ""}.`, "try"); };
    } else {
      document.getElementById("reveal").onclick = () => {
        document.getElementById("ans").innerHTML = `<div class="card" style="border-color:var(--good)"><strong>Answer:</strong> ${esc(q.answer)} ${say(q.answer)}</div>
          <p>Did you get it?</p><div class="row"><button class="primary" id="yes">✅ I got it</button><button class="ghost" id="nearly">🙂 Nearly</button><button class="ghost" id="no">🔁 Not yet</button></div>`;
        document.getElementById("reveal").remove();
        document.getElementById("yes").onclick = () => finish(true, q, true);
        document.getElementById("nearly").onclick = () => finish(false, q, true, true);
        document.getElementById("no").onclick = () => finish(false, q, true);
        if (S.settings.speak) speak("The answer is: " + q.answer);
      };
    }
  }
  function fb(msg, cls) { document.getElementById("fb").innerHTML = `<div class="feedback ${cls}">${msg}</div>`; }
  function finish(ok, q, self, nearly) {
    if (!q.gen) mark(q.id, ok); else { S.answered++; if (ok) S.right++; }
    res[i] = ok; if (ok) score++;
    const gainXp = ok ? 10 : 4, gainCoins = ok ? 3 : 1;   // effort always earns something
    const before = level(); S.xp += gainXp; S.coins += gainCoins; save();
    beep(ok);
    const praise = pick(["Brilliant!", "Great job!", "You got it!", "Super scientist!", "Fantastic!", "Spot on!"]);
    const kind = nearly ? "Good effort — you'll see this one again soon." : ok ? praise : self ? "That's OK — you'll see this one again soon, and you'll get it." : "Good try! Here is the answer:";
    $app.querySelectorAll("#opts .opt, .tile, #undo, #hint").forEach(b => b.disabled = true);
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "good" : "try"} pop">${kind} <span class="chip">+${gainXp} XP</span> <span class="chip">+${gainCoins} 🪙</span>
      ${!ok && q.explain ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)} ${say(q.explain)}</div>` : ok && q.explain && q.gen ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)}</div>` : ""}</div>
      <button class="primary" id="next">${i + 1 < qs.length ? "Next ➡" : "Finish 🎉"}</button>`;
    if (level() > before) { confetti(); fb2(`🎉 Level up! Your buddy is now level ${level()}!`); }
    const nb = document.getElementById("next"); nb.focus(); nb.onclick = () => { i++; i < qs.length ? show() : end(); };
  }
  function fb2(msg) { const d = document.createElement("div"); d.className = "feedback good pop"; d.textContent = msg; document.getElementById("fb").prepend(d); }
  function end() {
    const stars = score >= qs.length * 0.9 ? 3 : score >= qs.length * 0.6 ? 2 : 1;
    let bonus = 5 * stars;
    if (opt.mission) {
      if (S.lastMission !== TODAY()) {
        const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
        S.streak = S.lastMission === y ? S.streak + 1 : 1; S.lastMission = TODAY(); bonus += 20;
      }
      S.missions++;
    }
    S.coins += bonus; S.xp += bonus; save(); checkBadges();
    if (stars === 3) confetti();
    $app.innerHTML = header() + `<div class="card center pop">${petSVG(140, "wow")}<h1>${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</h1>
      <h2>${score} out of ${qs.length}!</h2><p>${stars === 3 ? "Amazing work!" : stars === 2 ? "Really good — keep going!" : "Every try makes you stronger. Let's do another!"}</p>
      <p><span class="chip">Bonus +${bonus} 🪙</span>${opt.mission && S.streak ? ` <span class="chip">🔥 ${S.streak}-day streak</span>` : ""}</p>
      <div class="row" style="justify-content:center"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button>${opt.unit ? `<button class="ghost" data-go="world" data-arg="${opt.unit}">Unit menu</button>` : ""}</div></div>`;
    document.getElementById("again").onclick = () => opt.mission ? go("mission") : go(opt.back === "world" ? currentActivity(opt) : "home", opt.arg);
    if (S.settings.speak) speak(`${score} out of ${qs.length}. ${stars === 3 ? "Amazing work!" : "Well done!"}`);
  }
  show();
}
function currentActivity(opt) { const t = opt.title; return t.startsWith("Quiz") ? "play" : t.startsWith("Number") ? "numbers" : t.startsWith("Word") ? "builder" : t.startsWith("Challenge") ? "challenge" : "play"; }

// ───────────────────── flashcards ─────────────────────
function flashcards(cards, id, title) {
  let i = 0, flipped = false; cards = weakFirst(cards, c => c[2]);
  function show() {
    const [front, back, cid] = cards[i];
    $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>${title}</strong><span class="chip">${i + 1} / ${cards.length}</span></div>
      <button class="card flash pop" id="fc" style="width:100%"><span class="side">${flipped ? "meaning" : "tap to flip"}</span>${esc(flipped ? back : front)}</button>
      <div class="row" style="justify-content:center">${say(flipped ? back : front)}
        ${flipped ? `<button class="primary" id="know">✅ I know this</button><button class="ghost" id="learn">🔁 Still learning</button>` : `<button class="primary" id="flip">Flip 🔄</button>`}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="ghost" id="prev">⬅ Previous</button><button class="ghost" id="nxt">Next ➡</button></div>`;
    if (S.settings.speak) speak(flipped ? back : front);
    const flip = () => { flipped = !flipped; show(); };
    document.getElementById("fc").onclick = flip;
    if (!flipped) document.getElementById("flip").onclick = flip;
    else {
      document.getElementById("know").onclick = () => { if (!title.startsWith("Big")) mark(cid, true); S.xp += 3; S.coins += 1; save(); beep(true); next(); };
      document.getElementById("learn").onclick = () => { S.xp += 2; save(); next(); };
    }
    document.getElementById("prev").onclick = () => { i = (i - 1 + cards.length) % cards.length; flipped = false; show(); };
    document.getElementById("nxt").onclick = next;
  }
  function next() { i = (i + 1) % cards.length; flipped = false; if (i === 0) confetti(); show(); }
  show();
}

// ───────────────────── match up ─────────────────────
function matchGame(id) {
  const set = weakFirst(allTerms.filter(t => t.unit === id)).slice(0, 5);
  const left = shuffle(set), right = shuffle(set);
  let sel = null, done = 0, mistakes = 0;
  $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>Match up</strong><span class="chip" id="mc">0 / ${set.length}</span></div>
    <p>Tap a word, then tap its meaning. ${say("Tap a word, then tap its meaning.")}</p>
    <div class="match"><div>${left.map(t => `<button data-side="L" data-id="${t.id}" style="width:100%;margin-bottom:10px;font-weight:700">${esc(t.term)}</button>`).join("")}</div>
    <div>${right.map(t => `<button data-side="R" data-id="${t.id}" style="width:100%;margin-bottom:10px">${esc(t.meaning)}</button>`).join("")}</div></div><div id="fb"></div>`;
  $app.querySelectorAll(".match button").forEach(b => b.onclick = () => {
    if (b.classList.contains("done")) return;
    if (!sel || sel.dataset.side === b.dataset.side) { $app.querySelectorAll(".match .sel").forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); if (S.settings.speak) speak(b.textContent); return; }
    if (sel.dataset.id === b.dataset.id) {

// ───────────────── the teacher's record (Option B, Wolf's pick 22 Sep 2026) ─────────────────
// The game posts rows to a Google Apps Script web app, which appends them to a Sheet in Wolf's
// school Drive. No endpoint in the build config means no posting at all and the game plays exactly
// the same — which is also what happens to the offline copy. Rows queue in the browser and go in
// batches, so a school wifi drop loses nothing and nothing ever blocks play.
const LOGKEY = "science-arcade:outbox";
let outbox = [];
try { outbox = JSON.parse(localStorage.getItem(LOGKEY)) || []; } catch (e) {}
let user = null;
function whoAmI() {
  if (user) return user.email || user.id;
  if (!S.pid) { S.pid = "g-" + Math.random().toString(36).slice(2, 10); save(); }
  return "guest:" + S.pid;
}
function logEvent(ev, data) {
  if (!DATA.endpoint) return;
  outbox.push(Object.assign({ at: new Date().toISOString(), who: whoAmI(), name: user ? user.name : S.name, grade: G ? G.grade : "", ev }, data || {}));
  if (outbox.length > 400) outbox = outbox.slice(-400);
  try { localStorage.setItem(LOGKEY, JSON.stringify(outbox)); } catch (e) {}
  if (outbox.length >= 8) flushLog();
}
let sending = false;
function flushLog(beacon) {
  if (!DATA.endpoint || !outbox.length || sending) return;
  const batch = outbox.slice(0, 200), body = JSON.stringify({ rows: batch, token: user ? user.token : "" });
  const drop = () => { outbox = outbox.slice(batch.length); try { localStorage.setItem(LOGKEY, JSON.stringify(outbox)); } catch (e) {} };
  if (beacon) { try { if (navigator.sendBeacon(DATA.endpoint, new Blob([body], { type: "text/plain" }))) drop(); } catch (e) {} return; }
  sending = true;
  // text/plain keeps it a simple request: Apps Script answers no CORS preflight.
  fetch(DATA.endpoint, { method: "POST", body, headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true })
    .then(r => { if (r.ok) drop(); }).catch(() => {}).then(() => { sending = false; });
}
setInterval(() => flushLog(), 60000);

window.ARCADE = {
  toy(def) { if (def && def.id && !toyById(def.id)) TOYS.push(def); },
  setUser(u) { user = u; if (u && u.name && !S.name) { S.name = u.name.split(" ")[0]; save(); } logEvent("signin", {}); },
  start() {
    TOYS.sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
    refreshPool(); applySettings(); flushLog();
    go(G ? "home" : "grade");
  },
};

          pts.forEach(([dx, dy], i) => {

    function buildBench() {

        <div class="ctrl"><button id="clear">🗑️ Empty the box</button></div>
        <p class="muted" id="msg">Drag a part into the box, or tap it. Drag it back out to take it away. Try building the smallest cell that can stay alive.</p>`);
      const svg = el("bsvg");

      function toggle(k, on) {
        if (!!has[k] === on) return;
        const before = Object.assign({}, has);
        if (on) has[k] = true; else delete has[k];

    // ── zoom out ────────────────────────────────────────────────────────────
    // Each level is drawn, with a blue box showing where the level before it is hiding. Moving the
    // slider zooms the picture out from that box, so "a tissue is made of cells" is something seen.
    function zoomBench() {
      const HUMAN = [
        ["Cell", "One ciliated cell", [180, 120]],
        ["Tissue", "Ciliated epithelium: lots of similar cells working together", [150, 113]],
        ["Organ", "The windpipe and lungs: organs made of several different tissues", [180, 38]],

      ];
      const cilCell = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-22" y="-40" width="44" height="80" rx="8" fill="#f4d4d4" stroke="#b9737a" stroke-width="2"/><circle cy="10" r="10" fill="#9b4f6b"/>`
        + [-16, -8, 0, 8, 16].map(dx => `<path d="M${dx} -40 q3 -8 0 -14" stroke="#a0685a" stroke-width="2" fill="none"/>`).join("") + "</g>";
      const palCell = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-18" y="-50" width="36" height="100" rx="10" fill="#e3f2d6" stroke="#4f8f3f" stroke-width="2"/>`
        + Array.from({ length: 10 }, (_, i) => `<ellipse cx="${-8 + (i % 2) * 16}" cy="${-40 + Math.floor(i / 2) * 20}" rx="5" ry="3.5" fill="#2e8b57"/>`).join("") + `<circle cy="4" r="7" fill="#7a5a9c"/></g>`;
      const lungs = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 -50 V-6" stroke="#c9a3a3" stroke-width="10" stroke-linecap="round"/><path d="M0 -8 L-18 8 M0 -8 L18 8" stroke="#c9a3a3" stroke-width="7" stroke-linecap="round"/>
          <path d="M-8 0 C-40 -10 -52 40 -40 62 C-30 70 -12 64 -8 50 Z" fill="#e8737d"/><path d="M8 0 C40 -10 52 40 40 62 C30 70 12 64 8 50 Z" fill="#e8737d"/></g>`;
      const petal = a => { const r = a * Math.PI / 180, x = (Math.cos(r) * 14).toFixed(1), y = (-58 + Math.sin(r) * 14).toFixed(1); return `<ellipse cx="${x}" cy="${y}" rx="7" ry="5" fill="#f5d34f" transform="rotate(${a} ${x} ${y})"/>`; };
      const shoot = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 60 V-50" stroke="#4f8f3f" stroke-width="5"/>
          <path d="M0 30 Q-30 20 -40 0 Q-12 4 0 30 M0 0 Q30 -10 40 -30 Q12 -26 0 0 M0 -30 Q-24 -36 -30 -56 Q-8 -50 0 -30" fill="#6fbf5a" stroke="#3f7f31"/>
          ${[0, 72, 144, 216, 288].map(petal).join("")}<circle cy="-58" r="8" fill="#b4531f"/></g>`;
      const box = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-dasharray="6 4" rx="4"/>`;
      const DRAW = {

            + `<text x="180" y="200" text-anchor="middle" font-size="13" class="lbl">cells side by side, lining the windpipe</text>`,

          () => `<ellipse cx="180" cy="44" rx="30" ry="34" fill="#f1dcc8" stroke="#b08a6a" stroke-width="2"/><path d="M180 76 V100" stroke="#c9a3a3" stroke-width="8"/><path d="M170 50 Q180 58 188 52" stroke="#b4531f" stroke-width="3" fill="none"/>`
            + lungs(180, 150, 1) + box(128, 86, 104, 132)
            + `<text x="232" y="48" font-size="13" class="lbl">nose and mouth</text><text x="200" y="104" font-size="13" class="lbl">windpipe</text><text x="240" y="190" font-size="13" class="lbl">lungs</text>`,

            + `<text x="180" y="212" text-anchor="middle" font-size="13" class="lbl">tall cells packed side by side, under the top of the leaf</text>`,

            + `<text x="180" y="210" text-anchor="middle" font-size="13" class="lbl">a leaf, with its veins</text>`,
          () => `<rect x="0" y="200" width="360" height="40" fill="#e3d2b6"/>` + shoot(180, 132, 1.3) + box(212, 80, 50, 40)
            + `<text x="300" y="60" font-size="13" class="lbl" text-anchor="middle">flower</text><text x="300" y="150" font-size="13" class="lbl" text-anchor="middle">leaves</text><text x="110" y="190" font-size="13" class="lbl" text-anchor="middle">stem</text>`,
          () => `<rect x="0" y="150" width="360" height="90" fill="#e3d2b6"/>` + shoot(180, 100, 0.8)
            + `<path d="M180 148 V200 M180 170 L150 200 M180 170 L210 204 M180 190 L160 220 M180 188 L204 224" stroke="#b08a6a" stroke-width="3" fill="none"/>` + box(144, 44, 72, 108)

        <svg class="scene" viewBox="0 0 360 240" role="img" aria-label="A drawing of the current level"><g id="zg"></g></svg>

        else say("Smallest first: cell, tissue, organ, organ system, organism.");
      }
      (function loop() {
        if (!alive(r)) return;
        if (zt < 1) {
          zt = Math.min(1, zt + 0.06);

      })();
      el("zl").oninput = () => { const nl = +el("zl").value, out = nl > lv; lv = nl; render(out); };
      wirePick("path", p => { path = p; lv = 0; el("zl").value = 0; render(false); });
      render(false);
    }

    draw();
  },
});

// Particle Lab — Grade 6 Unit 2 (Materials and their structure).
//
// Four benches: a box of water particles you heat and cool (the heating curve draws itself, flat
// bits and all), one water droplet you walk round the water cycle, iron and sulfur you mix, pull
// apart with a magnet and then cook into something a magnet cannot touch, and an atom tray where
// atoms bond into elements and compounds with their real names and formulae.
//
// Layout rules (agent-contract §6): every drawing is an svg.scene inside its own viewBox, labels at
// 12 units or more, readouts in HTML chips, option pickers in .ctrl.pick.
ARCADE.toy({
  id: "g06-u02-particles", unit: "g06-u02", order: 1,
  name: "Particle Lab", icon: "🧊",
  blurb: "Heat ice until it flies apart, then follow one raindrop round the world",
  discoveries: [
    ["shake", "Vibrating faster", "Warm the ice and watch the particles shake harder"],
    ["melt", "Melting", "Heat the ice until it turns to water"],
    ["boil", "Boiling", "Heat the water until it turns to gas"],
    ["flat", "The flat bits", "See the temperature stop rising while it melts and while it boils"],
    ["condense", "Condensing", "Cool the gas back into a liquid"],
    ["freeze", "Freezing", "Cool the water until it is solid again"],
    ["evap", "Evaporation", "Let the Sun lift the droplet out of the sea"],
    ["cloud", "Condensation", "Turn the water vapour into a cloud"],
    ["rain", "Precipitation", "Let the droplet fall as rain"],
    ["runoff", "Surface run-off", "Send the droplet running over the ground"],
    ["ground", "Groundwater", "Let the droplet soak into the ground"],
    ["transp", "Transpiration", "Let a tree breathe the droplet back into the air"],
    ["loop", "Round and round", "Bring the droplet back to the sea three times"],
    ["mixture", "A mixture", "Stir iron and sulfur together"],
    ["magnet", "Pulled apart", "Separate the mixture with a magnet"],
    ["glow", "It glows!", "Heat the iron and sulfur mixture"],
    ["ownheat", "It keeps going", "Turn the burner off while it glows and watch"],
    ["nomagnet", "A new substance", "Try the magnet on iron sulfide"],
    ["element", "An element", "Bond atoms of only one kind into a molecule"],
    ["water", "H₂O", "Make a water molecule"],
    ["monodi", "Mono or di?", "Make carbon monoxide and carbon dioxide"],
    ["salt", "Table salt", "Make sodium chloride"],
    ["five", "Chemist", "Make five different substances"],
  ],
  mount(root, api) {
    const rand = (a, b) => a + Math.random() * (b - a);   // api.rnd(n) is a whole number below n
    let tab = "heat", run = 0;
    const alive = r => r === run && document.body.contains(root);
    const tabs = [["heat", "🌡️ Heat and cool"], ["cycle", "💧 Water cycle"], ["fes", "🧲 Iron and sulfur"], ["atoms", "⚛️ Atom tray"]];
    const el = id => document.getElementById(id);
    const say = m => { const p = el("msg"); if (p && p.textContent !== m) { p.textContent = m; api.say(m); } };
    function shell(inner) {
      run++;
      root.innerHTML = `<div class="ctrl tabs">${tabs.map(([k, n]) =>
        `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${n}</button>`).join("")}</div><div id="bench">${inner}</div>`;
      root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
      return run;
    }
    function draw() { ({ heat: heatBench, cycle: cycleBench, fes: fesBench, atoms: atomBench })[tab](); }

    // ── heat and cool ───────────────────────────────────────────────────
    // Energy goes in at a steady rate. Temperature follows it except on the two plateaus, where the
    // energy breaks particles free instead — so the graph goes flat at 0 °C and 100 °C by itself.
    function heatBench() {
      const N = 24, COLS = 6;
      const MELT0 = 20, MELT1 = 60, BOIL0 = 160, BOIL1 = 260, TOP = 290;   // energy marks
      let E = 0, mode = "off", t = 0, sample = 0, pts = [], wasLiquid = false, wasGas = false, flatM = 0, flatB = 0;
      const temp = () => E < MELT0 ? -20 + E : E < MELT1 ? 0 : E < BOIL0 ? (E - MELT1) : E < BOIL1 ? 100 : 100 + (E - BOIL1);
      const liquidFrac = () => E < MELT0 ? 0 : E < MELT1 ? (E - MELT0) / (MELT1 - MELT0) : 1;
      const gasFrac = () => E < BOIL0 ? 0 : E < BOIL1 ? (E - BOIL0) / (BOIL1 - BOIL0) : 1;
      // Bottom rows of the lattice are listed first, so the top melts first and the bottom stays solid longest.
      const P = Array.from({ length: N }, (_, i) => {
        const row = Math.floor(i / COLS), col = i % COLS;
        const hx = 95 + col * 22, hy = 187 - row * 22;
        return { hx, hy, x: hx, y: hy, vx: rand(-1, 1), vy: rand(-1, 1) };
      });
      const r = shell(`<div class="duo">
          <svg class="scene" viewBox="0 0 300 250" role="img" aria-label="A sealed box of water particles over a burner">
            <rect x="20" y="16" width="260" height="184" rx="6" class="bgc" stroke="#7f8c99" stroke-width="3"/>
            <g id="parts"></g>
            <path d="M40 206 H260" stroke="#8d97a3" stroke-width="5" stroke-linecap="round"/>
            <path id="flame" d="" fill="#f2b705" opacity="0"/><path id="ice" d="" fill="#4a90d9" opacity="0"/>
            <rect x="144" y="228" width="12" height="16" fill="#8d97a3"/>
            <text id="state" x="150" y="38" text-anchor="middle" font-size="16" font-weight="bold"></text>
          </svg>
          <svg class="scene" viewBox="0 0 300 250" role="img" aria-label="A graph of temperature against time">
            <text x="14" y="112" font-size="12" class="lbl" text-anchor="middle" transform="rotate(-90 14 112)">temperature (°C)</text>
            <text x="165" y="244" font-size="12" class="lbl" text-anchor="middle">time</text>
            <g id="axes"></g><polyline id="line" fill="none" stroke="#d64545" stroke-width="3"/>
            <text id="hint" x="165" y="110" font-size="12" class="lbl" text-anchor="middle">turn the heat on</text>
          </svg></div>
        <div class="ctrl"><button id="heat">🔥 Heat</button><button id="cool">❄️ Cool</button><button id="reset">🧊 Back to ice</button></div>
        <div class="readout"><span class="chip" id="r1"></span><span class="chip" id="r2"></span></div>
        <p class="muted" id="msg">This is a box of ice, drawn as its particles. Turn the heat on and watch what they do.</p>`);
      const px = s => 50 + 235 * s / 120, py = T => 200 - 180 * (T + 20) / 150;
      el("axes").innerHTML = [-20, 0, 50, 100, 130].map(T => `<line x1="50" y1="${py(T)}" x2="285" y2="${py(T)}" class="edge" stroke-width="1" opacity="${T === 0 || T === 100 ? 1 : 0.5}"/><text x="44" y="${py(T) + 4}" font-size="11" class="lbl" text-anchor="end">${T}</text>`).join("")
        + `<path d="M50 20 V200 H285" fill="none" stroke="#9aa6b3" stroke-width="2"/>`;
      const setMode = m => { mode = mode === m ? "off" : m; el("heat").classList.toggle("on", mode === "heat"); el("cool").classList.toggle("on", mode === "cool"); };
      el("heat").onclick = () => setMode("heat");
      el("cool").onclick = () => setMode("cool");
      el("reset").onclick = () => { E = 0; t = 0; pts = []; wasLiquid = wasGas = false; P.forEach(p => { p.x = p.hx; p.y = p.hy; }); say("Fresh ice at −20 °C."); };
      let last = performance.now();
      (function loop(now) {
        if (!alive(r)) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const T0 = temp();
        if (mode === "heat") E = Math.min(TOP, E + dt * 14);
        if (mode === "cool") E = Math.max(0, E - dt * 14);
        const T = temp(), lf = liquidFrac(), gf = gasFrac();
        if (mode !== "off") {
          t += dt; sample += dt;
          if (sample > 0.4) { sample = 0; pts.push([t, T]); if (pts.length > 1 && t > 120) { const s0 = pts[0][0]; pts = pts.filter(p => p[0] > t - 120); } }
          if (mode === "heat" && E > MELT0 && E < MELT1) flatM += dt;
          if (mode === "heat" && E > BOIL0 && E < BOIL1) flatB += dt;
        }
        if (T > -12 && T0 <= -12 && mode === "heat" && api.found("shake")) say("The particles have more energy, so they vibrate harder — but they stay in their places. It is still solid.");
        if (E > MELT0 + 2 && mode === "heat" && T0 === 0 && lf > 0.15 && api.found("melt")) say("Melting! The particles vibrate so hard they break out of their rows and slide past each other.");
        if (gf > 0.15 && mode === "heat" && api.found("boil")) say("Boiling! Particles get enough energy to escape completely and fly about as a gas.");
        if (flatM > 1.5 && flatB > 1.5 && api.found("flat")) say("See the flat bits? While it melts and while it boils, the heat breaks particles free instead of making it hotter.");
        if (lf === 1 && gf === 0) wasLiquid = true;
        if (gf === 1) wasGas = true;
        if (wasGas && mode === "cool" && gf < 0.6 && api.found("condense")) say("Condensing: the gas particles slow down and the attraction pulls them back together into a liquid.");
        if (wasLiquid && mode === "cool" && lf === 0 && api.found("freeze")) say("Freezing: the particles slowed so much they locked back into rows. Solid again.");
        // Which particles are in which state. Solids stay at home, liquids wander low, gases fly.
        const nGas = Math.round(gf * N), nSolid = Math.round((1 - lf) * N);
        const solidTop = nSolid ? P[nSolid - 1].hy - 12 : 999;
        const speed = 18 + Math.max(0, T) * 0.5;
        P.forEach((p, i) => {
          const isGas = i >= N - nGas, isSolid = i < nSolid;
          p.kind = isGas ? "g" : isSolid ? "s" : "l";
          if (isSolid) {
            const amp = 0.6 + (T + 20) * 0.09;
            p.x += (p.hx + rand(-amp, amp) - p.x) * 0.5; p.y += (p.hy + rand(-amp, amp) - p.y) * 0.5;
            return;
          }
          const sp = isGas ? 140 + T : speed;
          p.vx += rand(-0.6, 0.6); p.vy += rand(-0.6, 0.6);
          const m = Math.hypot(p.vx, p.vy) || 1; p.vx /= m; p.vy /= m;
          p.x += p.vx * sp * dt; p.y += p.vy * sp * dt;
          const yTop = isGas ? 50 : 150 - (N - nGas - nSolid > 14 ? 14 : 0);
          if (p.x < 30) { p.x = 30; p.vx = Math.abs(p.vx); } if (p.x > 270) { p.x = 270; p.vx = -Math.abs(p.vx); }
          if (p.y < yTop) { p.y = yTop + (isGas ? 0 : 2); p.vy = Math.abs(p.vy); } if (p.y > 190) { p.y = 190; p.vy = -Math.abs(p.vy); }
          if (!isGas && p.y > solidTop && p.x > 82 && p.x < 218) { p.x = p.x < 150 ? 82 : 218; p.vx = -p.vx; }   // liquid flows round what is still solid
        });
        el("parts").innerHTML = P.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="${p.kind === "g" ? "#9cc7ea" : "#4a90d9"}" stroke="#2f6f9f" stroke-width="1.5"/>`).join("");
        const fh = mode === "heat" ? 16 : 0;
        el("flame").setAttribute("opacity", fh ? 1 : 0);
        el("flame").setAttribute("d", `M140 228 Q140 ${228 - fh * 0.5} 150 ${228 - fh} Q160 ${228 - fh * 0.5} 160 228 Z`);
        el("ice").setAttribute("opacity", mode === "cool" ? 0.8 : 0);
        el("ice").setAttribute("d", "M120 214 h60 l-6 12 h-48 Z");
        const state = gf === 1 ? "GAS" : gf > 0 ? "BOILING" : lf === 1 ? "LIQUID" : lf > 0 ? "MELTING" : "SOLID";
        el("state").textContent = state;
        el("r1").textContent = `${Math.round(T)} °C`;
        el("r2").textContent = state.toLowerCase();
        el("hint").style.display = pts.length ? "none" : "";
        const t0 = pts.length ? pts[0][0] : 0;
        el("line").setAttribute("points", pts.map(p => `${px(p[0] - t0).toFixed(1)},${py(p[1]).toFixed(1)}`).join(" "));
        requestAnimationFrame(loop);
      })(performance.now());
    }

    // ── water cycle ─────────────────────────────────────────────────────
    function cycleBench() {

            if (!grav) { api.found("straight"); say("With no gravity there is nothing to pull it round, so it goes in a straight line for ever."); }
            else { api.found("escape"); say("Too fast — gravity bent its path, but could not hold on to it. It flew off into space."); }
            p = null; break;
          }
          if (Math.abs(p.swept) >= 2 * Math.PI) { if (api.found("orbit")) say("Round it goes! The push sideways and the pull of gravity towards the Sun balance into an orbit."); p.swept = 0; }
        }
        if (p) { trail.push([p.x, p.y]); if (trail.length > 260) trail.shift(); }
        let g = `<circle cx="${CX}" cy="${CY}" r="16" fill="#f2b705"/><circle cx="${CX}" cy="${CY}" r="24" fill="#f2b705" opacity="0.25"/>
          <text x="${CX}" y="${CY + 40}" font-size="12" text-anchor="middle" class="lbl">Sun</text>`;
        if (trail.length > 1) g += `<polyline points="${trail.map(t => t[0].toFixed(1) + "," + t[1].toFixed(1)).join(" ")}" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.6"/>`;
        const px = p ? p.x : CX, py = p ? p.y : CY - R0;
        g += `<circle cx="${px}" cy="${py}" r="8" fill="#3aa38f"/>`;
        if (!p) g += `<path d="M${CX + 12} ${CY - R0} h${10 + speed * 0.5}" stroke="#d64545" stroke-width="3"/><path d="M${CX + 22 + speed * 0.5} ${CY - R0} l-7 -5 v10 Z" fill="#d64545"/>`;
        if (p && grav) { const d = Math.hypot(CX - p.x, CY - p.y); g += `<path d="M${p.x} ${p.y} L${p.x + (CX - p.x) / d * 22} ${p.y + (CY - p.y) / d * 22}" stroke="#7b5ea7" stroke-width="2.5"/>`; }

    }

    // ── weight and mass ─────────────────────────────────────────────────

    // ── tides ───────────────────────────────────────────────────────────
    function tideBench() {
      const MOON = { new: ["New moon", Math.PI], first: ["First quarter", -Math.PI / 2], full: ["Full moon", 0], last: ["Last quarter", Math.PI / 2] };
      let moon = "full", hours = 0, playing = false, prevH = 0, rising = false, highs = [];
      const r = shell(`${pickRow("mo", "Moon", Object.entries(MOON).map(([k, v]) => [k, v[0]]), moon)}
        <div class="duo">
          <svg class="scene" viewBox="0 0 240 240" role="img" aria-label="The Earth from above, with its water pulled into bulges by the Moon"><g id="earth"></g></svg>

      const SUN = Math.PI;   // the Sun is off to the left
      const level = () => {
        const ma = MOON[moon][1], ha = -Math.PI / 2 + hours / 24 * 2 * Math.PI;
        const lunar = Math.cos(2 * (ha - ma)), solar = 0.45 * Math.cos(2 * (ha - SUN));
        return { h: lunar + solar, ha, ma };
      };
      let last = performance.now();
      (function loop(now) {
        if (!alive(r)) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (playing) hours += dt * 4;
        const { h } = level();
        if (playing) {
          if (h < prevH && rising) {
            highs.push(hours); highs = highs.filter(t => hours - t <= 25);
            if (h > 0.5) api.found("high");
            if (highs.length >= 2) { if (api.found("twice")) say("Two high tides in about a day: one bulge faces the Moon, the other is on the far side of the Earth."); }
            if (h > 1.3 && (moon === "new" || moon === "full")) { if (api.found("spring")) say("A spring tide — very high highs and very low lows. The Sun and the Moon are in a line, so their pulls add up."); }
            if (h < 0.7 && (moon === "first" || moon === "last")) { if (api.found("neap")) say("A neap tide — the highs are not so high. The Sun pulls at right angles to the Moon, so they partly cancel."); }

          ${[-1, 0, 1].map(k => `<line x1="100" y1="${120 - k * 50}" x2="108" y2="${120 - k * 50}" stroke="#9aa6b3" stroke-width="2"/>`).join("")}
          <text x="112" y="74" font-size="12" class="lbl">high</text><text x="112" y="174" font-size="12" class="lbl">low</text>

    // ── energy ──────────────────────────────────────────────────────────
    function energyBench() {
      const COL = { "gravitational": "#7b5ea7", "kinetic": "#e4572e", "thermal": "#d64545", "chemical": "#3aa38f", "light": "#f2b705", "elastic": "#4a90d9", "sound": "#9aa6b3" };
      // each scene: [name, from store, to stores with share, sentence]
      const SC = {
        skate: ["Skateboard", null],
        torch: ["Torch", ["chemical", [["light", 0.2], ["thermal", 0.8]]], "Chemical energy in the battery goes to light — and most of it to thermal energy, warming the bulb. That part is wasted."],
        drink: ["Hot drink", ["thermal", [["thermal", 1]]], "The drink's thermal energy spreads into the cup, the table and the air until everything is the same temperature. Nothing is lost — it is just spread out."],
        catapult: ["Catapult", ["elastic", [["kinetic", 0.85], ["sound", 0.05], ["thermal", 0.1]]], "Elastic energy in the stretched band goes to kinetic energy of the stone, with a little sound and heat."],
      };
      let s = "skate", t = 0, going = false, x = -1, v = 0, E = { gravitational: 100, kinetic: 0, thermal: 0 }, watched = {};
      const r = shell(`${pickRow("sc", "Scene", Object.entries(SC).map(([k, v]) => [k, v[0]]), s)}
        <div class="duo">
          <svg class="scene" viewBox="0 0 260 200" role="img" aria-label="The scene"><g id="scene"></g></svg>
          <svg class="scene" viewBox="0 0 260 200" role="img" aria-label="Bars showing how much energy is in each store"><g id="bars"></g></svg></div>
        <div class="ctrl"><button id="go">▶️ Go</button></div>
        <div class="readout"><span class="chip" id="r1"></span></div>
        <p class="muted" id="msg">Pick a scene and press Go. Watch where the energy goes.</p>`);
      const reset = () => { t = 0; going = false; x = -1; v = 0; E = s === "skate" ? { gravitational: 100, kinetic: 0, thermal: 0 } : { [SC[s][1][0]]: 100, ...Object.fromEntries(SC[s][1][1].filter(z => z[0] !== SC[s][1][0]).map(z => [z[0], 0])), ...(s === "drink" ? { "surroundings": 0 } : {}) }; };
      reset();
      wirePick("sc", k => { s = k; reset(); say("Press Go."); });
      el("go").onclick = () => { reset(); going = true; };
      let last = performance.now();
      (function loop(now) {
        if (!alive(r)) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (going) {
          t += dt;
          if (s === "skate") {
            // a bead on a U-shaped ramp, y = x², losing a little to friction each swing
            for (let k = 0; k < 6; k++) { const h = dt / 6; v += -2 * x * 9 * h; v *= 1 - 0.15 * h; x += v * h; }
            // 9x² + v²/2 is conserved without friction; scaled so the start (x = −1) is 100 units
            E.gravitational = 100 * x * x; E.kinetic = 100 / 9 * v * v / 2; E.thermal = Math.max(0, 100 - E.gravitational - E.kinetic);
            if (t > 2) { if (api.found("skate")) say("Gravitational energy at the top, kinetic at the bottom, back and forth — and each swing a bit lower, because friction turns some into thermal energy."); }
            if (t > 9 && !watched.skate) { watched.skate = true; api.found("wasted"); check(); }

            else { E[from] = 100 * (1 - f); to.forEach(([k, share]) => { E[k] = 100 * share * f; }); }
            if (f >= 1) { going = false; watched[s] = true; say(SC[s][2]); if (s === "torch") api.found("wasted"); check(); }
          }
        }
        render(now);
        requestAnimationFrame(loop);
      })(performance.now());
      function check() { if (Object.keys(watched).length >= 3 && api.found("total")) say("Three energy changes, and the total stayed 100 every time. Energy is never made or destroyed — it only moves between stores."); }
      function render(now) {
        let g = "";
        if (s === "skate") {
          g = `<path d="${Array.from({ length: 41 }, (_, i) => { const xx = -1 + i / 20; return (i ? "L" : "M") + (130 + xx * 110) + " " + (180 - xx * xx * 140); }).join(" ")}" fill="none" stroke="#9aa6b3" stroke-width="5"/>
            <g transform="translate(${130 + x * 110} ${180 - x * x * 140 - 14})"><rect x="-14" y="6" width="28" height="5" rx="2" fill="#b4531f"/><circle cx="-8" cy="13" r="3" fill="#34495e"/><circle cx="8" cy="13" r="3" fill="#34495e"/>
            <circle cx="0" cy="-14" r="6" fill="#f2c9a0"/><path d="M0 -8 V4" stroke="#4a90d9" stroke-width="5"/></g>`;
        } else if (s === "torch") {
          const on = going || watched.torch;
          g = `<rect x="40" y="90" width="110" height="36" rx="8" fill="#5b6675"/><path d="M150 82 L180 70 V146 L150 134 Z" fill="#9aa6b3"/>
            ${on ? `<path d="M180 76 L250 46 V170 L180 140 Z" fill="#f2b705" opacity="0.4"/>` : ""}<text x="95" y="113" font-size="12" text-anchor="middle" fill="#ffffff">battery</text>`;
        } else if (s === "drink") {
          const warm = Math.max(0, 1 - t / 2.5);
          g = `<path d="M90 90 H170 L162 170 H98 Z" fill="#ffffff" stroke="#9aa6b3" stroke-width="3"/><rect x="94" y="100" width="72" height="66" fill="#8b5a2b" opacity="0.8"/>
            ${warm > 0.1 ? [0, 1, 2].map(i => `<path d="M${110 + i * 20} 84 q8 -12 0 -24 q-8 -12 0 -24" fill="none" stroke="#c9ced4" stroke-width="3" opacity="${warm}"/>`).join("") : ""}
            <rect x="40" y="170" width="180" height="8" fill="#c9b79c"/>`;
        } else {
          const pull = going ? Math.max(0, 1 - t / 0.5) : watched.catapult ? 0 : 1, sx = going || watched.catapult ? 70 + Math.min(1, t / 1.5) * 170 : 70;
          g = `<path d="M110 180 V110 M110 110 L90 70 M110 110 L130 70" stroke="#8b5a2b" stroke-width="8" stroke-linecap="round"/>
            <path d="M90 70 Q${110 - 50 * pull} 100 130 70" fill="none" stroke="#d64545" stroke-width="3"/><circle cx="${pull > 0.2 ? 110 - 46 * pull : sx}" cy="${pull > 0.2 ? 88 : 70 - Math.sin(Math.min(1, t / 1.5) * Math.PI) * 40}" r="7" fill="#7f8c99"/>`;

            <text x="${cx}" y="186" font-size="12" text-anchor="middle" class="lbl">${k}</text><text x="${cx}" y="${164 - h}" font-size="12" text-anchor="middle">${Math.round(E[k])}</text>`;

    draw();
  },
