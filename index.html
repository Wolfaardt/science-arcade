        </svg>
        <div class="ctrl"><button id="ba">😮‍💨 Hold: breathe out through A</button><button id="bb">💨 Hold: pump room air through B</button></div>`);
      const el = id => document.getElementById(id);
      const press = (btn, which) => {
        const on = () => { hold = which; }, off = () => { if (hold === which) hold = null; };
        btn.addEventListener("pointerdown", on); ["pointerup", "pointerleave", "pointercancel"].forEach(e => btn.addEventListener(e, off));
      };
      press(el("ba"), "a"); press(el("bb"), "b");
      (function loop() {
        if (!alive() || tab !== "lime") return;
        if (hold === "a") a = Math.min(1, a + 0.012);
        if (hold === "b") b = Math.min(1, b + 0.012);
        // Tube A goes milky. Tube B never changes — that is the whole point of the control.
        // Milky means you can no longer see through it: the cloud hides the X drawn behind the tube.
        el("liqA").setAttribute("opacity", Math.min(1, 1.1 * a).toFixed(2));
        const bubbles = (n, which) => el("bub" + n).innerHTML = hold === which

        bubbles("A", "a"); bubbles("B", "b");

        if (b > 0.5 && api.found("clear")) api.say("Tube B is still clear. Room air has only a tiny bit of carbon dioxide.");
        requestAnimationFrame(loop);
      })();
    }

    draw();
  },
});

// Dissolving Bench — Grade 7 Unit 2 (Properties of materials): solutions and solubility.
//
// Pour, stir, heat, cool. The solubility curve draws itself behind the student as they find each
// saturation point, so the graph arrives as the result of playing rather than as a picture to copy.
// The numbers are the real ones — salt's line really is nearly flat, which is the surprise.
ARCADE.toy({
  id: "g07-u02-dissolving", unit: "g07-u02", order: 2,
  name: "Dissolving Bench", icon: "🥄",
  blurb: "Keep pouring until the water gives up",
  discoveries: [
    ["dissolve", "It disappeared", "Dissolve your first spoonful"],
    ["stir", "Stirring helps", "Stir an undissolved pile away"],
    ["saturate", "Saturated!", "Add so much that the water cannot take any more"],
    ["heat", "Hot water holds more", "Heat a saturated solution until the extra dissolves"],
    ["cool", "Crystals came back", "Cool a saturated solution and watch crystals appear"],
    ["mass", "Nothing was lost", "Check the balance before and after dissolving"],
    ["curve", "You drew a curve", "Find four saturation points at different temperatures"],
    ["three", "All three solids", "Try salt, sugar and copper sulfate"],
    ["flat", "The odd one out", "Find the solid that hardly cares about temperature"],
  ],
  mount(root, api) {
    const WATER = 20;                                  // g of water in the beaker
    const SOLIDS = {
      salt: { name: "Salt", line: "#7f8c99", colour: "#e6e2d6", tint: null, t: [[0, 35.7], [20, 36.0], [40, 36.6], [60, 37.3], [80, 38.4], [100, 39.8]] },
      sugar: { name: "Sugar", line: "#d99a00", colour: "#efe7d4", tint: null, t: [[0, 179], [20, 204], [40, 238], [60, 287], [80, 362], [100, 487]] },
      copper: { name: "Copper sulfate", line: "#2f6f9f", colour: "#4a90d9", tint: "#4a90d9", t: [[0, 14], [20, 20.7], [40, 28.5], [60, 40], [80, 55], [100, 75]] },
    };
    const solubility = (s, temp) => {   // g per 100 g of water, read off the real table
      const t = SOLIDS[s].t;
      for (let i = 1; i < t.length; i++) if (temp <= t[i][0]) {
        const [x0, y0] = t[i - 1], [x1, y1] = t[i];
        return y0 + (y1 - y0) * (temp - x0) / (x1 - x0);
      }
      return t[t.length - 1][1];
    };
    const limit = (s, temp) => solubility(s, temp) * WATER / 100;   // g this beaker can hold

    let solid = "salt", temp = 20, added = 0, dissolved = 0, pouring = false, tried = {}, points = {};
    root.innerHTML = `
      <div class="ctrl">${Object.entries(SOLIDS).map(([k, s]) => `<button data-solid="${k}" class="${k === "salt" ? "on" : ""}">${s.name}</button>`).join("")}</div>
      <svg viewBox="0 0 400 268" role="img" aria-label="A beaker of water over a burner, with a graph beside it">
        <text id="sat" x="120" y="44" text-anchor="middle" font-size="15" fill="#b4531f" font-weight="bold"></text>
        <path d="M54 58 L54 200 L186 200 L186 58" fill="none" stroke="#7f8c99" stroke-width="4"/>
        <rect id="water" x="56" y="96" width="128" height="102" fill="#dbeaf6"/>
        <g id="pile"></g><g id="grains"></g>
        <line x1="44" y1="208" x2="196" y2="208" stroke="#9aa6b3" stroke-width="5"/>
        <path id="flame" d="" fill="#f2b705" opacity="0"/>
        <rect x="114" y="248" width="12" height="16" fill="#8d97a3"/>
        <rect x="98" y="262" width="44" height="6" rx="3" fill="#8d97a3"/>
        <rect x="214" y="36" width="172" height="152" fill="none" stroke="#c9d2db" stroke-width="2"/>
        <text x="300" y="206" text-anchor="middle" font-size="12" fill="#5b6675">temperature →</text>
        <text x="218" y="196" font-size="11" fill="#5b6675">0</text>
        <text x="386" y="196" text-anchor="end" font-size="11" fill="#5b6675">100 °C</text>
        <text x="218" y="32" font-size="11" fill="#5b6675">g per 100 g of water</text>
        <g id="plot"></g><g id="legend"></g><text id="ymax" x="210" y="44" text-anchor="end" font-size="11" fill="#5b6675"></text>
      </svg>
      <div class="ctrl"><button id="spoon">🥄 Hold to pour</button><button id="stir">🌀 Stir</button><button id="weigh">⚖️ Weigh it</button><button id="tip">🗑️ Empty the beaker</button></div>
      <div class="ctrl slider"><label for="tp">Temperature</label><input type="range" id="tp" min="10" max="100" value="20"><span class="chip" id="tpv">20 °C</span></div>
      <div class="readout"><span class="chip" id="r1">added 0.0 g</span><span class="chip" id="r2">dissolved 0.0 g</span><span class="chip" id="r3">this water can hold 7.2 g</span><span class="chip" id="r4">the balance reads 20.0 g</span></div>
      <p class="muted" id="msg">Hold the spoon down and keep pouring. Watch for the moment the water gives up.</p>`;

    const el = id => document.getElementById(id);
    const msg = m => { if (el("msg").textContent !== m) { el("msg").textContent = m; api.say(m); } };
    root.querySelectorAll("[data-solid]").forEach(b => b.onclick = () => {
      root.querySelectorAll("[data-solid]").forEach(x => x.classList.toggle("on", x === b));
      solid = b.dataset.solid; added = dissolved = 0; tried[solid] = true;
      if (Object.keys(tried).length >= 3) api.found("three");
      msg(`${SOLIDS[solid].name} it is. Pour some in.`); render();
    });
    tried.salt = true;
    el("tp").oninput = () => { temp = +el("tp").value; el("tpv").textContent = temp + " °C"; };
    const hold = (btn, on, off) => { btn.addEventListener("pointerdown", on); ["pointerup", "pointerleave", "pointercancel"].forEach(e => btn.addEventListener(e, off)); };
    hold(el("spoon"), () => { pouring = true; }, () => { pouring = false; });
    el("stir").onclick = () => {
      const cap = limit(solid, temp);
      if (dissolved < Math.min(added, cap) - 0.05) { dissolved = Math.min(added, cap); api.found("stir"); msg("Stirring got the rest of it to dissolve. It does not make the water hold more, only faster."); }
      else msg(dissolved >= cap - 0.05 && added > cap ? "Stirring will not help now — the solution is saturated." : "Nothing left to stir in.");
      render();
    };
    let weighed = null;
    el("weigh").onclick = () => {
      const mass = +(WATER + added).toFixed(1), now = { mass, dissolved };
      if (weighed && Math.abs(weighed.mass - mass) < 0.05 && dissolved - weighed.dissolved > 0.5) {
        api.found("mass");
        msg(`Still ${mass.toFixed(1)} g. The solid dissolved, but none of it was destroyed — it is still in there, spread out between the water particles.`);
      } else msg(`The balance reads ${mass.toFixed(1)} g. Let some more dissolve, then weigh it again.`);
      weighed = now;
    };
    el("tip").onclick = () => { weighed = null; added = dissolved = 0; msg("Empty beaker, fresh water."); render(); };

    // Heating a saturated beaker takes the pile away; cooling one puts it back. Both are watched.
    let lastCap = limit(solid, temp), heatedAway = false;
    let last = performance.now();
    (function loop(now) {
      if (!document.body.contains(root)) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const cap = limit(solid, temp);
      if (pouring) added += dt * 2.2;
      const before = dissolved;
      const room = Math.max(0, Math.min(added, cap) - dissolved);
      if (room > 0) dissolved = Math.min(added, cap, dissolved + dt * 1.6);   // dissolving takes a moment
      if (dissolved > cap) { dissolved = cap; }                               // cooling throws the extra back out
      if (dissolved > 0.2 && before <= 0.2) api.found("dissolve");
      const excess = added - dissolved;
      if (excess > 0.6 && added > cap) {
        if (api.found("saturate")) msg("The water will not take any more — that is a saturated solution. Now try heating it.");
        const key = Math.round(temp / 10) * 10;
        if (!points[solid]) points[solid] = {};
        if (!points[solid][key]) {
          points[solid][key] = solubility(solid, key);
          if (Object.keys(points[solid]).length >= 4) api.found("curve");
          const ks = Object.keys(points[solid]).map(Number).sort((a, b) => a - b);
          if (solid === "salt" && ks.length >= 2 && ks[ks.length - 1] - ks[0] >= 40) api.found("flat");
        }
      }
      render(excess, cap);
      requestAnimationFrame(loop);
    })(performance.now());

    function render(excess, cap) {
      cap = cap === undefined ? limit(solid, temp) : cap;
      excess = excess === undefined ? Math.max(0, added - dissolved) : excess;
      if (cap > lastCap + 0.05 && added > lastCap && excess < 0.3 && !heatedAway) { heatedAway = true; api.found("heat"); msg("Hot water holds more, so the pile at the bottom dissolved away."); }
      if (cap < lastCap - 0.05 && added > cap && excess > 0.3) { heatedAway = false; api.found("cool"); msg("Cooler water holds less, so the extra came back out as crystals."); }
      lastCap = cap;

      const s = SOLIDS[solid];
      const strength = s.tint ? Math.min(0.85, dissolved / Math.max(0.001, limit("copper", 100)) * 1.6) : 0;
      el("water").setAttribute("fill", s.tint ? `rgba(74,144,217,${0.18 + strength})` : "#dbeaf6");
      const ph = Math.min(48, excess * 7);
      el("pile").innerHTML = ph > 1 ? `<path d="M62 198 Q120 ${198 - ph} 178 198 Z" fill="${s.colour}" stroke="#7f8c99" stroke-width="2"/>` : "";
      el("grains").innerHTML = pouring ? [0, 1, 2].map(i => `<circle cx="${120 + (i - 1) * 8}" cy="${58 + ((performance.now() / 4 + i * 26) % 40)}" r="4" fill="${s.colour}" stroke="#7f8c99"/>`).join("") : "";
      const fh = 6 + (temp - 10) * 0.42;
      el("flame").setAttribute("opacity", temp > 14 ? Math.min(1, (temp - 14) / 30) : 0);
      el("flame").setAttribute("d", `M104 248 Q120 ${248 - fh} 136 248 Q120 254 104 248 Z`);
      el("sat").textContent = added > cap + 0.05 ? "SATURATED" : "";
      el("r4").textContent = `the balance reads ${(WATER + added).toFixed(1)} g`;
      el("r1").textContent = `added ${added.toFixed(1)} g`;
      el("r2").textContent = `dissolved ${dissolved.toFixed(1)} g`;
      el("r3").textContent = `this water can hold ${cap.toFixed(1)} g at ${temp} °C`;

      // Every solid the student has saturated stays on one shared graph, so salt's flat line ends
      // up beside sugar's steep one — the comparison is the discovery, not any single line.
      const series = Object.entries(points).map(([k, got]) => [k, Object.keys(got).map(Number).sort((a, b) => a - b).map(t => [t, got[t]])]).filter(([, pts]) => pts.length);
      const ymax = Math.max(50, ...series.flatMap(([, pts]) => pts.map(p => p[1]))) * 1.15;
      el("ymax").textContent = series.length ? Math.round(ymax) : "";
      const px = t => 214 + 172 * t / 100, py = y => 188 - 152 * Math.min(1, y / ymax);
      el("plot").innerHTML = series.map(([k, pts]) => {
        const c = SOLIDS[k].line, wide = k === solid ? 4 : 2.5;
        return (pts.length > 1 ? `<polyline points="${pts.map(p => px(p[0]) + "," + py(p[1])).join(" ")}" fill="none" stroke="${c}" stroke-width="${wide}"/>` : "")
          + pts.map(p => `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="${k === solid ? 5 : 4}" fill="${c}"/>`).join("");
      }).join("") + `<path d="M${px(temp)} 188 l-5 10 h10 Z" fill="#b4531f"/>`;
      el("legend").innerHTML = series.map(([k], i) => `<circle cx="226" cy="${54 + i * 16}" r="5" fill="${SOLIDS[k].line}"/><text x="236" y="${58 + i * 16}" font-size="12" fill="#5b6675"${k === solid ? ' font-weight="bold"' : ""}>${SOLIDS[k].name}</text>`).join("");
    }
    render();
  },
});

// Ink Lab — Grade 7 Unit 2 (Properties of materials): paper chromatography.
//
// Somebody ate the last biscuit and left a note. Four suspects, four pens, one chromatogram.
// The two real experimental mistakes are in here on purpose — putting the start line under the
// solvent washes the ink away, and a single spot never separates because it is already pure.
ARCADE.toy({
  id: "g07-u02-inklab", unit: "g07-u02", order: 1,
  name: "Ink Lab", icon: "🕵️",
  blurb: "Split inks on wet paper and catch the biscuit thief",
  discoveries: [
    ["run", "First chromatogram", "Dip the paper and let the solvent climb"],
    ["split", "One ink, three colours", "Separate an ink that is a mixture"],
    ["washed", "Oops — it washed away", "Start the ink below the solvent"],
    ["rf", "Measured an Rf", "Tap a colour, then measure it and the solvent front with the ruler"],
    ["all4", "Fair test", "Run all four suspects at once"],
    ["pure", "A pure ink", "Find the pen whose ink is only one colour"],
    ["solved", "Case closed", "Name the pen that wrote the note"],
  ],
  mount(root, api) {
    const START = 206, TOP = 44, RUN = START - TOP;   // the paper, in SVG units
    const NOTE = [[0.24, "#7b5ea7"], [0.56, "#2f6f9f"], [0.82, "#d99a00"]];
    const RECIPES = [NOTE, [[0.30, "#c2477b"], [0.74, "#2f6f9f"]], [[0.55, "#2e8b57"]], [[0.18, "#e4572e"], [0.46, "#d99a00"], [0.90, "#34495e"]]];
    const FACES = ["🦊 Fox", "🐻 Bear", "🐰 Rabbit", "🦉 Owl"];
    const mix = api.shuffle(RECIPES.map((r, i) => i));            // who holds which pen changes every time
    const PENS = FACES.map((name, i) => ({ name, key: "s" + i, dyes: RECIPES[mix[i]], ink: RECIPES[mix[i]][0][1] }));
    const CULPRIT = PENS[mix.indexOf(0)].key;
    const NOTEPEN = { name: "📄 The note", key: "note", dyes: NOTE, ink: "#3b3b3b" };
    const ALL = [NOTEPEN].concat(PENS);

    let picked = "note", spots = [], front = 0, running = false, dipped = false, ruler = false, sunk = false, said = "";
    // Measuring: tap a colour, drag the marker to its middle, then to the solvent front. The student
    // reads the ruler; close enough (4 mm) snaps, so it can be fiddly but never wrong.
    let meas = null, markY = null, dragging = false;
    root.innerHTML = `
      <p class="muted" id="story">Somebody ate the last biscuit and left this note. Pick a pen, tap the paper to dot it on the pencil line, then dip.</p>
      <svg viewBox="0 0 400 300" id="lab" role="img" aria-label="Chromatography paper standing in a beaker of solvent">
        <rect id="paper" x="104" y="26" width="192" height="260" fill="#fffdf6" stroke="#ded7c6" stroke-width="2"/>
        <line id="front" x1="104" y1="26" x2="296" y2="26" stroke="#7fb4d8" stroke-width="3" stroke-dasharray="7 4" opacity="0"/>
        <text id="frontlab" x="300" y="30" font-size="12" fill="#7fb4d8" opacity="0">solvent front</text>
        <g id="wet"></g>
        <line id="startline" x1="104" y1="${START}" x2="296" y2="${START}" stroke="#9aa6b3" stroke-width="2" stroke-dasharray="5 4"/>
        <text id="linelab" x="300" y="${START + 4}" font-size="12" fill="#9aa6b3">pencil line</text>
        <path d="M76 232 L76 288 L324 288 L324 232" fill="none" stroke="#7f8c99" stroke-width="4"/>
        <rect id="solvent" x="78" y="248" width="244" height="38" fill="#dbeaf6" opacity=".85"/>
        <text x="200" y="274" text-anchor="middle" font-size="13" fill="#5b6675">solvent</text>
        <g id="spots"></g><g id="rulermarks"></g><g id="marker"></g>
      </svg>
      <div class="ctrl" id="pens">${ALL.map(p => `<button data-pen="${p.key}" class="${p.key === "note" ? "on" : ""}">
        <span style="display:inline-block;width:.8em;height:.8em;border-radius:50%;background:${p.ink};margin-right:6px"></span>${p.name}</button>`).join("")}</div>
      <div class="ctrl"><button id="dip">💧 Dip the paper</button><button id="rule">📏 Ruler off</button>
        <button id="low">⬇ Start the ink lower</button><button id="reset">🔄 Fresh paper</button></div>
      <div id="say" class="muted"></div>
      <div class="ctrl" id="accuse" hidden>${PENS.map(p => `<button data-acc="${p.key}">It was ${p.name}</button>`).join("")}</div>`;

    const svg = document.getElementById("lab"), el = id => document.getElementById(id);
    const say = msg => { if (said === msg) return; said = msg; el("say").textContent = msg; api.say(msg); };

    root.querySelectorAll("[data-pen]").forEach(b => b.onclick = () => {
      root.querySelectorAll("[data-pen]").forEach(x => x.classList.toggle("on", x === b)); picked = b.dataset.pen;
    });
    svg.addEventListener("click", e => {
      if (running || dipped) return;
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 400;
      if (x < 112 || x > 288) return;
      const pen = ALL.find(p => p.key === picked);
      spots.push({ pen, x: Math.round(x) });
      api.log("spot", { pen: pen.key });
      render(); say(`${pen.name} dotted on the line. Add more, or dip.`);
    });
    const yIn = e => { const r = svg.getBoundingClientRect(); return (e.clientY - r.top) / r.height * 300; };
    svg.addEventListener("pointermove", e => {
      if (!dragging) return;
      const base = sunk ? START + 50 : START;
      markY = Math.max(base - RUN - 2, Math.min(base, yIn(e))); render();
    });
    addEventListener("pointerup", () => {
      if (!dragging || !meas) return;
      dragging = false;
      const base = sunk ? START + 50 : START, at = Math.round((base - markY) / RUN * 160);
      const want = meas.got === null ? meas.spot : meas.front;
      if (Math.abs(at - want) > 4) {
        said = ""; say(meas.got === null ? `The marker reads ${at} mm. Line it up with the middle of the colour.` : `The marker reads ${at} mm. Take it up to the dashed solvent front.`);
        return;
      }
      markY = base - RUN * want / 160; render();
      if (meas.got === null) { meas.got = want; said = ""; say(`The colour travelled ${want} mm. Now drag the marker up to the solvent front.`); return; }
      api.found("rf"); api.log("rf", { spot: meas.got, front: want });
      said = ""; say(`The solvent went ${want} mm. Rf = ${meas.got} ÷ ${want} = ${(meas.got / want).toFixed(2)}. Tap another colour to measure it.`);
      meas = null; markY = null;
    });
    el("low").onclick = () => { sunk = !sunk; el("low").classList.toggle("on", sunk); el("paper").setAttribute("y", sunk ? 76 : 26); el("paper").setAttribute("height", sunk ? 210 : 260); render(); say(sunk ? "The pencil line is under the solvent now. Dip it and see." : "Back above the solvent."); };
    el("rule").onclick = () => { ruler = !ruler; el("rule").textContent = ruler ? "📏 Ruler on" : "📏 Ruler off"; el("rule").classList.toggle("on", ruler); render(); };
    el("reset").onclick = () => { meas = null; markY = null; spots = []; front = 0; dipped = false; running = false; el("accuse").hidden = true; el("front").setAttribute("opacity", 0); render(); say("Fresh paper."); };
    el("dip").onclick = () => {
      if (running || !spots.length) { say("Dot at least one pen on the line first."); return; }
      if (sunk) { spots.forEach(s => s.gone = true); api.found("washed"); say("The ink was under the solvent, so it dissolved straight into the beaker. Nothing to see! Move the line back up."); render(); return; }
      running = true; dipped = true; el("front").setAttribute("opacity", 1);
      api.log("dip", { spots: spots.length });
      const t0 = performance.now();
      (function step(now) {
        if (!document.body.contains(root)) return;
        front = Math.min(1, (now - t0) / 5200);
        render();
        if (front < 1) return requestAnimationFrame(step);
        running = false;
        api.found("run");
        if (spots.some(s => s.pen.dyes.length >= 3)) api.found("split");
        if (spots.some(s => s.pen.dyes.length === 1)) api.found("pure");
        if (PENS.every(p => spots.some(s => s.pen.key === p.key))) api.found("all4");
        el("accuse").hidden = !spots.some(s => s.pen.key === "note");
        say("The solvent has stopped. Which suspect's colours line up with the note's?");
      })(t0);
    };
    root.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => {
      const ok = b.dataset.acc === CULPRIT;
      api.beep(ok);
      if (ok) { api.found("solved"); say("That is the one — every colour matches the note exactly. Biscuit recovered."); }
      else { said = ""; say("Their colours do not line up with the note. Look again — the heights have to match."); }
      api.log("accuse", { right: ok });
    });

    function render() {
      // The paper stands on the bottom of the beaker; sinking it drops the pencil line below the
      // solvent surface (y 248), which is the mistake this toy lets students make on purpose.
      const base = sunk ? START + 50 : START;
      el("startline").setAttribute("y1", base); el("startline").setAttribute("y2", base); el("linelab").setAttribute("y", base + 4);
      const fy = base - RUN * front;

        if (!ethanol) { api.found("hidden"); say("The leaf is too green to tell — the chlorophyll hides the colour change. Take the green out with ethanol first."); return; }
        const crack = soft ? "" : " (It cracked when you spread it — warm water would have softened it.)";
        if (leaf === "light") { api.found("pattern"); say("Blue-black where the leaf was green: starch. Orange-brown where it was white: no chlorophyll, so no photosynthesis." + crack); }
        else { api.found("destarch"); say("All orange-brown — no starch anywhere. In the dark it could not photosynthesise, and it used up its store." + crack); }
      };
      (function loop() {
        if (!alive(r)) return;
        if (fire > 0) fire -= 0.016;
        el("fire").innerHTML = fire > 0 ? [0, 1, 2].map(i => `<path d="M${132 + i * 8} 152 Q${136 + i * 8} ${(128 - Math.random() * 10).toFixed(1)} ${142 + i * 8} 152 Z" fill="${i % 2 ? "#f2b705" : "#e0592a"}"/>`).join("") : "";
        requestAnimationFrame(loop);
      })();
      render();
    }

    // ── hydrogencarbonate indicator ────────────────────────────────────────
    function indBench() {
      const MIX = [["none", "Nothing"], ["plant", "🌿 Water plant"], ["mag", "🐛 Maggots"], ["both", "🌿🐛 Both"]];
      let mix = "plant", light = true, co2 = 0.5, t = 0, going = false, rack = [];
      const r = shell(`${pickRow("mix", "In the tube:", MIX, mix)}
        ${pickRow("lt", "Leave it:", [["on", "☀️ in the light"], ["off", "🌑 in the dark"]], "on")}
        <div class="duo">
          <svg class="scene" viewBox="0 0 220 250" role="img" aria-label="A test tube of hydrogencarbonate indicator">
            <rect id="bg" x="0" y="0" width="220" height="250" rx="14" fill="#fff6cc"/>
            <text id="sky" x="196" y="30" text-anchor="middle" font-size="22">☀️</text>
            <path d="M88 26 V204 Q88 222 110 222 Q132 222 132 204 V26" fill="#fff" stroke="#7f8c99" stroke-width="3"/>
            <path id="liq" d="M91 118 V204 Q91 219 110 219 Q129 219 129 204 V118 Z" fill="#c0392b"/>
            <path d="M89 112 H131" stroke="#5b6675" stroke-width="4" stroke-dasharray="3 3"/><g id="who"></g>
            <text x="140" y="116" font-size="12" id="pl" class="lbl">platform</text>
            <text x="140" y="170" font-size="12" id="il" class="lbl">indicator</text>
            <text x="110" y="242" text-anchor="middle" font-size="14" font-weight="bold" id="clock">0 minutes</text>
          </svg>
          <div style="flex:1 1 240px;min-width:0">
            <div style="height:18px;border-radius:9px;background:linear-gradient(90deg,#7b3fa0,#c0392b 50%,#f2c12e)"></div>
            <div style="display:flex;justify-content:space-between;font-size:.85em" class="muted"><span>purple:<br>none</span><span style="text-align:center">red:<br>a little</span><span style="text-align:right">yellow:<br>lots</span></div>
            <p class="muted" style="margin:6px 0 0;font-size:.9em">…carbon dioxide in the water</p>
            <h3 style="margin:14px 0 6px;font-size:1em">Your results after 30 minutes</h3>
            <div id="rack" class="muted">Nothing tested yet.</div>
          </div>
        </div>
        <div class="ctrl"><button id="go">▶ Leave it for 30 minutes</button></div>
        <p class="muted" id="msg">The indicator starts red. Choose what goes in the tube and where it goes, then wait.</p>`);
      const colour = c => {       // purple → red → yellow as carbon dioxide rises
        const mixc = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
        const P = [123, 63, 160], R = [192, 57, 43], Y = [242, 193, 46];
        const [x, y, z] = c < 0.5 ? mixc(P, R, c / 0.5) : mixc(R, Y, (c - 0.5) / 0.5);
        return `rgb(${x},${y},${z})`;
      };
      const change = () => {       // carbon dioxide change per minute
        const plant = mix === "plant" || mix === "both", mag = mix === "mag" || mix === "both";
        return (plant ? 0.012 : 0) + (mag ? 0.02 : 0) - (plant && light ? 0.04 : 0);
      };
      const reset = () => { co2 = 0.5; t = 0; going = false; };
      wirePick("mix", v => { mix = v; reset(); });
      wirePick("lt", v => { light = v === "on"; reset(); });
      el("go").onclick = () => { reset(); going = true; };
      function finish() {
        going = false;
        const c = co2, name = MIX.find(m => m[0] === mix)[1] + (light ? ", light" : ", dark");
        rack = rack.filter(x => x[0] !== name).concat([[name, c]]).slice(-8);
        el("rack").innerHTML = rack.map(([n, cc]) => `<div><span class="swatch" style="background:${colour(cc)}"></span>${n}</div>`).join("");
        if (c > 0.8) api.found("yellow");
        if (c < 0.2) api.found("purple");
        if (mix === "plant" && !light) { api.found("plantdark"); say("Yellow — in the dark the plant only respires, so it adds carbon dioxide. Plants respire all the time, just like animals."); }
        else if (mix === "mag" && light) { api.found("maggotlight"); say("Still yellow. Maggots cannot photosynthesise — light makes no difference to them."); }
        else if (mix === "none") { api.found("control"); say("Still red. Nothing living, nothing changes — this is the control that the other tubes are compared with."); }
        else if (mix === "both" && light) say("Purple or red: the plant uses up the carbon dioxide from both itself and the maggots.");
        else if (mix === "plant" && light) say("Purple — photosynthesis in the light uses carbon dioxide faster than respiration makes it.");
        else say("Yellow — respiration only, so carbon dioxide builds up.");
      }
      (function loop() {
        if (!alive(r)) return;
        if (going) { t += 0.2; co2 = Math.max(0, Math.min(1, co2 + change() * 0.2)); if (t >= 30) finish(); }
        el("liq").setAttribute("fill", colour(co2));
        el("bg").setAttribute("fill", light ? "#fff6cc" : "#2c3440");
        el("sky").textContent = light ? "☀️" : "🌙";
        // The panel is a fixed light or dark colour in both themes, so its text is too.
        el("clock").style.fill = light ? "#1f2a37" : "#eef2f6";
        ["pl", "il"].forEach(id => el(id).style.fill = light ? "#5b6675" : "#c9d2db");
        el("clock").textContent = `${Math.round(t)} minutes`;
        el("who").innerHTML = (mix === "plant" || mix === "both" ? `<path d="M110 214 q-10 -22 0 -44 q8 -16 0 -30 M110 188 q12 -6 14 -18" stroke="#2e8b57" stroke-width="4" fill="none" stroke-linecap="round"/>` : "")
          + (mix === "mag" || mix === "both" ? `<ellipse cx="102" cy="104" rx="9" ry="4" fill="#efe6c8" stroke="#8a7a50"/><ellipse cx="118" cy="103" rx="9" ry="4" fill="#efe6c8" stroke="#8a7a50"/>` : "");
        requestAnimationFrame(loop);
      })();
    }

    // ── one carbon atom ────────────────────────────────────────────────────
    // The cycle is drawn as the textbook draws it: stores joined by labelled arrows. The arrows the
    // atom can take from where it is light up and can be tapped; the rest stay grey.
    function cycleBench() {
      const STORES = { air: [180, 32, 190, "☁️ Air (carbon dioxide)"], plant: [75, 150, 96, "🌳 Plants"], animal: [290, 150, 100, "🐄 Animals"],
        dead: [88, 236, 140, "🍂 Dead remains"], fuel: [262, 300, 140, "⛽ Fossil fuels"] };
      const ARROWS = [   // key, from, to, path, label, label x, y, anchor, rotate, what happened
        ["photo", "air", "plant", "M120 50 C60 56 50 96 54 130", "photosynthesis", 38, 84, "middle", -90, "A plant took in carbon dioxide and used light energy to make glucose. The carbon is now in the plant."],
        ["resp", "plant", "air", "M112 133 Q170 110 186 52", "respiration", 150, 98, "end", 0, "The plant broke down glucose — carbon dioxide back into the air. Plants respire all the time."],
        ["feed", "plant", "animal", "M123 150 H236", "feeding", 180, 141, "middle", 0, "An animal ate the plant. The carbon is now part of the animal."],
        ["resp2", "animal", "air", "M284 133 Q280 80 252 52", "respiration", 272, 100, "end", 0, "The animal respired — carbon dioxide breathed out into the air."],
        ["die", "plant", "dead", "M62 167 V216", "death", 68, 196, "start", 0, "The plant died. Its carbon is in the dead leaves and wood."],
        ["die2", "animal", "dead", "M262 167 L152 226", "death", 214, 212, "start", 0, "The animal died. Its carbon is in its body and its waste."],
        ["decomp", "dead", "air", "M24 219 C-2 160 -2 60 82 32", "decomposition", -10, 150, "middle", -90, "Decomposers — bacteria and fungi — broke down the remains and respired. Carbon dioxide into the air."],
        ["fossil", "dead", "fuel", "M100 253 Q120 300 184 300", "millions of years", 96, 322, "middle", 0, "Buried where there is no oxygen, so nothing rots it. Heat and pressure over MILLIONS of years made a fossil fuel."],
        ["burn", "fuel", "air", "M338 292 C374 230 370 70 268 36", "combustion", 336, 250, "end", 0, "Burning the fossil fuel releases carbon that was locked away for millions of years."],
      ];
      let at = "air", anim = null, loops = 0, years = 0;
      const r = shell(`<svg class="scene" viewBox="0 0 384 330" id="csvg" role="img" aria-label="The carbon cycle: stores joined by labelled arrows, with one carbon atom to move">
          <defs>${["off", "on"].map(k => `<marker id="ah-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="${k === "on" ? "#2f6f9f" : "#b9c4cf"}"/></marker>`).join("")}</defs>
          <rect x="0" y="268" width="384" height="62" fill="#b08a6a" opacity=".25"/><text x="8" y="286" font-size="13" class="lbl">underground</text>
          <g transform="translate(18 0)"><g id="arrows"></g><path id="trk" d="" fill="none" stroke="none"/>
          ${Object.entries(STORES).map(([k, [x, y, w, n]]) => `<rect x="${x - w / 2}" y="${y - 17}" width="${w}" height="34" rx="17" class="bgc" stroke="#c9d2db" stroke-width="2.5" id="st-${k}"/>
            <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="600">${n}</text>`).join("")}
          <g id="atom"><circle r="11" fill="#34495e" stroke="#fff" stroke-width="3"/><text y="4" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">C</text></g></g>
        </svg>
        <div class="ctrl" id="moves"></div>
        <div class="readout"><span class="chip" id="yrs"></span><span class="chip" id="lp"></span></div>
        <p class="muted" id="msg">You are one carbon atom in the air. Tap a blue arrow (or a button) to move.</p>`);
      function drawArrows() {
        el("arrows").innerHTML = ARROWS.map(([k, from, , d, label, lx, ly, anc, rot], i) => {
          const live = from === at && !anim;
          return `<g data-ar="${i}" style="${live ? "cursor:pointer" : ""}"><path d="${d}" fill="none" stroke="transparent" stroke-width="16"/>
            <path d="${d}" fill="none" stroke="${live ? "#2f6f9f" : "#b9c4cf"}" stroke-width="${live ? 4 : 2.5}" marker-end="url(#ah-${live ? "on" : "off"})"/>
            <text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="14" ${live ? 'fill="#2f6f9f" font-weight="bold"' : 'class="lbl"'}${rot ? ` transform="rotate(${rot} ${lx} ${ly})"` : ""}>${label}</text></g>`;
        }).join("");
        root.querySelectorAll("[data-ar]").forEach(g => g.onclick = () => { const a = ARROWS[+g.dataset.ar]; if (a[1] === at && !anim) go(a); });
        el("moves").innerHTML = ARROWS.filter(a => a[1] === at).map(a => `<button data-mv="${a[0]}">${a[4][0].toUpperCase() + a[4].slice(1)} →</button>`).join("");
        root.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { if (!anim) go(ARROWS.find(a => a[0] === b.dataset.mv)); });
        Object.keys(STORES).forEach(k => el("st-" + k).setAttribute("stroke", k === at ? "#2f6f9f" : "#c9d2db"));
      }
      function go(a) {
        const [k, , to] = a, text = a[9];
        const path = el("trk"); path.setAttribute("d", a[3]);   // a steady copy: the arrows redraw under it
        anim = { path, len: path.getTotalLength(), t: 0 };
        years += k === "fossil" ? 100e6 : 1;
        at = to;
        const disc = { photo: "photo", feed: "feed", decomp: "decomp", fossil: "fossil", burn: "burn" }[k];
        if (disc) api.found(disc);
        if (to === "air") { loops++; if (loops >= 5) api.found("loop"); }
        say(text); drawArrows();
      }
      (function loop() {
        if (!alive(r)) return;
        let x, y;
        if (anim) {
          anim.t = Math.min(1, anim.t + 0.025);
          const p = anim.path.getPointAtLength(anim.len * anim.t * anim.t * (3 - 2 * anim.t)); x = p.x; y = p.y;
          if (anim.t >= 1) { anim = null; drawArrows(); }
        } else { const [sx, sy, w] = STORES[at]; x = sx + w / 2 - 4; y = sy - 16; }
        el("atom").setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
        el("yrs").textContent = "time taken: " + (years >= 1e6 ? `about ${Math.round(years / 1e6)} million years` : years ? `about ${years} year${years === 1 ? "" : "s"}` : "none yet");
        el("lp").textContent = `back to the air: ${loops} time${loops === 1 ? "" : "s"}`;
        requestAnimationFrame(loop);
      })();
      drawArrows();
    }

    // ── the planet ─────────────────────────────────────────────────────────
    // A toy thermostat, not a climate model: carbon dioxide rises with fuel burned, forests pull it
    // back, and the temperature follows the carbon dioxide. Sea level follows the temperature.
    function planetBench() {
      let fuel = 3, forest = 6, co2 = 280, peak = 280, dust = 0, hit = 0;
      const r = shell(`<svg class="scene" viewBox="0 0 360 230" role="img" aria-label="A coast with ice, sea, houses, a factory and forest, and a thermometer">
          <rect id="sky" x="0" y="0" width="360" height="230" fill="#cfe7fb"/><circle id="sun" cx="300" cy="36" r="20" fill="#f2b705"/>
          <rect id="sea" x="0" y="150" width="140" height="80" fill="#4a90d9" opacity=".8"/>
          <path id="ice" d="" fill="#fff" stroke="#b9d3e8"/>
          <path d="M140 150 L330 150 L330 230 L140 230 Z" fill="#9bc37a"/><g id="trees"></g>
          <text x="176" y="148" font-size="22">🏠</text><text x="210" y="148" font-size="22">🏠</text><text x="270" y="148" font-size="22">🏭</text>
          <rect id="flood" x="140" y="150" width="190" height="0" fill="#4a90d9" opacity=".8"/>
          <g id="smoke"></g><g id="rock"></g>
          <rect x="338" y="40" width="14" height="150" rx="7" fill="#fff" stroke="#7f8c99"/><circle cx="345" cy="196" r="11" fill="#c0392b"/><rect id="therm" x="341" y="120" width="8" height="70" fill="#c0392b"/>
          <text x="345" y="30" text-anchor="middle" font-size="12" class="lbl">°C</text>
          <text x="40" y="186" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">sea</text>
          <text x="12" y="92" font-size="13" class="lbl" id="iceL">ice cap</text>
          <text x="180" y="222" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" id="tt"></text>
        </svg>
        <div class="readout"><span class="chip" id="c2"></span><span class="chip" id="tp"></span><span class="chip" id="sl"></span></div>
        <div class="ctrl slider"><label for="fu">🏭 Fossil fuel burned</label><input type="range" id="fu" min="0" max="10" value="3"></div>
        <div class="ctrl slider"><label for="fo">🌲 Forests</label><input type="range" id="fo" min="0" max="10" value="6"></div>
        <div class="ctrl"><button id="ast">☄️ Go back 66 million years…</button><button id="rs">↺ Start again</button></div>
        <p class="muted" id="msg">Carbon dioxide traps heat. Burn more, or plant more, and watch.</p>`);
      el("fu").oninput = () => { fuel = +el("fu").value; };
      el("fo").oninput = () => { forest = +el("fo").value; };
      el("rs").onclick = () => { co2 = peak = 280; dust = hit = 0; say("Back to 280 parts per million — the air before people burned coal and oil."); };
      el("ast").onclick = () => {
        if (hit) return; hit = 1; dust = 1; api.found("asteroid");
        say("An asteroid hits the coast of Mexico. Dust blocks the sunlight, so plants cannot photosynthesise and animals lose their food. Less heat reaches the ground, so it gets much colder. Up to three-quarters of all species die out — including the dinosaurs. (No people: there were none yet.)");
      };
      (function loop() {
        if (!alive(r)) return;
        co2 = Math.max(200, co2 + (fuel * 0.9 - forest * 0.35 - (co2 - 280) * 0.004) * 0.05);
        peak = Math.max(peak, co2);
        if (peak > 450 && co2 < 350) api.found("cool");
        const temp = 14 + 3 * Math.log2(co2 / 280) - dust * 8;
        if (temp >= 16) api.found("warm");
        if (hit) { hit += 0.004; dust = Math.max(0, 1 - (hit - 1) * 0.35); }
        const rise = Math.max(-10, Math.min(40, (temp - 14) * 9));
        el("sea").setAttribute("y", (150 - rise).toFixed(1)); el("sea").setAttribute("height", (80 + rise).toFixed(1));
        el("flood").setAttribute("y", (150 - Math.max(0, rise)).toFixed(1)); el("flood").setAttribute("height", Math.max(0, rise).toFixed(1));
        const iceW = Math.max(0, Math.min(130, 80 - (temp - 14) * 30));
        el("ice").setAttribute("d", `M0 ${(150 - rise).toFixed(1)} L${iceW.toFixed(1)} ${(150 - rise).toFixed(1)} L${(iceW * 0.7).toFixed(1)} 110 L0 100 Z`);
        el("iceL").style.display = iceW > 20 ? "" : "none";
        el("trees").innerHTML = Array.from({ length: forest }, (_, i) => `<text x="${146 + i * 18}" y="${176 + (i % 2) * 16}" font-size="16"${dust > 0.3 ? ' opacity=".35"' : ""}>🌲</text>`).join("");
        el("smoke").innerHTML = Array.from({ length: fuel }, (_, i) => `<circle cx="${(282 + Math.sin(i * 1.7 + performance.now() / 700) * 8).toFixed(1)}" cy="${120 - i * 10}" r="${5 + i}" fill="#7f8c99" opacity=".35"/>`).join("");
        el("sky").setAttribute("fill", dust > 0.05 ? `rgb(${Math.round(207 - 140 * dust)},${Math.round(231 - 150 * dust)},${Math.round(251 - 170 * dust)})` : "#cfe7fb");
        el("sun").setAttribute("opacity", (1 - dust * 0.85).toFixed(2));
        el("rock").innerHTML = hit && hit < 1.2 ? `<text x="${(40 + (hit - 1) * 700).toFixed(1)}" y="${(20 + (hit - 1) * 600).toFixed(1)}" font-size="26">☄️</text>` : dust > 0.3 ? `<text x="200" y="196" font-size="28">🦕</text>` : "";
        const th = Math.max(4, Math.min(146, (temp - 4) * 7));
        el("therm").setAttribute("y", (190 - th).toFixed(1)); el("therm").setAttribute("height", th.toFixed(1));
        el("c2").textContent = `carbon dioxide ${Math.round(co2)} ppm`;
        el("tp").textContent = `mean temperature ${temp.toFixed(1)} °C`;
        el("sl").textContent = rise > 20 ? "sea level: flooding!" : rise > 5 ? "sea level rising" : rise < -3 ? "sea level falling" : "sea level steady";
        el("tt").textContent = rise > 20 ? "the houses are flooding" : dust > 0.3 ? "dark and cold — no photosynthesis" : "";
        requestAnimationFrame(loop);
      })();
    }

    draw();
  },
});

ARCADE.start();
</script>
</body>
</html>
