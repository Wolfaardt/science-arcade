<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Arcade</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1f2a37; --soft:#5b6675; --line:#e2ddd2;
  --brand:#2f6f9f; --brand-ink:#ffffff; --good:#2e8b57; --good-bg:#e6f4ec;
  --warn:#b4531f; --warn-bg:#fbeee6; --gold:#d99a00; --accent:#7b5ea7;
  --radius:18px; --fs:19px;
}
:root[data-theme="dark"]{
  --bg:#141a22; --card:#1e2733; --ink:#eef2f6; --soft:#a9b4c2; --line:#2e3a48;
  --brand:#5aa0d6; --brand-ink:#0d1520; --good:#5cc98c; --good-bg:#16301f;
  --warn:#f08a55; --warn-bg:#3a2216; --gold:#ffc53d; --accent:#b39ddb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.5 "Segoe UI","Trebuchet MS",Verdana,system-ui,sans-serif;letter-spacing:.01em}
body.calm *{animation:none!important;transition:none!important}
#app{max-width:880px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.6em} h2{font-size:1.3em} h3{font-size:1.1em}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:var(--radius)}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.big{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);padding:16px 18px;font-size:1.05em;min-height:64px}
.big:hover{border-color:var(--brand)}
.big .ico{font-size:1.6em;margin-right:10px;vertical-align:middle}
.big small{display:block;color:var(--soft);font-size:.8em;margin-top:2px}
.primary{background:var(--brand);color:var(--brand-ink);padding:14px 26px;font-weight:700;font-size:1.05em;min-height:56px}
.ghost{background:transparent;border:2px solid var(--line);padding:10px 18px;min-height:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);padding:14px 18px;margin:10px 0;min-height:60px}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.prompt{font-size:1.2em;font-weight:600;margin:6px 0 12px}
.feedback{border-radius:var(--radius);padding:14px 18px;margin:12px 0;font-weight:600}
.feedback.good{background:var(--good-bg);color:var(--good)}
.feedback.try{background:var(--warn-bg);color:var(--warn)}
.progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);border-radius:999px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.dots b{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots b.ok{background:var(--good)} .dots b.no{background:var(--warn)} .dots b.now{outline:3px solid var(--brand)}
.pet{display:flex;align-items:center;gap:18px}
.pet svg{flex:0 0 auto}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tile{min-width:52px;height:56px;font-size:1.3em;font-weight:700;background:var(--card);border:3px solid var(--line);text-transform:uppercase}
.tile.used{opacity:.25}
.slot{min-height:64px;border:3px dashed var(--line);border-radius:var(--radius);padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:1.25em;cursor:pointer}
.flash .side{color:var(--soft);font-size:.7em;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{background:var(--card);border:3px solid var(--line);padding:12px;text-align:left;min-height:58px}
.match button.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.match button.done{border-color:var(--good);background:var(--good-bg);opacity:.55}
.match button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.7em;font-weight:700}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shop button{background:var(--card);border:3px solid var(--line);padding:12px;text-align:center}
.shop button.on{border-color:var(--good)}
.shop .em{font-size:2em;display:block}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:120px;margin:6px;text-align:center;font-size:.8em;opacity:.35}
.badge.got{opacity:1} .badge .em{font-size:2.2em}
.speak{background:transparent;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85em;margin-left:6px}
.muted{color:var(--soft)}
.center{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
input[type=range]{width:200px;height:34px}
/* ── toys: the front door of every unit ── */
.toybtn{border-color:var(--accent)}
.toybtn:hover{border-color:var(--brand)}
.dchip{color:var(--gold);font-weight:700}
.toytip{background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:10px 14px;margin:10px 0;font-weight:600}
.toybox{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px;margin:10px 0}
.toybox svg{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;overflow:visible}
.toybox p{margin:.4em 0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ctrl[hidden]{display:none}
.ctrl button{background:var(--card);border:3px solid var(--line);padding:10px 16px;min-height:52px;font-weight:600}
.ctrl button:hover{border-color:var(--brand)}
.ctrl button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--card))}
.ctrl label{color:var(--soft);font-size:.9em}
.slider{gap:12px}
.readout{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.readout .chip{font-variant-numeric:tabular-nums}
/* Scenes: a toy drawing that stays inside its frame, is capped so its text is not huge on a laptop,
   and takes theme colours for text and panels. .duo puts two scenes side by side, stacked on a phone.
   Bench tabs sit on a rule; option pickers are smaller pills so they do not read as more tabs. */
.toybox svg.scene{overflow:hidden;max-width:560px;margin:6px auto}
.scene text:not([fill]){fill:var(--ink)}
.scene text.lbl{fill:var(--soft)}
.scene .bgc{fill:var(--card)}
.scene .edge{stroke:var(--line)}
.duo{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.toybox .duo>svg.scene{flex:1 1 260px;min-width:0;max-width:400px;margin:0}
.ctrl.tabs{padding-bottom:12px;border-bottom:2px solid var(--line)}
.ctrl.pick{gap:6px}
.ctrl.pick button{min-height:44px;padding:6px 14px;border-width:2px;border-radius:999px;font-size:.95em}
.ctrl.pick .lead{color:var(--soft);font-size:.9em;margin-right:4px;font-weight:600}
.slider input[type=range]{flex:1 1 140px;min-width:0;max-width:320px}
.jobline{font-size:1.05em;margin:8px 0 0}
@media (max-width:520px){.ctrl.tabs{gap:6px}.ctrl.tabs button{min-height:44px;padding:6px 12px;font-size:.95em}}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0}
.disc{border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.85em;opacity:.5}
.disc.got{opacity:1;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.disc b{display:block} .disc span{color:var(--soft)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;max-width:92vw;box-shadow:0 8px 24px #0004}
details>summary{cursor:pointer;padding:6px 2px;font-weight:600;list-style-position:outside}
.grab{cursor:grab} .grab:active{cursor:grabbing}
@media (max-width:560px){ :root{--fs:17px} .match{grid-template-columns:1fr} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const DATA = {"built": "2026-10-27", "endpoint": "https://script.google.com/macros/s/AKfycbxXh5zGVoe8eDiXgKRuAkYSVv-kVitSEwp2fkkD-pIjyIhj8MlnBMAn_5TtLNlElA5OlA/exec", "client_id": "", "grades": [{"grade": "g06", "label": "Grade 6", "strap": "Science · Stage 7", "units": [{"id": "g06-u01", "n": 1, "tag": "Unit 1", "title": "Cells", "terms": [["b45c228675", "Cell", "The smallest living unit. All living things are made of cells"], ["fc9c4a0fcf", "Single-celled", "Made of only one cell, like many microorganisms"], ["8c6fd266bb", "Cellulose", "The strong substance that plant cell walls are made of"], ["6226dc5046", "Chlorophyll", "The green substance in chloroplasts that absorbs energy from light"], ["2ea5ad5237", "Photosynthesis", "How plants make food, using energy from light"], ["7676af9bb8", "Cell sap", "The liquid in the sap vacuole: sugars and salts dissolved in water"], ["f67a627d91", "Magnify", "Make something look bigger than it really is"], ["affef2c638", "Stain", "A coloured liquid that makes parts of a cell easier to see"], ["2c731a19fe", "Model", "Something made to help us understand a real thing"], ["23963891c5", "Function", "The job that something does"], ["cd099a4ea1", "Specialised / adapted", "Having a structure that helps it do one job well"], ["05147b21b3", "Haemoglobin", "The red substance in red blood cells that carries oxygen"], ["cc759ac4d7", "Axon", "The long, thin part of a neurone that carries the signal"], ["9b19c6c857", "Cilia", "Tiny hairs on a ciliated cell that beat to move mucus"], ["cbb8dd638b", "Tissue", "A group of similar cells working together"], ["8ec1100995", "Organ", "A structure made of several different tissues"], ["f44166f6a7", "Organ system", "A group of organs working together"], ["d6ad33a6ed", "Organism", "A whole living thing"]], "checks": [["7f5172252d", "Name the seven parts of a plant cell", "Cell wall, cell membrane, cytoplasm, nucleus, mitochondria, sap vacuole, chloroplasts"], ["9428a7a380", "Give the job of the nucleus and of the mitochondria", "The nucleus controls the activities of the cell. Mitochondria release energy from food"], ["c3466b0f14", "Why do root hair cells have no chloroplasts?", "They are underground, where there is no light, so they cannot photosynthesise"], ["3acead2432", "Why does a red blood cell have no nucleus?", "It leaves more space for haemoglobin, so the cell can carry more oxygen"], ["8c238770a6", "Put in order, smallest first: organ, cell, organ system, tissue", "Cell, tissue, organ, organ system"], ["e38928deef", "Why do you look from the side when you lower the objective lens?", "So that the lens does not hit and break the slide"], ["d68959e13a", "Name the part of a plant cell where energy is released from food", "mitochondrion / mitochondria"], ["79534a9349", "A student looks at onion cells. Give one reason why she starts with the lowest-power objective lens", "it gives the widest view / it is easier to find the cells"], ["c52aa35802", "Write down one limitation of this model of a plant cell", "any one: not to scale / not living / no chemical reactions happen / the bag does not control what goes in and out like a real membrane"], ["2f9c8ba61b", "Name two cell parts that are found only in plant cells", "any two: cell wall chloroplast (sap) vacuole"], ["0442d7c48c", "Explain how the structure of a root hair cell helps it to do its function", "long, thin extension / large surface area so it absorbs water faster / more water / can reach between soil particles"], ["e6bfadca75", "The stomach is made of several different tissues. What is the stomach an example of?", "an organ"]], "facts": [["655c59f6e4", "All living things are made of cells. A cell is the smallest living unit. Some living things are one cell only; plants and animals are made of millions of cells"], ["ee489528ed", "Every cell has a cell membrane, cytoplasm and — almost always — a nucleus and mitochondria. These four parts keep any cell alive, so plant cells and animal cells both have them"], ["bde8153ff1", "Plant cells have three extra parts: a cell wall, a large sap vacuole and (if they get light) chloroplasts. Animal cells never have a cell wall or chloroplasts"], ["144fe198c3", "Each part has one main job. Learn the part and its job as a pair — the tests ask for them as a pair"], ["883cfc44fd", "A specialised cell has a special shape or special parts that help it do one job well. Change the feature and the cell does its job less well"]]}, {"id": "g06-u02", "n": 2, "tag": "Unit 2", "title": "Materials and their structure", "terms": [["d86a903c1b", "Atom", "The smallest particle of an element that can exist"], ["f18313c23c", "Element", "A pure substance made of only one type of atom that cannot be broken down chemically"], ["acc60cbed8", "Periodic Table", "The table that organises all 118 known elements in order of atomic number"], ["d36b20251f", "Compound", "A substance made of two or more different types of atoms chemically bonded in a fixed ratio"], ["77d8e3b2f3", "Mixture", "Two or more substances physically mingled together without chemical bonds"], ["ec9a5b604b", "Alloy", "A solid mixture containing a metal and one or more other elements (e.g. steel = iron + carbon)"], ["b528fe8574", "Particle model", "A scientific model explaining physical properties in terms of particle arrangement, separation, and motion"], ["ac0e0a75d7", "Vacuum", "A space with no particles in it at all"], ["7e3fb53655", "Meniscus", "The curved surface of a liquid in a measuring cylinder. Read the bottom of the curve"], ["040e626141", "Melting point", "The constant temperature at which a pure solid absorbs heat and turns into a liquid (0 °C for ice)"], ["2bf5a6bbe1", "Boiling point", "The constant temperature at which a liquid absorbs heat throughout and turns into a gas (100 °C for water)"], ["e409a63339", "Evaporation", "The process where liquid at its surface absorbs energy and turns into a gas below the boiling point"], ["af7abaf83e", "Condensation", "The process where a gas cools, loses energy, and turns back into a liquid (forming clouds)"], ["6cc121b53b", "Precipitation", "Water falling from clouds as rain, snow, sleet or hail"], ["45fb18bb96", "Surface run-off", "Precipitation flowing over the ground surface into streams, rivers, lakes, and oceans"], ["3f3ed2a468", "Groundwater", "Water that soaks into the soil and rocks and moves slowly underground"], ["a35edb7e8b", "Open water", "Water lying on the surface: oceans, seas, lakes and rivers"]], "checks": [["af97755a9f", "Describe the arrangement, separation, and motion of particles in a liquid", "In a liquid, particles are arranged randomly (no fixed pattern), are touching each other (close together), and can slide and move past one another"], ["ac0aacda5d", "Explain why liquids and solids cannot be compressed, but gases can be compressed easily", "In solids and liquids, particles are already touching one another with no empty spaces between them, so they cannot be pushed closer together. In a gas, particles are separated by large empty spaces, so pressure pushes particles closer together into that empty space"], ["541f335d9b", "Name the six parts of the water cycle, and say what makes the water evaporate", "Evaporation, condensation, precipitation, surface run-off, groundwater and open water. Energy from the Sun makes the water evaporate"], ["b2f20601ff", "State the chemical symbols for sodium, potassium, iron, and chlorine, and explain why sodium's symbol is not S", "Sodium = Na, potassium = K, iron = Fe, chlorine = Cl. Sodium's symbol is not S because S was already assigned to sulfur (each element needs a unique symbol), and Na comes from sodium's Latin name natrium"], ["463ac41108", "Explain why heating an iron and sulfur mixture produces a substance that cannot be separated by a magnet", "Heating causes a chemical reaction where iron and sulfur atoms bond tightly together to form a new compound, iron sulfide (FeS). Iron sulfide has completely new chemical properties and is non-magnetic; because the atoms are chemically bonded, they cannot be separated by physical means like a magnet"], ["398d2d115e", "Explain why steel is harder than pure iron using ideas about particles and layers", "In pure iron, identical iron atoms are arranged in regular rows that slide easily over one another when a force is applied, making it soft. In steel, smaller carbon atoms sit between the iron atoms, disrupting the regular rows so the layers cannot slide past each other, making steel harder and stronger"]], "facts": [["c6525101fa", "All matter is made of tiny particles (atoms or molecules). A vacuum is a space with no particles in it at all"], ["265bcafd1b", "The three physical states of matter differ only in particle behaviour: - Solids: particles are arranged in a regular pattern, touching each other, and vibrate about fixed positions. - Liquids: particles have a random arrangement, are still touching, and slide past one another. - Gases: particles have a random arrangement, are far apart, and move rapidly and freely in all directions"], ["9c3bddc079", "Changes of state are physical changes caused by transferring heat energy: - Heating (melting, boiling, evaporation) absorbs energy: particles gain energy, move faster, and break free from the forces holding them together. - Cooling (condensing, freezing) releases energy: particles lose energy, slow down, and the forces between them pull them together. - Mass is always conserved during a change of state; no particles are created or destroyed"], ["49969d7925", "An element is a pure substance made of only one type of atom. It cannot be broken down into simpler substances. There are 118 known elements organised in the Periodic Table. Every element has a unique one- or two-letter chemical symbol (first letter capital, second lowercase)"], ["1595b6332d", "A compound contains two or more different types of atoms chemically bonded tightly together in a fixed ratio, producing completely new properties. A mixture contains two or more substances physically mingled without chemical bonds; each substance retains its original properties and can be separated by physical methods (e.g. magnets, filtration, evaporation)"]]}, {"id": "g06-u03", "n": 3, "tag": "Unit 3", "title": "Forces and energy", "terms": [["fcb675f5ee", "Gravity", "A force of attraction between any two objects with mass"], ["06ccbd6e12", "Mass", "The quantity of matter in an object, measured in kilograms (kg)"], ["749fe9d8df", "Weight", "The force of gravity on an object, measured in newtons (N)"], ["be6d434598", "Newton (N)", "The unit of force, including weight"], ["9f9a3b177b", "Strength of gravity", "The pull of gravity on each 1 kg of mass. On Earth it is 10 N/kg"], ["07f08cee5f", "Contact force", "The force a surface pushes up with to support an object"], ["5c0d8809ef", "Nebula", "A cloud of dust and gas in space, where stars form"], ["4a32e7aaca", "Orbit", "The path of an object around another object, such as a planet around the Sun"], ["d78fa461ea", "Plane", "A flat surface. The planets all orbit the Sun in the same plane"], ["bd22abc48f", "Model", "A way of showing something that is hard to observe directly"], ["5788e0e204", "Evidence", "Facts from observations or experiments that support or contradict an idea"], ["589e3053f9", "Air resistance", "A force that slows down an object moving through air"], ["ced284e3dc", "Vacuum", "A space with no particles in it"], ["60031f8f2a", "Tide", "The rise and fall in the depth of the sea during the day"], ["a683a1be5b", "Tidal range", "The difference in depth between high tide and low tide"], ["674bf6d41d", "Tidal force", "The pull of gravity from the Moon and the Sun that causes tides"], ["b96febb144", "Energy", "What must be changed or transferred to make something happen"], ["162485f065", "Joule (J)", "The unit of energy"], ["1c282d7b5d", "Kinetic energy", "The energy of a moving object"], ["d79381073a", "Gravitational potential energy", "The energy stored in an object lifted up away from the ground"], ["689221a363", "Dissipate", "To spread out into the surroundings and become less useful"]], "checks": [["933b95b3ff", "Describe the difference between mass and weight. Give the unit of each", "Mass is the quantity of matter in an object, in kilograms (kg). Weight is the force of gravity on it, in newtons (N). Mass stays the same everywhere; weight changes when gravity changes"], ["54c122f931", "A bag of flour has a mass of 2 kg. Calculate its weight on Earth", "weight = mass × 10 N/kg = 2 kg × 10 N/kg = 20 N"], ["c33a8ccc56", "Explain why a heavier planet gives the same mass a bigger weight", "A planet with more mass has stronger gravity. Weight is the pull of gravity on a mass, so the same mass has a bigger weight there"], ["dcfaa01358", "Explain how the Earth formed", "A cloud of dust and gas was pulled together by gravity. As the clumps grew, their mass and their gravity increased, so they pulled in more matter. They became the Sun and the planets, including the Earth"], ["ecc52d75a9", "Explain why a feather and a stone land together in a vacuum", "A vacuum has no particles, so there is no air resistance. Nothing slows the feather, so gravity pulls both down together"], ["6c415bf708", "Explain what keeps the Earth in its orbit around the Sun", "The Sun's gravity. It always pulls the Earth towards the Sun, so the Earth's path keeps turning into an orbit. In space there is no air resistance, so gravity is the only force"], ["5f9d2bb577", "Describe what causes tides, and when the tidal range is biggest", "Tidal forces come from the gravitational attraction between the Earth, the Moon and the Sun. The tidal range is biggest when the Sun, Earth and Moon are in a straight line, because the two pulls add together"], ["8b41e2d030", "Describe the energy changes when a child climbs up a slide and comes down it", "Climbing up: chemical energy from food changes to kinetic energy, then to gravitational potential energy. Coming down: gravitational potential energy changes to kinetic energy. Some energy dissipates as thermal energy and sound"], ["28dd19af71", "Explain what \"dissipated\" means, using a lamp as your example", "A lamp changes electrical energy to light. Some of the energy becomes thermal energy instead. This heat spreads out into the room, where it is no use, and cannot be collected again. That is dissipated energy"], ["636e0298f9", "Look at the table. It shows the weight of a 2 kg rock in three places. | place | weight of 2 kg rock in N | |---|---| | Earth | 20 | | Mars | 7.4 | | Jupiter | 50 | (a) Write down the unit used to measure mass. (b) Which place has the strongest gravity? Explain your answer. (c) A cat has a weight of 40 N on Earth. Calculate the mass of the cat. The strength of gravity on Earth is 10 N/kg", "> (a) kilogram (kg) (b) Jupiter — the same mass has the biggest weight there, so its gravity pulls hardest. (c) mass = weight ÷ 10 = 40 ÷ 10 = 4 kg"], ["5b580750c8", "Mia makes a model of the Solar System. She hangs eight coloured beads from a string in order from the Sun. All the beads are the same size. (a) Write down one strength of Mia's model. (b) Write down two limitations of Mia's model. (c) Complete the sentence. The Sun and planets formed when ……… and ……… were pulled together by ………", "> (a) It shows the order of the planets from the Sun. (Accept: the number of planets.) (b) Any two: it does not show the different sizes of the planets / the orbits or movement / the distances between the planets / the spinning / what holds the planets in place. (c) dust and gas … gravity"], ["e4476b0faf", "Chen drops a table-tennis ball and a sheet of paper from the same height. The ball lands first. (a) Name the force that slows the paper down. (b) Chen repeats the test inside a tube with all the air removed. Describe and explain what happens. (c) Which force acts on the Earth as it orbits the Sun? Tick () one box. ☐ air resistance only ☐ gravity only ☐ gravity and air resistance", "> (a) air resistance (b) The ball and the paper land at the same time. There is no air in a vacuum, so there is no air resistance to slow the paper. (c) gravity only"], ["04abb0b5d6", "The table shows tides at a harbour on one day. | time | height of water in m | |---|---| | 03:10 | 4.1 | | 09:25 | 0.8 | | 15:35 | 4.3 | | 21:50 | 0.7 | (a) Write down the time of the highest tide. (b) A boat needs at least 2 m of water. Suggest why it cannot leave the harbour at 09:25. (c) Explain why the tidal range is biggest when the Sun, Earth and Moon are in a straight line", "> (a) 15:35 (b) It is low tide, and the water (0.8 m) is too shallow for the boat. (c) The gravity of the Sun and the Moon pull in the same line, so their tidal forces add together"], ["8125c2f36e", "Look at the list. chemical · elastic potential · gravitational potential · kinetic (a) Write down the energy stored in a battery. (b) Write down the energy stored in a skier at the top of a hill. (c) Write down the energy stored in a stretched trampoline", "> (a) chemical (b) gravitational potential (c) elastic potential"], ["8986bd77fa", "Aiko throws a ball straight up. It rises, stops for a moment, then falls back into her hand. (a) Complete the sentences. Choose from the list. chemical · gravitational potential · kinetic · sound As the ball rises, its ……… energy decreases and its ……… energy increases. (b) Write down the useful energy change in an electric fan", "> (a) kinetic … gravitational potential (b) electrical → kinetic"], ["b0cec73cb8", "Priya plays a guitar. The string vibrates, and the sound slowly gets quieter. (a) Write down the energy transferred from the vibrating string. (b) The energy dissipates. What does \"dissipates\" mean? (c) An electric drill changes electrical energy into kinetic, thermal and sound energy. Which of these are wasted?", "> (a) sound (b) The energy spreads out into the surroundings and becomes less useful. (c) thermal and sound"]], "facts": [["3ff41de85a", "Gravity is a force of attraction between any two objects with mass. The bigger the masses, the stronger the pull. The pull gets weaker as the objects get further apart. On Earth, gravity always acts towards the centre of the Earth"], ["ee3f5198b3", "Mass is the quantity of matter in an object, measured in kilograms (kg). It does not change when you move to another planet. Weight is the force of gravity on that mass, measured in newtons (N). It changes when gravity changes"], ["6efe84adc9", "Weight equals mass multiplied by the strength of gravity. On Earth, gravity pulls with 10 N on every 1 kg (10 N/kg)"], ["700b7b9f14", "A vacuum is a space with no particles in it. With no particles there is no air resistance, so nothing slows a moving object the way air does on Earth. Space is a vacuum: a space probe keeps moving without using its engine. Gravity still acts on it"], ["aabc38ebda", "Energy must be changed or transferred to make anything happen. Every time it changes, some energy dissipates: it spreads out into the surroundings, mostly as thermal energy and sound. Dissipated energy is less useful and cannot be gathered back"]]}]}, {"grade": "g07", "label": "Grade 7", "strap": "Science · Stage 8", "units": [{"id": "g07-u01", "n": 1, "tag": "Unit 1", "title": "Respiration", "terms": [["4dfcd4acf2", "Respiration", "A chemical reaction in every living cell that releases energy from glucose"], ["945e9c4a8f", "Aerobic respiration", "Respiration that uses oxygen"], ["4c3c73d96a", "Mitochondria", "The parts of a cell where aerobic respiration happens"], ["f22af154d8", "Respiratory system", "The organ system that takes in oxygen and gets rid of carbon dioxide"], ["2de5c1c77f", "Larynx (voicebox)", "The top of the trachea; contains the vocal cords"], ["0390b42588", "Trachea (windpipe)", "The tube that carries air from the throat to the chest"], ["b957951b18", "Bronchus (plural bronchi)", "One of the two tubes that carry air into the lungs"], ["f4746c000b", "Bronchiole", "A small tube inside the lung"], ["a04ef8de11", "Air sac (alveolus)", "A tiny sac where gas exchange happens"], ["1929018c95", "Cartilage", "Tough, bendy tissue that holds the trachea and bronchi open"], ["a2846ba8ae", "Gas exchange", "Oxygen moving into the blood, and carbon dioxide moving out"], ["41c79ab053", "Diffusion", "Particles spreading from where there are many to where there are fewer"], ["49434c3145", "Capillary", "A tiny blood vessel with a very thin wall"], ["ddbbdb2446", "Diaphragm", "A dome-shaped sheet of muscle under the lungs"], ["7af69d8a7c", "Intercostal muscles", "Muscles between the ribs"], ["588f33ae3d", "Analogy", "A comparison with something simpler, used as a model"], ["792dba8ad7", "Limewater", "A liquid that turns cloudy when carbon dioxide passes through it"], ["ced769bfaa", "Plasma", "The liquid part of blood"], ["fbe113e8c9", "Haemoglobin", "The red substance in red blood cells that carries oxygen"], ["e48bf301b7", "Oxyhaemoglobin", "Haemoglobin joined to oxygen"], ["b743d5ffa9", "Pathogen", "A microorganism that causes disease"], ["75afd826ce", "Phagocytosis", "A white blood cell engulfing and digesting a pathogen"], ["13783bdf2f", "Antibody", "A chemical made by white blood cells that sticks to a pathogen"], ["02f5dc23c4", "Hazard", "Something that could cause harm"], ["7854117c0d", "Risk assessment", "Identifying the hazards, and how to reduce the risk from each"]], "checks": [["7cdf921725", "Name, in order, the tubes air passes through from the trachea to the air sacs", "Bronchi, then bronchioles"], ["bc9329afa1", "Why does the trachea have rings of cartilage?", "To hold it open, so it does not collapse when you breathe in"], ["85adac0249", "Give two features of the air sacs that make gas exchange fast", "Any two: thin walls; large surface area; rich blood supply; moist"], ["5a54f6c03e", "What happens to the volume and the pressure in your chest when you breathe in?", "The volume increases, so the pressure decreases"], ["6e01bfda76", "Write the word equation for aerobic respiration", "glucose + oxygen → carbon dioxide + water"], ["615c9ca83c", "Why do dead peas make no heat?", "Dead peas do not respire, so they release no energy as heat"], ["f7b6e9005e", "Why does a red blood cell have no mitochondria?", "So that it does not use up the oxygen it is carrying"], ["689a2b85ea", "Name two things carried in plasma", "Any two: glucose (nutrients); carbon dioxide; blood cells; hormones"], ["4b6f74691d", "Put these structures in the order that air passes through them as you breathe in: bronchiole, trachea, air sac, bronchus", "trachea → bronchus → bronchiole → air sac (one pair out of order loses one mark)"], ["4da24116e1", "Zara cuts open a sheep's lung with scissors. Write down one hazard, and one way she can reduce the risk from it", "hazard: the raw lung may carry harmful microorganisms — wear gloves / wash hands with soap afterwards (or: sharp scissors — cut downwards, away from the body)"], ["12df60c7f0", "Oxygen moves from the air in an air sac into the blood. Explain why it moves in this direction", "there is more oxygen in the air sac than in the blood, so it diffuses from where there is more to where there is less"], ["14efc068b6", "Air sacs are adapted to make gas exchange fast. Describe one adaptation of the air sacs and explain how it helps", "thin walls so the diffusion distance is short / diffusion is faster (or: large surface area more diffusion at once · rich blood supply keeps the difference in concentration high · moist walls gases dissolve )"], ["ed9c1b6e79", "Explain why the air you breathe out contains more carbon dioxide than the air you breathe in", "your cells make carbon dioxide in respiration it diffuses from the blood into the air sacs and is breathed out"], ["812de4136e", "Describe what happens to the diaphragm when you breathe in", "(the muscles in) the diaphragm contract the diaphragm flattens / moves down"], ["1465f655c1", "Complete the word equation for aerobic respiration. glucose + .................... → .................... + water", "oxygen · carbon dioxide"], ["6a7b5255ca", "Heart muscle cells have more mitochondria than skin cells. Suggest why", "heart muscle contracts all the time, so it needs more energy (from respiration)"], ["418f3eb7e9", "Maria says, \"Breathing and respiration are the same thing.\" Explain why Maria is wrong", "any two: breathing moves air into and out of the lungs, but respiration is a chemical reaction breathing happens in the lungs, but respiration happens in every cell respiration releases energy from glucose; breathing does not"], ["df63295926", "Explain how having no nucleus helps a red blood cell to do its job", "more space for haemoglobin so it can carry more oxygen"]], "facts": [["2ad7c42e1f", "Respiration happens in every living cell, all the time. In the mitochondria, glucose and oxygen react to make carbon dioxide and water. This releases energy that the cell uses"], ["3b40fe9f5d", "Diffusion is the spreading of particles from where there are many of them to where there are fewer. Gases and dissolved substances diffuse. Diffusion is faster when the distance is short and the surface area is large"], ["1e299808a7", "When the volume of a gas gets bigger, its pressure goes down. When the volume gets smaller, its pressure goes up. Air always moves from higher pressure to lower pressure"], ["da40b37f86", "A muscle can only pull, by contracting (getting shorter). When it relaxes, it stops pulling. The lungs have no muscles of their own, so other muscles must move them"], ["61caa6cf95", "Blood is the delivery service. Plasma carries dissolved substances and the blood cells. Red blood cells carry oxygen. White blood cells protect against pathogens"]]}, {"id": "g07-u02", "n": 2, "tag": "Unit 2", "title": "Properties of materials", "terms": [["c47f714890", "Solute", "The substance that dissolves"], ["75c3b0c1de", "Solvent", "The liquid that the solute dissolves in"], ["9a196fd0fc", "Solution", "The mixture made when a solute dissolves in a solvent"], ["a029799f72", "Soluble", "Able to dissolve in a solvent"], ["4efee0810e", "Insoluble", "Not able to dissolve in a solvent"], ["b469d212de", "Transparent", "You can see through it; all solutions are transparent"], ["1bf63dec49", "Opaque", "You cannot see through it"], ["3d9ab342f9", "Pure substance", "A substance that contains only one substance"], ["cfc2229e29", "Conserved", "Not lost; the total mass stays the same"], ["0fa39d0252", "Meniscus", "The curved surface of a liquid in a measuring cylinder"], ["ad20d39b12", "Concentration", "How many solute particles there are in a given volume"], ["bb0f7f9320", "Concentrated", "Having many solute particles in a given volume"], ["37b5f740bf", "Dilute", "Having few solute particles in a given volume"], ["a4e32a4240", "Analogy", "A comparison with something familiar that works in a similar way; a kind of model"], ["fe019cc210", "Solubility", "The mass of a solute that dissolves in 100 g of solvent at a stated temperature"], ["f69b702915", "Saturated solution", "A solution in which no more solute can dissolve at that temperature"], ["7703c0566a", "Hypothesis", "An idea that can be tested with evidence"], ["e0c324c166", "Independent variable", "The variable you change"], ["8390a43903", "Dependent variable", "The variable you measure"], ["73e3ab8d2f", "Control variable", "A variable you keep the same, for a fair test"], ["bd3d5929a6", "Range", "The lowest and highest values of the independent variable"], ["fa003b4a9b", "Interval", "The gap between one value of the independent variable and the next"], ["c589a92aea", "Anomaly", "A result that does not fit the pattern"], ["0706b71bb9", "Reliable", "Giving similar results when the experiment is repeated"], ["9050338d13", "Risk assessment", "Identifying the hazards, and how to reduce the risk from each"], ["806b65ef1f", "Paper chromatography", "A way to separate the dissolved substances in a mixture on paper"], ["d96c95c7eb", "Chromatogram", "The pattern of spots that chromatography produces"], ["c4ace6e366", "Solvent front", "The highest point the solvent reaches on the paper"], ["0fc8029aa8", "Rf value", "Distance moved by a spot ÷ distance moved by the solvent front"]], "checks": [["c0ff84c60a", "In \"sugar dissolves in water\", name the solute, the solvent and the solution", "Solute: sugar. Solvent: water. Solution: the sugar solution (sugar water)"], ["535c6c4504", "Why is a solution always transparent?", "The solute particles are spread out among the solvent particles and are too small to block the light"], ["41b00850ea", "15 g of salt dissolves in 100 g of water. What is the mass of the solution?", "115 g"], ["5c862cbe49", "Give two ways to make a solution more concentrated", "Dissolve more solute in it; evaporate (remove) some of the solvent"], ["717f586619", "Calculate the concentration of 4.0 g of salt in 50 cm³ of solution, in g / 100 cm³", "4.0 ÷ 50 × 100 = 8.0 g / 100 cm³"], ["48ffa57dfb", "What is a saturated solution?", "A solution in which no more solute will dissolve, at that temperature"], ["baa423ae8b", "Name the independent, dependent and one control variable in the solubility investigation", "Independent: temperature of the water. Dependent: mass of salt that dissolves. Control: volume of water (or type of salt, size of portion, stirring)"], ["20d69c1910", "Why is the start line on a chromatogram drawn in pencil?", "Pencil does not dissolve in the solvent, so it does not move up the paper and spoil the result"], ["57460d67ec", "A dye spot is 30 mm from the start line and the solvent front is 50 mm from it. Calculate Rf", "30 ÷ 50 = 0.6"], ["e36e724d95", "Priya dissolves 12 g of sugar in 80 g of water. What is the mass of the sugar solution? Explain your answer", "92 g the mass of the solute and the solvent add together / no mass is lost because the sugar particles are still there"], ["dca8c29b30", "Tom says, \"When I put sugar in my tea, the sugar melts.\" Explain why Tom is wrong", "the sugar dissolves dissolving needs two substances (a solute and a solvent) / the sugar is not heated to its melting point"], ["ee240c14a3", "Kofi has a beaker of copper sulfate solution. Give two ways he could make the solution more concentrated", "dissolve more copper sulfate in it evaporate / remove some of the water"], ["76b746a82a", "A teacher says a crowded bus is like a concentrated solution. She calls this an analogy. Explain what is meant by an analogy", "comparing something (hard to see) with something familiar that behaves in a similar way / a model that uses similar features to explain an idea"], ["962ae696db", "Three solutions have these concentrations: P 8.0 g / 100 cm³, Q 15.0 g / 100 cm³, R 3.5 g / 100 cm³. Which solution has the most solute particles in 100 cm³? Explain your answer", "Q it has the highest concentration"], ["a4b066f004", "7 g of potassium chlorate dissolves in 100 g of water at 20 °C. What mass dissolves in 300 g of water at 20 °C?", "300 g is three times 100 g, so 7 × 3 = 21 g"], ["eaa8a24394", "Use the table. Describe how the solubility of sodium nitrate changes as the temperature increases", "as the temperature increases, the solubility increases (allow \"the hotter the water, the more dissolves\")"], ["f14211ccd3", "Leo says, \"My results are not reliable.\" Give two reasons why Leo is correct", "the result at 50 °C does not fit the pattern / is an anomaly he has only one set of results / he did not repeat the experiment"], ["12ae7596f4", "Ana sets up a chromatography experiment. The solvent in the beaker is above her ink spot. Explain why she will not get a useful result", "the ink / spot dissolves into the solvent in the beaker so it does not move up the paper / does not separate / the solvent becomes coloured"], ["7e8b554b38", "An orange food colour gives two spots on a chromatogram. One is level with pure red dye. The other is level with pure yellow dye. (a) Is the orange food colour a pure substance? Explain your answer. (b) Name the dyes it contains", "(a) no — it gives more than one spot / it is a mixture (b) red and yellow"], ["4f8fbcc0d8", "On a chromatogram, a blue spot is 18 mm from the start line. The solvent front is 45 mm from the start line. Calculate the Rf value of the blue dye", "18 ÷ 45 = 0.4"]], "facts": [["679d0def3e", "When a solute dissolves, its particles separate and spread out among the solvent particles. The particles are still there, but they are too small and too spread out to see"], ["6dc38bdfc6", "Dissolving does not create or destroy particles, so mass is conserved. The mass of the solution equals the mass of the solute plus the mass of the solvent"], ["e1819611fa", "Concentration is how crowded the solute particles are — the number of solute particles in a given volume. Only two things raise it: more solute particles, or fewer solvent particles"], ["a992f6bcaa", "A solvent can only hold so much of a solute. That limit is the solubility. It depends on the solute, the solvent and the temperature. A solution at the limit is saturated"], ["b4c4c066d9", "Different substances dissolve to different amounts in the same solvent. This explains why salts have different solubilities, why nail polish needs its own solvent, and why chromatography separates dyes"]]}]}, {"grade": "g08", "label": "Grade 8", "strap": "Science · Stage 9", "units": [{"id": "g08-u01", "n": 1, "tag": "Unit 1", "title": "Photosynthesis and the carbon cycle", "terms": [["d75d6ebd73", "Photosynthesis", "Plants making glucose from carbon dioxide and water, using energy from light"], ["0c8c2bf398", "Chlorophyll", "The green chemical in chloroplasts that captures energy from light"], ["4d43799ed3", "Chloroplast", "The part of a plant cell where photosynthesis happens"], ["92e4b13464", "Light intensity", "The amount of light"], ["f4ada72d10", "Starch", "The carbohydrate a plant stores its extra food as"], ["2607f0d316", "Palisade layer", "The layer of tall leaf cells that do most of the photosynthesis"], ["ac4eea56c5", "Stoma (plural stomata)", "A tiny hole in a leaf that lets gases diffuse in and out"], ["8d04937919", "Mineral", "A substance plants take from the soil in small amounts, such as magnesium or nitrate"], ["49379849c5", "Fertiliser", "Something farmers add to soil to give plants the minerals they need"], ["591bb1d0ff", "Yield", "The quantity of crop a farmer harvests"], ["3ab9e37aa6", "Hypothesis", "A testable idea, with a scientific reason"], ["59ea700dad", "Risk assessment", "Identifying the hazards, and how to reduce the risk from each"], ["b4b8628fb9", "Carbon cycle", "How carbon atoms move between the air, living things and fossil fuels"], ["480fab8d0f", "Decomposition", "Microorganisms breaking down dead organisms and waste, releasing carbon dioxide"], ["69ec6626dc", "Combustion", "Burning; the carbon in a fuel combines with oxygen to make carbon dioxide"], ["63f6720d5f", "Fossil fuel", "Coal, oil or natural gas, formed from dead organisms over millions of years"], ["58a2174fbd", "Non-renewable", "Cannot be replaced once used up"], ["ad59ef906f", "Hydrogencarbonate indicator", "A liquid that changes colour with the amount of carbon dioxide"], ["5f62063d7d", "Greenhouse gas", "A gas that traps heat close to the Earth, such as carbon dioxide or methane"], ["4da8f2a9da", "Climate", "The long-term pattern of temperatures, wind and rainfall"], ["fd84584bb7", "Asteroid", "A rocky object orbiting the Sun, smaller than a planet"], ["c00e0dd5ac", "Meteoroid", "An object in space smaller than an asteroid"], ["48a0fc0e78", "Meteorite", "Part of a meteoroid that reaches the Earth's surface"], ["889bc6b4ce", "Mass extinction", "A very large number of species becoming extinct at about the same time"], ["43df5b0c1e", "Slush", "Melting ice"], ["03e6d09e57", "Secondary source", "Information collected by someone else, such as a website or book"]], "checks": [["8dff4c81ca", "Write the word equation for photosynthesis", "carbon dioxide + water → glucose + oxygen"], ["f16e888039", "Name the part of a palisade cell where photosynthesis happens", "The chloroplasts"], ["ca759398ff", "Why do you boil a leaf before testing it for starch?", "To break the cell membranes, so the iodine can get into the cells"], ["2dcb97651c", "Why must you turn off the burner before using ethanol?", "Ethanol is very flammable — it catches fire easily"], ["5c10b1569a", "What is the job of the stomata?", "To let carbon dioxide diffuse into the leaf, and oxygen diffuse out"], ["6001b723b4", "Why does a plant need nitrate?", "To make proteins, which it needs to make new cells and grow"], ["b7f9c1ac7e", "Name the three processes that release carbon dioxide into the air", "Respiration, decomposition, combustion"], ["89391b2e34", "A water plant is kept in the dark in hydrogencarbonate indicator. What colour does the indicator turn, and why?", "Yellow. In the dark the plant only respires, so carbon dioxide increases"], ["921991313c", "Give two reasons why sea level is rising", "Sea water expands as it warms; ice on land melts and adds water to the sea"], ["8c246e68b6", "Give three consequences of the asteroid collision 66 million years ago", "Any three: crater; shock waves; tsunami; dust blocked sunlight; plants could not photosynthesise; the Earth became colder; mass extinction; the dinosaurs died out"], ["82531c4959", "Tom covers one leaf of a plant with foil. Explain why that leaf makes no glucose", "The foil stops light reaching the leaf, and photosynthesis needs light"], ["3374db06af", "A lizard eats grasshoppers. Grasshoppers eat grass. Explain how the lizard depends on photosynthesis for its energy", "Grass uses energy from light to make glucose / carbohydrates in photosynthesis . The energy passes to the grasshopper when it eats the grass, and then to the lizard when it eats the grasshopper"], ["ab4cff42e9", "Describe the relationship between the distance of the lamp from the plant and the volume of gas collected", "As the distance from the lamp increases, the volume of gas collected decreases . (Also accepted: \"negative correlation\". Not \"inversely proportional\".)"], ["8be92d59bb", "A student tests a green-and-white leaf for starch. Explain why only the green parts turn blue-black", "Only the green parts have chlorophyll , so only they can photosynthesise and make starch"], ["3731811b92", "A farmer's crop has yellow leaves. The soil has plenty of nitrate. Suggest which mineral the soil is short of, and why the leaves are yellow", "Magnesium . Magnesium is needed to make chlorophyll, the green chemical, so without it the leaves lose their green colour"], ["7e29cd3d6f", "Mike grows five identical plants in five liquids, A to E, with different nutrients. The plant in liquid E grows least and has the fewest leaves. Mike concludes that E is pure water, which has no nutrients. Do the results support his conclusion? Explain", "Yes — E gives the least growth / fewest leaves, which is what you expect with no minerals"], ["45b981d75d", "Leaves fall onto a forest floor and slowly disappear. Name the process in the carbon cycle that returns their carbon to the air", "Decomposition (also accepted: decay, rotting). The name of the process, not the organisms — not \"decomposers\""], ["1cb438a1ec", "Explain how an asteroid collision can cause a mass extinction", "Dust is thrown into the air and blocks sunlight . Plants cannot photosynthesise, so animals have no food / food chains break down . Less heat reaches the Earth, so it becomes much colder (climate change)"], ["6eb79a8278", "A graph predicts that sea level will rise over the next 300 years. Suggest one impact of this rise", "Flooding / loss of land (also accepted: loss of habitats; people living on the coast or on islands must move). Not \"sea level rises\" — that is the trend itself"], ["1979423af1", "Puffins eat fish that live in cold sea water. When the water warms up, the fish move away. Predict what happens to the puffin population, and explain your answer", "It decreases , because the puffins have less food / starve . (Also accepted: stays the same, because the puffins migrate or find a new food source.)"]], "facts": [["4b9e31cc14", "Photosynthesis makes glucose from carbon dioxide and water, using energy from light. carbon dioxide + water → glucose + oxygen. The light energy is captured by the green chemical chlorophyll, which is inside the chloroplasts of plant cells. No light, no photosynthesis"], ["7749cb95c9", "Respiration happens in every living cell, all the time — plants too. glucose + oxygen → carbon dioxide + water. It is photosynthesis running the other way. In the light, a plant photosynthesises faster than it respires, so overall it takes in carbon dioxide. In the dark it only respires, so it gives carbon dioxide out"], ["c31c792c0f", "Almost all the energy in food started as light captured by plants. Animals get energy by eating plants, or by eating animals that ate plants. Cut off the light and the whole food chain fails"], ["b6e7051db8", "Carbon atoms are never used up. They move. Carbon moves between the air (as carbon dioxide), living things (as carbohydrates, fats and proteins) and fossil fuels. Photosynthesis is the only process that takes carbon dioxide out of the air"], ["91a788fb15", "Carbon dioxide traps heat. It is a greenhouse gas. More carbon dioxide in the air means more heat is kept close to the Earth, so the Earth's mean temperature rises and the climate changes"]]}, {"id": "g08-u02", "n": 2, "tag": "Unit 2", "title": "Properties of materials", "terms": [["1d8240fc83", "Atomic number", "The number of protons in an atom"], ["e4793d70a6", "Mass number", "The number of protons plus neutrons in an atom"], ["a7dd1f1739", "Electron shell", "One of the layers around the nucleus where electrons are found"], ["02bcc8cbaa", "Electronic structure", "How the electrons are arranged in shells, such as 2.8.1"], ["bc3d93aed8", "Electrostatic forces", "The attraction between positive and negative charges"], ["be21bbd776", "Group", "A column of the Periodic Table; same number of outer electrons"], ["84e713eb48", "Period", "A row of the Periodic Table; same number of shells with electrons in them"], ["9352c416dc", "Alkali metals", "The Group 1 elements"], ["56432b5d17", "Halogens", "The Group 7 elements"], ["b39c2ff98d", "Noble gases", "The Group 8 elements; inert gases with full outer shells"], ["d2fceba0f2", "Inert", "Does not react"], ["5c79a0e869", "Stable", "Unlikely to change — an atom with a full outer shell is stable"], ["1b931004fc", "Ion", "An atom that has gained or lost electrons, so it has a charge"], ["58434ee3ef", "Ionic bond", "The attraction between a positive ion and a negative ion"], ["7710b03ae5", "Ionic compound", "A compound made of ions; formed from a metal and a non-metal"], ["fcf7011b93", "Covalent bond", "A shared pair of electrons between two atoms"], ["7250c0a47c", "Molecule", "Two or more atoms joined together by covalent bonds"], ["648b50bba2", "Dot and cross diagram", "A diagram showing the electrons of one atom as dots and of the other as crosses"], ["b4f9b239d4", "Lattice", "A regular pattern of particles repeating in every direction"], ["73022ec726", "Intermolecular forces", "The weak forces between separate molecules"], ["2b9def2f04", "Macromolecule", "A giant structure of atoms joined by covalent bonds, such as diamond"]], "checks": [["8098640c27", "Give the charge of a proton, a neutron and an electron", "Proton +1 (positive), neutron 0 (no charge), electron −1 (negative)"], ["c66e72ea33", "Carbon has an atomic number of 6 and a mass number of 12. How many neutrons does a carbon atom have?", "12 − 6 = 6 neutrons"], ["0cad54751d", "Write down the electronic structure of sulfur (atomic number 16)", "2.8.6"], ["dd6da3a19f", "An element has the electronic structure 2.8.8.2. Which group and period is it in?", "Group 2 (two outer electrons), Period 4 (four shells). It is calcium"], ["794e7227d4", "Give one difference between Thomson's plum pudding model and the model used today", "Any one: today's model has a nucleus; today's model has protons (and neutrons); today's model has electrons in shells"], ["c51133c814", "Why are the noble gases unreactive?", "Their outer shells are already full"], ["5d097b3354", "Why does reactivity increase down Group 1?", "Going down, the outer electron is further from the nucleus, so it is held less strongly and is lost more easily"], ["258b477ccd", "Describe how a magnesium atom becomes a magnesium ion", "It loses its two outer electrons, giving Mg2+ with the structure 2.8"], ["eb3b2c46aa", "What is an ionic bond?", "The attraction between a positive ion and a negative ion"], ["02d4d2eadd", "What is a covalent bond?", "A shared pair of electrons between two atoms"], ["cee2a02926", "Write the formula of a compound with 1 atom of sodium, 1 atom of nitrogen and 3 atoms of oxygen", "NaNO3"], ["c59dfd643f", "A substance melts at 1083 °C. What type of structure does it have?", "A giant structure — its melting point is very high"], ["6898738923", "Why does solid sodium chloride not conduct electricity, although its solution does?", "In the solid the ions are fixed in place and cannot move. In the solution the ions are free to move and carry the current"], ["ca96613690", "Why is diamond hard but graphite soft?", "In diamond each carbon atom has four strong bonds in every direction. In graphite the carbon atoms are in layers with weak forces between them, so the layers slide"], ["8f6a87c8a6", "Magnesium has an atomic number of 12 and a mass number of 24. Write down the number of protons, electrons and neutrons in a magnesium atom", "Protons = 12 . Electrons = 12 . Neutrons = 24 − 12 = 12"], ["8d8fbab4e5", "The electronic structure of an element is 2.8.3. Write down its group and its period in the Periodic Table", "Group 3 — it has 3 electrons in its outer shell . Period 3 — it has three shells with electrons in them . (The element is aluminium.)"], ["c990c0f8a6", "Write down one idea Bohr added to Rutherford's model of the atom", "The electrons are in shells / at fixed distances from the nucleus"], ["51e7665007", "Describe two differences between the reaction of lithium with water and the reaction of potassium with water", "Any two, each for 1 mark: potassium reacts faster / more violently ; potassium catches fire (with a lilac flame) but lithium does not ; potassium melts but lithium does not ; potassium moves more quickly on the water"], ["46ef5adbaf", "Krypton is the next element below argon in Group 8. Use the table to predict the boiling point of krypton", "Any value higher than −186 °C, for example about −150 °C (the boiling point goes up going down the group). The real value is −153 °C"], ["6335b8bea7", "A potassium atom has 19 protons and 19 electrons. Explain why a potassium ion has a charge of +1", "The atom loses one electron (its outer electron) . The ion has 19 protons (positive) but only 18 electrons (negative), so there is one more positive charge than negative"], ["18cb8f49b4", "Calcium forms Ca2+ ions and chlorine forms Cl- ions. Write the formula of calcium chloride", "CaCl₂ — two Cl- ions are needed to cancel the 2+ charge of one calcium ion"], ["4b28c342bd", "Explain why graphite is used in pencils", "Graphite is made of layers of carbon atoms . The forces between the layers are weak, so the layers slide off onto the paper"], ["00e71da242", "Ammonia melts at −77 °C. Is ammonia made of simple molecules or does it have a giant structure? Give a reason for your answer", "Simple molecules . Its melting point is very low, so only weak forces between the molecules have to be overcome"]], "facts": [["b5882f068a", "An atom has a tiny nucleus of protons and neutrons, with electrons in shells around it. Protons are positive, electrons are negative, neutrons have no charge. An atom has the same number of protons and electrons, so it has no overall charge. The atomic number is the number of protons"], ["d6494f9b2b", "Electrons fill the shells from the inside out: 2, then 8, then 8. The first shell holds 2, the second and third hold 8. The electrons in the outermost shell are the ones that meet other atoms, so atoms with the same number of outer electrons behave in the same way"], ["1df4d9f40e", "An atom with a full outer shell is stable. The noble gases already have a full outer shell, so they do not react. Every other atom reacts in a way that gives it a full outer shell: it loses, gains or shares electrons"], ["0f05b594c9", "Electrons are held in the atom by electrostatic attraction to the positive protons in the nucleus. The further an outer shell is from the nucleus, the weaker that pull"], ["d2fe246dae", "A substance melts when its particles are pulled apart. If strong bonds have to break, a lot of energy is needed and the melting point is high. If only weak forces between molecules have to be overcome, little energy is needed and the melting point is low"]]}]}, {"grade": "g9-igcse1", "label": "Grade 9 · Chemistry", "strap": "IGCSE Chemistry 0620 · Year 1", "units": [{"id": "g9-igcse1-u01", "n": 1, "tag": "Unit 1", "title": "States of Matter", "terms": [["ac3db1fa0d", "Kinetic energy", "The energy a particle has because it is moving"], ["5dbb356c68", "Kinetic particle theory", "The model that explains the properties of matter by the movement and arrangement of its particles"], ["6ac08fcbeb", "Forces of attraction", "The attractions between particles that hold a solid and a liquid together"], ["d8e73d222f", "Melting point", "The temperature at which a solid changes into a liquid"], ["8a4c0f04a0", "Boiling point", "The temperature at which a liquid changes into a gas throughout the liquid"], ["f149ceb4c0", "Melting", "Change from solid to liquid"], ["14ee9e6d25", "Freezing", "Change from liquid to solid"], ["55a3de2b53", "Boiling", "Change from liquid to gas, throughout the liquid, at the boiling point"], ["8f997a2d2d", "Evaporating", "Change from liquid to gas, at the surface only, below the boiling point"], ["b0b85828fa", "Condensing", "Change from gas to liquid"], ["28c7b370e0", "Compressible", "Able to be squeezed into a smaller volume"], ["171786c596", "Density", "Mass per unit volume"], ["438313de0a", "Diffusion", "The net movement of particles from a higher to a lower concentration, caused by their random motion"], ["80875e76e8", "Concentration gradient", "A difference in concentration between two regions"], ["9f7490cb95", "Relative molecular mass (Mᵣ)", "The sum of the relative atomic masses of all the atoms in a molecule"]], "checks": [], "facts": [["cfad00f22f", "All matter is made of particles that are always moving. In a solid they vibrate about fixed positions. In a liquid and a gas they move from place to place"], ["f65f8bc751", "The particles themselves never change during a change of state. A water molecule is the same molecule in ice, in water and in steam. What changes is how far apart the particles are, how they are arranged, and how fast they move"], ["4f261c6d66", "Temperature is a measure of the average kinetic energy of the particles. A higher temperature means the particles are moving faster on average"], ["14094fbf6e", "Particles attract one another. These forces of attraction are strongest when particles are close together, and must be overcome to pull particles apart"]]}, {"id": "g9-igcse1-u02", "n": 2, "tag": "Unit 2", "title": "Atoms, Elements and Compounds", "terms": [["02322c41f1", "Element", "A substance containing only one type of atom"], ["178fa05540", "Compound", "Two or more types of atom chemically bonded in a fixed ratio"], ["d820802540", "Mixture", "Two or more substances not chemically bonded"], ["7c65fb0cac", "Nucleus", "The central part of an atom, containing the protons and neutrons"], ["d971ccbab5", "Proton number (atomic number)", "The number of protons in the nucleus; it defines the element"], ["63938fef88", "Nucleon number (mass number)", "The total number of protons and neutrons in the nucleus"], ["93023c3f2d", "Shell", "A region around the nucleus in which electrons are found"], ["434f52d562", "Electronic configuration", "The arrangement of electrons in shells, e.g. 2,8,1"], ["3edd2e3e2d", "Isotopes", "Atoms of the same element with the same proton number but different numbers of neutrons"], ["040511bc54", "Relative atomic mass (Aᵣ)", "The average mass of an element's isotopes on the carbon-12 scale"], ["9b0072e90d", "Ion", "An atom or group of atoms carrying an electrical charge"], ["3006174171", "Cation", "A positive ion, formed when an atom loses electrons"], ["020263e7cd", "Anion", "A negative ion, formed when an atom gains electrons"], ["4d74b2c46d", "Ionic bond", "The strong electrostatic attraction between oppositely charged ions"], ["43e671634b", "Giant ionic lattice", "A regular 3-D arrangement of alternating positive and negative ions"], ["2c9d1fb784", "Covalent bond", "A shared pair of electrons between two atoms"], ["8b52bb5a7b", "Molecule", "A group of atoms held together by covalent bonds"], ["7509176f49", "Intermolecular forces", "The weak forces of attraction between separate molecules"], ["d02ab1ec5a", "Giant covalent structure", "A continuous network of atoms joined by covalent bonds"], ["b0024c721b", "Delocalised electron", "An electron not attached to one atom, free to move through the structure"], ["eedcf5ce01", "Metallic bond", "The electrostatic attraction between positive metal ions and the sea of delocalised electrons"], ["8b7139b30f", "Malleable", "Able to be hammered into shape without breaking"], ["e11f7af43e", "Ductile", "Able to be drawn out into a wire"]], "checks": [["12ebeb4421", "Explain why air is classified as a mixture and not as a compound", "The gases in air are not chemically bonded / combined together. They are present in no fixed ratio and can be separated by physical means"], ["26981be43f", "An atom has proton number 15 and nucleon number 31. State its electronic configuration and give its group and period", "15 electrons, so the configuration is 2,8,5. Five outer-shell electrons, so Group V. Three occupied shells, so Period 3"], ["8a4cffdabb", "Copper has two isotopes: ⁶³Cu (69%) and ⁶⁵Cu (31%). Calculate the relative atomic mass of copper. Give your answer to one decimal place", "[(63 × 69) + (65 × 31)] ÷ 100 = (4347 + 2015) ÷ 100 = 63.6"], ["0d34f09481", "Explain why solid magnesium oxide does not conduct electricity but molten magnesium oxide does", "In the solid, the ions are held in fixed positions in the lattice. When molten, the lattice breaks down and the ions are free to move. Moving ions carry the electrical charge through the liquid"], ["75603e7aa8", "Explain why carbon dioxide has a much lower boiling point than silicon(IV) oxide, even though both contain only covalent bonds", "Carbon dioxide is simple molecular, so only the weak intermolecular forces between the molecules have to be overcome when it boils. Silicon(IV) oxide is giant covalent, so boiling means breaking strong covalent bonds throughout the structure. Breaking covalent bonds requires much more energy than overcoming intermolecular forces"], ["c2b141d414", "Graphite is used as a lubricant and also as an electrode. Explain, in terms of its structure, why it can do both", "Graphite has layers of carbon atoms held together by weak forces between the layers. These layers can slide over each other, which makes it slippery and useful as a lubricant. Each carbon atom uses only three of its four outer electrons for bonding. The fourth electron is delocalised and free to move, so graphite conducts electricity and can be used as an electrode"], ["4eaa0cc675", "Explain, in terms of structure and bonding, why copper can be drawn into wires", "Copper consists of layers of positive metal ions in a sea of delocalised electrons. The layers of ions can slide over each other when a force is applied. The delocalised electrons continue to attract the positive ions in their new positions, so the metallic bonding is not broken"]], "facts": [["11bc517c00", "An atom has a tiny central nucleus containing protons and neutrons, surrounded by electrons moving in shells. Almost all the mass is in the nucleus; almost all the volume is empty space around it"], ["d1fdad182e", "The proton number decides which element an atom is. Change it and you have a different element. Nothing else does this — not the neutrons, not the electrons"], ["eeabeb5b34", "Chemistry happens in the outer shell only. Two atoms with the same number of outer-shell electrons react in the same way, whatever else is different about them"], ["484310a13a", "A full outer shell is stable. The noble gases already have one, which is why they are unreactive. Every other atom bonds in order to reach one"], ["7ec8d95669", "There are exactly three ways to reach a full outer shell: lose electrons, gain electrons, or share them. Metal + non-metal gives ionic bonding, non-metal + non-metal gives covalent bonding, metal + metal gives metallic bonding. That is the whole map"]]}, {"id": "g9-igcse1-u03", "n": 3, "tag": "Unit 3", "title": "Stoichiometry", "terms": [["29868bcc6b", "Chemical formula", "Symbols and subscripts showing the ratio of atoms of each element in a substance"], ["22c761f69c", "Molecular formula", "The actual number of atoms of each element in one molecule of a compound"], ["738699e281", "Empirical formula", "The simplest whole number ratio of the atoms or ions in a compound"], ["e5ce2a229e", "Spectator ion", "An ion present at the start and unchanged at the end, left out of an ionic equation"], ["67bb669d12", "Ionic equation", "An equation showing only the particles that change during a reaction"], ["5e2f5728c2", "State symbol", "(s), (l), (g) or (aq), showing the physical state of a substance in a reaction"], ["69da559fdb", "Relative atomic mass, Aᵣ", "The average mass of an element's isotopes compared with one twelfth of a carbon-12 atom"], ["30bb02445a", "Relative molecular mass, Mᵣ", "The sum of the relative atomic masses of all the atoms in a molecular formula"], ["1c7d42b8f0", "Relative formula mass", "The same sum, used for an ionic compound, which has no molecules"], ["82fe99bb2d", "Water of crystallisation", "Water molecules held within a crystal, written after a dot in the formula"], ["82a4e63ae5", "Mole", "The unit of amount of substance; the amount containing 6.02 × 10²³ particles"], ["541b619255", "Avogadro constant", "6.02 × 10²³, the number of particles in one mole"], ["b3792f043f", "Molar mass, M", "The mass of one mole of a substance, in g/mol"], ["4f4a23d14a", "Molar gas volume", "24 dm³, the volume of one mole of any gas at room temperature and pressure"], ["d35117032d", "Concentration", "The amount of solute in a given volume of solution, in g/dm³ or mol/dm³"], ["2719fd6893", "Limiting reactant", "The reactant that is used up first and therefore sets the amount of product"], ["8f41566909", "Excess reactant", "A reactant that is not fully used up; some is left over"], ["ed3bc7197c", "Titre", "The volume of solution delivered from a burette to reach the end-point"], ["e37cb9f0c5", "Concordant results", "Titres agreeing within 0.10 cm³, which are the ones averaged"], ["9482648c27", "Theoretical yield", "The mass of product calculated from the limiting reactant, assuming complete reaction"], ["9efe1fe45d", "Actual yield", "The mass of product actually obtained"], ["63c3e20b1f", "Percentage purity", "The proportion of a sample that is the substance named, as a percentage of the whole sample"]], "checks": [["01ba6399f3", "Deduce the formula of aluminium nitrate", "Al³⁺ with NO₃⁻; one +3 needs three −1, and the nitrate repeats, so it needs brackets: Al(NO₃)₃"], ["a641a9c4a3", "Balance: ___C₂H₆ + ___O₂ → ___CO₂ + ___H₂O", "Balance carbon first (2 each side needs 2CO₂), then hydrogen (6 needs 3H₂O), leaving 7 oxygen atoms on the right, which needs 3½O₂. Double everything: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O"], ["dbc1352ce4", "Write the ionic equation for aqueous barium chloride reacting with dilute sulfuric acid to give a white precipitate of barium sulfate", "Full: BaCl₂(aq) + H₂SO₄(aq) → BaSO₄(s) + 2HCl(aq). The H⁺ and Cl⁻ are spectators. Ionic: Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)"], ["4f4758388d", "Calculate the relative formula mass of magnesium nitrate, Mg(NO₃)₂", "24 + 2 × (14 + 48) = 24 + 124 = 148"], ["05696113b7", "Calculate the mass of one mole of CuSO₄·5H₂O", "Mᵣ(CuSO₄) = 64 + 32 + 64 = 160; plus 5 × 18 = 90; total 250, so one mole has a mass of 250 g"], ["d2a60b379f", "Calculate the volume of hydrogen, at r.t.p., produced when 0.48 g of magnesium reacts completely with excess hydrochloric acid. Mg + 2HCl → MgCl₂ + H₂", "n(Mg) = 0.48 ÷ 24 = 0.020 mol. Ratio Mg : H₂ is 1 : 1, so n(H₂) = 0.020 mol. V = 0.020 × 24 = 0.48 dm³, which is 480 cm³"], ["5d64758b45", "2.0 g of sodium hydroxide is dissolved to make 500 cm³ of solution. Calculate its concentration in mol/dm³", "n = 2.0 ÷ 40 = 0.050 mol; V = 500 ÷ 1000 = 0.500 dm³; c = 0.050 ÷ 0.500 = 0.10 mol/dm³"], ["471556ec4a", "A compound contains 40.0% carbon, 6.7% hydrogen and 53.3% oxygen by mass, and has an Mᵣ of 180. Determine its molecular formula", "Moles: C = 40.0 ÷ 12 = 3.33; H = 6.7 ÷ 1 = 6.7; O = 53.3 ÷ 16 = 3.33. Divide by 3.33: 1 : 2 : 1, so the empirical formula is CH₂O, with a mass of 30. 180 ÷ 30 = 6, so the molecular formula is C₆H₁₂O₆"], ["5911e93c86", "Deduce the formula of iron(III) sulfate", "The ions are Fe³⁺ and SO₄²⁻. Two Fe³⁺ give +6 and three SO₄²⁻ give −6, so the ratio is 2 : 3, and the sulfate needs brackets because there is more than one of it: Fe₂(SO₄)₃"], ["72cb31e068", "Write the ionic equation for the reaction between aqueous lead(II) nitrate and aqueous potassium iodide, which forms a yellow precipitate of lead(II) iodide", "The full equation is Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq). Everything aqueous splits; the precipitate stays whole. The potassium ions and nitrate ions are unchanged on both sides, so they are spectators and are cancelled. Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s) (Charge check: +2 and 2 × −1 gives zero on the left, and the solid is neutral. Both sides balance.)"], ["83c3968f7f", "Chlorine consists of 75% ³⁵Cl and 25% ³⁷Cl. Calculate the relative atomic mass of chlorine", "Aᵣ = [ (35 × 75) + (37 × 25) ] ÷ 100 = [ 2625 + 925 ] ÷ 100 = 3550 ÷ 100 = 35.5 (Sanity check: the answer must lie between 35 and 37, and closer to 35 because there is more of it. It does.)"], ["2b002f6c31", "Calcium carbonate decomposes on heating: CaCO₃ → CaO + CO₂. Calculate the mass of calcium oxide formed when 50 g of calcium carbonate decomposes completely", "Mᵣ(CaCO₃) = 40 + 12 + 48 = 100 and Mᵣ(CaO) = 40 + 16 = 56, so 100 g of carbonate gives 56 g of oxide. Scaling by 50 ÷ 100 = 0.5: mass of CaO = 0.5 × 56 = 28 g (Sanity check: the CO₂ must account for the missing 22 g, and Mᵣ(CO₂) = 44, half of which is 22. Mass is conserved.)"], ["825a92db94", "Calculate the number of oxygen atoms in 88 g of carbon dioxide. The Avogadro constant is 6.02 × 10²³", "Mᵣ(CO₂) = 12 + 32 = 44, so M = 44 g/mol. n(CO₂) = 88 ÷ 44 = 2.0 mol Each molecule holds two oxygen atoms, so n(O atoms) = 2.0 × 2 = 4.0 mol Number = 4.0 × 6.02 × 10²³ = 2.41 × 10²⁴ atoms (The step students miss is the middle one. The question asks for atoms, not molecules.)"], ["e81eac6eb0", "4.0 g of sodium hydroxide is dissolved in water and made up to 250 cm³ of solution. Calculate the concentration of the solution in mol/dm³", "Mᵣ(NaOH) = 23 + 16 + 1 = 40, so M = 40 g/mol. n = 4.0 ÷ 40 = 0.10 mol V = 250 ÷ 1000 = 0.250 dm³ c = n ÷ V = 0.10 ÷ 0.250 = 0.40 mol/dm³ (Sanity check: a quarter of a litre holds 0.1 mol, so a full litre would hold 0.4 mol. The answer must be four times the amount, and it is.)"], ["307edec82f", "5.3 g of sodium carbonate reacts completely with excess dilute hydrochloric acid: Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂. Calculate the volume of carbon dioxide produced at r.t.p", "Mᵣ(Na₂CO₃) = 46 + 12 + 48 = 106. In: n(Na₂CO₃) = 5.3 ÷ 106 = 0.050 mol Across: the ratio Na₂CO₃ : CO₂ is 1 : 1, so n(CO₂) = 0.050 mol Out: V = 0.050 × 24 = 1.2 dm³ (The word \"excess\" is doing work: it tells you the acid is not the limiting reactant, so you can ignore it entirely.)"], ["2ed059cbfd", "5.4 g of aluminium is heated with 48.0 g of iron(III) oxide: 2Al + Fe₂O₃ → Al₂O₃ + 2Fe. Determine which reactant is limiting, and calculate the maximum mass of iron produced", "n(Al) = 5.4 ÷ 27 = 0.20 mol; Mᵣ(Fe₂O₃) = 112 + 48 = 160, so n(Fe₂O₃) = 48.0 ÷ 160 = 0.30 mol Divide by coefficients: Al gives 0.20 ÷ 2 = 0.10; Fe₂O₃ gives 0.30 ÷ 1 = 0.30. The smaller is aluminium, so aluminium is limiting Then n(Fe) = 0.20 × (2 ÷ 2) = 0.20 mol, and m = 0.20 × 56 = 11.2 g"], ["6ed56a479c", "25.0 cm³ of 0.100 mol/dm³ sodium hydroxide is exactly neutralised by 20.0 cm³ of sulfuric acid: 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O. Calculate the concentration of the sulfuric acid in mol/dm³", "In: n(NaOH) = c × V = 0.100 × (25.0 ÷ 1000) = 2.50 × 10⁻³ mol Across: the ratio NaOH : H₂SO₄ is 2 : 1, so n(H₂SO₄) = 2.50 × 10⁻³ ÷ 2 = 1.25 × 10⁻³ mol Out: c = n ÷ V = 1.25 × 10⁻³ ÷ (20.0 ÷ 1000) = 0.0625 mol/dm³ (Sanity check: the acid is more concentrated per particle than the alkali would suggest, because each H₂SO₄ supplies two H⁺. Dividing by 2 in the middle step is the chemistry, not a tidying-up move.)"], ["02a63aab6a", "A hydrocarbon contains 82.7% carbon and 17.3% hydrogen by mass. Its relative molecular mass is 58. Determine its empirical formula and its molecular formula", "Moles: C = 82.7 ÷ 12 = 6.89; H = 17.3 ÷ 1 = 17.3 Divide by the smaller: C = 1.00; H = 17.3 ÷ 6.89 = 2.51, which is 2.5 Multiply both by 2: C₂H₅, the empirical formula Its mass is 24 + 5 = 29, and 58 ÷ 29 = 2, so the molecular formula is C₄H₁₀ (A ratio landing on a .5 is a signal to double, not a rounding error to be tidied away.)"], ["fa01e01580", "An impure 20.0 g sample of limestone is heated until it fully decomposes, giving 4.40 g of carbon dioxide. CaCO₃ → CaO + CO₂. Calculate the percentage purity of the limestone", "n(CO₂) = 4.40 ÷ 44 = 0.100 mol The ratio CaCO₃ : CO₂ is 1 : 1, so n(CaCO₃) = 0.100 mol m(CaCO₃) = 0.100 × 100 = 10.0 g of pure carbonate % purity = (10.0 ÷ 20.0) × 100 = 50.0% (Note what the impurity does: it is in the 20.0 g and contributes no CO₂, which is exactly why the gas measures the pure part.)"]], "facts": [["64a3d3f24e", "A chemical formula states a fixed ratio of atoms, and the ratio is decided by the charges on the ions or by the bonding — never by you. This is why you can put a number in front of a formula to balance an equation, but you can never change a subscript inside one"], ["a17fb08593", "Atoms are far too small to weigh, so every mass in chemistry is a relative mass. All of them are measured against the same standard: one twelfth of the mass of a carbon-12 atom. That is why Aᵣ and Mᵣ are ratios and carry no units"], ["24d901cdfe", "In a chemical reaction the atoms are only rearranged. Every atom present at the start is present at the end, so the total mass cannot change. Balancing an equation is nothing more than writing that fact down"], ["49f8d70ce1", "A balanced equation gives the reacting ratio in particles, not in grams. 2Mg + O₂ → 2MgO says two magnesium atoms for every one oxygen molecule. It does not say 2 g of magnesium"], ["ef0dfe9267", "The mole is the bridge between F4 and the balance on the bench. One mole is 6.02 × 10²³ particles, and one mole of any substance has a mass in grams equal to its Aᵣ or Mᵣ"], ["958e888d9e", "Every calculation in this unit is the same three moves: into moles, across the equation, out of moles. Only the doors change — you may go in through a mass, a gas volume or a solution, and come out through a different one. Learn the three moves once and you have learned every question in this topic"]]}, {"id": "g9-igcse1-u04", "n": 4, "tag": "Unit 4", "title": "Electrochemistry", "terms": [["803b0725bc", "Electrolysis", "The decomposition of an ionic compound, when molten or in aqueous solution, by the passage of an electric current"], ["5d60338db1", "Electrolyte", "An ionic compound, molten or in aqueous solution, that conducts electricity and is decomposed by it"], ["6f9c05c19e", "Electrode", "A rod or plate that carries the current into and out of the electrolyte"], ["ec4f925d7e", "Anode", "The positive electrode, where oxidation occurs"], ["4a974df896", "Cathode", "The negative electrode, where reduction occurs"], ["099e6321f6", "Inert electrode", "An electrode that takes no part in the reaction — graphite or platinum"], ["da99349c41", "Active electrode", "An electrode that takes part in the reaction, such as a copper anode that dissolves"], ["1c7ed7d9d8", "Cation", "A positively charged ion, which migrates to the cathode"], ["19e049bd48", "Anion", "A negatively charged ion, which migrates to the anode"], ["f73f906b43", "Discharge", "The loss of an ion's charge at an electrode, converting it to a neutral atom or molecule"], ["93c6225683", "Oxidation", "Loss of electrons — occurs at the anode"], ["f74929bb96", "Reduction", "Gain of electrons — occurs at the cathode"], ["49bd464be5", "Half-equation", "An equation showing the electron loss or gain at one electrode only"], ["c81665798c", "Binary compound", "A compound containing only two elements"], ["5392c24d52", "Brine", "Concentrated aqueous sodium chloride"], ["ccd30b3ab8", "Electroplating", "Coating a metal object with a thin layer of another metal by electrolysis"], ["dc6163f945", "Anode sludge", "The insoluble impurities that collect below the anode during copper purification"], ["fe1670d04b", "Fuel cell", "A cell that produces electricity directly from the reaction of a fuel with oxygen"]], "checks": [], "facts": [["2e0f7a6992", "Electrolysis needs mobile ions. A solid ionic compound does not conduct, because its ions are locked in a lattice and cannot move. Melt it or dissolve it and the ions are free. That one sentence answers every \"why does it only conduct when molten or aqueous\" question in the to
