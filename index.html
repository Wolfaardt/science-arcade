 "Group", "A vertical column. The group number gives the number of outer-shell electrons"], ["6f62edde24", "Alkali metal", "An element of Group I. Soft, low density, reacts with water to give an alkali"], ["4deb9ee58a", "Halogen", "An element of Group VII. A diatomic non-metal"], ["d924ed2dfa", "Diatomic", "Existing as molecules of two atoms, such as Cl₂"], ["dcbd717655", "Monatomic", "Existing as single, unbonded atoms, as the noble gases do"], ["b860718d17", "Noble gas", "An element of Group VIII. Unreactive, because its outer shell is full"], ["4bf6490dd5", "Transition element", "A metal from the central block. Dense, high-melting, forms coloured compounds"], ["3a54f2bdea", "Displacement reaction", "A reaction in which a more reactive element takes the place of a less reactive one"], ["2274f54e4c", "Halide", "The compound or ion formed when a halogen gains an electron, such as chloride, Cl⁻"], ["348d1e2e40", "Oxidation number", "The charge an ion carries, shown by the Roman numeral in a compound's name"], ["00f444853a", "Variable oxidation number", "The ability of an element to form ions of more than one charge"], ["3d5721d0fa", "Catalyst", "A substance that speeds up a reaction without being used up or chemically changed"], ["5fe3b8096c", "Full outer shell", "An outer electron shell holding its maximum number of electrons. The reason noble gases are unreactive"]], "checks": [["76b0af9927", "State what the period number and the group number each tell you about an atom", "The period number gives the number of occupied electron shells. The group number gives the number of electrons in the outer shell"], ["891badf2fb", "An element is in Group VI. Deduce the charge of the ion it forms, and explain how you worked it out", "A 2− charge. A Group VI atom has six outer-shell electrons and gains two to reach a full outer shell of eight, so the ion carries two negative charges"], ["03f279de78", "Name the two products formed when lithium reacts with cold water, and state the pH range of the solution", "Hydrogen gas and lithium hydroxide. The solution is alkaline, so the pH is above 7"], ["3dfd0cb851", "Give the state and colour of chlorine, bromine and iodine at room temperature", "Chlorine is a pale yellow-green gas, bromine is a red-brown liquid, iodine is a grey-black solid"], ["3fa9335640", "Explain why bromine displaces iodine from potassium iodide solution but not chlorine from potassium chloride solution", "Bromine is more reactive than iodine, so it displaces iodide ions from solution. Bromine is less reactive than chlorine, so it cannot displace chloride ions. A halogen only displaces one that is less reactive than itself"], ["5d93a3f348", "State four properties of the transition elements that Group I metals do not have", "Higher density, higher melting point, coloured compounds, variable oxidation number. Acting as catalysts is also acceptable"], ["7eaee9f4f3", "Explain why the noble gases are monatomic", "A noble gas atom has a full outer electron shell. It does not need to share, gain or lose electrons to become stable, so it forms no bonds — not even with another atom of the same element"]], "facts": [["176ec188b3", "The elements are laid out in order of proton number, one after another. Nobody sorted them by how they behave. The behaviour repeats on its own, and the repeat is what makes the columns"], ["78e7083636", "Period number = the number of occupied electron shells. Group number = the number of electrons in the outer shell. An element's address is its electron arrangement written another way"], ["62812e9089", "Chemistry happens in the outer shell only. Elements in the same group have the same number of outer-shell electrons, so they react in the same way. That is the whole reason the table has columns"], ["645df99f05", "A full outer shell is stable, and atoms lose or gain electrons to reach one. Elements on the left have few outer electrons and lose them; elements on the right are a few short and gain them. The group number tells you the charge of the ion"], ["0b931a5c8a", "Going down a group, the outer shell is further from the nucleus and screened by more full inner shells, so the pull on the outer electrons is weaker. That one cause gives two opposite trends: losing an electron gets easier, so Group I gets more reactive downwards; attracting an extra electron gets harder, so Group VII gets less reactive downwards"]]}, {"id": "g10-igcse2-u09", "n": 9, "title": "Metals", "terms": [["e7fa616868", "Delocalised electron", "An electron that is free to move through the whole metal lattice rather than belonging to one atom"], ["5577a48bf6", "Malleable", "Able to be hammered or pressed into sheets without breaking"], ["249706e607", "Ductile", "Able to be drawn out into a wire"], ["e71d1fa815", "Alloy", "A mixture of a metal with one or more other elements, melted together"], ["ffc6c468f3", "Brass", "An alloy of copper and zinc"], ["e23417ff2f", "Stainless steel", "An alloy of iron with chromium, nickel and carbon"], ["5010a98cca", "Reactivity series", "Metals listed in order of how readily they lose electrons to form positive ions, with carbon and hydrogen included as reference points"], ["d3bd8de81f", "Displacement reaction", "A reaction in which a more reactive metal takes the place of a less reactive one in a compound"], ["3caa5587d2", "Oxidation", "Loss of electrons"], ["5e5021c55c", "Reduction", "Gain of electrons; also, loss of oxygen"], ["3a5552f333", "Corrosion", "The gradual destruction of a metal by reaction with its surroundings"], ["53e9d71d4f", "Rusting", "The corrosion of iron or steel, needing both water and oxygen, giving hydrated iron(III) oxide"], ["14b9cf9b29", "Galvanising", "Coating iron or steel with zinc, giving both barrier and sacrificial protection"], ["2a011235fb", "Sacrificial protection", "Protecting a metal by attaching a more reactive metal that is oxidised in its place"], ["2ad01ad9b3", "Ore", "A rock containing enough of a metal compound to make extraction worthwhile"], ["3bfc28c89f", "Hematite", "The main ore of iron, iron(III) oxide, Fe₂O₃"], ["41e6c55208", "Bauxite", "The main ore of aluminium, containing aluminium oxide, Al₂O₃"], ["1ac1b323b3", "Slag", "Molten calcium silicate formed in the blast furnace when calcium oxide reacts with sand"], ["4a0d9fee26", "Cryolite", "The molten compound in which aluminium oxide is dissolved, to lower the operating temperature of the electrolysis"], ["744efeb38a", "Native", "Occurring as the uncombined element, as gold does"]], "checks": [["d0e486603b", "State the reactivity series in full, including carbon and hydrogen, and say what each of", "Potassium, sodium, calcium, magnesium, aluminium, carbon, zinc, iron, hydrogen, copper,"], ["b0f1425666", "Explain, in terms of structure, why metals are malleable but simple molecular non-metals", "In a metal the ions are all the same size and are held in place by attraction to a sea of"], ["781e02bb80", "Name the products when calcium reacts with cold water, and when magnesium reacts with", "Calcium and cold water give calcium hydroxide and hydrogen. Magnesium and steam give"], ["e65a8a2d1e", "Explain why stainless steel is harder than pure iron", "Stainless steel contains chromium, nickel and carbon atoms, which are different sizes from"], ["46edc1da29", "State the two conditions required for iron to rust, and name the product", "Water and oxygen, both present at the same time. The product is hydrated iron(III) oxide"], ["41dc26a714", "Explain why galvanising protects iron even after the zinc layer is scratched, but tin", "Zinc is more reactive than iron, so where the two are in contact the zinc is oxidised in"], ["597864341d", "State the method used to extract aluminium and explain why that method is necessary", "Electrolysis of purified aluminium oxide dissolved in molten cryolite. Aluminium is above"], ["2f7add2618", "Write the equation for the reduction of iron(III) oxide by carbon monoxide, with state", "Fe₂O₃(s) + 3CO(g) → 2Fe(l) + 3CO₂(g)"]], "facts": [["83af266e51", "A metal is a lattice of positive metal ions in a sea of delocalised electrons. The electrons came from the outer shells of the atoms and no longer belong to any one of them. Every physical property of every metal comes out of that one picture"], ["babd3bb4c0", "The reactivity series is: potassium, sodium, calcium, magnesium, aluminium, carbon, zinc, iron, hydrogen, copper, silver, gold. Carbon and hydrogen are not metals. They are in the list as the two lines that divide it"], ["a7b209b000", "The carbon line decides how a metal is extracted. Above carbon, the metal holds its oxygen too tightly for carbon to take it, so the ore must be split by electrolysis. Below carbon, carbon can take the oxygen away, and heating in a furnace is enough"], ["1e97a6635e", "The hydrogen line decides whether a metal reacts with acid. Above hydrogen, the metal displaces hydrogen from an acid and you see effervescence. Below hydrogen — copper, silver, gold — nothing happens"], ["561a128fb5", "More reactive means a stronger tendency to lose electrons and form positive ions. That one sentence is the reason a more reactive metal displaces a less reactive one, the reason zinc protects iron rather than the other way round, and the reason reactive metals are the hardest to extract"]]}]}]};
// Science Arcade engine. One app for every grade; the toys and the question pool are modules.
//
// Toys are the point (Wolf, 22 Sep 2026: "learning the topic is not the idea" — playing with the
// idea is). Each toy is its own file in tools/arcade/toys/ and registers itself with ARCADE.toy().
// Adding a unit's toy means adding a file: nothing here changes and nothing already working moves.
// The question games are still here, one step down, for whoever wants them.
//
// Everything runs in the browser; progress is saved in localStorage, with a save code as backup.
"use strict";

// ───────────────────────── state ─────────────────────────
const KEY = "science-arcade:v2";
const TODAY = () => new Date().toISOString().slice(0, 10);
const BLANK = {
  name: "", grade: "", xp: 0, coins: 0, box: {}, found: {}, right: 0, answered: 0, missions: 0,
  lastMission: "", streak: 0, owned: ["none", "teal"], hat: "none", colour: "teal", badges: [],
  unitsDone: {}, settings: { size: 19, speak: false, calm: false, sound: true, dark: false },
};
let S = load();
function load() {
  const merge = s => Object.assign({}, BLANK, s, { settings: Object.assign({}, BLANK.settings, s.settings) });
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return merge(s); } catch (e) {}
  // One save per grade was the old shape. Carry the biggest one over so nobody starts again.
  try {
    const old = DATA.grades.map(g => { try { return JSON.parse(localStorage.getItem("science-arcade:" + g.grade)); } catch (e) { return null; } })
      .filter(Boolean).sort((a, b) => (b.xp || 0) - (a.xp || 0))[0];
    if (old) return merge(old);
  } catch (e) {}
  return JSON.parse(JSON.stringify(BLANK));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// The grade decides which worlds are on the home screen. ?grade=g07 in the address wins, so a
// class link can drop a student straight into theirs; otherwise it is whatever they picked.
const gradeById = id => DATA.grades.find(g => g.grade === id);
const urlGrade = (() => { try { return new URLSearchParams(location.search).get("grade"); } catch (e) { return null; } })();
let G = gradeById(urlGrade) || gradeById(S.grade) || null;
function setGrade(id) { G = gradeById(id) || G; S.grade = G.grade; refreshPool(); save(); }

// ───────────────────────── helpers ─────────────────────────
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const level = () => Math.floor(Math.sqrt(S.xp / 40)) + 1;
const xpFor = l => 40 * (l - 1) * (l - 1);
function applySettings() {
  document.documentElement.style.setProperty("--fs", S.settings.size + "px");
  document.body.classList.toggle("calm", S.settings.calm);
  document.documentElement.dataset.theme = S.settings.dark ? "dark" : "light";
}
function speak(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.lang = "en-GB"; speechSynthesis.speak(u); } catch (e) {}
}
const say = t => `<button class="speak" data-say="${esc(t)}" aria-label="Read aloud">🔊 Read</button>`;
let actx;
function beep(good) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [523, 659, 784] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.09; g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}
function confetti() {
  if (S.settings.calm) return;
  const d = document.createElement("div"); d.className = "confetti";
  const cols = ["#2f6f9f", "#2e8b57", "#d99a00", "#7b5ea7", "#e4572e"];
  for (let i = 0; i < 60; i++) { const b = document.createElement("i"); b.style.left = rnd(100) + "vw"; b.style.background = pick(cols); b.style.animationDelay = (Math.random() * 0.6) + "s"; d.appendChild(b); }
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); speak(b.dataset.say); } }, true);

// ───────────────────────── toys ─────────────────────────
// A toy is a self-contained simulation. It declares which unit(s) it belongs to and what there is
// to discover in it, and gets a box to draw in plus the small API below. It never touches S.
const TOYS = [];
const toyById = id => TOYS.find(t => t.id === id);
const toysFor = unit => TOYS.filter(t => (t.units || [t.unit]).includes(unit));
const hasFound = (toy, key) => !!S.found[toy + ":" + key];
const foundIn = toy => { const t = toyById(toy); return t ? t.discoveries.filter(d => hasFound(toy, d[0])).length : 0; };
const toyTotal = () => Object.keys(S.found).length;

function toyAPI(t) {
  return {
    id: t.id,
    has: key => hasFound(t.id, key),
    found(key) {
      const d = t.discoveries.find(x => x[0] === key);
      if (!d || hasFound(t.id, key)) return false;
      S.found[t.id + ":" + key] = TODAY();
      S.xp += 20; S.coins += 15; save();
      logEvent("discovery", { toy: t.id, key, label: d[1] });
      beep(true); confetti();
      toast(`💎 Discovery! ${d[1]} <span class="chip">+15 🪙</span>`);
      if (S.settings.speak) speak("Discovery! " + d[1]);
      const c = document.getElementById("dcount");
      if (c) c.textContent = `💎 ${foundIn(t.id)} / ${t.discoveries.length}`;
      drawDiscoveries(t);
      checkBadges();
      return true;
    },
    tip(html) { const el = document.getElementById("toytip"); if (el) el.innerHTML = html; },
    say(text) { if (S.settings.speak) speak(text); },
    beep, calm: () => S.settings.calm, log: (ev, data) => logEvent(ev, Object.assign({ toy: t.id }, data)),
    rnd, pick, shuffle, esc,
  };
}
function drawDiscoveries(t) {
  const el = document.getElementById("dlist");
  if (!el) return;
  const n = foundIn(t.id);
  el.innerHTML = `<summary>💎 Discoveries — ${n} of ${t.discoveries.length} found</summary>
    <div class="discs">${t.discoveries.map(d => hasFound(t.id, d[0])
      ? `<div class="disc got"><b>💎 ${esc(d[1])}</b><span>${esc(d[2])}</span></div>`
      : `<div class="disc"><b>🔒 ? ? ?</b><span>${esc(d[2])}</span></div>`).join("")}</div>
    <p class="muted">Every discovery is worth 15 coins. There is no way to get one wrong — just play with it.</p>`;
}
function openToy(id) {
  const t = toyById(id);
  if (!t) return go("home");
  const unit = (t.units || [t.unit])[0];
  $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${esc(unit)}">⬅ Back</button>
      <strong>${t.icon} ${esc(t.name)}</strong><span class="chip" id="dcount">💎 ${foundIn(id)} / ${t.discoveries.length}</span></div>
    <div class="toytip" id="toytip">${esc(t.blurb)} ${say(t.blurb)}</div>
    <div class="toybox" id="toyroot"></div>
    <details class="card" id="dlist"></details>`;
  drawDiscoveries(t);
  openedToy = { id, at: Date.now() };
  logEvent("toy_open", { toy: id, unit });
  try { t.mount(document.getElementById("toyroot"), toyAPI(t)); }
  catch (e) { document.getElementById("toyroot").innerHTML = `<p class="muted">This one would not start. Try another!</p>`; }
}
let openedToy = null;
function closeToy() {
  if (!openedToy) return;
  const secs = Math.round((Date.now() - openedToy.at) / 1000);
  const t = toyById(openedToy.id);
  if (secs >= 5) logEvent("toy_time", { toy: openedToy.id, seconds: secs, found: foundIn(openedToy.id), of: t ? t.discoveries.length : 0 });
  openedToy = null;
}
addEventListener("pagehide", () => { closeToy(); flushLog(true); });
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { closeToy(); flushLog(true); } });

function toast(html) {
  const d = document.createElement("div"); d.className = "feedback good pop toast";
  d.style.top = (14 + document.querySelectorAll(".toast").length * 74) + "px";
  d.innerHTML = html; document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
}

const COLOURS = { teal: "#3aa38f", sky: "#4a90d9", sun: "#f2b705", berry: "#c2477b", grape: "#7b5ea7", lime: "#7cb342", coral: "#ef6f5e", night: "#34495e", rainbow: "url(#rb)" };

  ["colour", "sky", "Sky blue", 20], ["colour", "sun", "Sunshine", 20], ["colour", "berry", "Berry", 30], ["colour", "grape", "Grape", 30],
  ["colour", "lime", "Lime", 30], ["colour", "coral", "Coral", 40], ["colour", "night", "Midnight", 50], ["colour", "rainbow", "Rainbow", 150],
  ["hat", "cap", "Cap", 25], ["hat", "bow", "Bow", 25], ["hat", "flower", "Flower", 30], ["hat", "goggles", "Lab goggles", 40],
  ["hat", "helmet", "Safety helmet", 40], ["hat", "grad", "Graduate", 60], ["hat", "top", "Top hat", 60], ["hat", "star", "Star", 80],
  ["hat", "rocket", "Rocket", 100], ["hat", "crown", "Crown", 150], ["hat", "dino", "Dino friend", 200],
];

      </details>`;
  },
  toy(id) { openToy(id); },
  mission() { play(roundFor(UNITS.map(u => u.id), 10), { title: "Today's mission", back: "home", mission: true }); },
  play(id) { play(roundFor([id], 10), { title: "Quiz · " + unitById(id).title, back: "world", arg: id, unit: id }); },
  numbers(id) { play(Array.from({ length: 10 }, () => genQuestion(id)).filter(Boolean), { title: "Number lab · " + unitById(id).title, back: "world", arg: id, unit: id }); },
  builder(id) { play(weakFirst(allTerms.filter(t => t.unit === id && buildable(t))).slice(0, 8).map(qBuild), { title: "Word builder", back: "world", arg: id, unit: id }); },
  challenge(id) { const u = unitById(id); play(weakFirst(u.checks.map(c => qSelf(u, c))).slice(0, 6), { title: "Challenge cards", back: "world", arg: id, unit: id }); },
  flash(id) { flashcards(unitById(id).terms.map(t => [t[1], t[2], t[0]]), id, "Flashcards"); },
  ideas(id) { flashcards(unitById(id).facts.map((f, i) => ["Big idea " + (i + 1), f[1], f[0]]), id, "Big ideas"); },
  match(id) { matchGame(id); },
  shop() {
    $app.innerHTML = header("home") + `<div class="card pet">${petSVG(120)}<div><h1>Buddy shop</h1><p class="muted">You have 🪙 ${S.coins}. Tap something you own to wear it.</p></div></div>
      <h2>Colours</h2><div class="shop">${shopRow("colour")}</div><h2>Hats and friends</h2><div class="shop">${shopRow("hat")}</div>`;
    $app.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
      const [kind, key, , price] = SHOP.find(s => s[1] === b.dataset.buy) || [b.dataset.kind, b.dataset.buy, "", 0];
      if (!S.owned.includes(key)) { if (S.coins < price) { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); return; } S.coins -= price; S.owned.push(key); beep(true); }
      if (kind === "hat") S.hat = key; else S.colour = key; checkBadges(); save(); go("shop");
    });
  },
  badges() {
    $app.innerHTML = header("home") + `<h1>Badges</h1><p class="muted">${S.right} correct answers so far.</p><div>${BADGES.map(b => `<div class="badge ${S.badges.includes(b[0]) ? "got" : ""}"><span class="em">${b[1]}</span><strong>${b[2]}</strong><span>${b[3]}</span></div>`).join("")}</div>`;
  },
  settings() {
    const st = S.settings;
    $app.innerHTML = header("home") + `<h1>Settings</h1>
      <div class="card"><label>Text size <input type="range" min="16" max="28" value="${st.size}" id="sz"></label></div>
      <div class="card"><label><input type="checkbox" id="sp" ${st.speak ? "checked" : ""}> Read every question aloud</label><br>
        <label><input type="checkbox" id="snd" ${st.sound ? "checked" : ""}> Sounds</label><br>
        <label><input type="checkbox" id="calm" ${st.calm ? "checked" : ""}> Calm mode (no moving pictures or confetti)</label><br>
        <label><input type="checkbox" id="dk" ${st.dark ? "checked" : ""}> Dark colours</label></div>
      <div class="card"><h2>Your grade</h2><p class="muted">You are in ${esc(G.label)}. Change it if that is wrong.</p>
        <div class="row">${DATA.grades.map(g => `<button class="ghost ${g.grade === G.grade ? "on" : ""}" data-setgrade="${esc(g.grade)}">${esc(g.label)}</button>`).join("")}</div></div>
      <div class="card"><h2>Your name</h2><input id="nm" value="${esc(S.name)}" maxlength="20" style="font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line)"></div>
      <div class="card"><h2>Save code</h2><p class="muted">Your progress is saved on this computer. To move it to another computer, copy this code, then paste it there.</p>
        <textarea id="code" rows="3" style="width:100%;font:14px monospace" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
        <div class="row"><button class="ghost" id="copy">Copy code</button><button class="ghost" id="load">Load a code</button></div></div>
      <p class="muted">Built ${esc(DATA.built)} · ${UNITS.length} unit${UNITS.length === 1 ? "" : "s"} · ${TOYS.length} toy${TOYS.length === 1 ? "" : "s"} · ${esc(G.strap)}</p>`;
    $app.querySelectorAll("[data-setgrade]").forEach(b => b.onclick = () => { setGrade(b.dataset.setgrade); go("settings"); });
    const upd = () => { st.size = +sz.value; st.speak = sp.checked; st.sound = snd.checked; st.calm = calm.checked; st.dark = dk.checked; S.name = nm.value.trim() || S.name; applySettings(); save(); };

function shopRow(kind) {
  const base = kind === "colour" ? [["colour", "teal", "Teal", 0]] : [["hat", "none", "No hat", 0]];
  return base.concat(SHOP.filter(s => s[0] === kind)).map(([k, key, name, price]) => {
    const own = S.owned.includes(key) || price === 0, on = (k === "hat" ? S.hat : S.colour) === key;
    const em = k === "hat" ? (HATS[key] || "🙂") : `<span style="display:inline-block;width:1em;height:1em;border-radius:50%;background:${key === "rainbow" ? "linear-gradient(90deg,#ef6f5e,#f2b705,#3aa38f,#7b5ea7)" : COLOURS[key]}"></span>`;
    return `<button data-buy="${key}" data-kind="${k}" class="${on ? "on" : ""}"><span class="em">${em}</span>${name}<br><small>${on ? "wearing" : own ? "owned" : "🪙 " + price}</small></button>`;
  }).join("");
}

// ───────────────────── the round player ─────────────────────
function play(qs, opt) {
  if (!qs.length) { $app.innerHTML = header(opt.back) + `<div class="card">Nothing here yet — try another activity!</div>`; return; }
  let i = 0, score = 0; const res = [];
  const backArgs = `data-go="${opt.back}" ${opt.arg ? `data-arg="${opt.arg}"` : ""}`;
  function show() {
    const q = qs[i];
    const u = unitById(q.unit);
    const dots = qs.map((_, k) => `<b class="${k < i ? (res[k] ? "ok" : "no") : k === i ? "now" : ""}"></b>`).join("");
    let body = "";
    if (q.kind === "mc") body = `<div class="prompt">${esc(q.prompt)} ${say(q.prompt + " " + (q.detail || "") + " " + q.options.join(". "))}</div>${q.detail ? `<div class="card" style="font-size:1.1em">${esc(q.detail)}</div>` : ""}<div id="opts">${q.options.map(o => `<button class="opt">${esc(o)}</button>`).join("")}</div>`;
    else if (q.kind === "build") body = `<div class="prompt">${esc(q.prompt)} ${say(q.detail)}</div><div class="card" style="font-size:1.1em">${esc(q.detail)}</div>
      <p class="muted">Tap the letters in order. It has ${q.answer.replace(/[ -]/g, "").length} letters.</p><div class="slot" id="slot"></div>
      <div class="tiles" id="tiles">${shuffle(q.answer.replace(/[ -]/g, "").split("")).map((c, k) => `<button class="tile" data-k="${k}">${esc(c)}</button>`).join("")}</div>
      <div class="row"><button class="ghost" id="hint">💡 Hint</button><button class="ghost" id="undo" hidden>⌫</button></div>`;
    else body = `<div class="prompt">${esc(q.prompt)} ${say(q.prompt)}</div><p class="muted">Think of your answer — say it or write it down. Then check.</p>
      <button class="primary" id="reveal">Show the answer</button><div id="ans"></div>`;
    $app.innerHTML = `<div class="bar"><button class="ghost" ${backArgs}>✖ Stop</button><strong>${esc(opt.title)}</strong><span class="chip">${i + 1} / ${qs.length}</span></div>
      <div class="dots">${dots}</div>${opt.mission && u ? `<p class="muted">Unit ${u.n}: ${esc(u.title)}</p>` : ""}<div class="card pop">${body}</div><div id="fb"></div>`;
    if (S.settings.speak) speak(q.kind === "build" ? q.detail : q.prompt + (q.detail ? ". " + q.detail : ""));
    if (q.kind === "mc") {
      const tries = { n: 0 };
      $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        if (b.disabled) return;
        const ok = b.textContent === q.answer;
        if (ok) { b.classList.add("right"); finish(tries.n === 0, q); }
        else { b.classList.add("wrong"); b.disabled = true; tries.n++; beep(false);
          if (tries.n >= 2) { $app.querySelectorAll(".opt").forEach(x => { if (x.textContent === q.answer) x.classList.add("right"); x.disabled = true; }); finish(false, q); }
          else fb(`Not quite — have another go! 💪`, "try"); }
      });
    } else if (q.kind === "build") {
      const target = q.answer.replace(/[ -]/g, "").toLowerCase(); let typed = []; let hints = 0;
      const slot = document.getElementById("slot"), tiles = [...document.querySelectorAll(".tile")];
      const draw = () => { slot.innerHTML = typed.map(k => `<span class="tile" style="display:inline-grid;place-items:center">${esc(tiles[k].textContent)}</span>`).join(""); tiles.forEach((t, k) => t.classList.toggle("used", typed.includes(k))); };
      // Guided spelling: a wrong letter is refused on the spot, and after three misses the right
      // tile lights up — nobody can get stuck, and nothing has to be undone.
      let misses = 0, here = 0;
      tiles.forEach((t, k) => t.onclick = () => {
        if (typed.includes(k)) return;
        if (t.textContent.toLowerCase() !== target[typed.length]) {
          misses++; here++; beep(false); t.classList.add("shake"); setTimeout(() => t.classList.remove("shake"), 400);
          if (here >= 3) tiles.find((x, j) => !typed.includes(j) && x.textContent.toLowerCase() === target[typed.length]).style.borderColor = "var(--gold)";
          return;
        }
        here = 0; tiles.forEach(x => x.style.borderColor = ""); typed.push(k); draw();
        if (typed.length === target.length) finish(hints === 0 && misses <= 2, q);
      });
      document.getElementById("undo").onclick = () => { typed.pop(); draw(); };
      document.getElementById("hint").onclick = () => { hints++; fb(`It starts with "${q.answer[0].toUpperCase()}"${hints > 1 ? ` and ends with "${q.answer.slice(-1)}"` : ""}.`, "try"); };
    } else {
      document.getElementById("reveal").onclick = () => {
        document.getElementById("ans").innerHTML = `<div class="card" style="border-color:var(--good)"><strong>Answer:</strong> ${esc(q.answer)} ${say(q.answer)}</div>
          <p>Did you get it?</p><div class="row"><button class="primary" id="yes">✅ I got it</button><button class="ghost" id="nearly">🙂 Nearly</button><button class="ghost" id="no">🔁 Not yet</button></div>`;
        document.getElementById("reveal").remove();
        document.getElementById("yes").onclick = () => finish(true, q, true);
        document.getElementById("nearly").onclick = () => finish(false, q, true, true);
        document.getElementById("no").onclick = () => finish(false, q, true);
        if (S.settings.speak) speak("The answer is: " + q.answer);
      };
    }
  }
  function fb(msg, cls) { document.getElementById("fb").innerHTML = `<div class="feedback ${cls}">${msg}</div>`; }
  function finish(ok, q, self, nearly) {
    if (!q.gen) mark(q.id, ok); else { S.answered++; if (ok) S.right++; }
    res[i] = ok; if (ok) score++;
    const gainXp = ok ? 10 : 4, gainCoins = ok ? 3 : 1;   // effort always earns something
    const before = level(); S.xp += gainXp; S.coins += gainCoins; save();
    beep(ok);
    const praise = pick(["Brilliant!", "Great job!", "You got it!", "Super scientist!", "Fantastic!", "Spot on!"]);
    const kind = nearly ? "Good effort — you'll see this one again soon." : ok ? praise : self ? "That's OK — you'll see this one again soon, and you'll get it." : "Good try! Here is the answer:";
    $app.querySelectorAll("#opts .opt, .tile, #undo, #hint").forEach(b => b.disabled = true);
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "good" : "try"} pop">${kind} <span class="chip">+${gainXp} XP</span> <span class="chip">+${gainCoins} 🪙</span>
      ${!ok && q.explain ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)} ${say(q.explain)}</div>` : ok && q.explain && q.gen ? `<div style="font-weight:400;margin-top:8px">${esc(q.explain)}</div>` : ""}</div>
      <button class="primary" id="next">${i + 1 < qs.length ? "Next ➡" : "Finish 🎉"}</button>`;
    if (level() > before) { confetti(); fb2(`🎉 Level up! Your buddy is now level ${level()}!`); }
    const nb = document.getElementById("next"); nb.focus(); nb.onclick = () => { i++; i < qs.length ? show() : end(); };
  }
  function fb2(msg) { const d = document.createElement("div"); d.className = "feedback good pop"; d.textContent = msg; document.getElementById("fb").prepend(d); }
  function end() {
    const stars = score >= qs.length * 0.9 ? 3 : score >= qs.length * 0.6 ? 2 : 1;
    let bonus = 5 * stars;
    if (opt.mission) {
      if (S.lastMission !== TODAY()) {
        const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
        S.streak = S.lastMission === y ? S.streak + 1 : 1; S.lastMission = TODAY(); bonus += 20;
      }
      S.missions++;
    }
    S.coins += bonus; S.xp += bonus; save(); checkBadges();
    if (stars === 3) confetti();
    $app.innerHTML = header() + `<div class="card center pop">${petSVG(140, "wow")}<h1>${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</h1>
      <h2>${score} out of ${qs.length}!</h2><p>${stars === 3 ? "Amazing work!" : stars === 2 ? "Really good — keep going!" : "Every try makes you stronger. Let's do another!"}</p>
      <p><span class="chip">Bonus +${bonus} 🪙</span>${opt.mission && S.streak ? ` <span class="chip">🔥 ${S.streak}-day streak</span>` : ""}</p>
      <div class="row" style="justify-content:center"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button>${opt.unit ? `<button class="ghost" data-go="world" data-arg="${opt.unit}">Unit menu</button>` : ""}</div></div>`;
    document.getElementById("again").onclick = () => opt.mission ? go("mission") : go(opt.back === "world" ? currentActivity(opt) : "home", opt.arg);
    if (S.settings.speak) speak(`${score} out of ${qs.length}. ${stars === 3 ? "Amazing work!" : "Well done!"}`);
  }
  show();
}
function currentActivity(opt) { const t = opt.title; return t.startsWith("Quiz") ? "play" : t.startsWith("Number") ? "numbers" : t.startsWith("Word") ? "builder" : t.startsWith("Challenge") ? "challenge" : "play"; }

// ───────────────────── flashcards ─────────────────────
function flashcards(cards, id, title) {
  let i = 0, flipped = false; cards = weakFirst(cards, c => c[2]);
  function show() {
    const [front, back, cid] = cards[i];
    $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>${title}</strong><span class="chip">${i + 1} / ${cards.length}</span></div>
      <button class="card flash pop" id="fc" style="width:100%"><span class="side">${flipped ? "meaning" : "tap to flip"}</span>${esc(flipped ? back : front)}</button>
      <div class="row" style="justify-content:center">${say(flipped ? back : front)}
        ${flipped ? `<button class="primary" id="know">✅ I know this</button><button class="ghost" id="learn">🔁 Still learning</button>` : `<button class="primary" id="flip">Flip 🔄</button>`}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="ghost" id="prev">⬅ Previous</button><button class="ghost" id="nxt">Next ➡</button></div>`;
    if (S.settings.speak) speak(flipped ? back : front);
    const flip = () => { flipped = !flipped; show(); };
    document.getElementById("fc").onclick = flip;
    if (!flipped) document.getElementById("flip").onclick = flip;
    else {
      document.getElementById("know").onclick = () => { if (!title.startsWith("Big")) mark(cid, true); S.xp += 3; S.coins += 1; save(); beep(true); next(); };
      document.getElementById("learn").onclick = () => { S.xp += 2; save(); next(); };
    }
    document.getElementById("prev").onclick = () => { i = (i - 1 + cards.length) % cards.length; flipped = false; show(); };
    document.getElementById("nxt").onclick = next;
  }
  function next() { i = (i + 1) % cards.length; flipped = false; if (i === 0) confetti(); show(); }
  show();
}

// ───────────────────── match up ─────────────────────
function matchGame(id) {
  const set = weakFirst(allTerms.filter(t => t.unit === id)).slice(0, 5);
  const left = shuffle(set), right = shuffle(set);
  let sel = null, done = 0, mistakes = 0;
  $app.innerHTML = `<div class="bar"><button class="ghost" data-go="world" data-arg="${id}">⬅ Back</button><strong>Match up</strong><span class="chip" id="mc">0 / ${set.length}</span></div>
    <p>Tap a word, then tap its meaning. ${say("Tap a word, then tap its meaning.")}</p>
    <div class="match"><div>${left.map(t => `<button data-side="L" data-id="${t.id}" style="width:100%;margin-bottom:10px;font-weight:700">${esc(t.term)}</button>`).join("")}</div>
    <div>${right.map(t => `<button data-side="R" data-id="${t.id}" style="width:100%;margin-bottom:10px">${esc(t.meaning)}</button>`).join("")}</div></div><div id="fb"></div>`;
  $app.querySelectorAll(".match button").forEach(b => b.onclick = () => {
    if (b.classList.contains("done")) return;
    if (!sel || sel.dataset.side === b.dataset.side) { $app.querySelectorAll(".match .sel").forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); if (S.settings.speak) speak(b.textContent); return; }
    if (sel.dataset.id === b.dataset.id) {
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); }); mark(b.dataset.id, true); done++; S.xp += 5; S.coins += 2; beep(true);
      document.getElementById("mc").textContent = `${done} / ${set.length}`; save();
      if (done === set.length) { const bonus = mistakes === 0 ? 15 : 8; S.coins += bonus; save(); confetti(); checkBadges();
        document.getElementById("fb").innerHTML = `<div class="feedback good pop">All matched! ${mistakes === 0 ? "Perfect — no mistakes!" : ""} <span class="chip">+${bonus} 🪙</span></div><div class="row"><button class="primary" id="again">Play again 🔁</button><button class="ghost" data-go="home">🏠 Home</button></div>`;
        document.getElementById("again").onclick = () => matchGame(id); }
    } else { mistakes++; beep(false); [sel, b].forEach(x => { x.classList.add("shake"); setTimeout(() => x.classList.remove("shake", "sel"), 400); }); }
    sel = null;
  });
}

// ───────────────── the teacher's record (Option B, Wolf's pick 22 Sep 2026) ─────────────────
// The game posts rows to a Google Apps Script web app, which appends them to a Sheet in Wolf's
// school Drive. No endpoint in the build config means no posting at all and the game plays exactly
// the same — which is also what happens to the offline copy. Rows queue in the browser and go in
// batches, so a school wifi drop loses nothing and nothing ever blocks play.
const LOGKEY = "science-arcade:outbox";
let outbox = [];
try { outbox = JSON.parse(localStorage.getItem(LOGKEY)) || []; } catch (e) {}
let user = null;
function whoAmI() {
  if (user) return user.email || user.id;
  if (!S.pid) { S.pid = "g-" + Math.random().toString(36).slice(2, 10); save(); }
  return "guest:" + S.pid;
}
function logEvent(ev, data) {
  if (!DATA.endpoint) return;
  outbox.push(Object.assign({ at: new Date().toISOString(), who: whoAmI(), name: user ? user.name : S.name, grade: G ? G.grade : "", ev }, data || {}));
  if (outbox.length > 400) outbox = outbox.slice(-400);
  try { localStorage.setItem(LOGKEY, JSON.stringify(outbox)); } catch (e) {}
  if (outbox.length >= 8) flushLog();
}
let sending = false;
function flushLog(beacon) {
  if (!DATA.endpoint || !outbox.length || sending) return;
  const batch = outbox.slice(0, 200), body = JSON.stringify({ rows: batch, token: user ? user.token : "" });
  const drop = () => { outbox = outbox.slice(batch.length); try { localStorage.setItem(LOGKEY, JSON.stringify(outbox)); } catch (e) {} };
  if (beacon) { try { if (navigator.sendBeacon(DATA.endpoint, new Blob([body], { type: "text/plain" }))) drop(); } catch (e) {} return; }
  sending = true;
  // text/plain keeps it a simple request: Apps Script answers no CORS preflight.
  fetch(DATA.endpoint, { method: "POST", body, headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true })
    .then(r => { if (r.ok) drop(); }).catch(() => {}).then(() => { sending = false; });
}
setInterval(() => flushLog(), 60000);

window.ARCADE = {
  toy(def) { if (def && def.id && !toyById(def.id)) TOYS.push(def); },
  setUser(u) { user = u; if (u && u.name && !S.name) { S.name = u.name.split(" ")[0]; save(); } logEvent("signin", {}); },
  start() {
    TOYS.sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
    refreshPool(); applySettings(); flushLog();
    go(G ? "home" : "grade");
  },
};

// Sign in with the school Google account. Entirely optional: with no client id in config.json
// this file does nothing at all and the game plays as a guest, which is also what the offline
// copy does. Nothing here blocks play — a student who ignores the button loses no function.
(function () {
  const KEY = "science-arcade:who";
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && saved.email) setTimeout(() => ARCADE.setUser(saved), 0);
  } catch (e) {}
  if (!DATA.client_id) return;

  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;right:10px;bottom:10px;z-index:30";
  function signedIn(u) {
    bar.innerHTML = `<span class="chip" title="${u.email}">👋 ${u.name ? u.name.split(" ")[0] : "signed in"}</span>`;
  }
  function onCredential(res) {
    try {
      const b = res.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const p = JSON.parse(decodeURIComponent(escape(atob(b + "===".slice((b.length + 3) % 4)))));
      const u = { id: p.sub, email: p.email, name: p.name, token: res.credential };
      try { localStorage.setItem(KEY, JSON.stringify(u)); } catch (e) {}
      ARCADE.setUser(u); signedIn(u);
    } catch (e) {}
  }
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.defer = true;
  s.onload = () => {
    try {
      google.accounts.id.initialize({ client_id: DATA.client_id, callback: onCredential, auto_select: true });
      const slot = document.createElement("div");
      bar.appendChild(slot); document.body.appendChild(bar);
      google.accounts.id.renderButton(slot, { type: "standard", size: "medium", text: "signin", shape: "pill" });
      google.accounts.id.prompt();
    } catch (e) {}
  };
  document.head.appendChild(s);
})();

// Cell Lab — Grade 6 Unit 1 (Cells).
//
// Four benches behind one set of tabs: a microscope you focus (and can crash into the slide), a
// cell you build by dragging parts in and out, a job centre where five specialised cells either
// manage their job or do not, and a zoom-out from one cell to a whole organism. Nothing is marked
// wrong: taking the membrane away so the cytoplasm leaks out is a discovery, not a fail.
//
// Layout rules (from the 23 Sep audit): every drawing is an svg.scene that stays inside its own
// viewBox, no label smaller than 12 units, readouts live in HTML chips rather than in the picture,
// and option pickers use .ctrl.pick so they never look like another row of tabs.
ARCADE.toy({
  id: "g06-u01-cells", unit: "g06-u01", order: 1,
  name: "Cell Lab", icon: "🔬",
  blurb: "Build a cell, break a cell, and give cells a job",
  discoveries: [
    ["focus", "Sharp!", "Focus the microscope on some cells"],
    ["crunch", "Crunch!", "Lower the lens until it hits the slide"],
    ["stain", "Now you can see it", "Stain the cells so the nucleus shows up"],
    ["x40", "Up close", "Get a sharp picture with the ×40 lens"],
    ["cheek", "Your own cells", "Look at stained cheek cells"],
    ["animal", "An animal cell", "Build a cell with just the four parts every cell needs"],
    ["plant", "A plant cell", "Build a cell with all seven parts"],
    ["root", "Still a plant", "Build a plant cell that could live underground"],
    ["spill", "Leaky!", "Take the membrane away and watch the cytoplasm"],
    ["power", "Power cut", "Take the mitochondria out of a working cell"],
    ["shape", "Stiff at last", "Give a floppy cell a cell wall"],
    ["jobs", "Every part has a job", "Put all seven parts in, one at a time"],
    ["rbc", "Room for more oxygen", "Take the nucleus out of a red blood cell"],
    ["stuck", "Traffic jam", "Make a red blood cell too big for the capillary"],
    ["sheath", "Faster message", "Send a signal down a neurone with a fatty sheath"],
    ["sweep", "Mucus swept away", "Give a ciliated cell enough energy to sweep the mucus up"],
    ["hair", "Big drink", "Grow a root hair long enough to fill the glass"],
    ["palisade", "Sugar factory", "Make the palisade cell catch the most light"],
    ["human", "Cell to human", "Zoom out from one cell to a whole person"],
    ["tree", "Cell to plant", "Zoom out from one leaf cell to a whole plant"],
  ],
  mount(root, api) {
    let tab = "scope", run = 0;
    const alive = r => r === run && document.body.contains(root);
    const tabs = [["scope", "🔬 Microscope"], ["build", "🧱 Build a cell"], ["jobs", "🛠️ Job centre"], ["zoom", "🔭 Zoom out"]];
    const el = id => document.getElementById(id);
    const say = m => { const p = el("msg"); if (p && p.textContent !== m) { p.textContent = m; api.say(m); } };

    function shell(inner) {
      run++;
      root.innerHTML = `<div class="ctrl tabs">${tabs.map(([k, n]) =>
        `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${n}</button>`).join("")}</div><div id="bench">${inner}</div>`;
      root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
      return run;
    }
    function draw() { ({ scope: scopeBench, build: buildBench, jobs: jobBench, zoom: zoomBench })[tab](); }
    const pickRow = (attr, lead, list, on) => `<div class="ctrl pick"><span class="lead">${lead}</span>${list.map(([k, n]) => `<button data-${attr}="${k}" class="${k === on ? "on" : ""}">${n}</button>`).join("")}</div>`;
    const wirePick = (attr, fn) => root.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => {
      root.querySelectorAll(`[data-${attr}]`).forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset[attr]);
    });

    // ── the microscope ──────────────────────────────────────────────────────
    // The lens only comes sharp at one gap, and the stronger the lens the smaller that gap — so the
    // ×40 picture is the one where crashing is easiest. The objective gets longer with power, as on a
    // real microscope, so the side view shows why.
    function scopeBench() {
      const SHARP = { 4: 62, 10: 40, 40: 14 }, LEN = { 4: 12, 10: 18, 40: 26 };
      let slide = "onion", mag = 4, h = 90, stained = false, cracked = false;
      shell(`${pickRow("slide", "Slide:", [["onion", "🧅 Onion skin"], ["cheek", "👄 Cheek cells"]], "onion")}
        ${pickRow("mag", "Lens:", [["4", "×4"], ["10", "×10"], ["40", "×40"]], "4")}
        <div class="duo">
          <svg class="scene" viewBox="0 0 220 260" role="img" aria-label="The microscope from the side">
            <text x="110" y="16" text-anchor="middle" font-size="13" class="lbl">from the side</text>
            <path d="M40 244 H180 V232 Q180 226 172 226 H48 Q40 226 40 232 Z" fill="#5b6675"/>
            <path d="M150 226 V150 Q150 70 128 56" fill="none" stroke="#5b6675" stroke-width="16" stroke-linecap="round"/>
            <circle cx="150" cy="176" r="13" fill="#34495e"/><line id="knobI" x1="150" y1="176" x2="150" y2="165" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <rect x="40" y="170" width="120" height="8" rx="2" fill="#34495e"/>
            <circle cx="95" cy="206" r="9" fill="#f2d24c" stroke="#8d97a3" stroke-width="2"/>
            <rect x="62" y="163" width="66" height="7" fill="#dbeaf6" stroke="#7f8c99"/>
            <path id="crackS" d="" stroke="#c0392b" stroke-width="2.5" fill="none"/>
            <g id="tube"><rect x="101" y="20" width="18" height="14" rx="2" fill="#34495e"/>
              <rect x="97" y="34" width="26" height="62" fill="#5b6675"/><rect x="92" y="96" width="36" height="8" rx="3" fill="#34495e"/>
              <rect id="obj" x="102" y="104" width="16" height="12" fill="#8d97a3"/>
              <path d="M123 60 L136 60" stroke="#5b6675" stroke-width="10"/></g>
            <g id="tubeL"><text x="8" y="31" font-size="12" class="lbl">eyepiece</text><path d="M60 27 H99" stroke="#9aa6b3" stroke-width="1.5"/></g>
            <g id="objG"><text x="8" y="114" font-size="12" class="lbl">objective</text><path id="objP" d="M64 110 H100" stroke="#9aa6b3" stroke-width="1.5"/></g>
            <text x="8" y="198" font-size="12" class="lbl">slide</text><path d="M34 190 L66 168" stroke="#9aa6b3" stroke-width="1.5"/>
            <text x="110" y="211" font-size="12" class="lbl">light</text>
            <text x="178" y="200" font-size="12" class="lbl" text-anchor="middle">focus</text>
            <text x="110" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#b4531f" id="gap"></text>
          </svg>
          <svg class="scene" viewBox="0 0 260 260" role="img" aria-label="What you see down the eyepiece">
            <defs><filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="bl" stdDeviation="6"/></filter>
              <clipPath id="eye"><circle cx="130" cy="122" r="104"/></clipPath></defs>
            <circle cx="130" cy="122" r="112" fill="#1f2a37" stroke="#8d97a3" stroke-width="2"/>
            <g clip-path="url(#eye)"><rect x="20" y="10" width="220" height="230" fill="#f7f3e8"/>
              <g id="cells" filter="url(#blur)"></g><path id="crack" d="" stroke="#333" stroke-width="3" fill="none"/></g>
            <rect x="190" y="14" width="44" height="24" rx="12" fill="#1f2a37"/><text x="212" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" id="magV">×4</text>
            <text x="130" y="254" text-anchor="middle" font-size="13" class="lbl">down the eyepiece</text>
          </svg>
        </div>
        <div class="ctrl slider"><label for="fk">Focus: lens up</label><input type="range" id="fk" min="0" max="100" value="10"><label for="fk">down</label></div>
        <div class="ctrl"><span class="chip" id="fkv"></span><button id="stain">💧 Add a drop of stain</button><button id="fresh">🔄 Fresh slide</button></div>
        <p class="muted" id="msg">Turn the focus to bring the lens down towards the slide until the cells look sharp.</p>`);

      function cellsSVG() {
        const s = mag === 4 ? 0.32 : mag === 10 ? 0.75 : 2, cx = 130, cy = 122, out = [];
        const nuc = stained ? (slide === "onion" ? "#7a4a0c" : "#1d3f8f") : "#cbbf9f";
        const fill = stained ? (slide === "onion" ? "#f2d58a" : "#aac4ef") : "#efe8d4";
        const edge = stained ? (slide === "onion" ? "#a07420" : "#3c62b8") : "#b9ab88";
        if (slide === "onion") {
          const w = 70 * s, hh = 28 * s;
          for (let row = -9; row <= 9; row++) for (let col = -8; col <= 8; col++) {
            const x = cx + col * w + (row % 2 ? w / 2 : 0) - w / 2, y = cy + row * hh - hh / 2;
            if (Math.abs(x + w / 2 - cx) > 120 + w || Math.abs(y + hh / 2 - cy) > 120 + hh) continue;
            out.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" fill="${fill}" stroke="${edge}" stroke-width="${Math.max(1, 2.5 * s).toFixed(1)}"/>`,
              `<circle cx="${(x + w * (0.3 + ((row * 7 + col * 3) & 3) * 0.12)).toFixed(1)}" cy="${(y + hh / 2).toFixed(1)}" r="${(5 * s).toFixed(1)}" fill="${nuc}"/>`);
          }
        } else {
          const pts = [[0, 0], [-60, -40], [55, -35], [-45, 50], [60, 45], [0, -80], [5, 80], [-95, 5], [95, 0], [-100, -80], [100, -80], [-100, 85], [100, 85]];
          pts.forEach(([dx, dy], i) => {
            const x = cx + dx * s, y = cy + dy * s, R = 24 * s;
            const d = Array.from({ length: 9 }, (_, k) => { const a = k / 9 * 6.283, rr = R * (0.8 + 0.25 * Math.sin(k * 2.3 + i)); return `${k ? "L" : "M"}${(x + rr * Math.cos(a)).toFixed(1)} ${(y + rr * Math.sin(a)).toFixed(1)}`; }).join(" ") + "Z";
            out.push(`<path d="${d}" fill="${fill}" stroke="${edge}" stroke-width="${Math.max(1, 1.5 * s).toFixed(1)}" stroke-linejoin="round"/>`,
              `<circle cx="${(x + 4 * s).toFixed(1)}" cy="${(y - 3 * s).toFixed(1)}" r="${(5 * s).toFixed(1)}" fill="${nuc}"/>`);
          });
        }
        return out.join("");
      }
      function render() {
        if (!el("cells")) return;
        el("cells").innerHTML = cellsSVG();
        const off = Math.abs(h - SHARP[mag]), blur = cracked ? 7 : Math.min(6, off / 3);
        el("bl").setAttribute("stdDeviation", blur.toFixed(2));
        // The lens tip sits h × 0.4 above the slide; the tube moves to keep it there.
        const len = LEN[mag], tr = 59 - len - h * 0.4;
        el("obj").setAttribute("height", len);
        el("tube").setAttribute("transform", `translate(0 ${tr.toFixed(1)})`);
        el("tubeL").setAttribute("transform", `translate(0 ${tr.toFixed(1)})`);
        el("objG").setAttribute("transform", `translate(0 ${(tr + len / 2).toFixed(1)})`);
        el("knobI").setAttribute("transform", `rotate(${(100 - h) * 3} 150 176)`);
        el("magV").textContent = "×" + mag;
        el("fkv").textContent = cracked ? "💥 cracked" : blur < 0.8 ? "✔ sharp" : "blurry";
        el("gap").textContent = cracked ? "the slide is cracked!" : h < 22 ? "careful — very close!" : "";
        el("crack").setAttribute("d", cracked ? "M40 40 L100 110 L80 150 L170 220 M100 110 L220 90" : "");
        el("crackS").setAttribute("d", cracked ? "M84 163 L92 170 L100 163 L108 170" : "");
        if (cracked) return;
        if (blur < 0.8) {
          api.found("focus");
          if (mag === 40) api.found("x40");
          if (stained && slide === "cheek") api.found("cheek");
          say(slide === "onion"
            ? (stained ? "Onion cells: brick-shaped, each with a cell wall and a dark nucleus." : "Sharp — but the cells are pale and hard to see. Try a drop of stain.")
            : (stained ? "Cheek cells: rounded and uneven, no cell wall, the nucleus stained dark blue." : "Your cheek cells — faint without a stain."));
        }
      }
      el("fk").oninput = () => {
        h = 100 - +el("fk").value;
        if (h < 3 && !cracked) {
          cracked = true; api.found("crunch");
          say("CRUNCH — the lens hit the slide. That is why you watch from the SIDE while you lower the lens, and only focus UP while looking through.");
        }
        render();
      };
      wirePick("mag", m => { mag = +m; say(mag === 40 ? "The ×40 lens is longer, so it is sharp much closer to the slide. Go gently." : mag === 4 ? "×4 — the widest view, the easiest for finding cells." : "×10 lens."); render(); });
      wirePick("slide", s => { slide = s; stained = false; say(s === "onion" ? "A thin layer of onion skin." : "Cells scraped from inside your cheek."); render(); });
      el("stain").onclick = () => {
        stained = true; api.found("stain");
        say(slide === "onion" ? "Iodine solution stains the onion cells, so the nucleus shows up." : "Methylene blue stains the cheek cells blue — the nucleus goes dark blue.");
        render();
      };
      el("fresh").onclick = () => { cracked = false; h = 90; el("fk").value = 10; stained = false; say("A fresh slide. Start with the lens high up."); render(); };
      render();
    }

    // ── build a cell ────────────────────────────────────────────────────────
    // Drag parts from the tray into the cell (or tap them); drag a part out of the cell to take it
    // away. The cell reacts to what is missing rather than saying "wrong".
    function buildBench() {
      const PARTS = [
        ["wall", "Cell wall", "#2e8b57", "Strong outer layer. Supports the cell and gives it a fixed shape. Plant cells only."],
        ["membrane", "Cell membrane", "#7b5ea7", "Thin layer round the cell. Controls what goes in and out."],
        ["cytoplasm", "Cytoplasm", "#d9a81e", "Jelly that fills the cell. Chemical reactions happen here."],
        ["nucleus", "Nucleus", "#8a4fa3", "Controls what the cell does."],
        ["mito", "Mitochondria", "#e07b39", "Release energy from food (respiration)."],
        ["vacuole", "Sap vacuole", "#6f9fcc", "Big space full of cell sap. Keeps the cell firm. Plant cells only."],
        ["chloro", "Chloroplasts", "#3aa655", "Absorb light to make food (photosynthesis). Only in plant cells that get light."],
      ];
      const has = {}, seen = {};
      let phase = 0;
      const r = shell(`<svg class="scene" viewBox="0 0 360 250" id="bsvg" role="img" aria-label="A cell you build from parts" style="touch-action:none">
          <rect x="14" y="8" width="332" height="212" rx="18" fill="none" class="edge" stroke-width="2.5" stroke-dasharray="8 6"/>
          <text x="180" y="120" text-anchor="middle" font-size="15" class="lbl" id="empty">drag parts in here</text>
          <g id="cell"></g><g id="leak"></g>
          <text x="180" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6f9f" id="what"></text>
        </svg>
        <div class="ctrl" id="tray">${PARTS.map(([k, n, c]) => `<button data-part="${k}" style="touch-action:none"><span style="color:${c};font-size:1.2em">●</span> ${n}</button>`).join("")}</div>
        <div class="ctrl"><button id="clear">🗑️ Empty the box</button></div>
        <p class="muted" id="msg">Drag a part into the box, or tap it. Drag it back out to take it away. Try building the smallest cell that can stay alive.</p>`);
      const svg = el("bsvg");

      function toggle(k, on) {
        if (!!has[k] === on) return;
        const before = Object.assign({}, has);
        if (on) has[k] = true; else delete has[k];
        const p = PARTS.find(x => x[0] === k);
        if (on) { seen[k] = true; if (Object.keys(seen).length === 7) api.found("jobs"); }
        say(on ? `${p[1]}: ${p[3]}` : `${p[1]} taken out.`);
        react(before, k, on);
        render();
      }
      function react(before, k, on) {
        const working = b => b.membrane && b.cytoplasm && b.mito;
        if (!on && k === "mito" && working(before)) { api.found("power"); say("Power cut! With no mitochondria, no energy is released from food, so everything in the cell slows to a stop."); }
        if (!on && k === "nucleus" && before.membrane && before.cytoplasm) say("No nucleus — nothing is in control. A red blood cell grows up like this on purpose: more room for haemoglobin.");
        if (on && k === "wall" && has.membrane && !before.wall) { api.found("shape"); say("The floppy cell now has a fixed shape. The cell wall supports it."); }
        const key = Object.keys(has).sort().join(",");
        if (key === "cytoplasm,membrane,mito,nucleus") { api.found("animal"); say("That is an animal cell: membrane, cytoplasm, nucleus and mitochondria. Every cell needs these four."); }
        if (Object.keys(has).length === 7) { api.found("plant"); say("A plant cell — all seven parts. The wall, the sap vacuole and the chloroplasts are the three extras."); }
        if (key === "cytoplasm,membrane,mito,nucleus,vacuole,wall") { api.found("root"); say("Still a plant cell — it has a wall and a sap vacuole. No chloroplasts, like a root cell: underground there is no light to use."); }
      }
      function render() {
        if (!el("cell")) return;
        const wob = has.wall ? 0 : 1, t = phase, out = [], CX = 180, CY = 114;
        const blob = (rx, ry) => Array.from({ length: 28 }, (_, k) => {
          const a = k / 28 * 6.283, rr = 1 + wob * Math.sin(a * 3 + t) * 0.05;
          return `${k ? "L" : "M"}${(CX + Math.cos(a) * rx * rr).toFixed(1)} ${(CY + Math.sin(a) * ry * rr).toFixed(1)}`;
        }).join(" ") + "Z";
        const rectP = (w, hh) => `M${CX - w} ${CY - hh} H${CX + w} V${CY + hh} H${CX - w} Z`;
        const outline = has.wall ? rectP(128, 82) : blob(126, 82);
        if (has.cytoplasm && has.membrane) out.push(`<path d="${outline}" fill="#f6e7ad" data-in="cytoplasm"/>`);
        if (has.wall) out.push(`<path d="${rectP(136, 90)}" fill="none" stroke="#2e8b57" stroke-width="9" data-in="wall"/>`);
        if (has.vacuole) out.push(`<rect x="166" y="62" width="120" height="104" rx="22" fill="#cfe2f5" stroke="#6f9fcc" stroke-width="2" data-in="vacuole"/>`);
        if (has.nucleus) out.push(`<circle cx="110" cy="110" r="22" fill="#8a4fa3" data-in="nucleus"/><circle cx="104" cy="104" r="7" fill="#5b2e70" pointer-events="none"/>`);
        const powered = has.mito && has.membrane && has.cytoplasm;
        if (has.mito) [[92, 162], [142, 58], [300, 60], [150, 170]].forEach(([x, y], i) => out.push(`<ellipse cx="${x}" cy="${(y + (powered ? Math.sin(t * 2 + i) * 2 : 0)).toFixed(1)}" rx="14" ry="7" fill="#e07b39" data-in="mito"/>`));
        if (has.chloro) [[78, 56], [300, 114], [80, 170], [230, 182], [226, 46], [300, 172]].forEach(([x, y]) => out.push(`<ellipse cx="${x}" cy="${y}" rx="12" ry="7" fill="#3aa655" stroke="#1f6b35" data-in="chloro"/>`));
        if (has.membrane) out.push(`<path d="${outline}" fill="none" stroke="#7b5ea7" stroke-width="4" data-in="membrane"/>`);
        const leak = has.cytoplasm && !has.membrane;
        if (leak) out.push(`<path d="${blob(126, 82)}" fill="#f6e7ad" opacity=".35" data-in="cytoplasm"/>`);
        el("cell").innerHTML = out.join("");
        el("leak").innerHTML = leak ? [0, 1, 2, 3].map(i => `<circle cx="${90 + i * 60}" cy="${(190 + ((t * 20 + i * 13) % 26)).toFixed(1)}" r="6" fill="#e6c35c"/>`).join("") : "";
        const n = Object.keys(has).length;
        el("empty").style.display = n ? "none" : "";
        el("what").textContent = !n ? "" : leak ? "the cytoplasm is leaking out!" : n === 7 ? "a plant cell" :
          (has.wall || has.vacuole || has.chloro) ? "looks like a plant cell" : has.membrane && has.cytoplasm && has.nucleus && has.mito ? "an animal cell" : "not alive yet…";
        root.querySelectorAll("[data-part]").forEach(b => b.classList.toggle("on", !!has[b.dataset.part]));
      }
      (function loop() {
        if (!alive(r)) return;
        phase += 0.05;
        if (has.cytoplasm && !has.membrane && phase > 0.5) api.found("spill");
        render(); requestAnimationFrame(loop);
      })();
      function inBox(e) { const b = svg.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * 360, y = (e.clientY - b.top) / b.height * 250; return x > 14 && x < 346 && y > 8 && y < 220; }

          () => `<rect x="0" y="150" width="360" height="90" fill="#e3d2b6"/>` + shoot(180, 100, 0.8)

        <div class="ctrl slider"><label for="zl">Zoom in</label><input type="range" id="zl" min="0" max="4" value="0"><label for="zl">Zoom out</label></div>
        <div class="readout" id="ladder"></div>
        <p class="muted" id="msg">Slide to zoom out. The blue box shows where you just were.</p>`);
      function render(animate) {

        el("zname").textContent = L[0]; el("zdesc").textContent = L[1];
        el("ladder").innerHTML = (path === "human" ? HUMAN : PLANT).map((x, i) => `<span class="chip" style="${i === lv ? "border-color:var(--brand)" : i > lv ? "opacity:.45" : ""}">${i + 1}. ${x[0]}</span>`).join("");
        el("zg").innerHTML = DRAW[path][lv]();
        zt = animate ? 0 : 1;
        if (!animate) { el("zg").removeAttribute("transform"); el("zg").setAttribute("opacity", 1); }
        if (lv === 4) { api.found(path); say(path === "human" ? "From one cell to a whole person. A ciliated cell belongs to the respiratory system." : "From one palisade cell to a whole plant."); }
        else say("Smallest first: cell, tissue, organ, organ system, organism.");
      }
      (function loop() {
        if (!alive(r)) return;
        if (zt < 1) {
          zt = Math.min(1, zt + 0.06);
          const [fx, fy] = (path === "human" ? HUMAN : PLANT)[lv][2], s = 1 + 1.6 * (1 - zt) ** 2;
          el("zg").setAttribute("transform", `translate(${fx} ${fy}) scale(${s.toFixed(3)}) translate(${-fx} ${-fy})`);
          el("zg").setAttribute("opacity", (0.3 + 0.7 * zt).toFixed(2));
        }
        requestAnimationFrame(loop);
      })();
      el("zl").oninput = () => { const nl = +el("zl").value, out = nl > lv; lv = nl; render(out); };
      wirePick("path", p => { path = p; lv = 0; el("zl").value = 0; render(false); });
      render(false);
    }

    draw();
  },
});

// Breathing Machine — Grade 7 Unit 1 (Respiration).
//
// Four benches behind one set of tabs: the bell-jar model you pull, a runner whose oxygen you have
// to keep up, one air sac where gases drift across on their own, and the limewater test. Nothing here can
// be answered wrongly; the runner passing out is a discovery, not a fail.
ARCADE.toy({
  id: "g07-u01-breathing", unit: "g07-u01", order: 1,
  name: "Breathing Machine", icon: "🫁",
  blurb: "Pull the handle and make the lungs fill up",
  discoveries: [
    ["in", "Air rushes in", "Pull the rubber sheet down"],
    ["out", "Air pushes out", "Push the rubber sheet back up"],
    ["deep", "A really deep breath", "Fill the lungs right to the top"],
    ["ten", "Ten breaths", "Breathe in and out ten times"],
    ["keepup", "Kept the sprinter going", "Breathe fast enough for a sprint"],
    ["faint", "Out of puff", "Let the oxygen run all the way out"],
    ["over", "Too much of a good thing", "Breathe far too fast while resting"],
    ["o2", "Oxygen crossed over", "Watch oxygen drift from the air sac into the blood"],
    ["co2", "Carbon dioxide came back", "Watch carbon dioxide drift out of the blood"],
    ["swap20", "Busy little air sac", "Watch twenty gases cross the thin wall"],
    ["steep", "Fed the body", "Keep breathing and the blood moving until 30 oxygen reach the body"],
    ["even", "It all evened out", "Stop the blood, stop breathing, and wait"],
    ["cloudy", "Cloudy limewater", "Breathe out into the limewater"],
    ["clear", "Room air is different", "Pump ordinary air through the other tube"],
  ],
  mount(root, api) {
    let tab = "jar", stop = false, frame = 0;
    const alive = () => !stop && document.body.contains(root);
    const tabs = [["jar", "🔔 Bell jar"], ["run", "🏃 The runner"], ["sac", "🔬 Air sac"], ["lime", "🧪 Limewater"]];

    function shell(inner) {
      root.innerHTML = `<div class="ctrl">${tabs.map(([k, n]) =>
        `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${n}</button>`).join("")}</div><div id="bench">${inner}</div>`;
      root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { stop = true; tab = b.dataset.tab; stop = false; draw(); });
    }
    const bench = () => document.getElementById("bench");
    function draw() { ({ jar: jarBench, run: runBench, sac: sacBench, lime: limeBench })[tab](); }

    // ── the bell jar ────────────────────────────────────────────────────────
    function jarBench() {
      let v = 0, target = 0, breaths = 0, wasIn = false, top = false;
      shell(`<svg viewBox="0 0 400 300" id="jar" role="img" aria-label="A bell jar model of the lungs">
          <text x="200" y="16" text-anchor="middle" font-size="15" id="flow">tap a button, or drag the blue handle</text>
          <rect x="192" y="20" width="16" height="48" fill="#b9c6d4"/>
          <path d="M200 66 L166 116 M200 66 L234 116" stroke="#b9c6d4" stroke-width="11" fill="none"/>
          <path d="M96 232 L96 90 Q96 62 124 62 L276 62 Q304 62 304 90 L304 232 Z" fill="none" stroke="#7f8c99" stroke-width="5"/>
          <ellipse id="lungL" cx="166" cy="140" rx="30" ry="34" fill="#e8737d"/>
          <ellipse id="lungR" cx="234" cy="140" rx="30" ry="34" fill="#e8737d"/>
          <text x="6" y="192" font-size="13" fill="#7b5ea7">rubber sheet</text>
          <text x="6" y="208" font-size="13" fill="#7b5ea7">= your diaphragm</text>
          <path id="sheet" d="" fill="none" stroke="#7b5ea7" stroke-width="9" stroke-linecap="round"/>
          <circle id="knob" r="17" cx="200" cy="232" fill="#2f6f9f" stroke="#fff" stroke-width="3" class="grab"/>
          <text x="200" y="276" text-anchor="middle" font-size="15" id="press">drag me down</text>
        </svg>
        <div class="ctrl"><button id="pull">⬇ Pull down (breathe in)</button><button id="push">⬆ Push up (breathe out)</button>
          <span class="chip" id="count">0 breaths</span></div>`);
      const svg = document.getElementById("jar");
      const el = id => document.getElementById(id);
      function render() {
        el("lungL").setAttribute("rx", 22 + 16 * v); el("lungR").setAttribute("rx", 22 + 16 * v);
        el("lungL").setAttribute("ry", 26 + 22 * v); el("lungR").setAttribute("ry", 26 + 22 * v);
        const dip = 196 + 46 * v;
        el("sheet").setAttribute("d", `M96 196 Q200 ${dip} 304 196`);
        el("knob").setAttribute("cy", 210 + 44 * v);
        el("press").textContent = v > 0.55 ? "space is BIGGER · pressure LOW" : v < 0.2 ? "space is smaller · pressure HIGH" : "";
      }
      function setV(nv) {
        nv = Math.max(0, Math.min(1, nv));
        const d = nv - v; v = nv; render();
        if (d > 0.01) { el("flow").textContent = "⬇ air rushes IN"; wasIn = true; }
        else if (d < -0.01) { el("flow").textContent = "⬆ air pushes OUT"; if (wasIn) { wasIn = false; breaths++; el("count").textContent = breaths + " breaths"; if (breaths >= 10) api.found("ten"); } }
        if (d > 0.01) api.found("in");
        if (d < -0.01) api.found("out");
        if (v > 0.94 && !top) { top = true; api.found("deep"); }
      }
      // Drag the knob, or use the buttons — either works, and neither can be done wrongly.
      let dragging = false;
      const yOf = e => { const r = svg.getBoundingClientRect(); return (e.clientY - r.top) / r.height * 300; };
      el("knob").addEventListener("pointerdown", e => { dragging = true; el("knob").setPointerCapture(e.pointerId); });
      svg.addEventListener("pointermove", e => { if (dragging) { e.preventDefault(); setV((yOf(e) - 210) / 44); } });
      addEventListener("pointerup", () => { dragging = false; });
      const glide = to => { target = to; (function step() { if (!alive() || dragging || tab !== "jar" || !el("lungL")) return; const d = target - v; if (Math.abs(d) < 0.02) { setV(target); return; } setV(v + d * 0.18); requestAnimationFrame(step); })(); };
      el("pull").onclick = () => glide(1); el("push").onclick = () => glide(0);
      render();
    }

    // ── the runner ──────────────────────────────────────────────────────────
    function runBench() {
      const SPEEDS = [["Resting", 14, 0.4], ["Walking", 22, 1], ["Jogging", 36, 1.8], ["Sprinting", 58, 3]];
      let si = 0, rate = 14, o2 = 80, phase = 0, sprintOk = 0, overFast = 0, down = false;
      shell(`<svg viewBox="0 0 400 250" role="img" aria-label="A runner and an oxygen meter">
          <line x1="0" y1="232" x2="400" y2="232" stroke="#9aa6b3" stroke-width="4"/>
          <g id="runner"><circle cx="0" cy="-64" r="13" fill="#34495e"/>
            <path id="body" d="M0 -51 L0 -18" stroke="#34495e" stroke-width="9" stroke-linecap="round"/>
            <path id="legs" d="" stroke="#34495e" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path id="arms" d="" stroke="#34495e" stroke-width="7" fill="none" stroke-linecap="round"/>
            <ellipse id="chest" cx="0" cy="-38" rx="12" ry="9" fill="#e8737d" opacity=".9"/>
            <text id="puff" x="24" y="-66" font-size="18"></text></g>
          <text x="10" y="26" font-size="15" id="need">Resting needs about 14 breaths a minute</text>
          <rect x="10" y="36" width="380" height="22" rx="11" fill="#e2ddd2"/>
          <rect x="10" y="36" width="304" height="22" rx="11" fill="#2e8b57" id="bar"/>
          <text x="200" y="52" text-anchor="middle" font-size="14" fill="#fff" id="o2t">oxygen 80%</text>
        </svg>
        <div class="ctrl">${SPEEDS.map((s, i) => `<button data-sp="${i}" class="${i === 0 ? "on" : ""}">${s[0]}</button>`).join("")}</div>
        <div class="ctrl slider"><label for="rt">Your breathing rate</label><input type="range" id="rt" min="6" max="75" value="14">
          <span class="chip" id="rtv">14 a minute</span></div>`);
      const el = id => document.getElementById(id);
      root.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => {
        root.querySelectorAll("[data-sp]").forEach(x => x.classList.toggle("on", x === b));
        si = +b.dataset.sp; el("need").textContent = `${SPEEDS[si][0]} needs about ${SPEEDS[si][1]} breaths a minute`;
        api.say(SPEEDS[si][0] + " needs about " + SPEEDS[si][1] + " breaths a minute");
      });
      el("rt").oninput = () => { rate = +el("rt").value; el("rtv").textContent = rate + " a minute"; };
      let last = performance.now();
      (function loop(now) {
        if (!alive() || tab !== "run") return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const [, need, speed] = SPEEDS[si];
        o2 = Math.max(0, Math.min(100, o2 + (rate - need) * dt * 2.2));
        down = o2 <= 0;
        if (si === 3 && o2 > 25) { sprintOk += dt; if (sprintOk > 15) api.found("keepup"); } else if (si !== 3) sprintOk = 0;
        if (o2 <= 0) api.found("faint");
        if (si === 0 && rate > 55) { overFast += dt; if (overFast > 5) api.found("over"); } else overFast = 0;
        phase += dt * (down ? 0 : speed * 7);
        const bounce = down ? 0 : Math.abs(Math.sin(phase)) * 6;
        el("runner").setAttribute("transform", `translate(${down ? 120 : 60 + ((phase * 14) % 280)} ${232 - bounce}) scale(${down ? "1.5 1.05" : "1.5"})`);
        const k = Math.sin(phase) * 16, j = Math.cos(phase) * 14;
        el("legs").setAttribute("d", `M0 -18 L${k} 0 M0 -18 L${-k} 0`);
        el("arms").setAttribute("d", `M0 -44 L${j} -26 M0 -44 L${-j} -26`);
        el("chest").setAttribute("ry", 7 + 4 * Math.abs(Math.sin(now / 1000 * rate / 60 * Math.PI)));
        el("puff").textContent = down ? "😵" : o2 < 25 ? "😮‍💨" : rate > need + 28 ? "😵‍💫" : o2 > 60 ? "😄" : "🙂";
        el("bar").setAttribute("width", Math.max(2, 380 * o2 / 100));
        el("bar").setAttribute("fill", o2 < 25 ? "#b4531f" : o2 < 55 ? "#d99a00" : "#2e8b57");
        el("o2t").textContent = down ? "out of oxygen — he has to stop!" : `oxygen ${Math.round(o2)}%`;
        requestAnimationFrame(loop);
      })(performance.now());
    }

    // ── one air sac ─────────────────────────────────────────────────────────
    // Diffusion, not delivery: nobody carries a gas across. Every dot wanders at random, and some
    // wander through the thin wall. Because the air sac is crowded with oxygen and the blood is not,
    // more oxygen wanders down than up — the student only controls what keeps that difference going
    // (breathing and blood flow). Stop both and the two sides even out, which is the lesson.
    function sacBench() {
      const X0 = 44, X1 = 356, SAC = [24, 106], BLOOD = [154, 236], CROSS = 0.6;
      let parts = [], flowing = true, crossed = 0, carried = 0, lastAct = performance.now(), last = performance.now(), spawn = 0;
      const dot = (kind, side) => { const [a, b] = side === "sac" ? SAC : BLOOD;
        return { kind, side, x: X0 + Math.random() * (X1 - X0), y: a + Math.random() * (b - a), h: Math.random() * 6.3 }; };
      for (let i = 0; i < 20; i++) parts.push(dot("o2", "sac"));
      for (let i = 0; i < 16; i++) parts.push(dot("co2", "blood"));
      shell(`<p class="muted">Oxygen (red) and carbon dioxide (grey) wander about on their own. Watch which way more of them drift through the thin wall. You are in charge of breathing and the blood.</p>
        <svg viewBox="0 0 400 262" id="sac" role="img" aria-label="An air sac above a blood vessel, with gas particles moving between them">
          <rect x="36" y="16" width="328" height="98" rx="20" fill="#dff0fb" stroke="#9fc6e0" stroke-width="3"/>
          <text x="200" y="14" text-anchor="middle" font-size="13" fill="#5b6675">inside the air sac</text>
          <rect x="36" y="146" width="328" height="98" rx="20" fill="#fbe3e6" stroke="#e0a6ad" stroke-width="3"/>
          <text x="200" y="258" text-anchor="middle" font-size="13" fill="#5b6675" id="bloodlab">blood vessel — blood flowing →</text>
          <text x="200" y="134" text-anchor="middle" font-size="12" fill="#9aa6b3">thin wall — one cell thick</text>
          <g id="gases"></g>
        </svg>
        <div class="readout"><span class="chip" id="cs">air sac: 20 O₂ · 0 CO₂</span><span class="chip" id="cb">blood: 0 O₂ · 16 CO₂</span><span class="chip" id="cd">oxygen sent to the body: 0</span></div>
        <div class="ctrl"><button id="breathe">😮‍💨 Breathe (fresh air in, old air out)</button><button id="flow" class="on">🩸 Blood flowing</button></div>
        <p class="muted" id="sacmsg"></p>`);
      const el = id => document.getElementById(id);
      const msg = m => { if (el("sacmsg").textContent !== m) { el("sacmsg").textContent = m; api.say(m); } };
      el("breathe").onclick = () => {
        lastAct = performance.now();
        const out = parts.filter(p => p.side === "sac" && p.kind === "co2").length;
        parts = parts.filter(p => !(p.side === "sac" && p.kind === "co2"));
        const have = parts.filter(p => p.side === "sac" && p.kind === "o2").length;
        for (let i = have; i < 20; i++) parts.push(dot("o2", "sac"));
        msg(out ? `You breathed out ${out} carbon dioxide and breathed in fresh oxygen.` : "Fresh oxygen in. Nothing much to breathe out yet.");
      };
      el("flow").onclick = () => {
        flowing = !flowing; lastAct = performance.now();
        el("flow").classList.toggle("on", flowing);
        el("flow").textContent = flowing ? "🩸 Blood flowing" : "✋ Blood stopped";
        el("bloodlab").textContent = flowing ? "blood vessel — blood flowing →" : "blood vessel — blood stopped";
      };
      (function loop(now) {
        if (!alive() || tab !== "sac") return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const calm = api.calm(), speed = calm ? 45 : 90;
        for (const p of parts) {
          p.h += (Math.random() - 0.5) * 2.4;
          p.x += Math.cos(p.h) * speed * dt; p.y += Math.sin(p.h) * speed * dt;
          if (p.side === "blood" && flowing) p.x += 34 * dt;
          if (p.x < X0) { p.x = X0; p.h = Math.PI - p.h; }
          if (p.x > X1) { if (p.side === "blood" && flowing) { p.gone = true; if (p.kind === "o2") carried++; continue; } p.x = X1; p.h = Math.PI - p.h; }
          const [a, b] = p.side === "sac" ? SAC : BLOOD;
          if (p.y < a) {
            if (p.side === "blood" && Math.random() < CROSS) { p.side = "sac"; p.y = SAC[1]; cross(p); } else { p.y = a; p.h = -p.h; }
          } else if (p.y > b) {
            if (p.side === "sac" && Math.random() < CROSS) { p.side = "blood"; p.y = BLOOD[0]; cross(p); } else { p.y = b; p.h = -p.h; }
          }
        }
        parts = parts.filter(p => !p.gone);
        // Blood arriving from the body brings carbon dioxide with it, and no oxygen.
        if (flowing) { spawn += dt * 1.6; while (spawn >= 1) { spawn--; const d = dot("co2", "blood"); d.x = X0; parts.push(d); } }
        const n = (side, kind) => parts.filter(p => p.side === side && p.kind === kind).length;
        const so = n("sac", "o2"), sc = n("sac", "co2"), bo = n("blood", "o2"), bc = n("blood", "co2");
        el("cs").textContent = `air sac: ${so} O₂ · ${sc} CO₂`;
        el("cb").textContent = `blood: ${bo} O₂ · ${bc} CO₂`;
        el("cd").textContent = `oxygen sent to the body: ${carried}`;
        if (carried >= 30) api.found("steep");
        if (!flowing && now - lastAct > 8000 && so + bo >= 6 && Math.abs(so - bo) <= 2 && api.found("even"))
          msg("Both sides have about the same now, so as many drift up as drift down. Breathe and get the blood moving again to bring the difference back.");
        el("gases").innerHTML = parts.map(p => p.kind === "o2"
          ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="#e8555f"/>`
          : `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="#8d97a3"/>`).join("");
        requestAnimationFrame(loop);
      })(last);
      function cross(p) {
        crossed++;
        if (p.kind === "o2" && p.side === "blood" && api.found("o2")) msg("Nobody pushed it — oxygen drifts from where there is lots of it to where there is little.");
        if (p.kind === "co2" && p.side === "sac" && api.found("co2")) msg("Carbon dioxide drifts the other way, because the blood has more of it than the air.");
        if (crossed >= 20) api.found("swap20");
      }
    }

    // ── limewater ───────────────────────────────────────────────────────────
    function limeBench() {
      let a = 0, b = 0, hold = null;
      shell(`<p class="muted">Limewater goes milky when carbon dioxide bubbles through it. Hold a button down — can you still see the X through the tube?</p>
        <svg viewBox="0 0 400 210" role="img" aria-label="Two test tubes of limewater">
          ${[["A", 120, "breathed-out air"], ["B", 280, "room air"]].map(([n, x, lab]) => `
            <rect x="${x - 34}" y="40" width="68" height="140" rx="30" fill="#f7fbff" stroke="#7f8c99" stroke-width="4"/>
