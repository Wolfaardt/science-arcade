pic"], ["72c0199c83", "Two different things move, and they are not the same thing. Electrons move through the metal wires of the external circuit. Ions move through the electrolyte. Electrons never travel through the solution. Confusing these two is the single most heavily penalised error in this unit"], ["46b47d3987", "The cathode is negative, so it attracts positive ions and gives electrons away — reduction. The anode is positive, so it attracts negative ions and takes electrons — oxidation. Both are forced by the power supply: the battery is doing the work, not the chemistry"], ["d7961e43c6", "A molten binary compound has no competition. It contains exactly two ions, so the metal is discharged at the cathode and the non-metal at the anode, every time. There is nothing to decide"], ["b42ebef890", "Water changes everything. Water supplies H⁺ and OH⁻, so an aqueous solution contains four ions and there is a competition. Two rules settle it: reactivity decides the cathode, concentration decides the anode"], ["c950e2bed4", "Inert electrodes carry the current; active electrodes join in. Swapping carbon for copper does not change what arrives at the electrode — it changes what the electrode itself does. That is why the same electrolyte can give oxygen at one anode and dissolve the other"]]}, {"id": "g9-igcse1-u05", "n": 5, "tag": "Unit 5", "title": "Chemical Energetics", "terms": [["bf7d6dff45", "Exothermic reaction", "A reaction that transfers thermal energy to the surroundings, so their temperature increases"], ["cef4f2175c", "Endothermic reaction", "A reaction that takes in thermal energy from the surroundings, so their temperature decreases"], ["821c56dae2", "Surroundings", "Everything around the reacting particles: the water, the container, the air"], ["049d697f7a", "Enthalpy change, ΔH", "The transfer of thermal energy during a reaction, in kJ/mol. Negative for exothermic, positive for endothermic"], ["2b749d02ef", "Reaction pathway diagram", "A diagram of energy against progress of reaction, showing the reactants, the products, Ea and ΔH"], ["5032a2512f", "Activation energy, Ea", "The minimum energy that colliding particles must have to react"], ["246c49a5ec", "Bond breaking", "An endothermic process: energy is taken in"], ["79cecd8e86", "Bond making", "An exothermic process: energy is given out"], ["aadd4eaa1d", "Bond energy", "The energy needed to break one mole of a particular bond, in kJ/mol. The same energy is given out when it forms"], ["abf7961589", "Displayed formula", "A formula that shows every atom and every bond in a molecule"]], "checks": [], "facts": [["8729d78b34", "Breaking a bond takes energy in; making a bond gives energy out. Atoms that are bonded attract each other, so you must put energy in to pull them apart. When they bond again, that same amount of energy is released. No bond is ever broken with energy given out"], ["5048a224b2", "The thermometer measures the surroundings, not the chemicals. The surroundings are everything around the reacting particles: the water they are dissolved in, the beaker, the air, your hand. Energy leaving the chemicals warms the surroundings; energy taken in by the chemicals cools them"], ["c124343727", "ΔH is the energy change of the chemicals, seen from the inside. When the chemicals lose energy to the surroundings, their energy goes down, so ΔH is negative. When they gain energy from the surroundings, ΔH is positive. Temperature rise and negative ΔH are the same event, seen from two sides"], ["751c76aebc", "Products lower than reactants means energy was given out. On a reaction pathway diagram the height of a line is how much energy the chemicals have. If the products finish lower than the reactants started, the difference has gone into the surroundings"], ["df1b080fff", "Every reaction has to climb a hill first. Even a reaction that gives out energy must start by breaking some bonds. So colliding particles need a minimum amount of energy before anything happens. That minimum is the activation energy, and it is the hump on the diagram"]]}, {"id": "g9-igcse1-u06", "n": 6, "tag": "Unit 6", "title": "Chemical Reactions", "terms": [["84f7683877", "Physical change", "A change that produces no new substance"], ["f1b1a9ec69", "Chemical change", "A change that produces one or more new substances"], ["5a4d26da3f", "Rate of reaction", "How quickly reactants are used up or products are formed, per unit time"], ["0a0a139543", "Catalyst", "A substance that increases the rate of a reaction and is unchanged in mass and chemical composition at the end"], ["42ca883de1", "Enzyme", "A biological catalyst"], ["f710fe3bbf", "Collision theory", "The model that reaction requires collisions with at least the activation energy"], ["b31ac3cb92", "Activation energy", "The minimum energy that colliding particles must have in order to react"], ["026b62b516", "Successful collision", "A collision that results in a reaction"], ["2ae71fa7cd", "Limiting reactant", "The reactant that is completely used up, and which therefore sets the amount of product"], ["13e6dcf775", "Reversible reaction", "A reaction in which the products can re-form the reactants, written with ⇌"], ["707adc14a8", "Closed system", "A system from which nothing can enter or leave"], ["6af117ee61", "Equilibrium", "The state in a closed system where the forward and backward rates are equal and the concentrations are constant"], ["f42ce17f7c", "Position of equilibrium", "Whether the equilibrium mixture is mostly products or mostly reactants"], ["2868eb9f6d", "Hydrated", "Containing water of crystallisation"], ["fc6fb83840", "Anhydrous", "Containing no water of crystallisation"], ["de5cf43396", "Compromise conditions", "Conditions chosen to balance yield against rate, cost and safety"], ["efc0341216", "Redox reaction", "A reaction in which oxidation and reduction occur simultaneously"], ["acdddc4c41", "Oxidation", "Gain of oxygen; loss of electrons; increase in oxidation number"], ["255231517c", "Reduction", "Loss of oxygen; gain of electrons; decrease in oxidation number"], ["f9c5e0d489", "Oxidation number", "A signed number describing the degree of oxidation of an atom"], ["c723711143", "Oxidising agent", "A substance that oxidises another substance and is itself reduced"], ["9d4ef4285e", "Reducing agent", "A substance that reduces another substance and is itself oxidised"], ["c40dbd541a", "Half-equation", "An equation showing only the electron loss or only the electron gain"]], "checks": [], "facts": [["f5d4d5c97e", "A chemical change makes a new substance; a physical change does not. That is the whole definition. Reversibility, colour and energy are clues, not the test — a reversible chemical change is still a chemical change"], ["0663dde2b1", "Particles must collide to react, and they must collide with at least a minimum energy — the activation energy — for the collision to do anything. Every rate fact in this unit is an answer to one of two questions: how often do they collide, and what fraction of those collisions has enough energy?"], ["5bbff61115", "Rate and yield are different questions. How fast a reaction goes is set by the conditions; how much product it eventually makes is set by how much reactant there was. A steeper graph and a higher graph mean different things, and a catalyst changes only the first"], ["82831701b4", "A catalyst speeds a reaction up by offering a route with a lower activation energy, and is chemically unchanged at the end. It never makes more product, and it never makes the particles move faster"], ["54cfaad6a9", "In a closed system, a reversible reaction reaches equilibrium: the forward and reverse reactions are still running, at equal rates, so the concentrations stop changing. Change a condition and the position shifts to oppose that change"], ["db09fe18b8", "Oxidation and reduction always happen together. One substance cannot lose electrons unless another gains them. Whether you track oxygen, electrons, or oxidation numbers, you are looking at the same event from three angles"]]}]}, {"grade": "g9-0654", "label": "Grade 9 · Co-ordinated", "strap": "IGCSE Co-ordinated Sciences 0654 · Year 1", "units": [{"id": "g9-0654-b01", "n": 1, "tag": "Biology 1", "title": "Characteristics of Living Organisms", "terms": [["21c0ebee0e", "Organism", "A complete living thing, such as a bacterium, a mango tree or you"], ["5bc5083560", "Movement", "An action by an organism or part of an organism causing a change of position or place"], ["0bdc34dd7f", "Respiration", "The chemical reactions in cells that break down nutrient molecules and release energy for metabolism"], ["cd2ccd1a16", "Sensitivity", "The ability to detect and respond to changes in the internal or external environment"], ["e344aa2353", "Growth", "A permanent increase in size and dry mass"], ["069b99c338", "Reproduction", "The processes that make more of the same kind of organism"], ["1bfb6bef66", "Excretion", "The removal of the waste products of metabolism and substances in excess of requirements"], ["9f74c5e4cf", "Nutrition", "The taking in of materials for energy, growth and development"], ["81985e1ef4", "Metabolism", "All the chemical reactions that happen in an organism's cells"], ["120a78d684", "Stimulus", "A change in the environment that an organism can detect (plural: stimuli)"], ["1999bdad83", "Dry mass", "The mass of an organism after all its water has been removed"], ["95fe6f44cb", "Egestion", "Passing out undigested food as faeces — not one of the seven characteristics"], ["31ff20d991", "Breathing", "Moving air into and out of the lungs — not the same as respiration"]], "checks": [["bd621350ea", "Sensitivity is one of the characteristics of living organisms. Define the term sensitivity", "The ability to detect (or sense) changes in the internal or external environment and to respond to them"], ["75a4f03b37", "A student says that plants do not respire because they do not breathe. Explain why the student is wrong", "Respiration is a set of chemical reactions in cells that releases energy from nutrient molecules. It happens in every living cell, including plant cells; breathing only moves air in and out of lungs"], ["cd4fc78115", "Complete the definition: Growth is a permanent increase in size and ……… by an increase in cell ……… or cell ………", "dry mass · number / size (either order; both needed for the second mark)"], ["7ba45dfa69", "On a sunny day oxygen leaves a leaf through its stomata. State which characteristic of living organisms this is, and explain your answer", "Excretion. The oxygen is a waste product of a chemical reaction in the leaf cells (photosynthesis), so it is a waste product of metabolism being removed"], ["4064bf8898", "A lion chases a zebra. While the lion is still chasing, which characteristic of living organisms is it not showing: movement, nutrition, respiration or sensitivity? Explain your choice", "Nutrition. The lion has not yet taken in any materials; it is moving (chasing), sensitive (it detects the zebra) and respiring (releasing energy in its muscle cells)"]], "facts": [["87b366804f", "Every living organism shows all seven characteristics at some stage of its life. A non-living thing may show one or two, never all seven"], ["88b9741089", "Each characteristic is something the organism does itself, using its own cells. Something done to it from outside does not count. Wind moving a leaf is not movement; water swelling a pufferfish is not growth"], ["d5a7a23202", "Respiration happens in every living cell and releases the energy for all the other processes. It is a set of chemical reactions, not breathing"], ["f88b9dec31", "The chemical reactions in cells are called metabolism, and metabolism makes waste. Removing that waste, and any substance in excess, is excretion. Material that never entered the cells, such as undigested food, is not a waste of metabolism"], ["9c4526cb0a", "Growth means new material: a permanent increase in size and dry mass. Taking in water makes an organism heavier but builds nothing, and it can be reversed"]]}, {"id": "g9-0654-c01", "n": 1, "tag": "Chemistry 1", "title": "States of Matter", "terms": [["6712004691", "Kinetic energy", "the energy a particle has because it is moving"], ["894d01814f", "Kinetic particle theory", "the model that explains the properties of matter by the movement and arrangement of its particles"], ["804e5bf037", "Forces of attraction", "the attractions between particles that hold solids and liquids together"], ["dff7e17a23", "Melting point", "the temperature at which a solid turns into a liquid"], ["6149e790b5", "Boiling point", "the temperature at which a liquid turns into a gas throughout the liquid"], ["9a44bfd66b", "Melting", "solid → liquid"], ["d6f1dd7f0b", "Freezing (solidifying)", "liquid → solid"], ["2a2c720674", "Boiling", "liquid → gas, throughout the liquid, at the boiling point"], ["a423b15320", "Evaporating", "liquid → gas, at the surface, below the boiling point"], ["ca8648eba9", "Condensing", "gas → liquid"], ["6c78c96fce", "Physical change", "a change in which no new substance is formed, such as a change of state"], ["b8b466b148", "Compressible", "able to be squeezed into a smaller volume"], ["ce7624c9c4", "Gas pressure", "the push of gas particles colliding with the walls of their container"], ["7d5714d3b6", "Diffusion", "the net movement of particles from a higher to a lower concentration, because of their random motion"], ["2e1754aed0", "Relative molecular mass (Mr)", "the sum of the relative atomic masses of all the atoms in a molecule"]], "checks": [], "facts": [["399be8eda0", "All matter is made of particles that are always moving. In a solid they vibrate about fixed positions. In a liquid and a gas they move from place to place"], ["62efa9b1fa", "The particles themselves never change in a change of state. A water molecule is the same molecule in ice, in water and in steam. What changes is how far apart the particles are, how they are arranged and how fast they move. So a change of state is a physical change: no new substance is formed"], ["f0ec599a95", "Temperature is a measure of the average kinetic energy of the particles. A higher temperature means the particles move faster on average"], ["bfff3016d8", "Particles attract one another. The forces of attraction are strong when the particles are close. To pull particles apart, energy must be supplied to overcome these forces; when they come back together, energy is given out"]]}, {"id": "g9-0654-p01", "n": 1, "tag": "Physics 1", "title": "Measurement, Motion, Mass and Density", "terms": [["c32754cc4d", "Parallax error", "A reading error caused by looking at a scale from the side instead of straight on"], ["22e876837e", "Meniscus", "The curved surface of a liquid in a tube; read the bottom of it"], ["5121b8f056", "Oscillation", "One complete swing, out and back to the starting point"], ["9868be06ff", "Period", "The time for one complete oscillation"], ["75e380df53", "Scalar", "A quantity with magnitude (size) only, such as speed, mass or time"], ["c41f5dcd28", "Vector", "A quantity with magnitude and direction, such as force, weight, velocity or acceleration"], ["3fd3efc0ee", "Speed", "The distance travelled per unit time"], ["d3afbbb525", "Average speed", "The total distance travelled divided by the total time taken"], ["428a6e41d5", "Velocity", "Speed in a given direction"], ["0537a38069", "Acceleration", "The change in velocity per unit time"], ["468084e974", "Deceleration", "A negative acceleration: slowing down"], ["2dd36711e9", "Gradient", "The steepness of a line on a graph: rise ÷ run"], ["96e3ab7c3b", "Mass", "The quantity of matter in an object, in kilograms"], ["08ddae3ae5", "Weight", "The gravitational force on a mass, in newtons"], ["03800012b7", "Gravitational field strength", "The gravitational force per unit mass, in N/kg; about 9.8 N/kg near the Earth"], ["82d68a1fce", "Density", "Mass per unit volume"], ["e03418806e", "Displacement method", "Finding the volume of an object from the rise in water level when it is put under water"]], "checks": [["a57958d68a", "A student wants to find the period of a pendulum. Explain why she times 20 oscillations instead of one", "One oscillation is too short to time accurately; the reaction time is a large part of it. Timing 20 oscillations and dividing by 20 makes the error in each period much smaller (20 times smaller)"], ["94e5ee4590", "Circle two vector quantities: acceleration · speed · temperature · time · weight", "acceleration · weight"], ["fb3a0d484f", "A girl runs 5000 m in 1200 s and then walks 3000 m in 1800 s. Calculate her average speed for the whole journey", "Find: average speed. Formula: average speed = total distance ÷ total time. Knowns: total distance = 5000 + 3000 = 8000 m; total time = 1200 + 1800 = 3000 s. Substitute: 8000 ÷ 3000. Answer: 2.7 m/s. Check: she ran at about 4 m/s and walked at under 2 m/s, so 2.7 m/s in between makes sense"], ["065c2e6fee", "State the difference between speed and velocity", "Speed has magnitude only (it is a scalar). Velocity has magnitude and direction (it is a vector)"], ["e16ab3546a", "A canoe slows down from 4.0 m/s to 0.5 m/s in 5.0 s. Calculate its deceleration", "Find: deceleration. Formula: a = Δv / Δt. Change in speed Δv = 4.0 − 0.5 = 3.5 m/s . Substitute: a = 3.5 ÷ 5.0 . Answer: 0.70 m/s² (deceleration) . Check: it loses less than 1 m/s each second, which suits a canoe gliding to a stop"], ["d1e3f65dd7", "A clay shape is dropped from 1.5 m. It hits the ground at 5.2 m/s after 0.61 s. (a) Calculate its average acceleration. (b) Explain why it is less than the acceleration of free fall", "(a) a = Δv / Δt = 5.2 ÷ 0.61 = 8.5 m/s² . (b) There is air resistance on the shape ; it acts upwards, opposite to its weight, so the shape speeds up less quickly than in free fall"], ["2ab0471285", "A forklift lifts a crate of mass 140 kg. Calculate the weight of the crate. g = 10 N/kg", "W = m × g = 140 × 10 = 1400 N"], ["d4ee9aedd1", "Weight is a force caused by the effect of a ……… field on a ………", "gravitational (field) · mass (both words needed for the mark)"], ["a90f1c19b2", "A small meteorite has a mass of 1720 g and a volume of 200 cm³. Calculate its density", "Find: density. Formula: ρ = m / V. Knowns: m = 1720 g, V = 200 cm³. Substitute: ρ = 1720 ÷ 200 . Answer: 8.6 g/cm³ . Check: denser than water and close to iron (7.9 g/cm³), which suits an iron meteorite"], ["5a19580e11", "An iceberg has a volume of 2.0 × 10⁵ m³ and a density of 920 kg/m³. Calculate its mass", "Rearrange: m = ρ × V = 920 × 2.0 × 10⁵ = 1.84 × 10⁸ kg"], ["cb159cb9b8", "Four blocks have the same mass. Block D has the largest volume. State which block is made of the least dense material, and explain your answer", "Block D. Density = mass ÷ volume; the masses are equal, so the block with the largest volume has the smallest density"]], "facts": [["3cefbaa28e", "Every measurement has a reading error. You make its effect smaller in two ways: read the scale straight on, and measure something bigger (many swings, many sheets, a longer distance) so the same error is a smaller fraction of it"], ["bdf640f67f", "Speed, acceleration, g and density are all \"per unit\" quantities: one quantity divided by another. The unit tells you the recipe. m/s is metres divided by seconds. N/kg is newtons divided by kilograms. g/cm³ is grams divided by cubic centimetres"], ["c29200d279", "On a graph against time, the gradient is the \"per second\" quantity. The gradient of a distance–time graph is speed. The gradient of a speed–time graph is acceleration. And the area under a speed–time graph is speed × time, which is distance"], ["e30097f6a8", "Mass is the amount of matter and never changes with place. Weight is a force from gravity, so it changes when g changes. Mass is in kilograms; weight is in newtons"], ["579a363077", "Density belongs to the material, not to the object. Cut a block in half and the mass and the volume both halve, so their ratio stays the same. Whether something floats depends on its density compared with the liquid's"]]}, {"id": "g9-0654-b02", "n": 2, "tag": "Biology 2", "title": "Cells", "terms": [["aaec0f0e0e", "Cell", "The smallest unit of a living organism"], ["3abe47b18d", "Cell membrane", "The thin layer round every cell that controls what enters and leaves; partially permeable"], ["5d792ed083", "Cell wall", "A strong layer outside the membrane of plant cells (cellulose) and bacteria (not cellulose); fully permeable"], ["616e562e77", "Cytoplasm", "The jelly inside the membrane where most chemical reactions happen"], ["dae1685f43", "Nucleus", "The part of a plant or animal cell that holds the DNA in chromosomes"], ["79bc4f7efe", "Ribosome", "A tiny structure that makes proteins"], ["8e0716454a", "Mitochondrion", "Where aerobic respiration happens, releasing energy (plural: mitochondria)"], ["c612db5b7c", "Chloroplast", "Where photosynthesis happens; contains chlorophyll"], ["e9186cf2d9", "Vacuole", "A space inside a cell surrounded by a membrane; in plants, large, permanent and full of cell sap"], ["792c98f5ec", "Circular DNA", "The single loop of DNA in a bacterial cell"], ["9c1d55465d", "Plasmid", "A small extra ring of DNA in a bacterial cell"], ["fbeedbaf20", "Specialised cell", "A cell whose structure fits it for one particular job"], ["8a18cafb06", "Gamete", "A sex cell: a sperm or an egg"], ["40cad9560b", "Haploid", "Having one set of chromosomes, as in a gamete"], ["5d08edd76a", "Tissue", "A group of similar cells carrying out the same job"], ["b2fafa5978", "Organ", "Different tissues working together to carry out a job"], ["cd0f66abdb", "Organ system", "A group of organs working together"], ["f372900705", "Magnification", "How many times bigger the image is than the real object: image size ÷ actual size"], ["9f93cb70fd", "Micrometre (µm)", "One thousandth of a millimetre: 1 mm = 1000 µm"]], "checks": [["995f5444e2", "State two structures that are found in plant cells but not in animal cells", "Any two from: cell wall · chloroplasts · (large, permanent) vacuole"], ["56b5756578", "State two ways in which a bacterial cell is different from a plant cell", "Any two from: a bacterial cell has no nucleus · it has circular DNA / plasmids · its cell wall is not made of cellulose · it has no chloroplasts · it has no (large) vacuole"], ["a115d2af67", "Root hair cells are plant cells, but they do not contain chloroplasts. Explain why root hair cells do not need chloroplasts", "Root hair cells are underground, so they receive no light · they do not photosynthesise; their job is to absorb water and mineral ions"], ["39434f415d", "Describe two ways in which a red blood cell is adapted for transporting oxygen", "Any two from: it contains haemoglobin (which carries oxygen) · it has no nucleus (so more room for haemoglobin) · it is biconcave / has a large surface area (for oxygen to diffuse in and out)"], ["d755035e6b", "Explain how the structure of a ciliated cell is related to its function", "It has cilia · which beat to move mucus (and the pathogens it traps) up and out of the trachea and bronchi"], ["2d59033868", "Match each part of the body to its level of organisation: lung, lymphocyte, intercostal muscle. The levels are cell, tissue and organ", "lymphocyte — cell · intercostal muscle — tissue · lung — organ"], ["078e9d4092", "A drawing of a flower is 80 mm across. The magnification of the drawing is ×4. Calculate the actual width of the flower", "A = I ÷ M · A = 80 ÷ 4 = 20 mm · Check: magnified ×4, so the real flower must be smaller than the drawing. It is"], ["763f44aec8", "There are 37 cells across the width of a root tip. The actual width of the root tip is 1.2 mm. Calculate the average width of one cell in mm", "width of one cell = 1.2 ÷ 37 · = 0.032 mm"], ["72c692c26a", "A photograph of a cell is 60 mm wide. The real cell is 40 µm wide. Calculate the magnification of the photograph", "Convert: 60 mm × 1000 = 60 000 µm · M = 60 000 ÷ 40 = ×1500"]], "facts": [["51e7d24bd0", "All organisms are made of cells, and new cells are made only when an existing cell divides into two"], ["c10a5e12dd", "Every cell has the same basic kit: a cell membrane that controls what goes in and out, cytoplasm where the chemical reactions happen, ribosomes that make proteins, and DNA that holds the instructions"], ["63488bd8b9", "A cell has a part only if it needs that part's job. Chloroplasts are only where there is light. Muscle cells are packed with mitochondria because they need a lot of energy. A specialised cell is this rule taken to the limit"], ["fe79c7caa6", "A cell wall sits outside the cell membrane. It is strong, it lets almost everything through, and it stops the cell bursting. Plants and bacteria have walls; animal cells never do"], ["4660f455ba", "Magnification compares two sizes in the same unit: magnification = image size ÷ actual size. It has no unit, so it is written with a × sign, such as ×400"]]}, {"id": "g9-0654-c02", "n": 2, "tag": "Chemistry 2", "title": "Atoms, Elements and Compounds", "terms": [["c58a27ac87", "Element", "A substance containing only one type of atom"], ["cc66cec8b0", "Compound", "Two or more types of atom chemically bonded in a fixed ratio"], ["a1c7294c15", "Mixture", "Two or more substances not chemically bonded"], ["a7d308e7d5", "Nucleus", "The central part of an atom, containing the protons and neutrons"], ["e945d39046", "Proton number (atomic number)", "The number of protons in the nucleus; it defines the element"], ["a0805fe7ba", "Nucleon number (mass number)", "The total number of protons and neutrons in the nucleus"], ["1a1cd96e18", "Shell", "A region around the nucleus in which electrons are found"], ["74d366e48e", "Electronic configuration", "The arrangement of electrons in shells, e.g. 2,8,1"], ["2152e18c39", "Isotopes", "Atoms of the same element with the same proton number but different numbers of neutrons"], ["0bba0608bc", "Relative atomic mass (Aᵣ)", "The average mass of an element's isotopes on the carbon-12 scale (described in Stoichiometry, C3.2.1)"], ["46036c67bd", "Ion", "An atom or group of atoms carrying an electrical charge"], ["cf45e60198", "Cation", "A positive ion, formed when an atom loses electrons"], ["a772b04497", "Anion", "A negative ion, formed when an atom gains electrons"], ["2ffb6d8ae1", "Ionic bond", "The strong electrostatic attraction between oppositely charged ions"], ["d59baca770", "Giant ionic lattice", "A regular 3-D arrangement of alternating positive and negative ions"], ["1233f75131", "Covalent bond", "A shared pair of electrons between two atoms"], ["107b5fcd94", "Molecule", "A group of atoms held together by covalent bonds"], ["fb9becb85c", "Intermolecular forces", "The weak forces of attraction between separate molecules"], ["80414eb760", "Giant covalent structure", "A continuous network of atoms joined by covalent bonds"], ["02da7f5705", "Delocalised electron", "An electron not attached to one atom, free to move through the structure"], ["3459997345", "Metallic bond", "The electrostatic attraction between positive metal ions and the sea of delocalised electrons"], ["d7fa198b49", "Malleable", "Able to be hammered into shape without breaking"]], "checks": [["b9f88ca018", "Explain why air is classified as a mixture and not as a compound", "The gases in air are not chemically bonded / combined together. They are present in no fixed ratio and can be separated by physical means"], ["5e1e30ab8f", "An atom has proton number 15 and nucleon number 31. State its electronic configuration and give its group and period", "15 electrons, so the configuration is 2,8,5. Five outer-shell electrons, so Group V. Three occupied shells, so Period 3"], ["ec7cc98590", "Explain why solid magnesium oxide does not conduct electricity but molten magnesium oxide does", "In the solid, the ions are held in fixed positions in the lattice. When molten, the lattice breaks down and the ions are free to move. Moving ions carry the electrical charge through the liquid"], ["54e31c1990", "Graphite is used as a lubricant and also as an electrode. Explain, in terms of its structure, why it can do both", "Graphite has layers of carbon atoms held together by weak forces between the layers. These layers can slide over each other, which makes it slippery and useful as a lubricant. Each carbon atom uses only three of its four outer electrons for bonding. The fourth electron is delocalised and free to move, so graphite conducts electricity and can be used as an electrode"], ["e7cbe8491f", "Explain, in terms of structure and bonding, why copper is malleable", "Copper consists of layers of positive metal ions in a sea of delocalised electrons. The layers of ions can slide over each other when a force is applied, without breaking the metallic bond"]], "facts": [["943d662b72", "An atom has a tiny central nucleus containing protons and neutrons, surrounded by electrons moving in shells. Almost all the mass is in the nucleus; almost all the volume is empty space around it"], ["f678f7bccb", "The proton number decides which element an atom is. Change it and you have a different element. Nothing else does this — not the neutrons, not the electrons"], ["e4434e0b2c", "Chemistry happens in the outer shell only. Two atoms with the same number of outer-shell electrons react in the same way, whatever else is different about them"], ["314a20fb8e", "A full outer shell is stable. The noble gases already have one, which is why they are unreactive. Every other atom bonds in order to reach one"], ["58ca1d581b", "There are exactly three ways to reach a full outer shell: lose electrons, gain electrons, or share them. Metal + non-metal gives ionic bonding, non-metal + non-metal gives covalent bonding, metal + metal gives metallic bonding. That is the whole map"]]}, {"id": "g9-0654-p02", "n": 2, "tag": "Physics 2", "title": "Forces, Energy and Pressure", "terms": [["0cf49be1ff", "Force", "A push or pull, measured in newtons; a vector"], ["141f8473c7", "Resultant force", "The single force with the same effect as all the forces acting together"], ["9f6aced597", "Friction", "A force that opposes the relative motion of two surfaces, and produces heating"], ["fc4f6e532e", "Drag / air resistance", "Friction in a liquid / in a gas; it grows with speed"], ["0ac00dd3ab", "Upthrust", "The upward force from a liquid on an object in it"], ["4d7e474a6a", "Hooke's law", "The extension is directly proportional to the load (up to the limit of proportionality)"], ["439b2ec2ae", "Spring constant", "The force per unit extension, k = F / x"], ["424fcb4321", "Limit of proportionality", "The point beyond which extension is no longer proportional to load"], ["c23e500883", "Moment", "The turning effect of a force: force × perpendicular distance from the pivot"], ["17dca629d7", "Pivot", "The fixed point an object turns about"], ["26b413f491", "Equilibrium", "No resultant force and no resultant moment"], ["b2fadc0f23", "Principle of moments", "In equilibrium, clockwise moments = anticlockwise moments"], ["633d3b6c71", "Centre of gravity", "The point where the whole weight of an object seems to act"], ["c507d910ae", "Energy store", "Where energy is kept: kinetic, gravitational potential, chemical, elastic, nuclear, electrostatic, internal"], ["ed893cfb89", "Conservation of energy", "Energy cannot be created or destroyed, only transferred"], ["a05ce980ce", "Work done", "The energy transferred when a force moves an object, W = Fd"], ["fac413a3cf", "Power", "The work done (or energy transferred) per unit time, in watts"], ["7573b590a3", "Efficiency", "The useful energy (or power) output as a percentage of the total input"], ["56f68e5fba", "Renewable", "An energy resource that will not run out"], ["2744d592f0", "Nuclear fusion", "Light nuclei joining, releasing energy (in the Sun)"], ["84fc6165f3", "Nuclear fission", "A heavy nucleus splitting, releasing energy (in a reactor)"], ["12b6199908", "Pressure", "Force per unit area, in pascals (N/m²)"]], "checks": [["d4ca839921", "At launch, a rocket has a thrust of 15.7 × 10⁶ N upwards and a weight of 7.8 × 10⁶ N. Calculate the resultant force and describe the motion of the rocket", "resultant = 15.7 × 10⁶ − 7.8 × 10⁶ = 7.9 × 10⁶ N (upwards) · the rocket accelerates upwards"], ["b657d7cabc", "A tractor moves at a constant speed. The forward force on it is 1500 N. State the value of the backward force R on the tractor, and explain your answer", "1500 N · the speed is constant, so the forces are balanced and the resultant force is zero"], ["6600c38de7", "A man paddles a canoe. The forward force is 600 N and the drag on the canoe is 200 N. The total mass of the man and canoe is 100 kg. Calculate the acceleration of the canoe", "Find: a. Resultant force = 600 − 200 = 400 N . Formula: a = F / m = 400 ÷ 100 . Answer: 4.0 m/s² . Check: about the acceleration of a fast car, which is plausible for a racing canoe for a moment"], ["13e486f47d", "A skydiver of mass 84 kg falls. At one moment the air resistance on her is 760 N. Calculate her acceleration at that moment. g = 10 N/kg", "weight = mg = 84 × 10 = 840 N; resultant = 840 − 760 = 80 N · a = F / m = 80 ÷ 84 · = 0.95 m/s² (downwards)"], ["1b7d5f6eab", "A spring is 16 cm long with a load of 12 N and 20 cm long with a load of 20 N. Calculate its spring constant", "An extra 8 N gives an extra 4 cm of extension · k = F / x = 8 ÷ 4 = 2.0 N/cm"], ["f1f5218a67", "A driver pushes on a brake pedal with a force of 35 N, 0.22 m from the pivot. Calculate the moment of the force about the pivot", "moment = F × d = 35 × 0.22 = 7.7 N m"], ["6be513fbd8", "A 3.0 m bar is used to lift a rock of weight 900 N. The pivot is 0.50 m from the rock. Calculate the minimum force needed at the other end of the bar. Ignore the weight of the bar", "distance from the pivot to the force = 3.0 − 0.50 = 2.5 m · anticlockwise moment = clockwise moment: 900 × 0.50 = F × 2.5 · F = 450 ÷ 2.5 = 180 N"], ["da375eae68", "Explain why a forklift truck is more stable when it carries its crate low down", "Its centre of gravity (centre of mass) is lower"], ["36b0c3f7fd", "A bee of mass 0.20 g flies at 5.8 m/s. Calculate its kinetic energy", "Convert: 0.20 g = 0.000 20 kg . Formula: Eₖ = ½mv² = 0.5 × 0.000 20 × 5.8² . Answer: 0.0034 J (3.4 × 10⁻³ J) . Check: tiny, which suits a bee"], ["7acc0f1215", "A car travelling at 18 m/s has 230 000 J of kinetic energy. Calculate its mass", "m = 2Eₖ ÷ v² = 2 × 230 000 ÷ 18² = 1400 kg"], ["9b4757d642", "A diver of mass 70 kg falls 5.0 m into a pool. There is no air resistance. (a) Calculate the change in his gravitational potential energy. (b) Calculate his speed as he enters the water. g = 9.8 N/kg", "(a) ΔEₚ = mgΔh = 70 × 9.8 × 5.0 = 3400 J . (b) Eₖ = 3400 J, so 3400 = 0.5 × 70 × v² ; v² = 97, v = 9.9 m/s"], ["ac2b182307", "A forklift lifts a crate of weight 1400 N through 1.5 m. Calculate the work done on the crate. State the unit", "W = F × d = 1400 × 1.5 = 2100 J"], ["395cbb766f", "A crane lifts a 300 kg load through 20 m in 1.0 minute. Calculate its average power output. g = 10 N/kg", "W = mgh = 300 × 10 × 20 = 60 000 J · t = 60 s · P = 60 000 ÷ 60 = 1000 W"], ["bd2e9a9187", "A 250 W electric motor lifts a 50 N load through 4.0 m in 3.0 s. Calculate the efficiency of the motor", "useful work = F × d = 50 × 4.0 = 200 J, so useful power = 200 ÷ 3.0 = 67 W · efficiency = 67 ÷ 250 × 100% · = 27%"], ["c39bc1c4b0", "A laser has a useful power output of 1200 W and is 80% efficient. Calculate its power input", "input = useful output ÷ efficiency = 1200 ÷ 0.80 = 1500 W"], ["fd6613f789", "A horse of weight 4500 N stands on four hooves. Each hoof has an area of 90 cm². Calculate the pressure on the ground in N/m²", "total area = 4 × 90 = 360 cm² = 0.036 m² · p = F / A = 4500 ÷ 0.036 · = 125 000 N/m² (Pa)"], ["43c4937dbd", "Wind exerts a pressure of 7200 Pa on a turbine blade of area 90 m². Calculate the force on the blade", "F = p × A = 7200 × 90 = 650 000 N"]], "facts": [["802ccdc0b5", "Only the resultant force matters for motion. Forces along one line add when they point the same way and subtract when they point opposite ways. What is left over is the resultant"], ["442037979e", "No resultant force means no change in motion. An object at rest stays at rest; a moving object keeps the same speed in the same direction. A resultant force makes the object accelerate in the direction of the resultant: F = ma"], ["d23caf8873", "A force turns things as well as pushing them. Its turning effect, the moment, is force × perpendicular distance from the pivot. A balanced object has no resultant force and no resultant moment"], ["7aa2aab4f2", "Energy is never created or destroyed; it moves between stores. A force that moves through a distance moves energy: work done = force × distance = energy transferred. Some of the energy always ends up heating the surroundings, which is why no machine is 100% efficient"], ["8f94262204", "Power, efficiency and pressure are \"per\" or \"share\" quantities. Power is energy per second. Efficiency is the useful share of the energy put in. Pressure is force per unit area. The unit tells you the recipe, as in Unit 1"]]}, {"id": "g9-0654-b03", "n": 3, "tag": "Biology 3", "title": "Movement into and out of Cells", "terms": [["a74d86fdea", "Diffusion", "The net movement of particles from a higher to a lower concentration, down a concentration gradient, as a result of their random movement"], ["d1b49daec4", "Concentration gradient", "The difference in concentration between two places"], ["be3b4c7ebe", "Net movement", "The overall movement, once movements in both directions are taken into account"], ["7641844bb4", "Partially permeable", "Lets some substances through (small molecules such as water) but not others (large molecules)"], ["92031fa886", "Fully permeable", "Lets almost everything through, like a cell wall"], ["7c07d0ae2e", "Visking tubing", "A partially permeable tubing used as a model of a cell membrane; also called dialysis tubing"], ["890864e989", "Solute", "A substance dissolved in a liquid"], ["4da2fec9ab", "Solvent", "The liquid a solute dissolves in; in living things, water"], ["c6299c2a70", "Water potential", "A measure of how much water is free to move: high in a dilute solution, low in a concentrated one"], ["910c17757f", "Osmosis", "The net movement of water molecules from a higher to a lower water potential, through a partially permeable membrane"], ["5da3f1d6cc", "Turgor pressure", "The pressure of the cell contents pushing outwards on the cell wall"], ["d8e6cd64ea", "Turgid", "Swollen and firm, with the contents pressing on the wall"], ["1da343269d", "Flaccid", "Soft, because the cell has lost water and turgor pressure"], ["ec2aaaa53a", "Plasmolysis", "The cell membrane pulling away from the cell wall as a plant cell loses water"], ["7aa77f8579", "Active transport", "The movement of particles through a cell membrane from a lower to a higher concentration, against a concentration gradient, using energy from respiration"], ["c6b7debf1e", "Carrier protein", "A protein in the cell membrane that changes shape to move particles across in active transport"]], "checks": [["2d716fac18", "Oxygen moves across the placenta from the mother's blood into the blood of the fetus by diffusion. Define diffusion", "(Net) movement of particles from a higher concentration to a lower concentration / down a concentration gradient · as a result of their random movement"], ["cdc8e2d480", "Oxygen made in palisade mesophyll cells by photosynthesis diffuses into the air spaces of the leaf. What causes this movement?", "A difference in oxygen concentration between the inside and the outside of the cells: there is more oxygen inside, where it is being made"], ["d0bf743022", "Carbon dioxide diffuses into a leaf during gas exchange. State two factors which increase the rate of diffusion during gas exchange", "Any two from: a larger surface area · a higher temperature · a steeper concentration gradient · a shorter diffusion distance"], ["1172938fbc", "A bag of Visking tubing contains iodine solution. It is placed in a beaker of starch solution. After five minutes the solution in the beaker is blue-black and the solution in the bag is still brown. Explain these observations. Include ideas about the size of molecules", "Iodine turns blue-black with starch · iodine molecules are small, so they move out through the tubing into the beaker · starch molecules are large, so they cannot move into the bag, so the bag stays brown"], ["0af89ab398", "Water enters the roots of a plant by osmosis. Describe osmosis. Use ideas about water potential", "(Net) movement of water (molecules) from a region of higher water potential to a region of lower water potential · through a partially permeable membrane"], ["9b870b097b", "Red blood cells are put into a salt solution of 10.0 g/dm³. The cells shrink. Explain this observation", "Water leaves the cells · by osmosis · because the salt solution has a lower water potential than the cells / water moves from a high to a low water potential"], ["7ab7ae82f0", "Some plant cells are immersed in a concentrated salt solution. Complete the sentences. The solution outside the cell has ………… water potential than the cells. Water diffuses across the cell membrane by ………… from high water potential to low water potential. This reduces the ………… pressure of the cells. The cytoplasm is pulled away from the cell wall. This is called …………", "a lower · osmosis · turgor · plasmolysis"], ["6f98da412f", "Plant cells do not burst when they are put in pure water. Explain why", "Plant cells have a cell wall · which is strong / resists the turgor pressure, so the cell cannot expand any further"], ["58deb5e643", "A potato cylinder is 50.0 mm long before it is put in a sugar solution and 51.0 mm long after. Calculate the percentage change in its length", "(1.0 ÷ 50.0) × 100 = +2.0 %"], ["e04aa6e751", "A grape gains mass in distilled water. When it is put in pure grape juice, its mass does not change. Explain both results", "Distilled water has a higher water potential than the grape cells · water moves into the grape by osmosis / down a water potential gradient · through the partially permeable membranes · grape juice has the same water potential as the grape cells, so there is no net movement of water"], ["10ca56631c", "A salmon swims from the sea into a river of fresh water. Describe the movement of water between the salmon's body and the river water", "The fresh water has a higher water potential than the salmon's body fluids · so water moves into the salmon (by osmosis)"], ["d751c225b2", "Nitrate ions are taken into root hair cells by active transport. The rate of uptake is 50 units when oxygen is present and 0 when oxygen is absent. Explain these results", "Oxygen is needed for aerobic respiration · respiration releases energy · energy is needed to move the ions against the concentration gradient / for active transport, so without oxygen there is no uptake"], ["b3a9e88258", "State one similarity and one difference between osmosis and diffusion", "Similarity: both are the (net) movement of particles from a higher to a lower concentration / both are passive · Difference: osmosis is the movement of water only / osmosis always happens through a partially permeable membrane"]], "facts": [["9e7f4c8cd6", "Particles in liquids and gases move all the time, at random, using their own kinetic energy. The hotter they are, the faster they move"], ["2654fd610d", "Random movement makes particles spread out. More of them move from where they are crowded than move back, so there is a net movement from a high concentration to a low concentration. The difference in concentration is the concentration gradient"], ["9bc5363e9d", "The cell membrane is partially permeable. It lets small molecules, such as water, oxygen and carbon dioxide, through, but stops large ones, such as starch and proteins. The cell wall lets almost everything through: it is fully permeable"], ["85f7e1836c", "Dilute means a lot of water; concentrated means less water. A dilute solution has a high water potential. A concentrated solution has a low water potential. Pure water has the highest water potential of all"], ["0efc053be3", "Going against a gradient costs energy. Diffusion and osmosis go down a gradient and need no energy from the cell. Active transport goes up a gradient, so it needs energy from respiration"]]}, {"id": "g9-0654-c03", "n": 3, "tag": "Chemistry 3", "title": "Stoichiometry", "terms": [["11790df33b", "Chemical formula", "symbols and numbers showing the ratio of atoms of each element in a substance"], ["410b72cd3f", "Molecular formula", "the number and type of atoms in one molecule"], ["b72633aba2", "Word equation", "an equation that names the reactants and products"], ["47105653d5", "Balanced symbol equation", "an equation with correct formulas and the same number of each atom on both sides"], ["60b7539553", "State symbols", "(s), (l), (g) and (aq): solid, liquid, gas and dissolved in water"], ["9701504a80", "Ionic equation", "an equation that shows only the ions and particles that change"], ["0a491aa7dc", "Spectator ion", "an ion that is the same at the start and at the end, so it is left out of an ionic equation"], ["f2662f1118", "Relative atomic mass, Ar", "the average mass of the atoms of an element compared with 1/12 of the mass of a carbon-12 atom"], ["785d40e939", "Relative molecular mass, Mr", "the sum of the relative atomic masses of the atoms in a formula; called relative formula mass for an ionic compound"], ["0696f6f896", "Concentration", "the mass (or amount) of solute in 1 dm³ of solution, in g/dm³ (or mol/dm³)"], ["42fc139cca", "Mole", "the unit of amount of substance; one mole contains 6.02 × 10²³ particles"], ["b87187bfb2", "Avogadro constant", "6.02 × 10²³, the number of particles in one mole"], ["068d29f25d", "Molar mass", "the mass of one mole of a substance, in g/mol; the same number as Ar or Mr"], ["11c2493b3e", "Molar gas volume", "24 dm³: the volume of one mole of any gas at room temperature and pressure"], ["e62805ea1e", "Limiting reactant", "the reactant that is used up first, so it decides how much product is made"], ["1159f51985", "Excess", "a reactant that is not all used up; some is left over"]], "checks": [], "facts": [["e91acfddd6", "A formula is a fixed ratio of atoms, and you cannot change it. The ratio is decided by the bonding or by the charges on the ions. So you balance an equation by putting numbers in front of formulas, never by changing the small numbers inside them"], ["17e2ba1a32", "Atoms are too small to weigh, so every mass in chemistry is relative. All of them are compared with the same standard: the carbon-12 atom. That is why Ar and Mr have no units"], ["8b914f0611", "In a reaction the atoms are only rearranged. Every atom at the start is still there at the end, so the total mass does not change. A balanced equation is that fact written down"], ["4883ed953f", "The numbers in an equation count particles, not grams. 2Mg + O2 → 2MgO means two magnesium atoms for every one oxygen molecule. It does not mean 2 g of magnesium"], ["ca09a25045", "One mole is 6.02 × 10²³ particles, and it has a mass in grams equal to the Ar or Mr. One mole of water, H2O (Mr 18), is 18 g. One mole of any gas fills 24 dm³ at room temperature and pressure. The mole is the bridge between F4 and the balance"], ["bbfec02271", "Every calculation is three moves: into moles, across the equation, out of moles. You go in through a mass, a gas volume or a solution, and out through another. Learn the three moves once and you can do every calculation in this unit"]]}, {"id": "g9-0654-p03", "n": 3, "tag": "Physics 3", "title": "Thermal Physics", "terms": [["60fafb236b", "Kinetic particle model", "Matter is made of particles that are always moving; temperature tells you how fast"], ["06f6eb289c", "Brownian motion", "The random motion of small visible particles (smoke, pollen) hit by invisible, fast-moving molecules"], ["0377269097", "Gas pressure", "The force per unit area from gas particles hitting the walls of the container"], ["afa3a725a0", "Thermal expansion", "The increase in size of a substance when it is heated, because its particles move further apart"], ["b9286418b5", "Melting point", "The temperature at which a solid melts (0 °C for pure water)"], ["8e8fb5aca3", "Boiling point", "The temperature at which a liquid boils throughout (100 °C for pure water)"], ["265066db19", "Condensation", "A gas turning into a liquid as it cools"], ["a0967485cd", "Solidification", "A liquid turning into a solid (freezing)"], ["5c728b982b", "Evaporation", "The escape of the more energetic particles from the surface of a liquid, at any temperature"], ["9201b4b781", "Conduction", "Energy passed through a material by vibrating particles (and free electrons in metals)"], ["ed475c8def", "Thermal conductor", "A material that lets thermal energy pass through it easily, such as a metal"], ["65919503d5", "Thermal insulator", "A material that is a poor conductor, such as plastic, wool or air"], ["6dfa47adca", "Convection", "Energy carried by a moving fluid: hot, less dense fluid rises and cooler, denser fluid sinks"], ["cead6d6505", "Convection current", "The circulating flow of fluid in convection"], ["6f40a7a2ac", "Thermal radiation", "Energy carried by electromagnetic waves, mainly infrared; it needs no medium"], ["faa07e8194", "Infrared", "The part of the electromagnetic spectrum that carries most thermal radiation"], ["1c8604826f", "Emitter / absorber", "A surface that gives out / takes in radiation; dull black is best at both"], ["a799688b93", "Rate of cooling", "The fall in temperature per unit time, in °C/s"]], "checks": [["f857d020f6", "Explain, in terms of the motion and arrangement of atoms, why a fixed mass of solid polonium has a smaller volume than the same mass of liquid polonium", "Both samples contain the same number of atoms (same mass) · atoms in the solid vibrate about fixed positions; in the liquid they are free to move · atoms in the solid are in a regular arrangement; in the liquid they are random, so they take up more space"], ["3a319b9818", "Describe how Brownian motion provides evidence for the kinetic particle model of matter", "The pollen grains (or smoke particles) move randomly · because they are hit by (collide with) water molecules · which are smaller and moving fast"], ["286b182fe0", "A sample of radon gas is stored in a container of fixed volume. Explain, in terms of molecular motion, why the pressure of the gas increases when its temperature is increased", "The kinetic energy (speed) of the atoms increases · they collide with the walls of the container more often · so they exert a larger force per unit area (pressure)"], ["5bb8f46c20", "Some gas is in a sealed syringe at constant temperature. The piston is pushed in. State what happens to the average speed of the particles and explain why the pressure of the gas increases", "The average speed does not change (the temperature is constant) · the particles hit the walls more often · so the force per unit area (pressure) increases"], ["6021ae14fd", "Explain why lengths of railway track are laid with small gaps between them", "When the temperature of the track rises, the steel expands · the gaps stop the track from buckling"], ["f5e9c57c6a", "Explain how evaporation of water from the skin cools a person", "Energy is transferred from the skin to the water molecules · the most energetic molecules escape from the surface · the average energy of the molecules that are left decreases, so the water (and skin) cools"], ["a29720951d", "State two differences between boiling and evaporation", "Boiling happens throughout the liquid; evaporation happens only at the surface · boiling happens only at the boiling point; evaporation happens at any temperature"], ["7c4115e1f1", "Three pieces of ice of the same mass are placed on blocks of copper, glass and expanded polystyrene in a warm room. After 5 minutes the most ice has melted on the copper and the least on the polystyrene. Explain these results", "Copper is a good thermal conductor so it transfers energy to the ice fastest and that ice melts most · polystyrene is a bad conductor (an insulator; it contains trapped air), so it transfers least energy and least ice melts"], ["37d3450808", "The cooling unit of a refrigerator is fitted at the top. Explain, in terms of density changes, why this allows all the air inside to be cooled", "The air at the top is cooled and its density increases · the cooled, denser air falls (sinks) · warmer, less dense air rises to the cooling unit to be cooled"], ["caa130ab21", "State which colour a solar heating panel should be painted, and explain why", "(Dull) black · because black absorbs more radiation than any other colour"], ["d5348951d3", "The Earth's temperature rises during the day and falls at night. Explain this in terms of radiation", "The temperature rises in the day and falls at night · in the day the Earth absorbs more radiation (from the Sun) than it emits · at night it emits more radiation than it absorbs"], ["5ef395ae24", "Two identical cans, P (dull black) and Q (shiny white), are filled with the same volume of water at 80 °C and left to cool in a room at 20 °C. (a) State the final temperature of both cans. (b) State which can cools faster, and explain why", "(a) 20 °C (room temperature) · (b) P cools faster · because black emits radiation (infrared) faster than white"], ["9aed865443", "A vacuum flask keeps a drink hot. Explain how the vacuum and the silvered surfaces help", "The vacuum stops conduction and convection, because there are no particles to carry the energy · the silvered surfaces reflect infrared radiation back, reducing energy loss by radiation"]], "facts": [["af1f333717", "Particles are always moving, and temperature is how fast. Heat a substance and its particles gain kinetic energy and move faster. Cool it and they slow down. They never stop"], ["e7ca0c66b6", "Particles attract each other, and the attraction decides the state. In a solid the forces are strong and hold the particles in fixed places. In a liquid they are weaker, so particles slide past each other. In a gas they are very weak, so particles fly apart"], ["99e7b56a95", "A moving particle that hits something pushes on it. That push is the force behind gas pressure, and behind Brownian motion. More hits, or harder hits, mean more force"], ["52b0c572c9", "Heating can make particles move faster or move apart, but they do not get bigger. Expansion is the same particles further apart. A change of state is particles escaping from each other"], ["d9a253e5ad", "Energy always flows from hot to cold, in three ways. By passing vibrations from particle to particle (conduction), by the hot fluid itself moving (convection), or by infrared waves, which need no particles (radiation)"]]}]}, {"grade": "g10-igcse2", "label": "Grade 10", "strap": "IGCSE Chemistry · Year 2", "units": [{"id": "g9-igcse1-u06", "n": 6, "tag": "Unit 6", "title": "Chemical Reactions", "terms": [["84f7683877", "Physical change", "A change that produces no new substance"], ["f1b1a9ec69", "Chemical change", "A change that produces one or more new substances"], ["5a4d26da3f", "Rate of reaction", "How quickly reactants are used up or products are formed, per unit time"], ["0a0a139543", "Catalyst", "A substance that increases the rate of a reaction and is unchanged in mass and chemical composition at the end"], ["42ca883de1", "Enzyme", "A biological catalyst"], ["f710fe3bbf", "Collision theory", "The model that reaction requires collisions with at least the activation energy"], ["b31ac3cb92", "Activation energy", "The minimum energy that colliding particles must have in order to react"], ["026b62b516", "Successful collision", "A collision that results in a reaction"], ["2ae71fa7cd", "Limiting reactant", "The reactant that is completely used up, and which therefore sets the amount of product"], ["13e6dcf775", "Reversible reaction", "A reaction in which the products can re-form the reactants, written with ⇌"], ["707adc14a8", "Closed system", "A system from which nothing can enter or leave"], ["6af117ee61", "Equilibrium", "The state in a closed system where the forward and backward rates are equal and the concentrations are constant"], ["f42ce17f7c", "Position of equilibrium", "Whether the equilibrium mixture is mostly products or mostly reactants"], ["2868eb9f6d", "Hydrated", "Containing water of crystallisation"], ["fc6fb83840", "Anhydrous", "Containing no water of crystallisation"], ["de5cf43396", "Compromise conditions", "Conditions chosen to balance yield against rate, cost and safety"], ["efc0341216", "Redox reaction", "A reaction in which oxidation and reduction occur simultaneously"], ["acdddc4c41", "Oxidation", "Gain of oxygen; loss of electrons; increase in oxidation number"], ["255231517c", "Reduction", "Loss of oxygen; gain of electrons; decrease in oxidation number"], ["f9c5e0d489", "Oxidation number", "A signed number describing the degree of oxidation of an atom"], ["c723711143", "Oxidising agent", "A substance that oxidises another substance and is itself reduced"], ["9d4ef4285e", "Reducing agent", "A substance that reduces another substance and is itself oxidised"], ["c40dbd541a", "Half-equation", "An equation showing only the electron loss or only the electron gain"]], "checks": [], "facts": [["f5d4d5c97e", "A chemical change makes a new substance; a physical change does not. That is the whole definition. Reversibility, colour and energy are clues, not the test — a reversible chemical change is still a chemical change"], ["0663dde2b1", "Particles must collide to react, and they must collide with at least a minimum energy — the activation energy — for the collision to do anything. Every rate fact in this unit is an answer to one of two questions: how often do they collide, and what fraction of those collisions has enough energy?"], ["5bbff61115", "Rate and yield are different questions. How fast a reaction goes is set by the conditions; how much product it eventually makes is set by how much reactant there was. A steeper graph and a higher graph mean different things, and a catalyst changes only the first"], ["82831701b4", "A catalyst speeds a reaction up by offering a route with a lower activation energy, and is chemically unchanged at the end. It never makes more product, and it never makes the particles move faster"], ["54cfaad6a9", "In a closed system, a reversible reaction reaches equilibrium: the forward and reverse reactions are still running, at equal rates, so the concentrations stop changing. Change a condition and the position shifts to oppose that change"], ["db09fe18b8", "Oxidation and reduction always happen together. One substance cannot lose electrons unless another gains them. Whether you track oxygen, electrons, or oxidation numbers, you are looking at the same event from three angles"]]}, {"id": "g10-igcse2-u07", "n": 7, "tag": "Unit 7", "title": "Acids, Bases and Salts", "terms": [["61bd19c1f1", "Acid", "A substance that releases hydrogen ions in water. A proton donor"], ["86ed649a24", "Base", "A metal oxide or metal hydroxide. A proton acceptor"], ["3c0ac8320f", "Alkali", "A base that dissolves in water, releasing hydroxide ions"], ["ba5b23b4d2", "Neutralisation", "The reaction of hydrogen ions with hydroxide ions to form water"], ["be4df3f275", "Indicator", "A dye with different colours in acidic and alkaline solutions"], ["9a5f3630f7", "pH scale", "A scale from 0 to 14 measuring how acidic or alkaline a solution is"], ["5ae9f53e48", "Effervescence", "The bubbling seen when a gas is produced in a reaction"], ["38eda5cb3a", "Strong acid", "An acid completely split into ions in water"], ["0b7a4bbb53", "Weak acid", "An acid only partly split into ions in water"], ["da5c07700f", "Spectator ion", "An ion that is unchanged on both sides of an equation"], ["61bbd47c85", "Basic oxide", "A metal oxide, which reacts with acids to give a salt and water"], ["bebb0c4441", "Acidic oxide", "A non-metal oxide, which reacts with bases to give a salt and water"], ["00797ade43", "Amphoteric oxide", "An oxide that reacts with both acids and bases"], ["2067cc6a48", "Salt", "The compound formed when the hydrogen of an acid is replaced by a metal or ammonium ion"], ["bb8dbe0d45", "Precipitate", "An insoluble solid formed when two solutions are mixed"], ["86278b19f3", "Filtrate", "The liquid that passes through the filter paper"], ["ab2501f2b5", "Residue", "The solid left on the filter paper"], ["a063bb3983", "Water of crystallisation", "Water chemically built into a crystal as it forms"], ["1f43c9418a", "Hydrated", "Containing water of crystallisation"], ["0e09b78833", "Anhydrous", "Containing no water of crystallisation"]], "checks": [], "facts": [["15e857b859", "An acid puts hydrogen ions, H⁺(aq), into water. An alkali puts hydroxide ions, OH⁻(aq), into water. A substance only behaves as an acid or an alkali once it is dissolved — dry hydrogen chloride gas turns nothing red"], ["d7fc271988", "A base is anything that neutralises an acid. An alkali is a base that dissolves in water. Every alkali is a base; most bases are not alkalis. The word you choose tells the reader whether the substance is in solution"], ["4cd8d9411e", "Neutralisation is always the same reaction: H⁺ + OH⁻ → H₂O. The other ions present take no part — they are spectators, and they are what is left behind as the salt"], ["3b3487440e", "A salt is an acid with its hydrogen replaced by a metal ion or an ammonium ion. The metal half of the name comes from the base; the other half comes from the acid — hydrochloric gives chlorides, sulfuric gives sulfates, nitric gives nitrates"], ["0677e0d27a", "Strength and concentration are different things. Strength is the fraction of the acid's molecules that release their hydrogen ion in water, and it is fixed for a given acid. Concentration is how much acid was dissolved in each dm³, and it is chosen by whoever made up the solution. The pH follows the hydrogen ion concentration, which depends on both"], ["2cea548803", "Whether a salt dissolves decides how you make it. A soluble salt is made in solution and then crystallised out; an insoluble salt is made by mixing two solutions and filtering the solid off. Choosing a preparation method is a solubility question before it is anything else"]]}, {"id": "g10-igcse2-u08", "n": 8, "tag": "Unit 8", "title": "The Periodic Table", "terms": [["9975c6e4e3", "Proton number", "The number of protons in an atom. It sets the order of the Periodic Table"], ["1ac3f607b6", "Period", "A horizontal row. The period number gives the number of occupied electron shells"], ["6e0f078145", "Group", "A vertical column. The group number gives the number of outer-shell electrons"], ["6f62edde24", "Alkali metal", "An element of Group I. Soft, low density, reacts with water to give an alkali"], ["4deb9ee58a", "Halogen", "An element of Group VII. A diatomic non-metal"], ["d924ed2dfa", "Diatomic", "Existing as molecules of two atoms, such as Cl₂"], ["dcbd717655", "Monatomic", "Existing as single, unbonded atoms, as the noble gases do"], ["b860718d17", "Noble gas", "An element of Group VIII. Unreactive, because its outer shell is full"], ["4bf6490dd5", "Transition element", "A metal from the central block. Dense, high-melting, forms coloured compounds"], ["3a54f2bdea", "Displacement reaction", "A reaction in which a more reactive element takes the place of a less reactive one"], ["2274f54e4c", "Halide", "The compound or ion formed when a halogen gains an electron, such as chloride, Cl⁻"], ["348d1e2e40", "Oxidation number", "The charge an ion carries, shown by the Roman numeral in a compound's name"], ["00f444853a", "Variable oxidation number", "The ability of an element to form ions of more than one charge"], ["3d5721d0fa", "Catalyst", "A substance that speeds up a reaction without being used up or chemically changed"], ["5fe3b8096c", "Full outer shell", "An outer electron shell holding its maximum number of electrons. The reason noble gases are unreactive"]], "checks": [["76b0af9927", "State what the period number and the group number each tell you about an atom", "The period number gives the number of occupied electron shells. The group number gives the number of electrons in the outer shell"], ["891badf2fb", "An element is in Group VI. Deduce the charge of the ion it forms, and explain how you worked it out", "A 2− charge. A Group VI atom has six outer-shell electrons and gains two to reach a full outer shell of eight, so the ion carries two negative charges"], ["03f279de78", "Name the two products formed when lithium reacts with cold water, and state the pH range of the solution", "Hydrogen gas and lithium hydroxide. The solution is alkaline, so the pH is above 7"], ["3dfd0cb851", "Give the state and colour of chlorine, bromine and iodine at room temperature", "Chlorine is a pale yellow-green gas, bromine is a red-brown liquid, iodine is a grey-black solid"], ["3fa9335640", "Explain why bromine displaces iodine from potassium iodide solution but not chlorine from potassium chloride solution", "Bromine is more reactive than iodine, so it displaces iodide ions from solution. Bromine is less reactive than chlorine, so it cannot displace chloride ions. A halogen only displaces one that is less reactive than itself"], ["5d93a3f348", "State four properties of the transition elements that Group I metals do not have", "Higher density, higher melting point, coloured compounds, variable oxidation number. Acting as catalysts is also acceptable"], ["7eaee9f4f3", "Explain why the noble gases are monatomic", "A noble gas atom has a full outer electron shell. It does not need to share, gain or lose electrons to become stable, so it forms no bonds — not even with another atom of the same element"]], "facts": [["176ec188b3", "The elements are laid out in order of proton number, one after another. Nobody sorted them by how they behave. The behaviour repeats on its own, and the repeat is what makes the columns"], ["78e7083636", "Period number = the number of occupied electron shells. Group number = the number of electrons in the outer shell. An element's address is its electron arrangement written another way"], ["62812e9089", "Chemistry happens in the outer shell only. Elements in the same group have the same number of outer-shell electrons, so they react in the same way. That is the whole reason the table has columns"], ["645df99f05", "A full outer shell is stable, and atoms lose or gain electrons to reach one. Elements on the left have few outer electrons and lose them; elements on the right are a few short and gain them. The group number tells you the charge of the ion"], ["0b931a5c8a", "Going down a group, the outer shell is further from the nucleus and screened by more full inner shells, so the pull on the outer electrons is weaker. That one cause gives two opposite trends: losing an electron gets easier, so Group I gets more reactive downwards; attracting an extra electron gets harder, so Group VII gets less reactive downwards"]]}, {"id": "g10-igcse2-u09", "n": 9, "tag": "Unit 9", "title": "Metals", "terms": [["e7fa616868", "Delocalised electron", "An electron that is free to move through the whole metal lattice rather than belonging to one atom"], ["5577a48bf6", "Malleable", "Able to be hammered or pressed into sheets without breaking"], ["249706e607", "Ductile", "Able to be drawn out into a wire"], ["e71d1fa815", "Alloy", "A mixture of a metal with one or more other elements, melted together"], ["ffc6c468f3", "Brass", "An alloy of copper and zinc"], ["e23417ff2f", "Stainless steel", "An alloy of iron with chromium, nickel and carbon"], ["5010a98cca", "Reactivity series", "Metals listed in order of how readily they lose electrons to form positive ions, with carbon and hydrogen included as reference points"], ["d3bd8de81f", "Displacement reaction", "A reaction in which a more reactive metal takes the place of a less reactive one in a compound"], ["3caa5587d2", "Oxidation", "Loss of electrons"], ["5e5021c55c", "Reduction", "Gain of electrons; also, loss of oxygen"], ["3a5552f333", "Corrosion", "The gradual destruction of a metal by reaction with its surroundings"], ["53e9d71d4f", "Rusting", "The corrosion of iron or steel, needing both water and oxygen, giving hydrated iron(III) oxide"], ["14b9cf9b29", "Galvanising", "Coating iron or steel with zinc, giving both barrier and sacrificial protection"], ["2a011235fb", "Sacrificial protection", "Protecting a metal by attaching a more reactive metal that is oxidised in its place"], ["2ad01ad9b3", "Ore", "A rock containing enough of a metal compound to make extraction worthwhile"], ["3bfc28c89f", "Hematite", "The main ore of iron, iron(III) oxide, Fe₂O₃"], ["41e6c55208", "Bauxite", "The main ore of aluminium, containing aluminium oxide, Al₂O₃"], ["1ac1b323b3", "Slag", "Molten calcium silicate formed in the blast furnace when calcium oxide reacts with sand"], ["4a0d9fee26", "Cryolite", "The molten compound in which aluminium oxide is dissolved, to lower the operating temperature of the electrolysis"], ["744efeb38a", "Native", "Occurring as the uncombined element, as gold does"]], "checks": [["d0e486603b", "State the reactivity series in full, including carbon and hydrogen, and say what each of", "Potassium, sodium, calcium, magnesium, aluminium, carbon, zinc, iron, hydrogen, copper,"], ["b0f1425666", "Explain, in terms of structure, why metals are malleable but simple molecular non-metals", "In a metal the ions are all the same size and are held in place by attraction to a sea of"], ["781e02bb80", "Name the products when calcium reacts with cold water, and when magnesium reacts with", "Calcium and cold water give calcium hydroxide and hydrogen. Magnesium and steam give"], ["e65a8a2d1e", "Explain why stainless steel is harder than pure iron", "Stainless steel contains chromium, nickel and carbon atoms, which are different sizes from"], ["46edc1da29", "State the two conditions required for iron to rust, and name the product", "Water and oxygen, both present at the same time. The product is hydrated iron(III) oxide"], ["41dc26a714", "Explain why galvanising protects iron even after the zinc layer is scratched, but tin", "Zinc is more reactive than iron, so where the two are in contact the zinc is oxidised in"], ["597864341d", "State the method used to extract aluminium and explain why that method is necessary", "Electrolysis of purified aluminium oxide dissolved in molten cryolite. Aluminium is above"], ["2f7add2618", "Write the equation for the reduction of iron(III) oxide by carbon monoxide, with state", "Fe₂O₃(s) + 3CO(g) → 2Fe(l) + 3CO₂(g)"]], "facts": [["83af266e51", "A metal is a lattice of positive metal ions in a sea of delocalised electrons. The electrons came from the outer shells of the atoms and no longer belong to any one of them. Every physical property of every metal comes out of that one picture"], ["babd3bb4c0", "The reactivity series is: potassium, sodium, calcium, magnesium, aluminium, carbon, zinc, iron, hydrogen, copper, silver, gold. Carbon and hydrogen are not metals. They are in the list as the two lines that divide it"], ["a7b209b000", "The carbon line decides how a metal is extracted. Above carbon, the metal holds its oxygen too tightly for carbon to take it, so the ore must be split by electrolysis. Below carbon, carbon can take the oxygen away, and heating in a furnace is enough"], ["1e97a6635e", "The hydrogen line decides whether a metal reacts with acid. Above hydrogen, the metal displaces hydrogen from an acid and you see effervescence. Below hydrogen — copper, silver, gold — nothing happens"], ["561a128fb5", "More reactive means a stronger tendency to lose electrons and form positive ions. That one sentence is the reason a more reactive metal displaces a less reactive one, the reason zinc protects iron rather than the other way round, and the reason reactive metals are the hardest to extract"]]}, {"id": "g10-igcse2-u10", "n": 10, "tag": "Unit 10", "title": "Chemistry of the Environment", "terms": [["9cd41fd9e7", "Anhydrous", "Without water. Anhydrous copper(II) sulfate and cobalt(II) chloride are used to test for water"], ["62f24e093b", "Pure water", "Water with nothing dissolved in it. It boils at 100 °C and melts at 0 °C"], ["2f52942adf", "Distilled water", "Water purified by distillation. It contains fewer impurities than tap water"], ["b815cf611a", "Sedimentation", "Letting insoluble particles settle to the bottom of a tank"], ["2fd22ee228", "Filtration", "Passing water through sand and gravel to remove insoluble particles"], ["370f1d4552", "Chlorination", "Adding chlorine to water to kill microbes"], ["8659876c9f", "Deoxygenation", "Loss of dissolved oxygen from water, caused when bacteria decompose dead algae"], ["c498d11b50", "Fertiliser", "A compound added to soil to supply the elements plants need"], ["82949b1cdf", "NPK fertiliser", "A fertiliser that supplies nitrogen, phosphorus and potassium"], ["02c24f897c", "Complete combustion", "Burning with plenty of oxygen. Carbon in the fuel becomes carbon dioxide"], ["667ef984ca", "Incomplete combustion", "Burning with too little oxygen. It produces carbon monoxide and particulates"], ["8bee290b53", "Particulates", "Tiny solid particles in the air, mostly carbon, from incomplete combustion"], ["e9a3957f03", "Acid rain", "Rain made acidic by dissolved sulfur dioxide and oxides of nitrogen"], ["c6cd27dd1e", "Photochemical smog", "A harmful haze over cities, formed when oxides of nitrogen react in sunlight"], ["4b1344d393", "Greenhouse gas", "A gas that absorbs thermal energy given off by the Earth, such as carbon dioxide and methane"], ["222626314d", "Global warming", "The rise in the Earth's average temperature caused by more greenhouse gases"], ["e35a4f0da5", "Catalytic converter", "A device in a car exhaust that changes oxides of nitrogen and carbon monoxide into nitrogen and carbon dioxide"], ["251f9dec2b", "Flue-gas desulfurisation", "Removing sulfur dioxide from power-station waste gases using calcium oxide"], ["2d2488b604", "Photosynthesis", "The reaction of carbon dioxide and water to make glucose and oxygen, using light energy and chlorophyll"]], "checks": [["4afacaabb3", "A student adds a few drops of a colourless liquid to anhydrous copper(II) sulfate. State the colour change seen if the liquid contains water", "From white to blue"], ["944288d609", "Describe a test to show that a sample of water is pure", "Measure its boiling point ; pure water boils at 100 °C . (Or: measure its melting point; pure water melts at 0 °C.)"], ["005a819e6b", "Explain why nitrates and phosphates in a lake are harmful to fish", "They cause rapid growth of algae . When the algae die, bacteria decompose them and use up the dissolved oxygen . The fish die from lack of oxygen"], ["c483db895b", "River water is treated to make drinking water. Name the stage that kills bacteria, and state one type of substance still present in the water after treatment", "Chlorination . Dissolved (soluble) substances, such as salts or chlorine compounds"], ["74fd10a098", "Which pair of compounds supplies nitrogen, phosphorus and potassium? A ammonium nitrate and calcium phosphate · B ammonium nitrate and potassium chloride · C ammonium phosphate and potassium chloride · D potassium nitrate and calcium carbonate", "C . Ammonium phosphate gives N and P; potassium chloride gives K. A has no K, B has no P, D has no P"], ["c1f5beca96", "Calculate the percentage by mass of nitrogen in ammonium nitrate, NH4NO3. (Ar: H = 1, N = 14, O = 16)", "Step 1: find the percentage of N. Step 2: % N = (mass of N ÷ Mr) × 100. Mr of NH4NO3 = 14 + (4 × 1) + 14 + (3 × 16) = 80 . Mass of N in the formula = 2 × 14 = 28. % N = (28 ÷ 80) × 100 = 35% . Check: about a third of the mass is nitrogen, which is sensible for a nitrogen fertiliser"], ["20efee92ac", "State the percentage of oxygen in clean, dry air, and name one compound found in clean, dry air", "21% . Carbon dioxide"], ["229856bc5a", "Name the toxic gas produced by the incomplete combustion of butane", "Carbon monoxide"], ["08dae14925", "Nitrogen dioxide causes respiratory problems. State one other adverse effect of nitrogen dioxide", "Acid rain (or photochemical smog)"], ["e8ba52a780", "Name the substance used to remove sulfur dioxide in flue-gas desulfurisation, and explain why it works", "Calcium oxide . It is a base, so it reacts with (neutralises) the acidic sulfur dioxide"], ["15c8a72d40", "Glucose, C6H12O6, is made in plants from carbon dioxide and water. (a) Name this process. (b) Write the symbol equation for this process. (c) State two essential conditions needed for this process", "(a) Photosynthesis . (b) 6CO2 + 6H2O → C6H12O6 + 6O2 . (c) Energy from light ; chlorophyll"], ["53d44883ae", "Explain, in terms of thermal energy, how greenhouse gases cause global warming", "Greenhouse gases absorb thermal energy (given off by the Earth) . They emit some of it back towards the Earth . This reduces the thermal energy lost to space, so the temperature rises"], ["38ff27e747", "A graph shows that the concentration of carbon dioxide in the atmosphere rose from 315 ppm in 1960 to 410 ppm in 2020. Explain why this data is of global concern", "The concentration of carbon dioxide is increasing . Carbon dioxide is a greenhouse gas . More of it causes global warming, which leads to climate change"], ["17c76cb668", "Explain how nitrogen dioxide is formed in car engines", "Nitrogen and oxygen from the air react because of the high temperature in the engine"], ["bac0521249", "Nitrogen dioxide, NO2, and carbon monoxide are removed from car exhaust by a catalytic converter. Write the symbol equation for this reaction", "2NO2 + 4CO → N2 + 4CO2. Nitrogen and carbon dioxide as the only products ; correctly balanced"]], "facts": [["620bcae7e7", "Water dissolves almost anything, so natural water is never pure. Rain, rivers and lakes pick up gases, salts, fertilisers and waste as they move. A pure substance has a fixed melting point and boiling point. Anything dissolved in water moves those values away from 0 °C and 100 °C"], ["ccae0b541f", "Plants need nitrogen, phosphorus and potassium, taken in as dissolved ions. A fertiliser is a soluble compound that supplies these ions. The same ions also feed the algae in rivers and lakes, if rain washes the fertiliser off the fields"], ["97cbc2d6c1", "A pollutant from burning is made from what was in the fuel, plus oxygen. Carbon in the fuel becomes carbon dioxide if there is plenty of oxygen. With too little oxygen it becomes carbon monoxide and soot. Sulfur in the fuel becomes sulfur dioxide"], ["bca5774dea", "Nitrogen is unreactive, but not at engine temperatures. Air is 78% nitrogen. In the very hot cylinder of a car engine, nitrogen and oxygen from the air react to make oxides of nitrogen. The nitrogen comes from the air, not from the petrol"], ["27081ab5b9", "Oxides of non-metals are acidic. Sulfur dioxide and nitrogen dioxide dissolve in rain to form acids. This is acid rain. A base such as calcium oxide neutralises them"], ["599b6beba8", "Carbon moves between the air and living things, and the balance sets the level of carbon dioxide. Photosynthesis takes carbon dioxide out of the air. Respiration, combustion and decomposition put it back. Burning fossil fuels and cutting down forests tip the balance, so the level rises"]]}, {"id": "g10-igcse2-u11", "n": 11, "tag": "Unit 11", "title": "Organic Chemistry", "terms": [["b8cf9b8064", "Displayed formula", "A formula showing every atom and every bond as a line"], ["9181f2e843", "Structural formula", "A one-line description of how the atoms are arranged, such as CH3CH2OH"], ["bbd0a64c6d", "General formula", "A formula that fits eve
