    function isoBench() {
      const EL = {
        cl: { name: "Chlorine", sym: "Cl", z: 17, iso: [[35, 75, "#3aa38f"], [37, 25, "#7b5ea7"]], table: 35.5 },
        cu: { name: "Copper", sym: "Cu", z: 29, iso: [[63, 69, "#d98c3a"], [65, 31, "#8a5a2b"]], table: 64 },
        b: { name: "Boron", sym: "B", z: 5, iso: [[10, 20, "#4a90d9"], [11, 80, "#2f5f8f"]], table: 11 },
      };
      let e = "cl", bag = [0, 0], natural = false;
      shell(`${pickRow("el", "Element", Object.entries(EL).map(([k, x]) => [k, x.name]), e)}
        <div class="duo">
          <svg class="scene" viewBox="0 0 260 230" role="img" aria-label="A bag of atoms of one element"><g id="bag"></g></svg>
          <svg class="scene" viewBox="0 0 260 230" role="img" aria-label="The two isotopes' nuclei and how common each is in the bag"><g id="spec"></g></svg></div>
        <div class="ctrl"><button id="a0"></button><button id="a1"></button><button id="nat">🌍 Natural sample</button><button id="empty">🗑️ Empty</button><button id="na">🧂 React with sodium</button></div>
        <div class="readout"><span class="chip" id="r1"></span><span class="chip" id="r2"></span></div>
        <p class="muted" id="msg">Add atoms of each isotope. The bag works out its own average mass.</p>`);
      wirePick("el", k => { e = k; bag = [0, 0]; natural = false; render(); say(`${EL[e].name}: two isotopes. Fill the bag.`); });
      const add = i => { if (natural) bag = [0, 0]; bag[i] = Math.min(60, bag[i] + 1); natural = false; check(); render(); };
      el("a0").onclick = () => add(0); el("a1").onclick = () => add(1);
      el("nat").onclick = () => {
        const x = EL[e]; bag = [x.iso[0][1], x.iso[1][1]]; natural = true;   // 100 atoms, the real percentages
        api.found("natural"); check();
        say(`A natural sample of ${x.name.toLowerCase()} is ${x.iso[0][1]}% ${x.sym}-${x.iso[0][0]} and ${x.iso[1][1]}% ${x.sym}-${x.iso[1][0]}. That mix averages ${ar().toFixed(1)}${ar().toFixed(1) === String(x.table) ? ", the number on the Periodic Table" : `, which the exam's Periodic Table prints as ${x.table}`}.`);
        render();
      };
      el("empty").onclick = () => { bag = [0, 0]; natural = false; render(); say("Empty bag."); };
      el("na").onclick = () => {
        if (e !== "cl") return say("Switch to chlorine first — sodium chloride needs chlorine.");
        if (!bag[0] || !bag[1]) return say("Put some of both chlorine isotopes in the bag first.");
        api.found("same");
        say("Both make exactly the same white sodium chloride. Same 17 protons means same 17 electrons, 2.8.7, and electrons decide the chemistry. Only the mass differs.");
      };
      const ar = () => { const n = bag[0] + bag[1]; const x = EL[e].iso; return n ? (bag[0] * x[0][0] + bag[1] * x[1][0]) / n : 0; };
      function check() {
        if (bag[0] && bag[1]) api.found("both");
        const n = bag[0] + bag[1];
        if (e === "cl" && !natural && n >= 4 && Math.abs(ar() - 35.5) < 0.005) {
          if (api.found("ar")) say(`${bag[0]} of chlorine-35 to ${bag[1]} of chlorine-37 is three to one, and the average is 35.5 — the number on the Periodic Table.`);
        }
        if (e === "cu" && n >= 4 && Math.round(ar()) === 64) api.found("copper");
      }
      function render() {
        const x = EL[e], n = bag[0] + bag[1];
        el("a0").textContent = `➕ ${x.sym}-${x.iso[0][0]}`; el("a1").textContent = `➕ ${x.sym}-${x.iso[1][0]}`;
        el("r1").textContent = `${bag[0]} × ${x.iso[0][0]}, ${bag[1]} × ${x.iso[1][0]}`;
        el("r2").textContent = n ? `Ar = ${ar().toFixed(1)}` : "Ar = —";
        // bag: a sack with atoms scattered inside, fixed positions per index so it does not jump
        const spots = [];
        for (let i = 0; i < n && i < 60; i++) {
          const a = i * 2.39996, rr = 9 * Math.sqrt(i + 0.5);
          spots.push([130 + rr * Math.cos(a) * 1.15, 128 + rr * Math.sin(a) * 0.8]);
        }
        // spread the heavier isotope evenly through the bag rather than in a ring of its own
        const kinds = []; for (let i = 0; i < n; i++) kinds.push(Math.floor((i + 1) * bag[1] / n) > Math.floor(i * bag[1] / n) ? 1 : 0);
        el("bag").innerHTML = `<path d="M60 70 Q40 200 130 214 Q220 200 200 70 Z" class="bgc" stroke="#9aa6b3" stroke-width="3"/>
          <path d="M60 70 Q130 52 200 70" fill="none" stroke="#9aa6b3" stroke-width="3"/>
          <text x="130" y="36" font-size="14" text-anchor="middle">${n ? n + " atoms of " + x.name.toLowerCase() : "an empty bag"}</text>`
          + spots.map((s, i) => `<circle cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="${x.iso[kinds[i]][0] > x.iso[1 - kinds[i]][0] ? 7 : 6}" fill="${x.iso[kinds[i]][2]}" stroke="#1f2a37" stroke-width="0.8"/>`).join("");
        // nuclei and an abundance bar chart
        const nuc = (cx, iso) => {
          const p = x.z, nn = iso[0] - x.z, dots = [];
          const show = Math.min(p + nn, 24);
          for (let i = 0; i < show; i++) { const a = i * 2.4, rr = 3.3 * Math.sqrt(i + 0.5); dots.push(`<circle cx="${(cx + rr * Math.cos(a)).toFixed(1)}" cy="${(60 + rr * Math.sin(a)).toFixed(1)}" r="3.4" fill="${i % 2 ? "#9aa6b3" : "#d64545"}"/>`); }
          return dots.join("") + `<text x="${cx}" y="102" font-size="13" text-anchor="middle" font-weight="bold">${x.sym}-${iso[0]}</text>
            <text x="${cx}" y="118" font-size="12" text-anchor="middle" class="lbl">${p} p · ${nn} n · ${p} e</text>`;
        };
        const share = i => n ? bag[i] / n : 0;
        el("spec").innerHTML = nuc(70, x.iso[0]) + nuc(190, x.iso[1])
          + `<path d="M30 210 H240" stroke="#9aa6b3" stroke-width="2"/>`
          + [0, 1].map(i => { const h = 70 * share(i); return `<rect x="${i ? 160 : 40}" y="${210 - h}" width="60" height="${h}" fill="${x.iso[i][2]}"/>
            <text x="${i ? 190 : 70}" y="${204 - h}" font-size="12" text-anchor="middle">${Math.round(share(i) * 100)}%</text>`; }).join("")
          + `<text x="135" y="226" font-size="12" text-anchor="middle" class="lbl">how much of the bag each isotope is</text>`;
      }
      render();
    }

    // ── molecules: tap a bond to add a shared pair ──────────────────────
    function molBench() {
      const V = { H: 1, C: 4, N: 5, O: 6, Cl: 7 }, COL = { H: "#e8edf2", C: "#5b6675", N: "#4a90d9", O: "#e4572e", Cl: "#7cb342" };
      const MOL = {
        h2o: ["Water, H₂O", [["O", 150, 90], ["H", 85, 150], ["H", 215, 150]], [[0, 1], [0, 2]]],
        ch4: ["Methane, CH₄", [["C", 150, 110], ["H", 150, 38], ["H", 72, 110], ["H", 228, 110], ["H", 150, 182]], [[0, 1], [0, 2], [0, 3], [0, 4]]],
        nh3: ["Ammonia, NH₃", [["N", 150, 85], ["H", 80, 140], ["H", 220, 140], ["H", 150, 180]], [[0, 1], [0, 2], [0, 3]]],
        hcl: ["Hydrogen chloride, HCl", [["H", 95, 110], ["Cl", 205, 110]], [[0, 1]]],
        o2: ["Oxygen, O₂", [["O", 100, 110], ["O", 200, 110]], [[0, 1]]],
        n2: ["Nitrogen, N₂", [["N", 100, 110], ["N", 200, 110]], [[0, 1]]],
        co2: ["Carbon dioxide, CO₂", [["O", 55, 110], ["C", 150, 110], ["O", 245, 110]], [[0, 1], [1, 2]]],
        c2h4: ["Ethene, C₂H₄", [["C", 115, 110], ["C", 185, 110], ["H", 58, 55], ["H", 58, 165], ["H", 242, 55], ["H", 242, 165]], [[0, 1], [0, 2], [0, 3], [1, 4], [1, 5]]],
      };
      let m = "h2o", order = [], done = {};
      shell(`${pickRow("m", "Molecule", Object.entries(MOL).map(([k, x]) => [k, x[0].split(",")[1].trim()]), m)}
        <svg class="scene" viewBox="0 0 300 220" role="img" aria-label="Atoms of a molecule; tap the gap between two atoms to share a pair of electrons"><g id="mol"></g></svg>
        <div class="ctrl"><button id="clear">🔄 Break all the bonds</button></div>
        <div class="readout"><span class="chip" id="r1"></span><span class="chip" id="r2"></span></div>
        <p class="muted" id="msg">Tap the gap between two atoms to share a pair of electrons. Tap again for a second pair, again for a third.</p>`);
      const reset = () => { order = MOL[m][2].map(() => 0); };
      reset();
      wirePick("m", k => { m = k; reset(); render(); say(`${MOL[m][0]}. Share pairs until every atom has a full outer shell.`); });
      el("clear").onclick = () => { reset(); render(); };
      const outer = i => { const [s] = MOL[m][1][i]; let b = 0; MOL[m][2].forEach((p, k) => { if (p.includes(i)) b += order[k]; }); return { s, have: V[s] + b, full: s === "H" ? 2 : 8, bonds: b }; };
      function tap(k) {
        order[k] = (order[k] + 1) % 4; render();
        const atoms = MOL[m][1].map((_, i) => outer(i));
        if (atoms.some(a => a.have > a.full)) { api.found("over"); say("Too many — that atom now has more electrons than its outer shell can hold. Tap the bond round to fewer pairs."); return; }
        if (atoms.every(a => a.have === a.full)) {
          done[m] = true;
          const top = Math.max(...order);
          if (top === 1) api.found("single");
          if (top === 2) api.found("double");
          if (top === 3) api.found("triple");
          if (m === "h2o") api.found("lone");
          if (Object.keys(done).length === Object.keys(MOL).length) api.found("all");
          const names = ["", "single", "double", "triple"];
          say(`${MOL[m][0]} — every outer shell is full. ${top > 1 ? `It needs a ${names[top]} bond: ${top} shared pairs between one pair of atoms.` : "Single bonds only."}${atoms.some(a => (V[a.s] - a.bonds) >= 2) ? " The pairs drawn beside an atom are lone pairs — its own electrons, not shared." : ""}`);
        } else say("Keep going — an atom glows green when its outer shell is full.");
      }
      function render() {
        const [name, atoms, bonds] = MOL[m];
        let s = "";
        bonds.forEach(([a, b], k) => {
          const [, x1, y1] = atoms[a], [, x2, y2] = atoms[b], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
          for (let j = 0; j < order[k]; j++) {
            const off = (j - (order[k] - 1) / 2) * 7;
            s += `<line x1="${x1 + nx * off}" y1="${y1 + ny * off}" x2="${x2 + nx * off}" y2="${y2 + ny * off}" stroke="#9aa6b3" stroke-width="3"/>`;
            const mx = (x1 + x2) / 2 + nx * off * 2.2, my = (y1 + y2) / 2 + ny * off * 2.2;
            s += `<circle cx="${mx - dx / L * 6}" cy="${my - dy / L * 6}" r="3.4" fill="#2f6f9f"/><text x="${mx + dx / L * 6}" y="${my + dy / L * 6 + 4}" font-size="13" text-anchor="middle" fill="#b4531f" font-weight="bold">×</text>`;
          }
          if (!order[k]) s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9aa6b3" stroke-width="2" stroke-dasharray="4 6"/>`;
          s += `<line data-b="${k}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="34" style="cursor:pointer"/>`;
        });
        atoms.forEach(([sym, x, y], i) => {
          const o = outer(i), ring = o.have > o.full ? "#d64545" : o.have === o.full ? "#2e8b57" : "#9aa6b3", r = sym === "H" ? 20 : 26;
          // lone pairs sit on the side facing away from the molecule's middle
          const lone = Math.max(0, Math.floor((V[sym] - o.bonds) / 2));
          let lp = "";
          if (sym !== "H" && o.have === o.full) {
            const cx = atoms.reduce((t, a) => t + a[1], 0) / atoms.length, cy = atoms.reduce((t, a) => t + a[2], 0) / atoms.length;
            const base = Math.atan2(y - cy, x - cx) || -Math.PI / 2;
            for (let j = 0; j < lone; j++) {
              const a = base + (j - (lone - 1) / 2) * 0.9, px = x + Math.cos(a) * (r + 10), py = y + Math.sin(a) * (r + 10), tx = -Math.sin(a) * 4, ty = Math.cos(a) * 4;
              lp += `<circle cx="${px + tx}" cy="${py + ty}" r="3" fill="#b4531f"/><circle cx="${px - tx}" cy="${py - ty}" r="3" fill="#b4531f"/>`;
            }
          }
          s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${COL[sym]}" stroke="${ring}" stroke-width="4"/>
            <text x="${x}" y="${y + 5}" font-size="15" text-anchor="middle" font-weight="bold" fill="${sym === "C" ? "#ffffff" : "#1f2a37"}">${sym}</text>
            <text x="${x}" y="${y + r + 15}" font-size="12" text-anchor="middle" class="lbl">${o.have}/${o.full}</text>${lp}`;
        });
        el("mol").innerHTML = s;
        el("mol").querySelectorAll("[data-b]").forEach(l => l.onclick = () => tap(+l.dataset.b));
        el("r1").textContent = name;
        el("r2").textContent = `${Object.keys(done).length} of ${Object.keys(MOL).length} finished`;
      }
      render();
    }

    // ── metal or salt: hammer and circuit ──────────────────────────────
    function metalBench() {
      let s = "metal", shifted = false, state = "solid", bulb = false, cracked = false, t0 = performance.now();
      const r = shell(`${pickRow("s", "Sample", [["metal", "Copper (metal)"], ["salt", "Sodium chloride (salt)"]], s)}
        <div class="duo">
          <svg class="scene" viewBox="0 0 260 220" role="img" aria-label="The particles in the sample, in rows"><g id="lat"></g></svg>
          <svg class="scene" viewBox="0 0 260 220" role="img" aria-label="A circuit with a battery and a bulb across the sample"><g id="circ"></g></svg></div>
        <div class="ctrl"><button id="ham">🔨 Hit it</button><button id="test">🔌 Test in the circuit</button><button id="melt">🔥 Melt it</button><button id="dis">💧 Dissolve it</button><button id="new">🔄 Fresh sample</button></div>
        <p class="muted" id="msg">Hit each sample with the hammer, then put it in the circuit.</p>`);
      const fresh = () => { shifted = false; state = "solid"; bulb = false; cracked = false; };
      wirePick("s", k => { s = k; fresh(); say(k === "metal" ? "Copper: positive ions in a sea of electrons." : "Sodium chloride: positive and negative ions, alternating."); });
      el("new").onclick = () => { fresh(); say("A fresh sample."); };
      el("ham").onclick = () => {
        if (state !== "solid") return say("Let it set solid again first — try a fresh sample.");
        shifted = true;
        if (s === "metal") { api.found("malleable"); say("The rows slid over each other and the metal just bent. The sea of electrons still holds every ion in the new place — metals are malleable."); }
        else { cracked = true; api.found("shatter"); say("One row slid, so now positive sits next to positive and negative next to negative. They push apart and the crystal shatters — salts are brittle."); }
      };
      el("test").onclick = () => {
        bulb = s === "metal" || state !== "solid";
        if (s === "metal") { api.found("electrons"); say("The bulb lights. The electrons in a metal are free to drift through the lattice, so the metal conducts as a solid."); }
        else if (state === "solid") { api.found("solid"); say("No light. The ions are charged, but in a solid they are held in place and cannot move to carry the current."); }
        else if (state === "molten") { api.found("molten"); say("It lights! Melted, the ions are free to move — that is what carries the current."); }
        else { api.found("solution"); say("It lights. Dissolved in water the ions can move too."); }
      };
      el("melt").onclick = () => {
        if (s === "metal") return say("Copper melts at 1085 °C — this burner will not do it. Melting is the salt's test.");
        state = "molten"; bulb = false; say("Molten sodium chloride at 801 °C. The ions are loose now. Try the circuit.");
      };
      el("dis").onclick = () => {
        if (s === "metal") return say("Copper does not dissolve in water.");
        state = "solution"; bulb = false; say("Dissolved. Try the circuit.");
      };
      (function loop(now) {
        if (!alive(r)) return;
        const t = (now - t0) / 1000;
        let g = `<rect x="20" y="20" width="220" height="180" rx="10" class="bgc" stroke="#9aa6b3" stroke-width="2"/>`;
        const loose = s === "salt" && state !== "solid";
        for (let row = 0; row < 4; row++) for (let col = 0; col < 5; col++) {
          const slide = shifted && row < 2 ? 40 : 0;
          let x = 50 + col * 40 + slide, y = 50 + row * 40;
          if (loose) { x = 130 + 90 * Math.sin(t * 0.7 + row * 1.9 + col * 2.7); y = 110 + 70 * Math.sin(t * 0.9 + col * 1.3 + row * 2.1); }
          if (cracked && row < 2) y -= 14;
          if (x > 225 || x < 35) continue;
          if (s === "metal") g += `<circle cx="${x}" cy="${y}" r="15" fill="#d98c3a"/><text x="${x}" y="${y + 5}" font-size="13" text-anchor="middle" fill="#1f2a37" font-weight="bold">+</text>`;
          else { const neg = (row + col) % 2 === 1; g += `<circle cx="${x}" cy="${y}" r="${neg ? 16 : 11}" fill="${neg ? "#7cb342" : "#9b7ede"}"/><text x="${x}" y="${y + 5}" font-size="13" text-anchor="middle" fill="#1f2a37" font-weight="bold">${neg ? "−" : "+"}</text>`; }
        }
        if (s === "metal") for (let i = 0; i < 18; i++) {
          const x = 30 + ((i * 53 + t * (bulb ? 60 : 14) * (i % 2 ? 1 : 0.6)) % 200), y = 40 + ((i * 37) % 150) + 6 * Math.sin(t * 2 + i);
          g += `<circle cx="${x}" cy="${y}" r="3.5" fill="#2f6f9f"/>`;
        }
        if (cracked) g += `<path d="M20 112 L80 104 L120 118 L170 100 L240 110" fill="none" stroke="#d64545" stroke-width="3"/>`;
        if (state === "solution") g = `<rect x="20" y="20" width="220" height="180" rx="10" fill="#dbeaf6" stroke="#9aa6b3" stroke-width="2"/>` + g.replace(/^<rect[^>]*>/, "");
        g += `<text x="130" y="214" font-size="12" text-anchor="middle" class="lbl">${s === "metal" ? "+ ions in a sea of electrons" : state === "solid" ? "+ and − ions, held in a lattice" : state === "molten" ? "molten: ions free to move" : "dissolved: ions free to move"}</text>`;
        el("lat").innerHTML = g;
        el("circ").innerHTML = `<path d="M40 160 V60 H110 M150 60 H220 V160" fill="none" stroke="#5b6675" stroke-width="4"/>
          <rect x="104" y="46" width="8" height="28" fill="#5b6675"/><rect x="118" y="38" width="4" height="44" fill="#5b6675"/>
          <text x="118" y="30" font-size="12" text-anchor="middle" class="lbl">battery</text>
          <rect x="70" y="150" width="120" height="44" rx="8" fill="${s === "metal" ? "#d98c3a" : state === "solution" ? "#dbeaf6" : state === "molten" ? "#f2b705" : "#e6e2d6"}" stroke="#9aa6b3" stroke-width="2"/>
          <path d="M40 160 H70 M190 160 H220" stroke="#5b6675" stroke-width="4"/>
          <text x="130" y="177" font-size="12" text-anchor="middle" fill="#1f2a37">sample</text>
          <circle cx="220" cy="110" r="18" fill="${bulb ? "#ffd84d" : "#ffffff"}" stroke="#5b6675" stroke-width="3"/>
          ${bulb ? `<circle cx="220" cy="110" r="30" fill="#ffd84d" opacity="0.35"/>` : ""}
          <text x="186" y="114" font-size="12" text-anchor="end" class="lbl">bulb</text>`;
        requestAnimationFrame(loop);
      })(performance.now());
    }

    draw();
  },
});

// Mole Lab — Grade 9 Unit 3, Stoichiometry (0620 U03 and 0654 C3).
//
// Four benches: balance an equation by changing only the big numbers, while two rows of atoms show
// whether each side has the same count; a scale that weighs out moles of anything (and a syringe for
// the gases, 24 dm³ each); magnesium burned in a crucible whose masses give the formula MgO; and
// magnesium added to a fixed flask of acid until the gas stops coming — the limiting reactant.
// Numbers are the ones the paper uses: Ar from the printed table, 24 dm³ at r.t.p.
//
// Layout rules (agent-contract §6): every drawing is an svg.scene inside its own viewBox, labels at
// 12 units or more, readouts in HTML chips, option pickers in .ctrl.pick.
ARCADE.toy({
  id: "g9-igcse1-u03-molelab", unit: "g9-igcse1-u03", units: ["g9-igcse1-u03", "g9-0654-c03"], order: 1,
  name: "Mole Lab", icon: "⚖️",
  blurb: "Balance equations, weigh out moles, burn magnesium and run the acid out",
  discoveries: [
    ["balanced", "Balanced", "Get the same atoms on both sides"],
    ["lowest", "Smallest numbers", "Balance one with numbers that could all be halved"],
    ["fixed", "Formulae are fixed", "Try to change a formula instead of the big number"],
    ["methane", "Methane burns", "Balance the burning of methane"],
    ["seven", "Every equation", "Balance all seven equations"],
    ["onemole", "Same number, different mass", "Weigh one mole of three different substances"],
    ["gas24", "24 dm³", "Fill the syringe with one mole of a gas"],
    ["gassame", "Any gas, same space", "Compare the same amount of two different gases"],
    ["heavier", "Heavier after burning", "Weigh the crucible after the magnesium has burned"],
    ["air", "It needs air", "Keep the lid shut and watch the burning stop"],
    ["smoke", "Lost in the smoke", "Take the lid right off while it burns"],
    ["mgo", "MgO from masses", "Burn it all without losing any and read the ratio"],
    ["constant", "Constant mass", "Weigh the finished crucible twice"],
    ["rise", "More metal, more gas", "Add magnesium to the acid"],
    ["plateau", "The acid ran out", "Keep adding magnesium after the gas stops"],
    ["double", "Twice the acid, twice the gas", "Use acid twice as concentrated"],
  ],
  mount(root, api) {
    let tab = "eq", run = 0;
    const alive = r => r === run && document.body.contains(root);
    const tabs = [["eq", "⚖️ Balance"], ["scale", "🥄 Moles"], ["cru", "🔥 Crucible"], ["lim", "🧪 Run out"]];
    const el = id => document.getElementById(id);
    const say = m => { const p = el("msg"); if (p && p.textContent !== m) { p.textContent = m; api.say(m); } };
    function shell(inner) {
      run++;
      root.innerHTML = `<div class="ctrl tabs">${tabs.map(([k, n]) =>
        `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${n}</button>`).join("")}</div><div id="bench">${inner}</div>`;
      root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
      return run;
    }
    function draw() { ({ eq: eqBench, scale: scaleBench, cru: cruBench, lim: limBench })[tab](); }
    const pickRow = (attr, label, opts, on) => `<div class="ctrl pick"><span class="lead">${label}</span>${opts.map(([k, n]) =>
      `<button data-${attr}="${k}" class="${k === on ? "on" : ""}">${n}</button>`).join("")}</div>`;
    const wirePick = (attr, fn) => root.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => {
      root.querySelectorAll(`[data-${attr}]`).forEach(o => o.classList.toggle("on", o === b)); fn(b.dataset[attr]); });
    const sub = f => f.replace(/(\d+)/g, d => [...d].map(c => "₀₁₂₃₄₅₆₇₈₉"[c]).join(""));

    // ── balancing ───────────────────────────────────────────────────────
    const EQS = {
      h2: [["H2", "O2"], ["H2O"], [2, 1, 2]],
      mg: [["Mg", "O2"], ["MgO"], [2, 1, 2]],
      na: [["Na", "Cl2"], ["NaCl"], [2, 1, 2]],
      ch4: [["CH4", "O2"], ["CO2", "H2O"], [1, 2, 1, 2]],
      nh3: [["N2", "H2"], ["NH3"], [1, 3, 2]],
      fe: [["Fe", "Cl2"], ["FeCl3"], [2, 3, 2]],
      caco3: [["CaCO3", "HCl"], ["CaCl2", "H2O", "CO2"], [1, 2, 1, 1, 1]],
    };
    const COL = { H: "#e8edf2", O: "#e4572e", Mg: "#9aa6b3", Na: "#9b7ede", Cl: "#7cb342", C: "#5b6675", N: "#4a90d9", Fe: "#b4531f", Ca: "#f2b705" };
    const atoms = f => { const out = {}; for (const [, s, n] of f.matchAll(/([A-Z][a-z]?)(\d*)/g)) out[s] = (out[s] || 0) + (+n || 1); return out; };
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
    let solved = {};
    function eqBench() {
      let e = "h2", co = [];
      shell(`${pickRow("e", "Equation", Object.keys(EQS).map(k => [k, sub(EQS[k][0][0]) + " + " + sub(EQS[k][0][1])]), e)}
        <div id="eqrow" class="ctrl" style="justify-content:center;font-size:1.15em"></div>
        <svg class="scene" viewBox="0 0 320 210" role="img" aria-label="Rows of atoms: the left side of the equation against the right side"><g id="tally"></g></svg>
        <div class="ctrl"><button id="fix">✏️ Change a formula instead</button><button id="reset">🔄 All back to 1</button></div>
        <p class="muted" id="msg">Use ➕ and ➖ to change how many of each there are. The rows of atoms must match.</p>`);
      const load = () => { co = EQS[e][2].map(() => 1); };
      load();
      wirePick("e", k => { e = k; load(); render(); say("Change only the big numbers in front."); });
      el("reset").onclick = () => { load(); render(); };
      el("fix").onclick = () => {
        api.found("fixed");
        say(e === "h2" || e === "ch4" ? "You cannot write H₂O₂ to fix it — that is hydrogen peroxide, a different substance. The formula is fixed; only the number in front can change." : "Changing a small number makes a different substance. Formulae are fixed; only the big number in front can change.");
      };
      function render() {
        const [L, R] = EQS[e], all = L.concat(R);
        const term = (f, i) => `<span style="white-space:nowrap"><button data-d="-1" data-i="${i}" aria-label="fewer">➖</button> <b style="font-size:1.2em;color:var(--brand)">${co[i] > 1 ? co[i] : ""}</b>${sub(f)} <button data-d="1" data-i="${i}" aria-label="more">➕</button></span>`;
        el("eqrow").innerHTML = L.map((f, i) => term(f, i)).join(" + ") + ` <b>→</b> ` + R.map((f, i) => term(f, i + L.length)).join(" + ");
        el("eqrow").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const i = +b.dataset.i; co[i] = Math.max(1, Math.min(9, co[i] + +b.dataset.d)); render(); check(); });
        const side = (fs, off) => { const t = {}; fs.forEach((f, i) => { for (const [s, n] of Object.entries(atoms(f))) t[s] = (t[s] || 0) + n * co[i + off]; }); return t; };
        const l = side(L, 0), rr = side(R, L.length), els = [...new Set([...Object.keys(l), ...Object.keys(rr)])];
        let g = `<text x="80" y="18" font-size="13" text-anchor="middle" class="lbl">left side</text><text x="240" y="18" font-size="13" text-anchor="middle" class="lbl">right side</text><line x1="160" y1="24" x2="160" y2="${30 + els.length * 40}" class="edge" stroke-width="2"/>`;
        els.forEach((s, k) => {
          const y = 44 + k * 40, a = l[s] || 0, b = rr[s] || 0, ok = a === b;
          const row = (n, x0, dir) => Array.from({ length: Math.min(n, 12) }, (_, j) => `<circle cx="${x0 + dir * (j % 6) * 22}" cy="${y + (j >= 6 ? 9 : 0) - (n > 6 ? 5 : 0)}" r="9" fill="${COL[s]}" stroke="#1f2a37" stroke-width="0.8"/>`).join("");
          g += row(a, 140, -1) + row(b, 180, 1)
            + `<text x="160" y="${y + 5}" font-size="13" text-anchor="middle" font-weight="bold" fill="${ok ? "#2e8b57" : "#d64545"}">${s}</text>`
            + `<text x="8" y="${y + 5}" font-size="12" class="lbl">${a}</text><text x="312" y="${y + 5}" font-size="12" text-anchor="end" class="lbl">${b}</text>`;
        });
        el("tally").innerHTML = g;
        el("tally").parentNode.setAttribute("viewBox", `0 0 320 ${36 + els.length * 40}`);
        return els.every(s => (l[s] || 0) === (rr[s] || 0));
      }
      function check() {
        if (!render()) return say("Not yet — a red symbol has a different number of atoms on each side.");
        const g = co.reduce(gcd);
        if (g > 1) { api.found("lowest"); return say(`Balanced — but every number divides by ${g}. Use the smallest whole numbers.`); }
        api.found("balanced"); solved[e] = true;
        if (e === "ch4") api.found("methane");
        if (Object.keys(solved).length === Object.keys(EQS).length) api.found("seven");
        say(`Balanced: the same atoms on both sides, just rearranged. ${Object.keys(solved).length} of ${Object.keys(EQS).length} done.`);
      }
      render();
    }

    // ── moles on a scale ────────────────────────────────────────────────
    function scaleBench() {
      const SUB = { c: ["Carbon", "C", 12, false, "#3b3f45"], mg: ["Magnesium", "Mg", 24, false, "#b8c0c8"], h2o: ["Water", "H2O", 18, false, "#dbeaf6"], nacl: ["Salt", "NaCl", 58.5, false, "#f4f1ea"], caco3: ["Chalk", "CaCO3", 100, false, "#efe7d4"], o2: ["Oxygen", "O2", 32, true, "#e4572e"], co2: ["Carbon dioxide", "CO2", 44, true, "#9aa6b3"] };
      let s = "c", n = 1, ones = {}, gases = {};
      shell(`${pickRow("s", "Substance", Object.entries(SUB).map(([k, x]) => [k, x[0]]), s)}
        ${pickRow("n", "Amount", [["0.1", "0.1 mol"], ["0.5", "0.5 mol"], ["1", "1 mol"], ["2", "2 mol"]], "1")}
        <svg class="scene" viewBox="0 0 320 200" role="img" aria-label="A balance, and a gas syringe for gases"><g id="sc"></g></svg>
        <div class="readout"><span class="chip" id="r1"></span><span class="chip" id="r2"></span><span class="chip" id="r3"></span></div>
        <p class="muted" id="msg">Pick a substance and an amount in moles. The scale weighs it out.</p>`);
      const show = () => {
        const [name, f, mr, gas, col] = SUB[s], mass = +(n * mr).toFixed(2);
        const parts = (n * 6.02).toFixed(2).replace(/\.?0+$/, "");
        el("r1").textContent = `Mr ${f === "C" || f === "Mg" ? "(Ar)" : ""} ${mr}`.replace("  ", " ");
        el("r2").textContent = `${mass} g`;
        el("r3").textContent = gas ? `${+(n * 24).toFixed(1)} dm³` : `${parts} × 10²³ particles`;
        const pile = Math.min(70, 8 + Math.sqrt(mass) * 4.2);
        let g = `<path d="M30 170 H170" stroke="#8d97a3" stroke-width="6" stroke-linecap="round"/><rect x="60" y="170" width="80" height="22" rx="4" fill="#8d97a3"/>
          <rect x="74" y="175" width="52" height="12" rx="2" fill="#1f2a37"/><text x="100" y="185" font-size="11" text-anchor="middle" fill="#7cf29c">${gas ? "—" : mass.toFixed(1) + " g"}</text>`;
        if (!gas) g += `<path d="M${100 - pile} 166 Q100 ${166 - pile * 1.1} ${100 + pile} 166 Z" fill="${col}" stroke="#7f8c99" stroke-width="2"/>`;
        // syringe: 0–60 dm³ scale
        const len = Math.min(170, n * 24 / 60 * 170);
        g += `<rect x="190" y="40" width="20" height="130" rx="3" class="bgc" stroke="#9aa6b3" stroke-width="2"/>`;
        g += `<rect x="193" y="${168 - (gas ? len * 0.74 : 0)}" width="14" height="${gas ? len * 0.74 : 0}" fill="${col}" opacity="0.6"/>`;
        g += [0, 24, 48].map(v => `<line x1="210" y1="${168 - v / 60 * 170 * 0.74}" x2="218" y2="${168 - v / 60 * 170 * 0.74}" stroke="#9aa6b3" stroke-width="2"/><text x="222" y="${172 - v / 60 * 170 * 0.74}" font-size="12" class="lbl">${v} dm³</text>`).join("");
        g += `<text x="200" y="30" font-size="12" text-anchor="middle" class="lbl">gas syringe</text><text x="100" y="30" font-size="14" text-anchor="middle">${n} mol of ${name.toLowerCase()}</text>`;
        if (gas) g += `<text x="100" y="120" font-size="12" text-anchor="middle" class="lbl">a gas is measured by volume →</text>`;
        el("sc").innerHTML = g;
        if (n === 1) { ones[s] = true; if (Object.keys(ones).length >= 3) { if (api.found("onemole")) say("One mole of anything is 6.02 × 10²³ particles. The particles weigh different amounts, so the masses differ: 12 g, 24 g, 18 g…"); } }
        if (gas && n === 1 && api.found("gas24")) say("One mole of any gas fills 24 dm³ at room temperature and pressure.");
        if (gas) { gases[s + ":" + n] = true; if (gases["o2:" + n] && gases["co2:" + n] && api.found("gassame")) say(`${n} mol of oxygen and ${n} mol of carbon dioxide fill exactly the same volume, ${n * 24} dm³ — even though carbon dioxide is heavier.`); }
      };
      wirePick("s", k => { s = k; show(); });
      wirePick("n", k => { n = +k; show(); });
      show();
    }

    // ── magnesium in a crucible ─────────────────────────────────────────
    function cruBench() {
      const EMPTY = 25.00;
      let mg = 0.24, p = 0, air = 0.35, lost = 0, heating = false, lidOff = false, weighed = [], stall = 0;
      const r = shell(`${pickRow("m", "Magnesium", [["0.24", "0.24 g"], ["0.36", "0.36 g"], ["0.48", "0.48 g"]], "0.24")}
        <div class="duo">
          <svg class="scene" viewBox="0 0 240 220" role="img" aria-label="A crucible with a lid on a pipe-clay triangle over a burner"><g id="cr"></g></svg>
          <div style="flex:1 1 220px;max-width:340px" id="sheet"></div></div>
        <div class="ctrl"><button id="heat">🔥 Heat</button><button id="peek">🫙 Lift the lid a little</button><button id="off">🫙 Take the lid off</button><button id="weigh">⚖️ Weigh</button><button id="again">🔄 New ribbon</button></div>
        <p class="muted" id="msg">Weigh the crucible with the ribbon, then heat. Lift the lid now and then to let air in.</p>`);
      const fresh = () => { p = 0; air = 0.35; lost = 0; heating = false; lidOff = false; weighed = []; stall = 0; };
      wirePick("m", k => { mg = +k; fresh(); sheet(); });
      el("again").onclick = () => { fresh(); sheet(); say("A fresh coil of ribbon."); };
      el("heat").onclick = () => { heating = !heating; el("heat").textContent = heating ? "⏸️ Stop heating" : "🔥 Heat"; };
      el("peek").onclick = () => { lidOff = false; el("off").textContent = "🫙 Take the lid off"; air = Math.min(1, air + 0.35); say("A little air gets in and the magnesium glows brighter."); };
      el("off").onclick = () => { lidOff = !lidOff; el("off").textContent = lidOff ? "🫙 Put the lid back" : "🫙 Take the lid off"; };
      const mass = () => EMPTY + mg + mg * (16 / 24) * p - lost;
      el("weigh").onclick = () => {
        const m = +mass().toFixed(2); weighed.push([m, p]);
        if (p > 0.05 && m > EMPTY + mg + 0.005) api.found("heavier");
        const last = weighed.slice(-2);
        if (p >= 1 && last.length === 2 && last[0][1] >= 1 && last[0][0] === last[1][0]) { api.found("constant"); say("Same mass twice — it has reached constant mass, so all the magnesium has reacted."); }
        else say(`The balance reads ${m.toFixed(2)} g.`);
        sheet();
      };
      function sheet() {
        const done = p >= 1, m = mass(), o = m - EMPTY - mg;
        const nMg = mg / 24, nO = o / 16, ratio = nO / nMg;
        el("sheet").innerHTML = `<table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums">
          ${[["crucible + lid", EMPTY.toFixed(2) + " g"], ["+ magnesium", (EMPTY + mg).toFixed(2) + " g"], ["after heating", weighed.length ? weighed[weighed.length - 1][0].toFixed(2) + " g" : "—"],
            ["oxygen gained", done ? o.toFixed(3) + " g" : "—"], ["moles Mg", done ? nMg.toFixed(3) : "—"], ["moles O", done ? nO.toFixed(3) : "—"], ["Mg : O", done ? "1 : " + ratio.toFixed(2) : "—"]]
            .map(([a, b]) => `<tr><td style="padding:4px 6px;border-bottom:1px solid var(--line)">${a}</td><td style="padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-weight:600">${b}</td></tr>`).join("")}</table>`;
      }
      sheet();
      let last = performance.now(), finished = false;
      (function loop(now) {
        if (!alive(r)) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (heating && p < 1) {
          if (lidOff) { p = Math.min(1, p + dt * 0.45); lost += dt * 0.012 * mg / 0.24; if (lost > 0.004) api.found("smoke"); }
          else if (air > 0.01) { const d = Math.min(air, dt * 0.25); p = Math.min(1, p + d); air -= d; stall = 0; }
          else { stall += dt; if (stall > 1.5 && api.found("air")) say("It has stopped glowing. With the lid shut the oxygen ran out — burning needs air. Lift the lid a little."); }
        }
        if (p >= 1 && !finished) {
          finished = true; heating = false; el("heat").textContent = "🔥 Heat";
          const ratio = ((mass() - EMPTY - mg) / 16) / (mg / 24);
          if (lost < 0.004) { api.found("mgo"); say(`All burned. ${(mg / 24).toFixed(3)} mol of magnesium took ${(mg / 24).toFixed(3)} mol of oxygen atoms — one to one, so the formula is MgO. Weigh it.`); }
          else say(`All burned, but white smoke escaped with the lid off. The ratio comes out 1 : ${ratio.toFixed(2)}, not 1 : 1 — the lost smoke was magnesium oxide.`);
          sheet();
        }
        if (p < 1) finished = false;
        const glow = heating && p < 1 && (lidOff || air > 0.01);
        el("cr").innerHTML = `
          <path d="M40 150 L120 150 L200 150" stroke="#c9b79c" stroke-width="5"/>
          <path d="M70 100 L80 150 H160 L170 100 Z" fill="#e8e2d6" stroke="#9aa6b3" stroke-width="3"/>
          <path d="M84 146 H156" stroke="${p > 0 ? "#f4f1ea" : "#b8c0c8"}" stroke-width="${6 + p * 8}" stroke-linecap="round" opacity="0.95"/>
          ${p < 1 ? `<path d="M90 140 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0" fill="none" stroke="#9aa6b3" stroke-width="${3 * (1 - p)}"/>` : ""}
          ${glow ? `<circle cx="120" cy="132" r="22" fill="#ffffff" opacity="0.85"/><circle cx="120" cy="132" r="34" fill="#fff6c2" opacity="0.4"/>` : ""}
          <g transform="${lidOff ? "translate(22 -30) rotate(18 120 96)" : ""}"><path d="M62 96 H178" stroke="#9aa6b3" stroke-width="7" stroke-linecap="round"/><rect x="114" y="84" width="12" height="9" rx="3" fill="#9aa6b3"/></g>
          ${lidOff && heating && p < 1 ? `<g opacity="0.7">${[0, 1, 2].map(i => `<circle cx="${105 + i * 14 + 6 * Math.sin(now / 300 + i)}" cy="${80 - ((now / 20 + i * 30) % 70)}" r="${7 + i}" fill="#f4f4f4" stroke="#c9ced4"/>`).join("")}</g>` : ""}
          <path d="M60 156 L45 214 M180 156 L195 214" stroke="#8d97a3" stroke-width="4"/>
          ${heating ? `<path d="M108 210 Q108 186 120 170 Q132 186 132 210 Z" fill="#4a90d9" opacity="0.8"/>` : ""}
          <rect x="112" y="200" width="16" height="16" fill="#8d97a3"/>
          <text x="120" y="22" font-size="13" text-anchor="middle">${p >= 1 ? "all magnesium oxide" : Math.round(p * 100) + "% burned"}</text>`;
        requestAnimationFrame(loop);
      })(performance.now());
    }

    // ── limiting reactant ───────────────────────────────────────────────
    function limBench() {
      let conc = 1, added = 0, reacted = 0, pts = [[0, 0]];
      const ACID = 50;                                    // cm³
      const r = shell(`${pickRow("c", "Acid", [["1", "1.0 mol/dm³"], ["2", "2.0 mol/dm³"]], "1")}
        <div class="duo">
          <svg class="scene" viewBox="0 0 260 220" role="img" aria-label="A flask of acid with magnesium in it, joined to a gas syringe"><g id="fl"></g></svg>
          <svg class="scene" viewBox="0 0 260 220" role="img" aria-label="Volume of hydrogen against mass of magnesium added"><g id="gr"></g></svg></div>
        <div class="ctrl"><button id="add">➕ Add 0.1 g magnesium</button><button id="again">🔄 Fresh acid</button></div>
        <div class="readout"><span class="chip" id="r1"></span><span class="chip" id="r2"></span></div>
        <p class="muted" id="msg">50 cm³ of hydrochloric acid. Add magnesium, a tenth of a gram at a time.</p>`);
      const maxMg = () => ACID / 1000 * conc / 2 * 24;   // Mg + 2HCl: moles acid / 2 × 24
      const gas = m => m / 24 * 24000;                     // cm³ of H₂
      const fresh = () => { added = 0; reacted = 0; pts = [[0, 0]]; };
      wirePick("c", k => { conc = +k; fresh(); say(`${conc.toFixed(1)} mol/dm³ acid, 50 cm³.`); });
      el("again").onclick = () => { fresh(); say("Fresh acid."); };
      el("add").onclick = () => { if (added >= 1.6 - 1e-9) return say("That is plenty — the graph has told its story."); added = +(added + 0.1).toFixed(1); };
      let last = performance.now();
      (function loop(now) {
        if (!alive(r)) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const target = Math.min(added, maxMg());
        if (reacted < target) reacted = Math.min(target, reacted + dt * 0.25);
        // each 0.1 g plots a point once its fizzing has finished
        if (Math.abs(reacted - target) < 1e-9 && !pts.find(p => Math.abs(p[0] - added) < 1e-9)) {
          pts.push([added, gas(reacted)]);
          if (gas(reacted) > 0) api.found("rise");
          if (added > maxMg() + 0.05) { if (api.found("plateau")) say(`No more gas. The ${conc === 1 ? "0.050" : "0.100"} mol of acid is used up — the acid is the limiting reactant, and the extra magnesium just sits there.`); }
          if (conc === 2 && added > maxMg()) { if (api.found("double")) say("Twice as much acid, twice the hydrogen before it runs out: 1200 cm³ instead of 600."); }
        }
        const left = Math.max(0, added - reacted), fizz = reacted < target;
        el("r1").textContent = `${added.toFixed(1)} g added`;
        el("r2").textContent = `${Math.round(gas(reacted))} cm³ hydrogen`;
        let f = `<path d="M40 70 V100 L20 190 H120 L100 100 V70" fill="none" stroke="#9aa6b3" stroke-width="3"/>
          <path d="M27 160 H113 L120 190 H20 Z" fill="#dbeaf6"/>
          <path d="M70 70 V40 H140" fill="none" stroke="#9aa6b3" stroke-width="3"/>
          <rect x="140" y="30" width="110" height="20" rx="3" class="bgc" stroke="#9aa6b3" stroke-width="2"/>
          <rect x="142" y="32" width="${Math.min(106, gas(reacted) / 1200 * 106)}" height="16" fill="#e8edf2"/>
          <line x1="${142 + Math.min(106, gas(reacted) / 1200 * 106)}" y1="26" x2="${142 + Math.min(106, gas(reacted) / 1200 * 106)}" y2="54" stroke="#5b6675" stroke-width="4"/>
          <text x="195" y="72" font-size="12" text-anchor="middle" class="lbl">gas syringe</text>
          <text x="70" y="210" font-size="12" text-anchor="middle" class="lbl">50 cm³ acid</text>`;
        for (let i = 0; i < Math.round(left * 10); i++) f += `<rect x="${30 + (i % 8) * 10}" y="${180 - Math.floor(i / 8) * 5}" width="8" height="3" fill="#b8c0c8" stroke="#5b6675" stroke-width="0.6"/>`;
        if (fizz) for (let i = 0; i < 8; i++) f += `<circle cx="${40 + i * 9}" cy="${185 - ((now / 8 + i * 17) % 30)}" r="2.5" fill="#ffffff" stroke="#9aa6b3"/>`;
        el("fl").innerHTML = f;
        const px = m => 40 + m / 1.6 * 205, py = v => 190 - v / 1200 * 165;
        el("gr").innerHTML = `<path d="M40 20 V190 H248" fill="none" stroke="#9aa6b3" stroke-width="2"/>`
          + [0, 0.4, 0.8, 1.2, 1.6].map(m => `<text x="${px(m)}" y="205" font-size="11" text-anchor="middle" class="lbl">${m}</text>`).join("")
          + [0, 600, 1200].map(v => `<text x="34" y="${py(v) + 4}" font-size="11" text-anchor="end" class="lbl">${v}</text><line x1="40" y1="${py(v)}" x2="248" y2="${py(v)}" class="edge" opacity="${v ? 0.6 : 0}"/>`).join("")
          + `<text x="144" y="218" font-size="12" text-anchor="middle" class="lbl">magnesium added (g)</text><text x="12" y="105" font-size="12" class="lbl" text-anchor="middle" transform="rotate(-90 12 105)">hydrogen (cm³)</text>`
          + (pts.length > 1 ? `<polyline points="${pts.map(p => px(p[0]) + "," + py(p[1])).join(" ")}" fill="none" stroke="#2f6f9f" stroke-width="3"/>` : "")
          + pts.map(p => `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="4" fill="#2f6f9f"/>`).join("");
        requestAnimationFrame(loop);
      })(performance.now());
    }

    draw();
  },
});

// Reaction Lab — Grade 9 (IGCSE 1) Unit 6, Chemical Reactions. Also Grade 10's first unit this year
// (they never did it in Grade 9 — see BORROWED in build_arcade.py), so one toy serves both classes.
//
// Four benches, one per topic in the Core Notes: heat, wet and crush five samples on a balance and
// see whether a new substance appears; race magnesium in acid (and hydrogen peroxide with a catalyst)
// while a zoom shows which collisions clear the activation-energy bar and the graph keeps every run;
// dry and re-wet the two hydrated salts, then run a Haber or Contact reactor and watch equilibrium
// stay busy; and pass electrons by hand from magnesium to copper ions, then use the two test reagents.

// Layout rules (agent-contract §6): every drawing is an svg.scene inside its own viewBox, labels at

ARCADE.toy({
  id: "g9-igcse1-u06-reactionlab", unit: "g9-igcse1-u06", order: 1,

  discoveries: [
    ["melt", "Still water", "Melt the ice — is it a new substance?"],
    ["saltback", "Salt comes back", "Dissolve the salt, then get it back"],
