              const same = runs.find(q => q.mass === mass && q.top > 0 && Math.abs(Math.log(q.k / k())) > 0.25);
              const diff = runs.find(q => q.mass !== undefined && q.mass !== mass && q.top > 0);
              if (same && api.found("sametop")) say("Look where the two curves end: the same height. Faster conditions make a steeper line, never a higher one — the magnesium sets how much hydrogen you get.");
              else if (diff && api.found("moretop")) say("A different top! The amount of magnesium sets how much gas there is. The conditions only set how fast you get there.");
            } else if (cat && api.found("catalyst")) say("It gushes. The catalyst gives a route with a lower activation energy — look at the energy graph: the bar moved, the particles did not speed up. Now filter it out and weigh it.");
            opts();
          }
        }
        // the zoom: particles hitting the surface
        const sp = 80 * Math.sqrt(kT(T));
        const surf = rx === "mg" ? (form === "ribbon" ? [[70, 170]] : grains.map(g => [g[0] - 9, g[0] + 9])) : grains.map(g => [g[0] - 12, g[0] + 12]);
        const floor = rx === "mg" ? (form === "ribbon" ? 130 : 118) : 136;
        P.forEach(p => {
          p.x += Math.cos(p.a) * sp * dt; p.y += Math.sin(p.a) * sp * dt;
          if (p.x < 18) { p.x = 18; p.a = Math.PI - p.a; } if (p.x > 222) { p.x = 222; p.a = Math.PI - p.a; }
          if (p.y < 38) { p.y = 38; p.a = -p.a; }
          if (p.y > floor) {
            p.y = floor; p.a = -p.a + rand(-0.3, 0.3);
            const onSolid = rx === "h2o2" && !cat ? true : surf.some(([a, b]) => p.x >= a && p.x <= b);
            if (onSolid && going) { const E = gamma2(T), ok = E >= Ea(); hits.push({ x: p.x, y: floor + 6, at: now, ok }); }
          }
        });
        while (hits.length && hits[0].at < now - 1000) hits.shift();
        const good = hits.filter(h => h.ok).length;
        let b = `<rect x="10" y="10" width="220" height="140" rx="6" fill="#dbeaf6" stroke="#7f8c99" stroke-width="2"/>`;
        if (rx === "mg" && form === "ribbon") b += `<rect x="70" y="136" width="100" height="12" rx="2" fill="#8d97a3"/><text x="120" y="146" text-anchor="middle" font-size="11" fill="#ffffff">magnesium</text>`;
        grains.forEach(([x, y]) => { b += rx === "mg" ? `<circle cx="${x}" cy="${y + 8}" r="7" fill="#8d97a3"/>` : `<rect x="${x - 12}" y="${y}" width="24" height="9" rx="3" fill="#2b2b2b"/>`; });
        P.forEach(p => { b += rx === "mg" ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#d64545"/>`
          : `<circle cx="${(p.x - 3).toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#d64545"/><circle cx="${(p.x + 3).toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#d64545"/>`; });
        hits.forEach(h => { const a = 1 - (now - h.at) / 1000; b += h.ok ? `<text x="${h.x.toFixed(0)}" y="${(h.y - 4).toFixed(0)}" text-anchor="middle" font-size="16" opacity="${a.toFixed(2)}">💥</text>`
          : `<circle cx="${h.x.toFixed(0)}" cy="${(h.y - 8).toFixed(0)}" r="${5 + (1 - a) * 6}" fill="none" stroke="#5b6675" stroke-width="1.5" opacity="${a.toFixed(2)}"/>`; });
        b += `<text x="18" y="28" font-size="12" fill="#5b6675">${rx === "mg" ? "acid particles" : "H₂O₂ molecules"}</text>`;
        el("box").innerHTML = b;
        // the energy spread with the activation-energy bar
        const X = E => 20 + E * 20, Y = f => 236 - f * 150, curve = [], tail = [];
        // the same number of particles at every temperature: hotter spreads the curve out and lowers it
        for (let E = 0; E <= 10.001; E += 0.25) { const f = E / kT(T) ** 2 * Math.exp(-E / kT(T)) * Math.E * 0.42; curve.push(`${X(E).toFixed(1)},${Y(f).toFixed(1)}`); if (E >= Ea()) tail.push(`${X(E).toFixed(1)},${Y(f).toFixed(1)}`); }
        let d = `<path d="M20 160 V236 H222" fill="none" stroke="#5b6675" stroke-width="1.5"/>
          <text x="121" y="249" text-anchor="middle" font-size="12" class="lbl">energy of a collision →</text>`;
        if (tail.length) d += `<polygon points="${X(Ea())},236 ${tail.join(" ")} ${X(10)},236" fill="#f2b705" opacity=".55"/>`;
        d += `<polyline points="${curve.join(" ")}" fill="none" stroke="#2f6f9f" stroke-width="2.5"/>`;
        if (rx === "h2o2" && cat) d += `<path d="M${X(7)} 168 V236" stroke="#9aa6b3" stroke-dasharray="3 3" stroke-width="2"/><text x="${X(7) + 3}" y="178" font-size="12" class="lbl">old bar</text>`;
        d += `<path d="M${X(Ea())} 164 V236" stroke="#b4531f" stroke-width="2.5"/><text x="${X(Ea()) + 4}" y="${rx === "h2o2" && cat ? 196 : 176}" font-size="12" fill="#b4531f">activation energy</text>`;
        el("dist").innerHTML = d;
        // syringe and graph
        const top = 160, tmax = 150, GX = s => 40 + s / tmax * 210, GY = v => 236 - v / top * 156;
        const fill = Math.min(1, V / top);
        el("syr").innerHTML = `<rect x="40" y="18" width="200" height="34" rx="4" fill="#ffffff" fill-opacity=".5" stroke="#7f8c99" stroke-width="2.5"/>
          ${Array.from({ length: 9 }, (_, i) => `<path d="M${40 + (i + 1) * 20} 18 V26" stroke="#7f8c99"/>`).join("")}
          <rect x="40" y="20" width="${200 * fill}" height="30" fill="#cfe6f7"/><rect x="${40 + 200 * fill}" y="20" width="6" height="30" fill="#5b6675"/>
          <rect x="${46 + 200 * fill}" y="31" width="${Math.max(0, 200 - 200 * fill) + 12}" height="8" fill="#9aa6b3"/>
          <rect x="18" y="31" width="22" height="8" fill="#9aa6b3"/><text x="20" y="66" font-size="12" class="lbl">gas syringe</text>`;
        let g = `<path d="M40 76 V236 H252" fill="none" stroke="#5b6675" stroke-width="2"/>
          <text x="146" y="262" text-anchor="middle" font-size="12" class="lbl">time / s</text>
          <text x="14" y="160" text-anchor="middle" font-size="12" class="lbl" transform="rotate(-90 14 160)">gas / cm³</text>`;
        [50, 100, 150].forEach(v => { g += `<text x="36" y="${GY(v) + 4}" text-anchor="end" font-size="11" class="lbl">${v}</text><path d="M40 ${GY(v)} H252" stroke="#9aa6b3" stroke-opacity=".3"/>`; });
        [0, 50, 100, 150].forEach(s => { g += `<text x="${GX(s)}" y="249" text-anchor="middle" font-size="11" class="lbl">${s}</text>`; });
        const line = (pts, c, w, o) => `<polyline points="${pts.filter((_, i) => i % 3 === 0 || i === pts.length - 1).map(([a, v]) => `${GX(a).toFixed(1)},${GY(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" opacity="${o}"/>`;
        runs.forEach((q, i) => { g += line(q.pts, COLS[i % 4], 2, 0.8); });
        if (cur.length > 1) g += line(cur, "#d64545", 3, 1);
        el("graph").innerHTML = g;
        el("legend").innerHTML = runs.map((q, i) => `<span class="chip" style="white-space:normal"><i class="swatch" style="background:${COLS[i % 4]}"></i>${q.label}</span>`).join("")
          + (cur.length > 1 && meta ? `<span class="chip" style="white-space:normal"><i class="swatch" style="background:#d64545"></i>${going ? "now" : "last run"}: ${meta.label}</span>` : "");
        el("r1").textContent = `${Math.round(V)} cm³ ${rx === "mg" ? "hydrogen" : "oxygen"}`;
        el("r2").textContent = `💥 ${good} successful hits / s`;
        el("r3").textContent = `${Math.round(100 * frac(T, Ea()))}% clear the bar`;
      });
    }

    // ── 3. reversible reactions and equilibrium ────────────────────────
    function eqBench() {
      let part = "salts";
      const r = shell(`${pickRow("part", "Bench", [["salts", "💧 Hydrated salts"], ["reactor", "🏭 Haber & Contact"]], part)}<div id="part"></div><p class="muted" id="msg"></p>`);
      wirePick("part", v => { part = v; open(); });
      let pr = 0;
      function open() { pr++; const me = pr, live = () => alive(r) && me === pr && el("part"); (part === "salts" ? salts : reactor)(live); }
      open();

      function salts(live) {
        // wet = 1 hydrated, 0 anhydrous; heat drives towards 0, water snaps back to 1 with a temperature spike
        const S = { cu: { wet: 1, heat: false, temp: 20, was: false }, co: { wet: 1, heat: false, temp: 20, was: false } };
        const mix = (a, b, f) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), A = h(a), B = h(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * f)).join(",")})`; };
        const colour = k => k === "cu" ? mix("#ffffff", "#2a7fd4", S.cu.wet) : mix("#2a54c8", "#e88fb4", S.co.wet);
        el("part").innerHTML = `<div class="duo">
          <svg class="scene" viewBox="0 40 220 160" role="img" aria-label="Copper(II) sulfate in an evaporating dish"><g id="cu"></g></svg>
          <svg class="scene" viewBox="0 40 220 160" role="img" aria-label="Cobalt(II) chloride paper on a gauze"><g id="co"></g></svg></div>
          <div class="ctrl"><span class="lead muted">Copper(II) sulfate:</span><button id="cuh">🔥 Heat</button><button id="cuw">💧 Add water</button></div>
          <div class="ctrl"><span class="lead muted">Cobalt(II) chloride paper:</span><button id="coh">🔥 Heat</button><button id="cow">💧 Add water</button></div>
          <div class="readout"><span class="chip" id="eq1" style="white-space:normal"></span><span class="chip" id="eq2" style="white-space:normal"></span></div>`;
        const tog = k => { S[k].heat = !S[k].heat; el(k + "h").classList.toggle("on", S[k].heat);
          say(S[k].heat ? "Heating… the water of crystallisation is being driven off." : "Burner off."); };
        const wet = k => { const s = S[k];
          if (s.wet > 0.9) return say("It is already hydrated. Heat it first.");
          s.heat = false; el(k + "h").classList.remove("on"); s.temp = 20 + 40 * (1 - s.wet); s.wet = 1;
          if (k === "cu" && s.was && api.found("cublue")) say("Blue again — and feel the dish: it got hot. Putting the water back gives out the same energy that heating took in.");
          else say(k === "cu" ? "Blue again, and warm. The reaction runs both ways." : "Pink again. Water turns blue cobalt chloride paper pink — that is a test for water."); };
        el("cuh").onclick = () => tog("cu"); el("coh").onclick = () => tog("co");
        el("cuw").onclick = () => wet("cu"); el("cow").onclick = () => wet("co");
        say("Two salts with water locked inside their crystals. Heat them, then give the water back.");
        const dish = (k, x0) => {
          const s = S[k], c = colour(k);
          let g = `<text x="110" y="58" text-anchor="middle" font-size="12" class="lbl">${k === "cu" ? "copper(II) sulfate" : "cobalt(II) chloride paper"}</text>`;
          if (k === "cu") g += `<path d="M40 96 Q110 160 180 96 Z" fill="#e9e3d6" stroke="#9aa6b3" stroke-width="3"/><path d="M58 108 Q110 146 162 108 Q110 96 58 108Z" fill="${c}" stroke="#9aa6b3"/>`;
          else g += `<rect x="30" y="112" width="160" height="6" fill="#7f8c99"/><rect x="60" y="78" width="100" height="34" rx="3" fill="${c}" stroke="#9aa6b3"/>`;
          g += `<path d="M70 168 H150 M82 168 L74 190 M138 168 L146 190" stroke="#7f8c99" stroke-width="4"/>`;
          if (s.heat) g += `<text x="110" y="${k === "cu" ? 160 : 148}" text-anchor="middle" font-size="26">🔥</text>`;
          if (s.heat && s.wet > 0.05) g += `<text x="${110 + rand(-30, 30)}" y="${k === "cu" ? 82 : 66}" text-anchor="middle" font-size="16" opacity=".7">💨</text>`;
          g += `<text x="110" y="${k === "cu" ? 196 : 196}" text-anchor="middle" font-size="12" class="lbl" dy="-0">${s.temp > 25 ? `🌡️ ${Math.round(s.temp)} °C` : ""}</text>`;
          return g;
        };
        ticker(live, dt => {
          ["cu", "co"].forEach(k => { const s = S[k];
            if (s.heat) s.wet = Math.max(0, s.wet - dt * 0.25);
            s.temp += (20 - s.temp) * Math.min(1, dt * 0.25);
            if (s.wet < 0.05 && !s.was) { s.was = true;
              if (k === "cu" && api.found("cuwhite")) say("White! That is anhydrous copper(II) sulfate: CuSO₄·5H₂O → CuSO₄ + 5H₂O. A new substance, so a chemical change — even though it reverses easily.");
              if (k === "co" && api.found("coblue")) say("Pink to blue. For cobalt chloride, BLUE is the dry one — the opposite of copper sulfate."); }
            if (s.wet > 0.9) s.was = false;
          });
          if (S.cu.wet < 0.05 && S.co.wet < 0.05 && api.found("opposite")) say("Look at them side by side: copper is white when dry, cobalt is blue when dry. Blue means wet for copper and dry for cobalt — learn them as a pair.");
          el("cu").innerHTML = dish("cu"); el("co").innerHTML = dish("co");
          el("eq1").textContent = `CuSO₄·5H₂O ${S.cu.wet > 0.5 ? "(blue)" : ""} ⇌ CuSO₄ ${S.cu.wet <= 0.5 ? "(white)" : ""} + 5H₂O`;
          el("eq2").textContent = `CoCl₂·6H₂O ${S.co.wet > 0.5 ? "(pink)" : ""} ⇌ CoCl₂ ${S.co.wet <= 0.5 ? "(blue)" : ""} + 6H₂O`;
        });
      }

      function reactor(live) {
        // Equilibrium yields (≈, read off the usual textbook curves) by temperature and pressure.
        const TS = [250, 350, 450, 550, 650];
        const HP = [50, 100, 200, 300, 400], HY = [[55, 68, 79, 84, 87], [28, 40, 54, 62, 68], [12, 20, 30, 38, 44], [5, 9, 15, 21, 26], [2, 4, 8, 11, 14]];
        const CP = [1, 2, 5, 10], CY = [[99.5, 99.6, 99.7, 99.8], [98.5, 99, 99.3, 99.5], [95, 96, 97.5, 98.5], [85, 88, 92, 94], [65, 70, 78, 84]];
        let proc = "haber", T = 400, P = 200, cat = true, mols = [], x = 0, ev = [], calmSince = null;
        const interp = (xs, v) => { let i = 0; while (i < xs.length - 2 && v > xs[i + 1]) i++; return [i, Math.max(0, Math.min(1, (v - xs[i]) / (xs[i + 1] - xs[i])))]; };
        const yieldNow = () => { const [ps, ys] = proc === "haber" ? [HP, HY] : [CP, CY];
          const [i, fi] = interp(TS, T), [j, fj] = interp(ps, P), row = k => ys[k][j] + (ys[k][j + 1] - ys[k][j]) * fj;
          return row(i) + (row(i + 1) - row(i)) * fi; };
        const speed = () => Math.pow(2, (T - 450) / 25) * (cat ? 1 : 0.02) * (proc === "haber" ? P / 200 : Math.sqrt(P / 2));
        // Haber: 8 N₂ + 24 H₂, x pairs turned into 2 NH₃ each. Contact: 16 SO₂ + 8 O₂, x is O₂ used.
        const xeq = () => { const y = yieldNow() / 100; return proc === "haber" ? 16 * y / (1 + y) : 8 * y; };
        const xmax = () => 8;
        el("part").innerHTML = `${pickRow("pp", "Process", [["haber", "Haber — ammonia"], ["contact", "Contact — sulfur trioxide"]], proc)}
          <div class="ctrl slider"><label for="tt">Temperature</label><input type="range" id="tt" min="250" max="650" step="50" value="${T}"><span class="chip" id="tv"></span></div>
          <div id="prow"></div>
          ${pickRow("cc", "Catalyst", [["1", "On"], ["0", "Off"]], "1")}
          <p class="jobline" id="eqn"></p>
          <svg class="scene" viewBox="0 0 340 200" role="img" aria-label="Molecules in a closed reactor, reacting both ways"><g id="rv"></g></svg>
          <div class="readout"><span class="chip" id="y1"></span><span class="chip" id="y2"></span><span class="chip" id="y3"></span></div>`;
        function prow() {
          const ps = proc === "haber" ? HP : CP;
          el("prow").innerHTML = pickRow("pr", "Pressure", ps.map(p => [p, `${p} atm`]), P);
          wirePick("pr", v => { P = +v; changed(`Pressure ${P} atm.`); });
          el("eqn").innerHTML = proc === "haber" ? "N₂ + 3H₂ ⇌ 2NH₃ &nbsp;·&nbsp; forward is exothermic &nbsp;·&nbsp; 4 moles of gas → 2" : "2SO₂ + O₂ ⇌ 2SO₃ &nbsp;·&nbsp; forward is exothermic &nbsp;·&nbsp; 3 moles of gas → 2";
          el("tv").textContent = `${T} °C`;
        }
        function fill() {
          mols = [];
          const add = (n, kind) => { for (let i = 0; i < n; i++) mols.push({ kind, x: rand(24, 316), y: rand(24, 176), a: rand(0, 6.28), f: 0 }); };
          x = 0; if (proc === "haber") { add(8, "N2"); add(24, "H2"); } else { add(16, "SO2"); add(8, "O2"); }
          ev = []; calmSince = null;
        }
        function changed(m, quiet) {
          calmSince = null;
          if (quiet) return say(m);
          const y = yieldNow();
          let note = "";
          if (proc === "haber" && T <= 300 && api.found("coldyield")) note = " Cold: the yield would be huge, but look how long it takes to get there.";
          if (proc === "haber" && P >= 400 && api.found("pressup")) note = " 4 moles of gas go to 2, so squeezing pushes the equilibrium right. But 400 atm needs thick, costly, dangerous pipework.";
          if (proc === "haber" && T === 450 && P === 200 && cat && api.found("compromise")) note = " These are the real conditions: 450 °C is a compromise — a lower temperature gives more ammonia, but far too slowly. The unreacted gas is recycled.";
          if (proc === "contact" && T === 450 && P === 2 && cat && api.found("contact")) note = " 96% at only 2 atm. Higher pressure would barely help, so it is not worth the cost.";
          say(`${m} Equilibrium mixture ≈ ${y.toFixed(0)}% ${proc === "haber" ? "ammonia" : "converted"}.${note}`);
        }
        wirePick("pp", v => { proc = v; P = proc === "haber" ? 200 : 2; T = proc === "haber" ? 400 : 450; el("tt").value = T; fill(); prow(); changed(proc === "haber" ? "Haber process." : "Contact process."); });
        el("tt").oninput = () => { T = +el("tt").value; el("tv").textContent = `${T} °C`; changed(`${T} °C.`); };
        wirePick("cc", v => { const before = fmtTime(speed()); cat = v === "1";
          if (!cat && proc === "haber" && api.found("catsame")) say(`Catalyst out: the equilibrium mixture is still ≈ ${yieldNow().toFixed(0)}% ammonia — only the wait changes, from ${before} to ${fmtTime(speed())}. A catalyst speeds the forward and backward reactions equally.`);
          else changed(cat ? "Catalyst in." : "Catalyst out — everything slows right down.");
        });
        const fmtTime = s => { const m = 1 / s; return m < 1 ? "under a minute" : m < 60 ? `about ${Math.round(m)} min` : m < 1440 ? `about ${Math.round(m / 60)} h` : `about ${Math.round(m / 1440)} days`; };
        fill(); prow(); changed("A sealed reactor of nitrogen and hydrogen, at 400 °C and 200 atm with an iron catalyst. Watch it settle, then change the conditions.", true);
        // Each direction fills its own meter at its own rate and reacts when the meter is full. With so
        // few molecules, chance alone would swing the mixture ±10% a step; this way equilibrium looks
        // like what it is — forward and backward taking turns while the amounts hold still.
        let accF = 0, accB = 0, shown = 0, needF = 1, needB = 1;
        ticker(live, (dt, now) => {
          const rate = 2.5 * Math.max(0.03, Math.min(3, speed())), e = Math.max(0.05, xeq()), m = xmax();
          const fwd = rate * Math.max(0, m - x) / Math.max(0.05, m - e), back = rate * x / e;
          accF += fwd * dt; accB += back * dt;
          if (accF >= needF && x < m) { accF -= needF; needF = rand(0.7, 1.3); react(1, now); }
          if (accB >= needB && x >= 1) { accB -= needB; needB = rand(0.7, 1.3); react(-1, now); }
          while (ev.length && ev[0].at < now - 10000) ev.shift();
          const near = Math.abs(x - xeq()) < 1;
          if (near) { if (calmSince === null) calmSince = now; } else calmSince = null;
          const nf = ev.filter(q => q.d > 0).length, nb = ev.length - nf;
          if (calmSince && now - calmSince > 8000 && nf >= 3 && nb >= 3 && api.found("dynamic")) say(`At equilibrium, and still busy: ${nf} forward and ${nb} backward reactions in the last 10 seconds. Equal rates, so the amounts stay the same. That is dynamic equilibrium.`);
          mols.forEach(q => { q.a += rand(-0.4, 0.4) * dt * 4; q.x += Math.cos(q.a) * 40 * dt; q.y += Math.sin(q.a) * 40 * dt; q.f = Math.max(0, q.f - dt);
            if (q.x < 24 || q.x > 316) q.a = Math.PI - q.a; if (q.y < 26 || q.y > 174) q.a = -q.a; q.x = Math.max(24, Math.min(316, q.x)); q.y = Math.max(26, Math.min(174, q.y)); });
          const glyph = q => { const X = q.x.toFixed(0), Y = q.y.toFixed(0), ring = q.f > 0 ? `<circle cx="${X}" cy="${Y}" r="${14 + (1 - q.f) * 8}" fill="none" stroke="${q.d > 0 ? "#2e8b57" : "#b4531f"}" stroke-width="2" opacity="${q.f.toFixed(2)}"/>` : "";
            const a = (dx, dy, r, c) => `<circle cx="${(q.x + dx * 1.35).toFixed(0)}" cy="${(q.y + dy * 1.35).toFixed(0)}" r="${r * 1.35}" fill="${c}" stroke="#5b6675" stroke-width=".8"/>`;
            return ring + ({ N2: a(-4, 0, 6, "#2f6f9f") + a(4, 0, 6, "#2f6f9f"), H2: a(-3, 0, 4, "#ffffff") + a(3, 0, 4, "#ffffff"),
              NH3: a(0, 0, 6, "#2f6f9f") + a(-7, 5, 3.5, "#ffffff") + a(7, 5, 3.5, "#ffffff") + a(0, -8, 3.5, "#ffffff"),
              SO2: a(0, 0, 6, "#f2b705") + a(-8, 3, 4.5, "#d64545") + a(8, 3, 4.5, "#d64545"), O2: a(-4, 0, 4.5, "#d64545") + a(4, 0, 4.5, "#d64545"),
              SO3: a(0, 0, 6, "#f2b705") + a(-8, 3, 4.5, "#d64545") + a(8, 3, 4.5, "#d64545") + a(0, -9, 4.5, "#d64545") })[q.kind]; };
          el("rv").innerHTML = `<rect x="6" y="6" width="328" height="188" rx="10" class="bgc" stroke="#7f8c99" stroke-width="3"/>${mols.map(glyph).join("")}`;
          const prod = proc === "haber" ? mols.filter(q => q.kind === "NH3").length : mols.filter(q => q.kind === "SO3").length;
          const nowPct = proc === "haber" ? 100 * prod / mols.length : 100 * x / 8;
          shown += (nowPct - shown) * Math.min(1, dt * 0.8);
          el("y1").textContent = proc === "haber" ? `NH₃ now ≈ ${Math.round(shown)}% of molecules` : `SO₂ converted now ≈ ${Math.round(shown)}%`;
          el("y2").textContent = `at equilibrium ≈ ${yieldNow().toFixed(0)}%`;
          el("y3").textContent = `gets there in ${fmtTime(speed())}`;
        });
        function react(d, now) {
          const pickK = (k, n) => { const out = []; for (const q of mols) { if (q.kind === k && out.length < n) out.push(q); } return out; };
          const [A, nA, B, nB, C, nC] = proc === "haber" ? ["N2", 1, "H2", 3, "NH3", 2] : ["SO2", 2, "O2", 1, "SO3", 2];
          if (d > 0) { const a = pickK(A, nA), b = pickK(B, nB); if (a.length < nA || b.length < nB) return;
            const at = a[0]; [...a, ...b].forEach(q => mols.splice(mols.indexOf(q), 1));
            for (let i = 0; i < nC; i++) mols.push({ kind: C, x: at.x + i * 10, y: at.y, a: rand(0, 6.28), f: 1, d: 1 });
          } else { const c = pickK(C, nC); if (c.length < nC) return;
            const at = c[0]; c.forEach(q => mols.splice(mols.indexOf(q), 1));
            for (let i = 0; i < nA; i++) mols.push({ kind: A, x: at.x + i * 8, y: at.y, a: rand(0, 6.28), f: 1, d: -1 });
            for (let i = 0; i < nB; i++) mols.push({ kind: B, x: at.x + rand(-12, 12), y: at.y + rand(-12, 12), a: rand(0, 6.28), f: 1, d: -1 });
          }
          x += d; ev.push({ at: now, d });
        }
      }
    }

    // ── 4. redox ────────────────────────────────────────────────────────
    function redoxBench() {
      let part = "pass";
      const r = shell(`${pickRow("part", "Bench", [["pass", "🤲 Pass the electrons"], ["tubes", "🧪 Test reagents"]], part)}<div id="part"></div><p class="muted" id="msg"></p>`);
      wirePick("part", v => { part = v; open(); });
      let pr = 0;
      function open() { pr++; const me = pr, live = () => alive(r) && me === pr && el("part"); (part === "pass" ? pass : tubes)(live); }
      open();

      function pass() {
        let pair = "mg", sel = null, givers = [], takers = [], dragXY = null;
        el("part").innerHTML = `${pickRow("pair", "Pair", [["mg", "Magnesium + copper(II) ions"], ["cl", "Chlorine + bromide ions"]], pair)}
          <svg class="scene" id="psvg" viewBox="0 0 340 236" role="img" aria-label="Atoms that can give electrons on the left, particles that take them on the right"><g id="pv"></g></svg>
          <div class="readout"><span class="chip" id="h1" style="white-space:normal"></span><span class="chip" id="h2" style="white-space:normal"></span></div>`;
        const svg = el("psvg");
        function setup() {
          sel = null;
          if (pair === "mg") {
            givers = [0, 1, 2].map(i => ({ x: 64, y: 50 + i * 56, e: 2, kind: "Mg" }));
            takers = [0, 1, 2].map(i => ({ x: 236 + (i % 2) * 40, y: 52 + i * 56, got: 0, need: 2, kind: "Cu" }));
            say("Drag an electron (e⁻) from a magnesium atom to a copper(II) ion — or tap the electron, then tap the ion.");
          } else {
            givers = [0, 1, 2, 3].map(i => ({ x: 64, y: 38 + i * 46, e: 1, kind: "Br" }));
            takers = [0, 1].map(i => ({ x: 250, y: 70 + i * 80, got: 0, need: 2, kind: "Cl2" }));
            say("Chlorine molecules want electrons. Bromide ions each have a spare one. No oxygen anywhere — but watch.");
          }
          paint();
        }
        wirePick("pair", v => { pair = v; setup(); });
        const toSvg = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
        function give(gi, ti) {
          const g = givers[gi], t = takers[ti];
          if (!g || g.e <= 0) return;
          if (!t) return;
          if (t.got >= t.need) return say("That one is already full.");
          g.e--; t.got++;
          if (pair === "mg") {
            if (g.e === 0 && api.found("lose")) say("Magnesium has lost two electrons: Mg → Mg²⁺ + 2e⁻. Losing electrons is OXIDATION. The ion drifts off into the solution.");
            else if (t.got === 2 && api.found("gain")) say("The copper ion has gained two electrons: Cu²⁺ + 2e⁻ → Cu. Gaining electrons is REDUCTION. Brown copper coats the strip.");
            else say(g.e === 0 ? "Another magnesium atom becomes an ion." : t.got === 2 ? "Another copper atom forms." : "One electron moved. Keep going.");
            if (takers.every(q => q.got === 2) && api.found("allblue")) say("Every Cu²⁺ is now copper metal, so the blue has gone. The electrons magnesium lost are exactly the electrons copper gained — oxidation and reduction together.");
          } else {
            const done = givers.filter(q => q.e === 0).length;
            if (t.got === 2 && api.found("bromine")) say("Cl₂ + 2e⁻ → 2Cl⁻: chlorine is reduced. 2Br⁻ → Br₂ + 2e⁻: bromide is oxidised, and orange bromine appears. Redox, with no oxygen anywhere.");
            else say(done % 2 === 0 ? "Two bromide ions have given their electrons — they pair up as Br₂." : "One electron moved.");
          }
          paint();
        }
        function hitTaker(p) { return takers.findIndex(t => Math.hypot(t.x - p.x, t.y - p.y) < 26); }
        function hitGiver(p) { return givers.findIndex(g => g.e > 0 && Math.hypot(g.x - p.x, g.y - p.y) < 26); }
        svg.addEventListener("pointerdown", ev => {
          const p = toSvg(ev), gi = hitGiver(p);
          if (gi < 0) {
            const ti = hitTaker(p);
            if (ti >= 0 && sel !== null) { give(sel, ti); sel = null; paint(); }
            return;
          }
          ev.preventDefault(); const x0 = ev.clientX, y0 = ev.clientY; let moved = false;
          const mv = e2 => { if (Math.hypot(e2.clientX - x0, e2.clientY - y0) > 6) moved = true; if (moved) { dragXY = toSvg(e2); dragXY.from = gi; paint(); } };
          const up = e2 => {
            removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
            const q = toSvg(e2); dragXY = null;
            if (!moved) { sel = sel === gi ? null : gi; paint(); if (sel !== null) say("Now tap where the electron should go."); return; }
            const ti = hitTaker(q);
            if (ti >= 0) give(gi, ti);
            else if (hitGiver(q) >= 0 || givers.some(g => Math.hypot(g.x - q.x, g.y - q.y) < 26)) {
              if (pair === "mg" && api.found("backwards")) say("Magnesium does not want more electrons — metals give electrons away. That is why they are oxidised in reactions like this.");
              else say(pair === "mg" ? "Metal atoms give electrons; they do not take them." : "Bromide already has a full outer shell. It gives, it does not take.");
            }
            paint();
          };
          addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);
        });
        function paint() {
          if (!el("pv")) return;
          const used = takers.filter(t => t.got === t.need).length, gone = givers.filter(g => g.e === 0).length;
          let g = "";
          if (pair === "mg") {
            const blue = 1 - used / 3;
            g += `<rect x="150" y="10" width="184" height="200" rx="8" fill="rgb(${Math.round(240 - 150 * blue)},${Math.round(244 - 90 * blue)},${Math.round(250 - 20 * blue)})" stroke="#7f8c99" stroke-width="2"/>
              <rect x="20" y="10" width="88" height="200" rx="6" fill="#c3c9d0" stroke="#7f8c99" stroke-width="2"/>
              <text x="64" y="228" text-anchor="middle" font-size="12" class="lbl">magnesium strip</text><text x="242" y="228" text-anchor="middle" font-size="12" class="lbl">copper(II) sulfate solution</text>`;
            givers.forEach((q, i) => {
              if (q.e === 0) { g += `<circle cx="${q.x + 112}" cy="${q.y}" r="15" fill="#8d97a3" stroke="#5b6675"/><text x="${q.x + 112}" y="${q.y + 4}" text-anchor="middle" font-size="11" fill="#1f2a37">Mg²⁺</text>`; return; }
              g += `<circle cx="${q.x}" cy="${q.y}" r="17" fill="#8d97a3" stroke="${sel === i ? "#d99a00" : "#5b6675"}" stroke-width="${sel === i ? 4 : 1.5}"/><text x="${q.x}" y="${q.y + 4}" text-anchor="middle" font-size="12" fill="#ffffff">Mg</text>`;
              for (let k = 0; k < q.e; k++) if (!(dragXY && dragXY.from === i && k === q.e - 1)) g += `<circle class="grab" cx="${q.x + 22}" cy="${q.y - 9 + k * 18}" r="9" fill="#f2b705" stroke="#1f2a37"/><text x="${q.x + 22}" y="${q.y - 5 + k * 18}" text-anchor="middle" font-size="10" fill="#1f2a37">e⁻</text>`;
            });
            takers.forEach(q => {
              if (q.got === 2) { const y = 30 + takers.indexOf(q) * 60; g += `<rect x="104" y="${y}" width="10" height="34" rx="3" fill="#b5651d"/><text x="122" y="${y + 22}" font-size="12" fill="#1f2a37">Cu</text>`; return; }
              g += `<circle cx="${q.x}" cy="${q.y}" r="17" fill="#2a7fd4" stroke="#1f2a37"/><text x="${q.x}" y="${q.y + 4}" text-anchor="middle" font-size="12" fill="#ffffff">Cu²⁺</text>`;
              for (let k = 0; k < q.got; k++) g += `<circle cx="${q.x - 22}" cy="${q.y - 6 + k * 12}" r="6" fill="#f2b705" stroke="#1f2a37"/>`;
            });
          } else {
            const orange = gone / 4;
            g += `<rect x="10" y="10" width="320" height="200" rx="8" fill="rgb(${Math.round(232 + 10 * orange)},${Math.round(240 - 90 * orange)},${Math.round(246 - 200 * orange)})" stroke="#7f8c99" stroke-width="2"/>
              <text x="170" y="228" text-anchor="middle" font-size="12" class="lbl">chlorine water added to potassium bromide solution</text>`;
            givers.forEach((q, i) => {
              if (q.e === 0) return;
              g += `<circle cx="${q.x}" cy="${q.y}" r="16" fill="#9b3b1e" stroke="${sel === i ? "#d99a00" : "#1f2a37"}" stroke-width="${sel === i ? 4 : 1.5}"/><text x="${q.x}" y="${q.y + 4}" text-anchor="middle" font-size="12" fill="#ffffff">Br⁻</text>`;
              if (!(dragXY && dragXY.from === i)) g += `<circle class="grab" cx="${q.x + 22}" cy="${q.y}" r="9" fill="#f2b705" stroke="#1f2a37"/><text x="${q.x + 22}" y="${q.y + 4}" text-anchor="middle" font-size="10" fill="#1f2a37">e⁻</text>`;
            });
            for (let k = 0; k < Math.floor(gone / 2); k++) g += `<circle cx="${124 + k * 50}" cy="40" r="10" fill="#c0501c"/><circle cx="${138 + k * 50}" cy="40" r="10" fill="#c0501c"/><text x="${131 + k * 50}" y="68" text-anchor="middle" font-size="12" fill="#1f2a37">Br₂</text>`;
            takers.forEach(q => {
              if (q.got === 2) { g += `<circle cx="${q.x - 14}" cy="${q.y}" r="17" fill="#3a9a5b"/><text x="${q.x - 14}" y="${q.y + 4}" text-anchor="middle" font-size="12" fill="#ffffff">Cl⁻</text><circle cx="${q.x + 26}" cy="${q.y}" r="17" fill="#3a9a5b"/><text x="${q.x + 26}" y="${q.y + 4}" text-anchor="middle" font-size="12" fill="#ffffff">Cl⁻</text>`; return; }
              g += `<circle cx="${q.x - 10}" cy="${q.y}" r="15" fill="#9ccc65" stroke="#1f2a37"/><circle cx="${q.x + 10}" cy="${q.y}" r="15" fill="#9ccc65" stroke="#1f2a37"/><text x="${q.x}" y="${q.y + 4}" text-anchor="middle" font-size="11" fill="#1f2a37">Cl₂</text>`;
              for (let k = 0; k < q.got; k++) g += `<circle cx="${q.x + 34}" cy="${q.y - 6 + k * 12}" r="6" fill="#f2b705" stroke="#1f2a37"/>`;
            });
          }
          if (dragXY) g += `<circle cx="${dragXY.x}" cy="${dragXY.y}" r="9" fill="#f2b705" stroke="#1f2a37" stroke-width="2"/><text x="${dragXY.x}" y="${dragXY.y + 4}" text-anchor="middle" font-size="10" fill="#1f2a37">e⁻</text>`;
          el("pv").innerHTML = g;
          const lost = givers.reduce((a, q) => a + ((pair === "mg" ? 2 : 1) - q.e), 0), got = takers.reduce((a, q) => a + q.got, 0);
          el("h1").textContent = pair === "mg" ? `Mg → Mg²⁺ + 2e⁻ · electrons lost: ${lost} · OXIDISED` : `2Br⁻ → Br₂ + 2e⁻ · electrons lost: ${lost} · OXIDISED`;
          el("h2").textContent = pair === "mg" ? `Cu²⁺ + 2e⁻ → Cu · electrons gained: ${got} · REDUCED` : `Cl₂ + 2e⁻ → 2Cl⁻ · electrons gained: ${got} · REDUCED`;
        }
        setup();
      }

      function tubes(live) {
        // [name, what it is]; outcome per reagent tube
        const ADD = { so2: ["Sulfur dioxide gas", "reducing"], fe: ["Iron(II) sulfate solution", "reducing"], cl: ["Chlorine gas", "oxidising"], ki: ["Potassium iodide solution", "reducing"], water: ["Water", "neither"] };
        let add = "so2", mn = "#7a1fa2", io = "#f4f4f4", mnTarget = mn, ioTarget = io;
        el("part").innerHTML = `${pickRow("ad", "Add", Object.entries(ADD).map(([k, v]) => [k, v[0]]), add)}
          <svg class="scene" viewBox="0 0 320 220" role="img" aria-label="Two test tubes: acidified potassium manganate(VII) and potassium iodide"><g id="tv"></g></svg>
          <div class="ctrl"><button id="tmn">➡️ Into the manganate(VII)</button><button id="tio">➡️ Into the iodide</button><button id="fresh">🔄 Fresh tubes</button></div>`;
        wirePick("ad", v => { add = v; });
        say("Purple acidified potassium manganate(VII) is an oxidising agent — it reveals reducing agents. Colourless potassium iodide is a reducing agent — it reveals oxidising agents.");
        el("fresh").onclick = () => { mnTarget = "#7a1fa2"; ioTarget = "#f4f4f4"; say("Fresh tubes."); };
        el("tmn").onclick = () => {
          if (mnTarget !== "#7a1fa2") return say("This tube has been used. Get fresh tubes.");
          if (add === "so2" || add === "fe") { mnTarget = add === "fe" ? "#f3ecc8" : "#f4f4f4"; api.found("decolour"); say(`Purple → colourless. The manganate(VII) was reduced, so ${ADD[add][0].toLowerCase()} gave it electrons: it is a REDUCING agent.`); }
          else if (add === "ki") { mnTarget = "#8a4b12"; api.found("trap"); say("Purple gone — but the tube is BROWN, not colourless. Iodide is a reducing agent, and the iodine it turns into is brown. The colour you see is whatever is formed."); }
          else if (add === "cl") { api.found("nothing"); say("No change. Chlorine is an oxidising agent too — an oxidising agent cannot reveal another one."); }
          else say("No change. Water is neither.");
        };
        el("tio").onclick = () => {
          if (ioTarget !== "#f4f4f4") return say("This tube has been used. Get fresh tubes.");
          if (add === "cl") { ioTarget = "#8a4b12"; api.found("brown"); say("Colourless → brown. Iodide was oxidised to iodine, so chlorine took its electrons: chlorine is an OXIDISING agent."); }
          else if (add === "so2" || add === "fe") { api.found("nothing"); say(`No change. ${ADD[add][0]} is a reducing agent, and so is iodide — two givers, nobody to take.`); }
          else if (add === "ki") say("Iodide into iodide: nothing happens.");
          else say("No change. Water is neither.");
        };
        const mixc = (a, b, f) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), A = h(a), B = h(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * f).toString(16).padStart(2, "0")).join(""); };
        const tube = (x, c, name) => `<path d="M${x - 22} 30 V160 a22 22 0 0 0 44 0 V30" fill="#ffffff" fill-opacity=".35" stroke="#7f8c99" stroke-width="3"/>
          <path d="M${x - 19} 90 V160 a19 19 0 0 0 38 0 V90 Z" fill="${c}"/>
          <text x="${x}" y="208" text-anchor="middle" font-size="14" class="lbl">${name}</text>`;
        ticker(live, dt => {
          mn = mixc(mn, mnTarget, Math.min(1, dt * 1.5)); io = mixc(io, ioTarget, Math.min(1, dt * 1.5));
          el("tv").innerHTML = tube(90, mn, "manganate(VII)") + tube(230, io, "iodide");
        });
      }
    }

    draw();
  },
});

ARCADE.start();
</script>
</body>
